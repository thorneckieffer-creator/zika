}
function reveal(){let drawing=null;const old=document.getElementById('pad');if(old&&old._snap)drawing=old._snap();revealed=true;renderRev();if(drawing){const pad=document.getElementById('pad');if(pad)restorePad(pad,drawing);}}
function skipKnown(level){if(!cur)return;const wid=cur.split(':')[0];(level==='m'?markMastered:markKnown)(wid);['learn','rev','fresh'].forEach(k=>{rq[k]=rq[k].filter(cid=>cid.split(':')[0]!==wid);});undoState=null;nextCard();}
function grade(g){
  if(!cur)return;
  undoState={cid:cur,card:S.cards[cur]?JSON.parse(JSON.stringify(S.cards[cur])):{},log:JSON.parse(JSON.stringify(S.log)),intro:JSON.parse(JSON.stringify(S.intro))};
  rate(cur,g);sessionN++;
  ['learn','rev','fresh'].forEach(k=>{const i=rq[k].indexOf(cur);if(i>-1)rq[k].splice(i,1);});
  const c=S.cards[cur];
  if(c.due<=Date.now()+15*MIN&&(c.st==='learn'||c.st==='relearn'))rq.learn.push(cur);
  nextCard();
}
function doUndo(){if(!undoState)return;const had=Object.keys(undoState.card).length;S.cards[undoState.cid]=had?undoState.card:{};S.log=undoState.log;S.intro=undoState.intro;save();cur=undoState.cid;undoState=null;revealed=true;sessionN=Math.max(0,sessionN-1);renderRev();}
function toggleGhost(){S.settings.ghost=!S.settings.ghost;save();renderRev();}

/* scratchpad */
function initPad(cv){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth;cv.width=w*dpr;cv.height=w*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineWidth=6.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1d1c1a';
  let down=false,px=0,py=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{down=true;const p=pos(e);px=p[0];py=p[1];cv.setPointerCapture(e.pointerId);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(p[0],p[1]);ctx.stroke();px=p[0];py=p[1];e.preventDefault();});
  cv.addEventListener('pointerup',()=>down=false);
  cv._snap=()=>{try{return cv.toDataURL()}catch(e){return null}};
}
function restorePad(cv,dataUrl){const img=new Image();img.onload=()=>{const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.clientWidth,cv.clientWidth);};img.src=dataUrl;}
function clearPad(){const cv=document.getElementById('pad');if(!cv)return;const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);}

/* ---- SETTINGS ---- */
function renderSet(){
  const s=S.settings;
  document.getElementById('vSet').innerHTML=`
  <div class="card"><div class="lab">Card types</div>
    ${MODES.map(m=>`<div class="set-row"><div><b>${MODE_LABEL[m]}</b><div class="d">${m==='rec'?'see the 字 → recall meaning + pronunciation':'see the English → write the 字 + say the tones'}</div></div>
      <button class="tgl ${s.modes[m]?'on':''}" onclick="S.settings.modes.${m}=!S.settings.modes.${m};save();renderSet();badge()"><i></i></button></div>`).join('')}
    <div class="set-row"><div><b>Include names</b><div class="d">people like 陳月美 — off by default</div></div>
      <button class="tgl ${s.includeNames?'on':''}" onclick="S.settings.includeNames=!S.settings.includeNames;save();renderSet();badge()"><i></i></button></div>
  </div>
  <div class="card"><div class="lab">Schedule</div>
    <div class="set-row"><div><b>New words per day</b><div class="d">each word = up to 2 cards; 8–10 is your target pace</div></div>
      <input type="number" min="0" max="100" value="${s.newPerDay}" onchange="S.settings.newPerDay=Math.max(0,parseInt(this.value)||0);save();badge()"></div>
    <div class="set-row"><div><b>Early writing reps</b><div class="d">writing cards forced back on day 1, 2 and 3 before FSRS takes over</div></div>
      <button class="tgl ${s.earlyDrill?'on':''}" onclick="S.settings.earlyDrill=!S.settings.earlyDrill;save();renderSet()"><i></i></button></div>
    <div class="set-row"><div><b>Paper reps per character</b><div class="d">boxes per character on the printable 田字格 sheet</div></div>
      <input type="number" min="1" max="100" value="${s.writeTarget}" onchange="S.settings.writeTarget=Math.max(1,parseInt(this.value)||20);save()"></div>
    <div class="set-row"><div><b>Desired retention</b><div class="d">higher = more frequent reviews. 90% is the sweet spot.</div></div>
      <div class="row"><input type="range" min="80" max="97" value="${Math.round(s.retention*100)}" oninput="S.settings.retention=this.value/100;save();this.nextElementSibling.textContent=this.value+'%'"><b>${Math.round(s.retention*100)}%</b></div></div>
    <div class="set-row"><div><b>Max reviews per day</b></div>
      <input type="number" min="10" max="1000" value="${s.maxRev}" onchange="S.settings.maxRev=Math.max(10,parseInt(this.value)||200);save();badge()"></div>
  </div>
  <div class="card"><div class="lab">Audio & strokes</div>
    <div class="set-row"><div><b>Audio source</b><div class="d">Taiwanese voice = your device's zh-TW voice (Google 國語（臺灣）in Chrome, 美佳 Mei-Jia on Apple). Recording = bundled neural audio — works offline but mainland-accented.</div></div>
      <select class="vsel" onchange="S.settings.audioSrc=this.value;save()">
        <option value="auto" ${(s.audioSrc||'auto')==='auto'?'selected':''}>Auto — Taiwanese voice when available</option>
        <option value="system" ${s.audioSrc==='system'?'selected':''}>Taiwanese system voice only</option>
        <option value="bundled" ${s.audioSrc==='bundled'?'selected':''}>Bundled recording (offline)</option>
      </select></div>
    <div class="set-row"><div><b>Pronunciation voice</b><div class="d">in Chrome, pick “Google 國語（臺灣）” — Google-quality Taiwanese female Mandarin</div></div>
      <div class="row"><select class="vsel" onchange="S.settings.voiceName=this.value;save()">
        <option value="">Auto — best available</option>
        ${VOICES.slice().sort((a,b)=>rankVoice(b)-rankVoice(a)).map(v=>`<option value="${esc(v.name)}" ${S.settings.voiceName===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}
      </select><button class="btn ghost sm" onclick="speakText('歡迎你來臺灣')">Test</button></div></div>
    <div class="set-row"><div><b>Auto-play on reveal</b><div class="d">hear every word when the answer shows</div></div>
      <button class="tgl ${s.autoplayAudio?'on':''}" onclick="S.settings.autoplayAudio=!S.settings.autoplayAudio;save();renderSet()"><i></i></button></div>
    <div class="set-row"><div><b>Speech speed</b></div>
      <div class="row"><input type="range" min="60" max="110" value="${Math.round((s.speechRate||0.85)*100)}" oninput="S.settings.speechRate=this.value/100;save();this.nextElementSibling.textContent=this.value+'%'"><b>${Math.round((s.speechRate||0.85)*100)}%</b></div></div>
    <div class="set-row"><div><b>Stroke-order animations</b><div class="d">writing-card answers draw themselves stroke by stroke</div></div>
      <button class="tgl ${s.strokeAnim?'on':''}" onclick="S.settings.strokeAnim=!S.settings.strokeAnim;save();renderSet()"><i></i></button></div>
  </div>
  <div class="card"><div class="lab">Backup</div>
    <div class="row">
      <button class="btn ghost sm" onclick="exportData()">Export progress</button>
      <button class="btn ghost sm" onclick="document.getElementById('impFile').click()">Import</button>
      <input id="impFile" type="file" accept=".json" style="display:none" onchange="importData(this)">
      <button class="btn ghost sm" style="color:var(--red);border-color:#e8d5d2" onclick="if(confirm('Really erase ALL progress?')){S={cards:{},settings:S.settings,log:{},intro:{}};save();renderSet();badge();}">Reset</button>
    </div>
    <div class="small muted" style="margin-top:10px">Everything auto-saves. Export a JSON occasionally as insurance.</div>
  </div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='shida-b1-progress-'+dkey(new Date())+'.json';a.click();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.cards)throw 0;S=p;save();alert('Imported ✓');renderSet();badge();}catch(e){alert('That file does not look like a progress export.')}};
  r.readAsText(f);
}

document.addEventListener('keydown',e=>{
  if(view!=='rev'||!cur)return;
  if(e.code==='Space'&&!revealed){e.preventDefault();reveal();}
  else if(revealed&&['1','2','3','4'].includes(e.key)){grade(parseInt(e.key));}
});

takeSnapshot();
renderHome();badge();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
