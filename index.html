 rú yù le méi yǒu?"},{"zh":"下個月的學費，你付給學校了沒有？","en":"Next month's tuition — have you paid the school yet?","py":"xià gè yuè de xué fèi, nǐ fù gěi xué xiào le méi yǒu?"},{"zh":"不踢給你，踢給我！","en":"Don't kick it to you, kick it to me!","py":"bù tī gěi nǐ, tī gěi wǒ!"},{"zh":"客人付給老闆一百塊。","en":"The customer paid the boss 100 dollars.","py":"kè rén fù gěi lǎo bǎn yì bǎi kuài."},{"zh":"老闆拿給客人豬肉。","en":"The boss handed the customer the pork.","py":"lǎo bǎn ná gěi kè rén zhū ròu."},{"zh":"老闆送給這位太太豬肉嗎？不是，老闆賣給她豬肉。","en":"Did the boss give this lady pork as a gift? No, the boss sold her pork.","py":"lǎo bǎn sòng gěi zhè wèi tài tài zhū ròu ma? bú shì, lǎo bǎn mài gěi tā zhū ròu."},{"zh":"老闆付給這位太太錢嗎？不是，客人付給老闆錢。","en":"Did the boss pay this lady money? No, the customer paid the boss money.","py":"lǎo bǎn fù gěi zhè wèi tài tài qián ma? bú shì, kè rén fù gěi lǎo bǎn qián."},{"zh":"先生：我要送給你這個。","en":"Sir: I want to give you this.","py":"xiān shēng: wǒ yào sòng gěi nǐ zhè ge."},{"zh":"先生做給小姐這個禮物嗎？不是，先生買給小姐這個禮物。","en":"Did the man make this gift for the lady himself? No, the man bought this gift for the lady.","py":"xiān shēng zuò gěi xiǎo jiě zhè ge lǐ wù ma? bú shì, xiān shēng mǎi gěi xiǎo jiě zhè ge lǐ wù."},{"zh":"我送給他一個蛋糕。","en":"I gave him a cake, free of charge.","py":"wǒ sòng gěi tā yí gè dàn gāo."},{"zh":"我做給他一個蛋糕。","en":"I made him a cake (did the work for him).","py":"wǒ zuò gěi tā yí gè dàn gāo."},{"zh":"我做了一個蛋糕送給他。","en":"I made a cake and gave it to him.","py":"wǒ zuò le yí gè dàn gāo sòng gěi tā."}],"cy":"Write the same double-object sentence three ways: basic V給+person+thing, person moved to the back, and thing fronted as topic.","ov":"The 給 family so far: B1 L11 打電話給你 (給 tacks a recipient onto a verb that has no thing to hand over) → here, B2 L6, V給+人+東西 (a real thing changes hands) → and inside Ⅳ's 把: 把這包茶送給老師. Same 給 each time, marking whoever ends up with something. When 給 can drop: only with verbs of giving outward (賣, 送, 付) — 我要賣我朋友這個電腦 ✓. With verbs like 做, 買 it can't drop when there's a made/bought thing for someone — 我做他一個蛋糕 ✗, 哥哥買我一本書 ✗ both need 給.","tw":"腳踏車 (jiǎotàchē) is the Taiwan word for a bicycle; mainland 自行車 (zìxíngchē). 法國 is read Fàguó in Taiwan vs Fǎguó on the mainland.","src":"B2L6"},{"id":"n21-3","t":"Ⅲ. V + 在 · resultant location: where the thing ends up","e":"A placing verb followed by 在 + location states where the object is set down and stays — contrast with 到, used for moving verbs where the thing travels there.","pat":"placing verb + 在 + location. The object is placed and stays there. Verbs: 放 (put), 留 (leave), 存 (save/deposit), 寫 (write), 裝 (install), 住 (live).","tgt":["在"],"alt":["到","給","把"],"s":[{"zh":"那張椅子，請你放在樓下。","en":"That chair — please put it downstairs.","py":"nà zhāng yǐ zi, qǐng nǐ fàng zài lóu xià."},{"zh":"這些複雜的漢字，我要寫在本子上。","en":"I'm going to write these complicated characters in my notebook.","py":"zhè xiē fù zá de hàn zì, wǒ yào xiě zài běn zi shàng."},{"zh":"履歷表先留在我這裡。","en":"Leave the resume with me for now.","py":"lǚ lì biǎo xiān liú zài wǒ zhè lǐ."},{"zh":"傘，白如玉放在學校。","en":"The umbrella — Bai Ruyu left it at school.","py":"sǎn, bái rú yù fàng zài xué xiào."},{"zh":"書別放在椅子上。","en":"Don't put the book on the chair.","py":"shū bié fàng zài yǐ zi shàng."},{"zh":"我沒留甜點在桌子上。","en":"I didn't leave any dessert on the table.","py":"wǒ méi liú tián diǎn zài zhuō zi shàng."},{"zh":"他的錢沒存在銀行裡。","en":"His money isn't deposited in the bank.","py":"tā de qián méi cún zài yín háng lǐ."},{"zh":"電視，你打算放在哪裡？","en":"The TV — where are you planning to put it?","py":"diàn shì, nǐ dǎ suàn fàng zài nǎ lǐ?"},{"zh":"我給你的資料，你存在電腦裡沒有？","en":"The files I gave you — did you save them on the computer?","py":"wǒ gěi nǐ de zī liào, nǐ cún zài diàn nǎo lǐ méi yǒu?"},{"zh":"她把背包放在教室裡。","en":"She put her backpack in the classroom (on purpose).","py":"tā bǎ bēi bāo fàng zài jiào shì lǐ."},{"zh":"她把背包忘在教室裡。","en":"She left her backpack in the classroom (forgot it there).","py":"tā bǎ bēi bāo wàng zài jiào shì lǐ."},{"zh":"你的錢都花在哪裡？","en":"Where do you spend all your money?","py":"nǐ de qián dōu huā zài nǎ lǐ?"},{"zh":"你的時間都用在什麼地方？","en":"What do you spend all your time on?","py":"nǐ de shí jiān dōu yòng zài shén me dì fāng?"}],"cy":"Write a sentence with a placing verb (放/留/存/寫) + 在 + a location, saying where something ends up and stays.","ov":"到 vs 在 is the exam-likely discrimination named directly under Ⅰ: 到 goes with moving verbs (搬, 拿, 送, 踢, 騎, 開 — things that travel), 在 with placing verbs (放, 留, 存, 寫, 裝 — things that get set down). Extension: 忘在 = left it there unintentionally, contrasted with 放在 (on purpose); and V在 + an abstract 'place' (花在, 用在) shows money and time can also 'end up' somewhere. Also feeds directly into Ⅳ's 把 pattern as the 在-ending option.","tw":"隨身碟 (suíshēndié) is the Taiwan word for a USB stick; mainland U盤.","src":"B2L6"},{"id":"n21-4","t":"Ⅳ. 把 · moving an object to a location: A 把 B + V + 到／在／給 + place or person","e":"把 fronts a definite object so the sentence can end on where it went, where it was placed, or who received it. It is not itself a verb — it's a marker flagging the noun after it as the object, letting the real verb (which follows) carry the result.","pat":"A 把 B + Verb + 到／在／給 + Location. Rules: (1) object of 把 is definite. (2) 不／沒／別／還沒 go before 把, never before the verb. (3) 到 with moving verbs, 在 with placing verbs, 給 with people. (4) Questions: 是不是把… or 把…了沒有.","tgt":["把"],"alt":["被","將","拿"],"s":[{"zh":"我把球踢到學校外面了。","en":"I kicked the ball outside the school.","py":"wǒ bǎ qiú tī dào xué xiào wài miàn le."},{"zh":"他想把公司搬到台南。","en":"He wants to move the company to Tainan.","py":"tā xiǎng bǎ gōng sī bān dào tái nán."},{"zh":"我打算把這個蛋糕拿到學校請同學吃。","en":"I plan to take this cake to school to treat my classmates.","py":"wǒ dǎ suàn bǎ zhè ge dàn gāo ná dào xué xiào qǐng tóng xué chī."},{"zh":"我要把這包茶送給老師。","en":"I want to give this pack of tea to the teacher.","py":"wǒ yào bǎ zhè bāo chá sòng gěi lǎo shī."},{"zh":"請妳把那件衣服拿給白如玉。","en":"Please take that piece of clothing to Bai Ruyu.","py":"qǐng nǐ bǎ nà jiàn yī fú ná gěi bái rú yù."},{"zh":"我打算把舊車賣給高先生。","en":"I plan to sell the old car to Mr. Gao.","py":"wǒ dǎ suàn bǎ jiù chē mài gěi gāo xiān shēng."},{"zh":"請你把那張椅子放在樓下。","en":"Please put that chair downstairs.","py":"qǐng nǐ bǎ nà zhāng yǐ zi fàng zài lóu xià."},{"zh":"我要把媽媽給我的錢存在銀行裡。","en":"I want to deposit the money my mom gave me in the bank.","py":"wǒ yào bǎ mā mā gěi wǒ de qián cún zài yín háng lǐ."},{"zh":"他沒把資料帶到學校來，可是還好我帶了。","en":"He didn't bring the files to school, but luckily I did.","py":"tā méi bǎ zī liào dài dào xué xiào lái, kě shì hái hǎo wǒ dài le."},{"zh":"別把那本書賣給別人，賣給我吧。","en":"Don't sell that book to someone else, sell it to me.","py":"bié bǎ nà běn shū mài gěi bié rén, mài gěi wǒ ba."},{"zh":"我還沒把這個月的房租拿給房東。","en":"I haven't given this month's rent to the landlord yet.","py":"wǒ hái méi bǎ zhè ge yuè de fáng zū ná gěi fáng dōng."},{"zh":"別把隨身碟放在桌子上。","en":"Don't leave the USB stick on the table.","py":"bié bǎ suí shēn dié fàng zài zhuō zi shàng."},{"zh":"妳是不是把我的書帶到學校來了？","en":"Did you bring my book to school?","py":"nǐ shì bú shì bǎ wǒ de shū dài dào xué xiào lái le?"},{"zh":"你把那本本子拿給老師了沒有？","en":"Have you given that notebook to the teacher yet?","py":"nǐ bǎ nà běn běn zi ná gěi lǎo shī le méi yǒu?"},{"zh":"房東是不是把熱水器裝在浴室外面了？","en":"Did the landlord install the water heater outside the bathroom?","py":"fáng dōng shì bú shì bǎ rè shuǐ qì zhuāng zài yù shì wài miàn le?"},{"zh":"你把學費用在什麼地方了？","en":"What did you spend your tuition money on?","py":"nǐ bǎ xué fèi yòng zài shén me dì fāng le?"},{"zh":"誰把我的咖啡喝了？","en":"Who drank my coffee?","py":"shuí bǎ wǒ de kā fēi hē le?"},{"zh":"房東要把房子賣了。","en":"The landlord wants to sell the house.","py":"fáng dōng yào bǎ fáng zi mài le."}],"cy":"Write a 把 sentence using A 把 B + verb + 到/在/給 + a location or person, following the rules for where negation goes and what must follow the verb.","ov":"把 is not a verb — it's a marker (proof: verbs can swap in the same frame — 我把球拿到/踢到/放在 — while dropping 把 just reverts to normal word order). The 把 family end to end: ① B1 L15 把 O V 了 (the thing got dealt with, no destination: 誰把我的咖啡喝了？) → ② here, 把 O V 到 + place (it travelled there) → ③ here, 把 O V 在 + place (set down and stays) → ④ here, 把 O V 給 + person (ended up with someone). This is the extension named directly in the project's overlap map: disposal 把 O V 了 → A 把 B V 到／在／給 + location. Shared rules across all four: definite object · 不／沒／別／還沒 before 把 · 來／去 last · something must follow the verb · 是、有、喜歡、知道、覺得 never take 把. Later (not on this test): 把 O V 好／完, 把 O V 成, 把 O 當.","tw":"隨身碟 (suíshēndié) is the Taiwan word for a USB stick; mainland U盤. 垃圾 is read lèsè in Taiwan; mainland lājī.","src":"B2L6"},{"id":"n21-5","t":"Ⅴ. 而且 · and / furthermore","e":"而且 joins two comments about the same thing, pointing the same direction (both good or both bad). Between two state verbs it means 'and'; between two clauses it means 'furthermore', often promoting the second item as new information the listener didn't already have.","pat":"而且 starts the second half. Between two Vs (熱而且濕) it's 'and'; between two clauses it's 'furthermore', often with 還 or 也 in the second clause. Both halves point the same way; for a contrast use 可是.","tgt":["而且"],"alt":["可是","不但","並且"],"s":[{"zh":"台灣的夏天熱而且濕。","en":"Taiwan's summer is hot and humid.","py":"tái wān de xià tiān rè ér qiě shī."},{"zh":"如果多花一點時間找，一定能找到便宜而且合適的。","en":"If you spend a bit more time looking, you can definitely find something cheap and suitable.","py":"rú guǒ duō huā yì diǎn shí jiān zhǎo, yí dìng néng zhǎo dào pián yi ér qiě hé shì de."},{"zh":"房東幫她裝了有線電視，而且還幫她裝了網路。","en":"The landlord installed cable TV for her, and furthermore also installed internet for her.","py":"fáng dōng bāng tā zhuāng le yǒu xiàn diàn shì, ér qiě hái bāng tā zhuāng le wǎng lù."},{"zh":"做這個工作得會說中文，而且得有一些工作經驗。","en":"To do this job you need to speak Chinese, and also need some work experience.","py":"zuò zhè ge gōng zuò dé huì shuō zhōng wén, ér qiě dé yǒu yī xiē gōng zuò jīng yàn."},{"zh":"我想租環境好、光線好的房子。","en":"I want to rent a place with a good environment and good light.","py":"wǒ xiǎng zū huán jìng hǎo, guāng xiàn hǎo de fáng zi."},{"zh":"我想租環境好，而且光線也好的房子。","en":"I want to rent a place with a good environment — and the lighting is good too.","py":"wǒ xiǎng zū huán jìng hǎo, ér qiě guāng xiàn yě hǎo de fáng zi."},{"zh":"這棟大樓裡有教室，而且也有社團辦公室。","en":"This building has classrooms, and it also has club offices.","py":"zhè dòng dà lóu lǐ yǒu jiào shì, ér qiě yě yǒu shè tuán bàn gōng shì."}],"cy":"Write a sentence joining two positive (or two negative) comments about the same thing with 而且.","ov":"","tw":"網路 (wǎnglù) is both the Taiwan word and Taiwan reading for internet; mainland 網絡 (wǎngluò). 濕 is also written 溼 in Taiwan.","src":"B2L6"},{"id":"n21-6","t":"Ⅵ. 什麼樣 vs 怎麼樣 · what kind of…","e":"Both mean 'what kind of N', but 什麼樣 leans on the observable/visible type (what it looks like), while 怎麼樣 leans on how something feels or comes across (character/quality). For objects, 什麼樣的 is the normal choice.","pat":"什麼樣的 + N and 怎麼樣的 + N both mean 'what kind of N'. 什麼樣 leans on 看起來 (looks like); 怎麼樣 leans on 感覺 (comes across as).","tgt":["什麼樣"],"alt":["怎麼樣","哪一種","什麼"],"s":[{"zh":"他是什麼樣的人？他很高、眼睛很大。","en":"What does he look like? He's tall, with big eyes.","py":"tā shì shén me yàng de rén? tā hěn gāo, yǎn jīng hěn dà."},{"zh":"他是怎麼樣的人？他對人很好、很客氣。","en":"What kind of person is he (character-wise)? He's nice to people, polite.","py":"tā shì zěn me yàng de rén? tā duì rén hěn hǎo, hěn kè qì."},{"zh":"你喜歡什麼樣的飲料／食物／房子／包包／衣服／工作？","en":"What kind of drinks/food/house/bag/clothes/job do you like?","py":"nǐ xǐ huān shén me yàng de yǐn liào ／ shí wù ／ fáng zi ／ bāo bāo ／ yī fú ／ gōng zuò?"}],"cy":"Write a question using 什麼樣的 + noun asking what kind (appearance) of something someone likes.","ov":"Don't confuse with bare 怎麼樣, which asks 'how is it?' (那家旅館怎麼樣？) rather than 'what kind?'. The 的 is what turns it into a 'what kind of' question.","tw":"包包 (bāobāo) is Taiwan's everyday word for a bag/handbag.","src":"B2L6"}],"22":[{"id":"n22-1","t":"以為 · I thought (wrongly)","e":"States a belief that turned out to be mistaken — the error is built into the word itself. For a belief that's still true, use 覺得 or 想 instead.","pat":"S + 以為 + clause = 'I assumed (and was wrong)'.","tgt":["以為"],"alt":["覺得","想","以致"],"s":[{"zh":"我以為垃圾車六點來，沒想到五點半就來了。","en":"I thought the garbage truck came at 6, but it turned out it came at 5:30.","py":"wǒ yǐ wéi lā jī chē liù diǎn lái, méi xiǎng dào wǔ diǎn bàn jiù lái le."},{"zh":"他以為紙杯可以回收，可是不行。","en":"He thought paper cups could be recycled, but they can't.","py":"tā yǐ wéi zhǐ bēi kě yǐ huí shōu, kě shì bù xíng."},{"zh":"我以為你今天不來了！","en":"I thought you weren't coming today!","py":"wǒ yǐ wéi nǐ jīn tiān bù lái le!"}],"cy":"Write a sentence using 以為 to describe a mistaken belief you had.","ov":"Contrast with B2 L4's 沒想到 (an unexpected outcome, with no claimed prior belief stated) and B2 L3's 想起來/沒想起來 (recall of something forgotten) — three related but distinct 想/以為 expressions worth telling apart.","tw":"","src":"B2L7"},{"id":"n22-2","t":"…，要不然… · otherwise","e":"States an instruction or plan, then what goes wrong if you don't follow it. Unlike 如果…就 (which can point either direction, good or bad), 要不然 only ever runs one way: do X, or else Y (bad).","pat":"Clause₁，要不然 (+ 就) + bad consequence. 'Do X, or else Y.' Shorter form 不然 means the same.","tgt":["要不然"],"alt":["如果...就","不然","否則"],"s":[{"zh":"你得把垃圾分類，要不然垃圾車不收。","en":"You have to sort your trash, or else the truck won't take it.","py":"nǐ dé bǎ lā jī fēn lèi, yào bù rán lā jī chē bù shōu."},{"zh":"快一點，要不然就追不到垃圾車了。","en":"Hurry up, or else you won't catch the garbage truck.","py":"kuài yì diǎn, yào bù rán jiù zhuī bú dào lā jī chē le."},{"zh":"我們現在去，要不然就太晚了。","en":"Let's go now, or it'll be too late.","py":"wǒ men xiàn zài qù, yào bù rán jiù tài wǎn le."}],"cy":"Write a sentence using 要不然 to state an instruction and the bad thing that happens if it's not followed.","ov":"要不然 vs 如果…就 (B2 L6): 如果 sets up a condition and can point either direction, good or bad — 如果你搬家了，我就少了一個朋友。 要不然 only ever runs one way — the first clause is what you should do, and what follows 要不然 is what goes wrong if you don't. Test: does 'or else' fit the English? Then 要不然. Saying the same thing with 如果 needs the sentence flipped and takes twice the words (如果你不快一點，就追不到垃圾車了) — that's what 要不然 is for.","tw":"","src":"B2L7"},{"id":"n22-3","t":"為了 + purpose，… · in order to","e":"States the goal you're acting toward, looking forward — contrast with 因為 (the reason/cause, looking back at what caused something).","pat":"為了 + goal (noun or VP)，+ what you do. Usually leads the sentence.","tgt":["為了"],"alt":["因為","為","由於"],"s":[{"zh":"為了保護環境，台灣人天天做垃圾分類。","en":"In order to protect the environment, Taiwanese people sort their trash every day.","py":"wèi le bǎo hù huán jìng, tái wān rén tiān tiān zuò lā jī fēn lèi."},{"zh":"為了利用資源，紙、瓶子、塑膠都要回收。","en":"In order to make use of resources, paper, bottles, and plastic all need to be recycled.","py":"wèi le lì yòng zī yuán, zhǐ, píng zi, sù jiāo dōu yào huí shōu."},{"zh":"我為了學中文來台灣。","en":"I came to Taiwan in order to learn Chinese.","py":"wǒ wèi le xué zhōng wén lái tái wān."},{"zh":"我因為喜歡台灣，所以來台灣。","en":"Because I like Taiwan, I came to Taiwan.","py":"wǒ yīn wèi xǐ huān tái wān, suǒ yǐ lái tái wān."}],"cy":"Write a minimal pair: one sentence with 為了 (the goal) and one with 因為…所以 (the cause) for the same action.","ov":"The minimal pair to memorize: 我為了學中文來台灣 (why I came — the goal, forward-looking) vs 我因為喜歡台灣，所以來台灣 (what caused it — the reason, backward-looking). Test: could you say 'in order to' in front of it in English? Then 為了. And 為了 takes a goal, not a whole cause-clause with 所以 hanging off it — ✗為了我喜歡台灣，所以來台灣。","tw":"為 is read in 4th tone in both 為了 and 因為 here.","src":"B2L7"},{"id":"n22-4","t":"Directional complements: V + 出／進／過 + 來／去","e":"Combines a motion verb with a direction word (out, in, across/over, up, down) and then 來/去 to say which way something moved relative to the speaker — toward the speaker (來) or away (去). With an object, 把 O + V + direction is the cleanest structure.","pat":"Motion verb + direction (出 out, 進 in, 過 across/over, 上 up, 下 down) + 來／去 (toward／away from the speaker). With an object: 把 O + V + direction.","tgt":["出來","進去","來/去"],"alt":["到","在","給"],"s":[{"zh":"她拿著垃圾走出來了。","en":"She came out carrying the trash.","py":"tā ná zhù lā jī zǒu chū lái le."},{"zh":"垃圾車開過來了。","en":"The garbage truck is coming this way.","py":"lā jī chē kāi guò lái le."},{"zh":"他走過去跟他們聊天。","en":"He walked over to chat with them.","py":"tā zǒu guò qù gēn tā men liáo tiān."},{"zh":"把瓶子丟進去。","en":"Throw the bottle in.","py":"bǎ píng zi diū jìn qù."},{"zh":"把袋子放下。","en":"Put the bag down.","py":"bǎ dài zi fàng xià."}],"cy":"Write a sentence using a motion verb + direction + 來/去, thinking carefully about where you (the speaker) are standing.","ov":"This is the same 來／去 already met in B2 L6 (Ⅰ, add-on 3). There it was 到 + place + 來／去: 我把書搬到樓上去了 (I'm downstairs) vs 你把書搬到樓上來吧 (I'm already upstairs). Nothing about the 來／去 half changes here: it never names a destination, it says where you are standing, and it still lands at the very end. New in L7: what sits in front of it is no longer 到+place but a bare direction (出／進／過／上／下), so the endpoint can go unsaid — 走出來 = came out (of somewhere we both already know). Same tail, shorter body. The trap: don't hang a place off the short form (✗走出來教室 ✓從教室走出來 ✓走出教室來); the test is still 'am I inside or outside?' (你進來 vs 你進去). Also related — the 把 family gets a third ending: B1 L15 把 O V 了 → B2 L6 把 O V 到／在／給 → here, 把 O V + direction (把瓶子丟進去, 把書拿出來). Frame unchanged: definite object, 不／沒／別 before 把, and something always after the verb.","tw":"垃圾 is read lèsè in Taiwan; mainland lājī.","src":"B2L7"},{"id":"n22-5","t":"一定的 + N · fixed, set","e":"Describes a fixed or set noun — a schedule, place, or rule that doesn't vary. Different from the adverb 一定 (definitely), which modifies a verb; the 的 signals which meaning is meant.","pat":"一定的 + N = a fixed / set N.","tgt":["一定的"],"alt":["一定","固定的","特定的"],"s":[{"zh":"垃圾車有一定的時間和一定的地點。","en":"The garbage truck has a fixed time and a fixed location.","py":"lā jī chē yǒu yí dìng de shí jiān hé yí dìng de dì diǎn."},{"zh":"回收有一定的規定。","en":"Recycling has fixed/set regulations.","py":"huí shōu yǒu yí dìng de guī dìng."}],"cy":"Write a sentence describing something as fixed or set using 一定的 + noun, then contrast it with 一定 as 'definitely' before a verb.","ov":"","tw":"","src":"B2L7"}],"23":[{"t":"下去 — Continuing an Action","e":"Continuing an Action","tgt":["下去"],"alt":[],"s":[{"zh":"還要練下去嗎？","en":"Should I keep practicing?","py":"hái yào liàn xià qù ma?"},{"zh":"不想學下去了。","en":"I don't want to continue learning anymore.","py":"bù xiǎng xué xià qù le."},{"zh":"腿這麼痛，練不下去了。","en":"My legs hurt so much I can't continue.","py":"tuǐ zhè me tòng, liàn bù xià qù le."}],"cy":"Write your own sentence using 「下去」.","id":"g23-1"},{"t":"完 — Completion Marker","e":"Completion Marker","tgt":["完"],"alt":[],"s":[{"zh":"練完了。","en":"Finished practicing.","py":"liàn wán le."},{"zh":"吃完了嗎？","en":"Have you finished eating?","py":"chī wán le ma?"},{"zh":"整天練，終於練完了。","en":"Practiced all day; finally finished.","py":"zhěng tiān liàn, zhōng yú liàn wán le."}],"cy":"Write your own sentence using 「完」.","id":"g23-2"},{"t":"本來 — Originally","e":"Originally","tgt":["本來"],"alt":[],"s":[{"zh":"我本來不會，後來學了。","en":"I originally didn't know how; I later learned.","py":"wǒ běn lái bú huì, hòu lái xué le."},{"zh":"本來打算不去，後來決定去了。","en":"Originally planned not to go; later decided to go.","py":"běn lái dǎ suàn bù qù, hòu lái jué dìng qù le."},{"zh":"本來他不想學功夫。","en":"He originally didn't want to learn kung fu.","py":"běn lái tā bù xiǎng xué gōng fu."}],"cy":"Write your own sentence using 「本來」.","id":"g23-3"},{"t":"總是 — Always","e":"Always","tgt":["總是"],"alt":[],"s":[{"zh":"他總是抱怨。","en":"He's always complaining.","py":"tā zǒng shì bào yuàn."},{"zh":"練完總是腿痛。","en":"After practicing, my legs always hurt.","py":"liàn wán zǒng shì tuǐ tòng."},{"zh":"我總是起不來。","en":"I always can't get out of bed.","py":"wǒ zǒng shì qǐ bù lái."}],"cy":"Write your own sentence using 「總是」.","id":"g23-4"},{"t":"了 (liǎo) — Capability Complement","e":"Capability Complement","tgt":["了"],"alt":[],"s":[{"zh":"腿痛得走不了路。","en":"Legs hurt too much to walk.","py":"tuǐ tòng dé zǒu bù liǎo lù."},{"zh":"這麼多，我吃不了。","en":"This much — I can't finish it.","py":"zhè me duō, wǒ chī bù liǎo."}],"cy":"Write your own sentence using 「了」.","id":"g23-5"}],"24":[{"t":"Resultative 好 and 到","e":"Resultative 好 and 到","tgt":["好","到"],"alt":[],"s":[{"zh":"票訂好了嗎？","en":"Has the ticket been properly booked?","py":"piào dìng hǎo le ma?"},{"zh":"行李準備好了。","en":"The luggage is all packed and ready.","py":"xíng lǐ zhǔn bèi hǎo le."},{"zh":"找到了嗎？","en":"Did you find it?","py":"zhǎo dào le ma?"}],"cy":"Write your own sentence using 「好」.","id":"g24-1"},{"t":"比起來 — Compared To","e":"Compared To","tgt":["比起來"],"alt":[],"s":[{"zh":"跟台北比起來，高雄比較熱。","en":"Compared to Taipei, Kaohsiung is hotter.","py":"gēn tái běi bǐ qǐ lái, gāo xióng bǐ jiào rè."},{"zh":"跟城市比起來，鄉下比較安靜。","en":"Compared to cities, the countryside is quieter.","py":"gēn chéng shì bǐ qǐ lái, xiāng xià bǐ jiào ān jìng."},{"zh":"跟北部比起來，南部的人比較熱情。","en":"Compared to the north, southerners are more hospitable.","py":"gēn běi bù bǐ qǐ lái, nán bù de rén bǐ jiào rè qíng."}],"cy":"Write your own sentence using 「比起來」.","id":"g24-2"},{"t":"極了 — Extremely","e":"Extremely","tgt":["極了"],"alt":[],"s":[{"zh":"風景美極了。","en":"The scenery was absolutely beautiful.","py":"fēng jǐng měi jí le."},{"zh":"食物好吃極了。","en":"The food was incredibly delicious.","py":"shí wù hǎo chī jí le."},{"zh":"氣氛熱鬧極了。","en":"The atmosphere was incredibly lively.","py":"qì fēn rè nào jí le."}],"cy":"Write your own sentence using 「極了」.","id":"g24-3"},{"t":"越來越 — More and More","e":"More and More","tgt":["越來越"],"alt":[],"s":[{"zh":"城市越來越現代。","en":"The city is becoming more and more modern.","py":"chéng shì yuè lái yuè xiàn dài."},{"zh":"物價越來越高。","en":"Prices are going higher and higher.","py":"wù jià yuè lái yuè gāo."},{"zh":"中文越來越有意思。","en":"Chinese is getting more and more interesting.","py":"zhōng wén yuè lái yuè yǒu yì si."}],"cy":"Write your own sentence using 「越來越」.","id":"g24-4"},{"t":"各 — Various","e":"Various","tgt":["各"],"alt":[],"s":[{"zh":"海裡有各種顏色的魚。","en":"The sea has fish of all different colors.","py":"hǎi lǐ yǒu gè zhǒng yán sè de yú."},{"zh":"各地的建築都不一樣。","en":"The buildings in each place are different.","py":"gè dì de jiàn zhù dōu bù yí yàng."}],"cy":"Write your own sentence using 「各」.","id":"g24-5"},{"t":"忘不了 — Unforgettable","e":"Unforgettable","tgt":["忘不了"],"alt":[],"s":[{"zh":"忘不了那個味道。","en":"I can't forget that taste.","py":"wàng bù liǎo nà ge wèi dào."},{"zh":"忘不了南部的熱情。","en":"Can't forget the warmth of the south.","py":"wàng bù liǎo nán bù de rè qíng."}],"cy":"Write your own sentence using 「忘不了」.","id":"g24-6"},{"t":"買得起 — Can Afford","e":"Can Afford","tgt":["買得起"],"alt":[],"s":[{"zh":"那個公寓你買得起嗎？","en":"Can you afford that apartment?","py":"nà ge gōng yù nǐ mǎi de qǐ ma?"},{"zh":"生活費低，什麼都買得起。","en":"Costs are low; you can afford everything.","py":"shēng huó fèi dī, shén me dōu mǎi de qǐ."}],"cy":"Write your own sentence using 「買得起」.","id":"g24-7"}],"25":[{"t":"趁 — While / Seizing the Chance","e":"While / Seizing the Chance","tgt":["趁"],"alt":[],"s":[{"zh":"趁學期還沒開始，多練習。","en":"While the semester hasn't started, practice more.","py":"chèn xué qī hái méi kāi shǐ, duō liàn xí."},{"zh":"趁熱吃。","en":"Eat it while it's hot.","py":"chèn rè chī."},{"zh":"趁機會學。","en":"Take the opportunity to learn.","py":"chèn jī huì xué."}],"cy":"Write your own sentence using 「趁」.","id":"g25-1"},{"t":"下 — Enough Space To","e":"Enough Space To","tgt":["下"],"alt":[],"s":[{"zh":"飯廳坐得下嗎？","en":"Can the dining room fit everyon /* ============ FSRS-5 ============ */
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5, FACTOR=19/81, DAY=86400000, MIN=60000;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const retrievability=(t,s)=>Math.pow(1+FACTOR*t/s,DECAY);
function nextIntervalDays(s){const r=S.settings.retention;return clamp(Math.round(s/FACTOR*(Math.pow(r,1/DECAY)-1)),1,365);}
const initS=g=>W[g-1];
const initD=g=>clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
function updD(d,g){let nd=d-W[6]*(g-3)*((10-d)/9);nd=W[7]*initD(4)+(1-W[7])*nd;return clamp(nd,1,10);}
function stabRecall(s,d,r,g){const hard=g===2?W[15]:1, easy=g===4?W[16]:1;return s*(Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp(W[10]*(1-r))-1)*hard*easy+1);}
function stabForget(s,d,r){return Math.min(s, W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp(W[14]*(1-r)));}
function stabShort(s,g){return s*Math.exp(W[17]*(g-3+W[18]));}
function fuzz(days){if(days<3)return days;const f=days*0.05;return Math.round(days+(Math.random()*2-1)*f);}
// early-drill: force writing cards back on day 1, 2, 3 before FSRS takes over
function capEarly(c,cid,days){
  if(!S.settings.earlyDrill||modeOf(cid)!=='prod')return days;
  const d=(c&&c.days)||0;
  if(d===0)return Math.min(days,1);
  if(d===1)return Math.min(days,2);
  if(d===2)return Math.min(days,3);
  return days;
}
function previewIv(c,cid,g){
  const now=Date.now();
  const fmt=d=>d+'d';
  if(!c||c.st===undefined){
    if(g===1)return'1m'; if(g===2)return'5m'; if(g===3)return'10m';
    return fmt(capEarly(c,cid,nextIntervalDays(initS(4))));
  }
  if(c.st==='learn'||c.st==='relearn'){
    if(g===1)return'1m'; if(g===2)return'5m';
    return fmt(capEarly(c,cid,Math.max(1,nextIntervalDays(stabShort(c.S,g)))));
  }
  const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S);
  if(g===1)return'5m';
  return fmt(capEarly(c,cid,nextIntervalDays(stabRecall(c.S,c.D,r,g))));
}
function wordStartedBefore(wid){return MODES.some(m=>{const c=S.cards[cardId(wid,m)];return c&&c.st!==undefined;});}
function rate(cid,g){
  const now=Date.now(); let c=S.cards[cid];
  const today=dkey(new Date());
  S.log[today]=S.log[today]||{rev:0,new:0};
  const schedule=(days)=>{days=capEarly(c,cid,days);c.due=now+fuzz(days)*DAY;c.days=(c.days||0)+1;};
  if(!c||c.st===undefined){
    const wid=cid.split(':')[0];
    if(!wordStartedBefore(wid)){S.intro[today]=(S.intro[today]||0)+1;if(S.pick)S.pick=S.pick.filter(x=>x!==wid);}
    c={st:'learn',S:initS(g),D:initD(g),due:0,last:now,reps:1,lapses:0,days:0};
    S.cards[cid]=c;
    S.log[today].new++;
    if(g===1)c.due=now+1*MIN; else if(g===2)c.due=now+5*MIN; else if(g===3)c.due=now+10*MIN;
    else {c.st='rev'; schedule(nextIntervalDays(c.S));}
  } else if(c.st==='learn'||c.st==='relearn'){
    S.log[today].rev++;
    c.reps++;c.last=now;c.S=stabShort(c.S,g);
    if(g===1)c.due=now+1*MIN; else if(g===2)c.due=now+5*MIN;
    else {c.st='rev'; schedule(Math.max(1,nextIntervalDays(c.S)));}
  } else {
    S.log[today].rev++;
    const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S);
    c.D=updD(c.D,g); c.reps++; c.last=now;
    if(g===1){c.lapses++;c.S=stabForget(c.S,c.D,r);c.st='relearn';c.due=now+5*MIN;}
    else {c.S=stabRecall(c.S,c.D,r,g);schedule(nextIntervalDays(c.S));}
  }
  // mastery timestamps for the Brain view
  if(c.st==='rev'&&c.S>=MASTER_S){if(!c.mastAt)c.mastAt=now;}
  else if(c.mastAt){delete c.mastAt;}
  save();
}

const MODES=['rec','prod'];

function cardId(wid,m){return wid+':'+m;}

function untrackWord(wid){MODES.forEach(m=>{delete S.cards[cardId(wid,m)];});save();}
function markKnown(wid){ // "I already know this" — skip learning, verify in ~3 weeks
  MODES.forEach(m=>{
    if(!S.settings.modes[m])return;
    const k=cardId(wid,m), c=S.cards[k];
    if(c&&c.st==='rev'&&c.S>=21)return;
    S.cards[k]={st:'rev',S:21,D:4,due:Date.now()+fuzz(21)*DAY,last:Date.now(),reps:1,lapses:0,days:99,known:1};
  });

}
function markMastered(wid){ // "I've mastered this" — straight onto the shelf, resurface in ~3 months, NO paper reps
  MODES.forEach(m=>{
    if(!S.settings.modes[m])return;
    S.cards[cardId(wid,m)]={st:'rev',S:90,D:3,due:Date.now()+fuzz(90)*DAY,last:Date.now(),reps:1,lapses:0,days:99,known:1,mastAt:Date.now()};
  });

}
function isKnown(wid){return MODES.some(m=>(S.cards[cardId(wid,m)]||{}).known);}
function wordStatus(wid){
  let states=MODES.map(m=>S.cards[cardId(wid,m)]).filter(Boolean);
  if(!states.length)return null;
  const real=states.filter(c=>c.st!==undefined);
  if(!real.length)return{k:'new',t:'queued'};
  if(real.some(c=>c.due<=Date.now()))return{k:'due',t:'due'};
  if(real.length===states.length&&Math.min(...real.map(c=>c.S||0))>=21)return{k:'mat',t:'solid'};
  return{k:'ok',t:'learning'};
}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ============ QUEUE ============ */
function buildQueue(){
  const now=Date.now(), today=dkey(new Date());
  const introToday=S.intro[today]||0;
  const learn=[],rev=[],freshAll=[];
  for(const cid in S.cards){
    const c=S.cards[cid], w=wordOf(cid); if(!w)continue;
    if(c.susp)continue;
    if(!S.settings.includeNames&&isName(w))continue;
    if(!S.settings.modes[modeOf(cid)])continue;
    if(c.st===undefined){freshAll.push(cid);continue;}
    if(c.due<=now){(c.st==='rev'?rev:learn).push(cid);}
  }
  learn.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  rev.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  const mOrd={rec:0,prod:1};
  const pickIdx=wid=>{const i=(S.pick||[]).indexOf(wid);return i===-1?9999:i;};
  freshAll.sort((a,b)=>{const wa=wordOf(a),wb=wordOf(b);return pickIdx(wa.id)-pickIdx(wb.id)||wa.l-wb.l||parseInt(wa.id.slice(1))-parseInt(wb.id.slice(1))||mOrd[modeOf(a)]-mOrd[modeOf(b)];});
  // newPerDay counts WORDS, not cards: both cards of an introduced word may start the same day
  const allowance=Math.max(0,S.settings.newPerDay-introToday);
  const planned=new Set(); const fresh=[];
  for(const cid of freshAll){
    const wid=cid.split(':')[0];
    if(wordStartedBefore(wid)||planned.has(wid)){fresh.push(cid);continue;}
    if(planned.size<allowance){planned.add(wid);fresh.push(cid);}
  }
  return {learn,rev:rev.slice(0,S.settings.maxRev),fresh};
}
function dueCount(){const q=buildQueue();return q.learn.length+q.rev.length+q.fresh.length;}

const toneMarks={'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4};
function tonePinyin(p){
  return p.split(/(\s+|\/|,|·|\+)/).map(part=>{
    if(/^\s*$|^\/$|^,$|^\+$/.test(part))return part;
    let tone=0;
    for(const ch of part){if(toneMarks[ch]){tone=toneMarks[ch];break;}}
    return '<span class="tone'+tone+'">'+part+'</span>';
  }).join('');
}

function paperList(){
  // day 1 = full drilling (×writeTarget), day 2 = a few reps (×5), day 3 = one re-exposure (×1).
  // Words marked ✓known or ★mastered never appear here — you already own them.
  const d=new Date();d.setHours(0,0,0,0);const t0=d.getTime();
  const seen=new Set(),out=[];
  for(const cid in S.cards){
    if(!cid.endsWith(':prod'))continue;
    const c=S.cards[cid]; if(!c||c.st===undefined||c.last<t0||c.known)continue;
    const wid=cid.split(':')[0], w=byId[wid];
    if(!w||seen.has(wid))continue;
    const T=S.settings.writeTarget||20;
    if(c.st==='relearn'||c.lapses>0&&c.st!=='rev'){seen.add(wid);out.push({w,tag:'again',reps:10});}
    else if((c.days||0)<=1){seen.add(wid);out.push({w,tag:'day 1',reps:T});}

}

let VOICES=[];
function loadVoices(){try{VOICES=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^(zh|cmn)/i.test(v.lang)||/中文|國語|粵語|普通话/.test(v.name));}catch(e){VOICES=[];}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function rankVoice(v){
  let s=0; const nm=v.name+' '+v.lang;
  if(/國語|臺灣|Taiwan/i.test(nm))s+=50;
  if(/zh[-_]TW/i.test(v.lang))s+=25;
  if(/Google/i.test(v.name))s+=30;
  if(/Mei-?Jia|美佳|Yating|雅婷|Hsiao|曉|Ting-?Ting|婷|Xiaoxiao|Female|女/i.test(nm))s+=40;
  if(/Liang|Aaron|YunJhe|雲哲|Kangkang|Male|男/i.test(nm))s-=30;
  if(/zh[-_]CN|cmn/i.test(v.lang))s+=8;

  if(!v.localService)s+=6;

}
/* bundled neural audio (female standard Mandarin) with speech-synthesis fallback */
const AUDIO_MISS={};
let curAudio=null;
function audioKey(t){t=String(t).split('（')[0];const h=t.replace(/[^㐀-鿿]/g,'');return h||t.replace(/[^A-Za-z0-9]/g,'');}
function hasTwVoice(){if(!VOICES.length)loadVoices();return VOICES.some(v=>/zh[-_]TW/i.test(v.lang)||/國語|臺灣|Taiwan|Mei-?Jia/i.test(v.name));}
let APACK=null,APACKP=null,AIDX=null,AURL={};
function loadPack(){
  if(APACK)return Promise.resolve(true);
  if(APACKP)return APACKP;
  APACKP=Promise.all([
    fetch('assets/audio-index.json').then(r=>{if(!r.ok)throw 0;return r.json()}),
    fetch('assets/audio.pack').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
  ]).then(([idx,buf])=>{AIDX=idx;APACK=buf;return true;}).catch(()=>false);
  return APACKP;
}
function playBundled(text,onFail){
  const k=audioKey(text);
  if(!k||AUDIO_MISS[k]){onFail();return;}
  loadPack().then(ok=>{
    if(!ok||!AIDX[k]){AUDIO_MISS[k]=1;onFail();return;}
    try{
      if(!AURL[k]){
        const[o,l]=AIDX[k];
        AURL[k]=URL.createObjectURL(new Blob([APACK.slice(o,o+l)],{type:'audio/mpeg'}));
      }
      if(curAudio){try{curAudio.pause();}catch(e){}}
      const a=new Audio(AURL[k]);
      a.playbackRate=Math.min(1.3,audioSpeed()/0.9); // clips were recorded at 0.9× — speed setting scales them
      curAudio=a;
      a.onerror=()=>{AUDIO_MISS[k]=1;onFail();};
      a.play().catch(()=>{AUDIO_MISS[k]=1;onFail();});
    }catch(e){onFail();}
  });
}
function playAudio(text){
  const mode=S.settings.audioSrc||'auto';
  // Taiwanese-accented system voices (Google 國語（臺灣）, Mei-Jia) beat the bundled
  // mainland-accented recording — prefer them whenever one exists.
  if(mode==='bundled'){playBundled(text,()=>speakText(text));return;}
  if(mode==='system'){speakText(text);return;}
  if(hasTwVoice()){speakText(text);}else{playBundled(text,()=>speakText(text));}
}
function pickVoice(){
  if(!VOICES.length)loadVoices();

/* ============ GRAMMAR DRILLS ============ */
let gramLesson=1, gq=null, gramOpen={};
const GPOOL=['嗎','呢','吧','的','得','都','也','很','不','沒','了','還是','或是','可以','會','能','想','要','先','再','就','比','跟','給','把','別','最','更','太','常','剛','已經','應該','打算','因為','所以','可是','不過','要是','一樣','每','只','又','從','到','在','離','當然','好像','需要','希望','一直','最好'];
const DICT=(()=>{const s=new Set(GPOOL);WORDS.forEach(w=>{const h=w.t.split('（')[0].replace(/[^㐀-鿿]/g,'');if(h)s.add(h);});return s;})();
function segZh(zh){
  const clean=zh.replace(/[。？！]/g,'');
  const parts=clean.split(/(，)/).filter(Boolean);
  const out=[];
  for(const part of parts){
    if(part==='，'){out.push('，');continue;}
    let i=0;
    while(i<part.length){
      let hit=null;
      for(let L=Math.min(5,part.length-i);L>=2;L--){
        if(DICT.has(part.substr(i,L))){hit=part.substr(i,L);break;}
      }
      if(hit){out.push(hit);i+=hit.length;}
      else{out.push(part[i]);i++;}
    }
  }
  // merge lone singles with a neighbor to keep chips meaningful
  const merged=[];
  for(const c of out){
    if(c.length===1&&c!=='，'&&merged.length&&merged[merged.length-1].length===1&&merged[merged.length-1]!=='，')merged[merged.length-1]+=c;
    else merged.push(c);
  }
  return merged;
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n,excl){const pool=a.filter(x=>!excl.includes(x));return shuf(pool).slice(0,n);}
function gStat(id){return S.gram&&S.gram[id]?S.gram[id]:{n:0,ok:0};}
function gMark(id,ok){S.gram=S.gram||{};const g=S.gram[id]=S.gram[id]||{n:0,ok:0};g.n++;if(ok)g.ok++;save();}
function gDots(id){const g=gStat(id);const d=g.n===0?0:(g.ok/g.n>=0.8&&g.n>=6)?3:(g.ok/g.n>=0.6&&g.n>=3)?2:1;return '<span class="gdots">'+[1,2,3].map(i=>'<span class="gdot'+(i<=d?' on':'')+'"></span>').join('')+'</span>';}
function tgtIn(p,zh){return p.tgt.find(t=>zh.includes(t));}
/* question builders — each returns {type,p,html-parts...} */
function buildQuestion(p,type){
  const hasT=p.tgt&&p.tgt.length&&p.s.some(x=>tgtIn(p,x.zh));
  if(!hasT&&(type==='fib'||type==='mc'))type=(p.s.length>1?'build':'create');
  const sents=p.s.filter(s=>tgtIn(p,s.zh));
  const s=(type==='fib'||type==='mc')&&sents.length?sents[Math.floor(Math.random()*sents.length)]:p.s[Math.floor(Math.random()*p.s.length)];
  if(type==='fib'){
    const t=tgtIn(p,s.zh)||p.tgt[0];
    const opts=shuf([t,...sample(p.alt.concat(GPOOL),3,[t,...p.tgt])]);
    return {type,p,s,t,opts,blanked:s.zh.replace(t,'⬚')};
  }
  if(type==='mc'){
    const t=tgtIn(p,s.zh)||p.tgt[0];
    const altTok=(p.alt[0]&&!s.zh.includes(p.alt[0]))?p.alt[0]:sample(GPOOL,1,[t])[0];
    const c1=s.zh.replace(t,altTok);
    const c2=s.zh.replace(t,'');
    const segs=segZh(s.zh);
    let c3=s.zh;
    if(segs.length>2){const sw=shuf(segs.slice());c3=sw.join('')+(s.zh.match(/[。？！]$/)||[''])[0];if(c3===s.zh)c3=segs.slice().reverse().join('');}
    const opts=shuf([...new Set([s.zh,c1,c2,c3])].slice(0,4));
    return {type,p,s,opts,correct:s.zh};
  }
  if(type==='build'){
    let chunks=segZh(s.zh);
    let sh=shuf(chunks);
    let guard=0; while(sh.join('')===chunks.join('')&&guard++<5)sh=shuf(chunks);
    return {type,p,s,chunks,shuffled:sh,picked:[]};
  }
  if(type==='finish'){
    const cut=Math.max(2,Math.floor(s.zh.length*0.45));
    return {type,p,s,head:s.zh.slice(0,cut)};
  }
  return {type:'create',p,s};
}
const GTYPES=[['fib','Fill in the blank'],['mc','Multiple choice'],['build','Build the sentence'],['finish','Finish the sentence'],['create','Create your own']];
function startGramQuiz(scope){ // scope: array of points
  const pts=scope.filter(p=>p.s.length);
  const qs=[];
  const types=GTYPES.map(t=>t[0]);
  const n=Math.min(12,Math.max(6,pts.length*2));
  for(let i=0;i<n;i++){
    const p=pts[i%pts.length];
    qs.push(buildQuestion(p,types[Math.floor(Math.random()*types.length)]));
  }
  gq={qs:shuf(qs),i:0,ok:0,state:'ask',chosen:null};
  renderGram();
}
function gramAnswer(ok){const q=gq.qs[gq.i];gMark(q.p.id,ok);if(ok)gq.ok++;gq.state='done';renderGram();}
function gramPick(idx){ // fib / mc click
  const q=gq.qs[gq.i];
  if(gq.state!=='ask')return;
  gq.chosen=idx;
  const ok=q.type==='fib'?q.opts[idx]===q.t:q.opts[idx]===q.correct;
  gramAnswer(ok);
}
function gramChunk(i){
  const q=gq.qs[gq.i];
  if(q.picked.includes(i))return;
  q.picked.push(i);
  if(q.picked.length===q.shuffled.length){
    const built=q.picked.map(x=>q.shuffled[x]).join('');
    gramAnswer(built===q.chunks.join(''));
  } else renderGram();
}
function gramUnchunk(k){const q=gq.qs[gq.i];q.picked.splice(k,1);renderGram();}
function gramNext(){gq.i++;gq.state='ask';gq.chosen=null;renderGram();}
function renderGram(){

  if(gq){ /* ---- quiz runner ---- */

/* ============ STROKE ORDER (Hanzi Writer) ============ */
let HWPromise=null;
function ensureHW(){
  if(window.HanziWriter)return Promise.resolve(true);
  if(HWPromise)return HWPromise;
  HWPromise=new Promise(res=>{
    const tryLoad=srcs=>{
      if(!srcs.length)return res(false);
      const s=document.createElement('script'); s.src=srcs[0];
      s.onload=()=>res(!!window.HanziWriter); s.onerror=()=>tryLoad(srcs.slice(1));
      document.head.appendChild(s);
    };
    tryLoad(['assets/hanzi-writer.min.js','https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js','https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.5.0/hanzi-writer.min.js']);
  });
  return HWPromise;
}
let STROKES=null,STROKESP=null;
function loadStrokes(){
  if(STROKES)return Promise.resolve(STROKES);
  if(STROKESP)return STROKESP;
  STROKESP=fetch('assets/strokes.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{STROKES=d;return d;}).catch(()=>{STROKES={};return STROKES;});
  return STROKESP;
}
function strokeDataLoader(char,onComplete,onErr){
  loadStrokes().then(d=>{
    if(d[char]){onComplete(d[char]);return;}
    fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/'+encodeURIComponent(char)+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(onComplete).catch(()=>onErr&&onErr());
  });
}
let strokeWriters=[];
function renderStrokes(hostId,text,opts){
  opts=opts||{};
  const host=document.getElementById(hostId); if(!host)return;
  const chars=[...text].filter(ch=>/\p{Script=Han}/u.test(ch));
  if(!chars.length)return;
  ensureHW().then(ok=>{
    if(!ok){host.style.display='none';const fb=document.getElementById(hostId+'-fb');if(fb)fb.style.display='';return;}
    host.innerHTML=chars.map((c,i)=>'<div class="strokebox" id="'+hostId+'-c'+i+'"></div>').join('');
    strokeWriters=[];
    const size=opts.size||102;
    chars.forEach((ch,i)=>{
      try{
        const wtr=HanziWriter.create(hostId+'-c'+i,ch,{
          width:size,height:size,padding:6,
          strokeColor:cssVar('--ink')||'#1d1c1a',outlineColor:cssVar('--line2')||'#e3dfd8',radicalColor:cssVar('--acc')||'#0e7266',
          strokeAnimationSpeed:1.05,delayBetweenStrokes:110,delayBetweenLoops:2500,
          showCharacter:false,showOutline:true,
          charDataLoader:(c,onC)=>strokeDataLoader(c,onC,()=>{const b=document.getElementById(hostId+'-c'+i);if(b)b.style.display='none';})
        });
        strokeWriters.push(wtr);
      }catch(e){}
    });
    playStrokes();
    setTimeout(()=>{ // if no stroke data ever arrived, fall back to the static character
      if(!host.querySelector('svg path')){
        host.style.display='none';
        const t=document.querySelector('.stroketools'); if(t)t.style.display='none';
        const fb=document.getElementById(hostId+'-fb'); if(fb)fb.style.display='';
      }
    },3500);
  });
}
function playStrokes(){
  const ws=strokeWriters.slice(); if(!ws.length)return;
  const next=i=>{ if(i>=ws.length)return; try{ws[i].animateCharacter({onComplete:()=>setTimeout(()=>next(i+1),260)});}catch(e){next(i+1);} };
  ws.forEach(w=>{try{w.hideCharacter({duration:0})}catch(e){}});
  next(0);
}

/* ============ TIME-LAPSE SNAPSHOTS ============ */
function stageString(){return WORDS.map(w=>wordStage(w.id)).join('');}
function takeSnapshot(){
  try{
    if(!S.hist)S.hist={d:[],s:[]};
    const today=dkey(new Date()), s=stageString();
    const n=S.hist.d.length;
    if(n&&S.hist.d[n-1]===today){if(S.hist.s[n-1]!==s){S.hist.s[n-1]=s;save();}return;}
    S.hist.d.push(today);S.hist.s.push(s);
    if(S.hist.d.length>400){S.hist.d.shift();S.hist.s.shift();}
    save();
  }catch(e){}
}

/* ---- BRAIN ---- */
let brainView='chars', brainGroup='stage', brainSel=null, brainTime=null, brainScope=1;
const STAGE_NAMES=['Not started','Learning','Young','Solid','Mastered'];
const STAGE_DESC=['not yet studied','in short-step drilling (first days)','memory holds < 3 weeks','memory holds 3–6 weeks','memory holds 6+ weeks'];
function wordCards(wid){return MODES.filter(m=>S.settings.modes[m]).map(m=>S.cards[cardId(wid,m)]).filter(Boolean);}
function wordStage(wid){
  const cards=wordCards(wid); if(!cards.length)return 0;
  const started=cards.filter(c=>c.st!==undefined);
  if(!started.length)return 0;
  if(started.length<cards.length||started.some(c=>c.st==='learn'||c.st==='relearn'))return 1;
  const minS=Math.min(...started.map(c=>c.S));
  if(minS<7)return 1; if(minS<21)return 2; if(minS<MASTER_S)return 3; return 4;
}
function wordMem(wid){ // current recall probability (weakest card)
  const started=wordCards(wid).filter(c=>c.st!==undefined&&c.st==='rev');
  if(!started.length)return null;
  return Math.min(...started.map(c=>retrievability(Math.max(0.01,(Date.now()-c.last)/DAY),c.S)));
}
function wordDueNow(wid){return wordCards(wid).some(c=>c.st!==undefined&&c.due<=Date.now());}
function wordMastAt(wid){
  const cards=wordCards(wid); if(!cards.length)return null;
  if(!cards.every(c=>c.mastAt))return null;
  return Math.max(...cards.map(c=>c.mastAt));
}
function studyWords(){return WORDS.filter(w=>!isName(w)||S.settings.includeNames);}
const SIMP_CHAR={}; WORDS.forEach(w=>{if(w.s&&w.s.length===w.t.length){for(let i=0;i<w.t.length;i++){if(w.t[i]!==w.s[i])SIMP_CHAR[w.t[i]]=w.s[i];}}});
function charModel(){
  const map=new Map();
  studyWords().forEach(w=>{
    for(const ch of w.t){
      if(!/\p{Script=Han}/u.test(ch))continue;
      if(!map.has(ch))map.set(ch,{ch,words:[],stage:0,due:false,lesson:99,mem:null,mastAt:null});
      const e=map.get(ch);
      e.words.push(w.id);
      e.lesson=Math.min(e.lesson,w.l);
      const st=wordStage(w.id);
      if(st>e.stage){e.stage=st;}
      if(wordDueNow(w.id))e.due=true;
      const m=wordMem(w.id); if(m!==null)e.mem=e.mem===null?m:Math.max(e.mem,m);
      const ma=wordMastAt(w.id); if(ma&&(!e.mastAt||ma<e.mastAt||e.mastAt===null))e.mastAt=e.mastAt?Math.max(e.mastAt,ma):ma;
    }
  });
  return [...map.values()];
}
function firstTone(p){for(const ch of p){if(toneMarks[ch])return toneMarks[ch];}return 0;}
function posGroup(w){
  if(isName(w))return 'Names';
  const p=w.pos;
  if(!p)return 'Proper nouns';
  if(/^Vs/.test(p))return 'Adjectives 形';
  if(/^V/.test(p))return 'Verbs 動';
  if(p==='N')return 'Nouns 名';
  if(p==='Adv')return 'Adverbs 副';
  if(p==='M')return 'Measure words 量';
  if(p==='Ptc')return 'Particles 助';
  if(p==='Det')return 'Determiners';
  if(p==='Prep')return 'Prepositions';
  if(p==='Conj')return 'Conjunctions';
  if(p==='Ph')return 'Phrases 語';
  return 'Other';
}
function fmtAgo(ts){const d=Math.floor((Date.now()-ts)/DAY);return d<=0?'today':d===1?'1d ago':d+'d ago';}
function fmtDueIn(c){
  if(!c||c.st===undefined)return 'not started';
  const ms=c.due-Date.now();
  if(ms<=0)return 'due now';
  if(ms<DAY)return 'due in '+Math.max(1,Math.round(ms/3600000))+'h';
  return 'due in '+Math.round(ms/DAY)+'d';
}
function stageCounts(items){const c=[0,0,0,0,0];items.forEach(i=>c[i.stage!==undefined?i.stage:wordStage(i.id)]++);return c;}
function tileTitle(label,stage,mem,due){
  let t=label+' · '+STAGE_NAMES[stage];
  if(mem!==null&&mem!==undefined)t+=' · memory now '+Math.round(mem*100)+'%';
  if(due)t+=' · due for review';
  return t;
}
function tlChart(){
  const H=S.hist,n=H.d.length; if(n<2)return '';
  const Wd=640,Hh=88;
  let maxTot=1; const layers=[];
  for(let i=0;i<n;i++){
    const c=[0,0,0,0,0];
    for(const d of H.s[i])c[+d]++;
    layers.push(c);
    maxTot=Math.max(maxTot,c[1]+c[2]+c[3]+c[4]);
  }
  const x=i=>n===1?0:i/(n-1)*Wd;
  const y=v=>Hh-4-(v/maxTot)*(Hh-10);
  // stack bottom→top: mastered, solid, young, learning
  const order=[4,3,2,1];
  const cum=layers.map(c=>{let a=0;const m={};order.forEach(st=>{a+=c[st];m[st]=a;});return m;});
  let polys='';
  order.forEach((st,k)=>{
    let top='',bot='';
    for(let i=0;i<n;i++)top+=(i?' ':'')+x(i).toFixed(1)+','+y(cum[i][st]).toFixed(1);
    for(let i=n-1;i>=0;i--)bot+=' '+x(i).toFixed(1)+','+(k===0?Hh-4:y(cum[i][order[k-1]])).toFixed(1);
    const cls='s'+st;
    const col=cssVar('--s'+st+'bg')||{4:'#0b5d54',3:'#2f9184',2:'#7fbfb3',1:'#dcebe7'}[st];
    polys+='<polygon points="'+top+bot+'" fill="'+col+'"><title>'+STAGE_NAMES[st]+'</title></polygon>';
  });
  return '<svg class="tl-chart" viewBox="0 0 '+Wd+' '+Hh+'" preserveAspectRatio="none">'+polys+'</svg>';
}

        +'<div class="row" style="gap:8px"><span class="pyline" style="font-size:18px">'+tonePinyin(esc(w.p))+'</span>'+spkBtn(w.id)+'</div>'

        +(w.mastAt?'<span class="tag known">mastered '+fmtAgo(w.mastAt)+'</span>':'')+'</div>'

      }

  }
  // ----- grouped walls -----
  function tile(it){
    if(isChars){
      const sel=brainSel&&brainSel.type==='char'&&brainSel.id===it.ch;
      return '<div class="tile zh s'+it.stage+(sel?' sel':'')+'" title="'+esc(tileTitle(it.ch,it.stage,it.mem,it.due))+'" onclick="brainSel={type:\'char\',id:\''+it.ch+'\'};renderBrain()">'+esc(it.ch)+(it.due?'<span class="dot"></span>':'')+'</div>';
    }

    return '<div class="tile zh s'+it.stage+(sel?' sel':'')+'" title="'+esc(tileTitle(it.t+' '+it.p,it.stage,it.mem,it.due))+'" onclick="brainSel={type:\'word\',id:\''+it.id+'\'};renderBrain()">'+esc(it.t)+(it.due?'<span class="dot"></span>':'')+'</div>';
  }
  function wall(list){return '<div class="wall'+(isChars?'':' words')+'">'+list.map(tile).join('')+'</div>';}
  let groupsHtml='';
  const grpHdr=(name,list,note)=>'<div class="grp"><span>'+name+(note?' <span class="gn">· '+note+'</span>':'')+'</span><span class="gn">'+list.length+'</span></div>';
  if(brainGroup==='stage'){
    [4,3,2,1,0].forEach(st=>{
      const list=items.filter(i=>i.stage===st);
      if(!list.length)return;
      groupsHtml+=grpHdr(STAGE_NAMES[st],list,STAGE_DESC[st])+wall(list);
    });
  } else if(brainGroup==='lesson'){
    for(let ln=1;ln<=MAX_LN;ln++){
      const list=isChars?items.filter(i=>i.lesson===ln):items.filter(i=>i.l===ln);
      if(!list.length)continue;
      groupsHtml+=grpHdr(lnLabel(ln),list,LESSON_TITLES[ln])+wall(list);
    }
  } else if(brainGroup==='simp'){
    const diff=items.filter(i=>SIMP_CHAR[i.ch]), same=items.filter(i=>!SIMP_CHAR[i.ch]);
    groupsHtml+=grpHdr('Different in simplified',diff,'your ongoing trad list')+wall(diff)+grpHdr('Same in both scripts',same,'')+wall(same);
  } else if(brainGroup==='pos'){
    const order=['Nouns 名','Verbs 動','Adjectives 形','Adverbs 副','Measure words 量','Particles 助','Phrases 語','Determiners','Prepositions','Conjunctions','Proper nouns','Names','Other'];
    const bins={}; items.forEach(w=>{const g=posGroup(w);(bins[g]=bins[g]||[]).push(w);});
    order.forEach(g=>{if(bins[g])groupsHtml+=grpHdr(g,bins[g],'')+wall(bins[g]);});
  } else if(brainGroup==='tone'){
    const names={1:'1st tone ˉ',2:'2nd tone ˊ',3:'3rd tone ˇ',4:'4th tone ˋ',0:'Neutral / other'};
    [1,2,3,4,0].forEach(t=>{

      groupsHtml+=grpHdr(names[t],list,'by first syllable')+wall(list);

  // ----- time-lapse card -----
  const chart=tlChart();
  const scrubVal=past?brainTime:nSnap-1;
  const tlHtml=`<div class="card"><div class="lab">Time-lapse</div>
    ${chart||'<div class="small muted">Recording started today — from now on the app snapshots your brain daily, and this becomes a scrubbable film of the wall filling in over the semester.</div>'}

  </div>`;
  el.innerHTML=`

    <div class="hero-row">
      <div class="hero-big"><div class="n">${mastered}<span class="of"> / ${total}</span></div><div class="l">${isChars?'characters':'words'} mastered${past?' · '+S.hist.d[brainTime]:''}</div></div>

  </div>

          :`<button class="btn sm ghost" onclick="event.stopPropagation();if(confirm('Remove all Lesson ${ln} cards and their progress?')){WORDS.filter(w=>w.l===${ln}).forEach(w=>untrackWord(w.id));renderLib();badge();}">Remove</button>`}

}

function reveal(){let drawing=null;const old=document.getElementById('pad');if(old&&old._snap)drawing=old._snap();revealed=true;renderRev();if(drawing){const pad=document.getElementById('pad');if(pad)restorePad(pad,drawing);}}
function skipKnown(level){if(!cur)return;const wid=cur.split(':')[0];(level==='m'?markMastered:markKnown)(wid);['learn','rev','fresh'].forEach(k=>{rq[k]=rq[k].filter(cid=>cid.split(':')[0]!==wid);});nextCard();}
function grade(g){
  if(!cur)return;
  undoStack.push({cid:cur,card:S.cards[cur]?JSON.parse(JSON.stringify(S.cards[cur])):{},log:JSON.parse(JSON.stringify(S.log)),intro:JSON.parse(JSON.stringify(S.intro))});
  if(undoStack.length>25)undoStack.shift();
  rate(cur,g);sessionN++;
  ['learn','rev','fresh'].forEach(k=>{const i=rq[k].indexOf(cur);if(i>-1)rq[k].splice(i,1);});
  const c=S.cards[cur];
  if(c.due<=Date.now()+15*MIN&&(c.st==='learn'||c.st==='relearn'))rq.learn.push(cur);
  nextCard();
}
function doUndo(){ // step back through as many cards as the stack holds
  const u=undoStack.pop(); if(!u)return;
  const had=Object.keys(u.card).length;
  S.cards[u.cid]=had?u.card:{};
  S.log=u.log;S.intro=u.intro;save();
  cur=u.cid;revealed=true;sessionN=Math.max(0,sessionN-1);renderRev();
}
function toggleGhost(){S.settings.ghost=!S.settings.ghost;save();renderRev();}

/* scratchpad */
function initPad(cv){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth;cv.width=w*dpr;cv.height=w*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineWidth=6.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=cssVar('--ink')||'#1d1c1a';
  let down=false,px=0,py=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{down=true;const p=pos(e);px=p[0];py=p[1];cv.setPointerCapture(e.pointerId);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(p[0],p[1]);ctx.stroke();px=p[0];py=p[1];e.preventDefault();});
  cv.addEventListener('pointerup',()=>down=false);
  cv._snap=()=>{try{return cv.toDataURL()}catch(e){return null}};
}
function restorePad(cv,dataUrl){const img=new Image();img.onload=()=>{const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.clientWidth,cv.clientWidth);};img.src=dataUrl;}
function clearPad(){const cv=document.getElementById('pad');if(!cv)return;const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);}

function drillMiss(wid,mode){

function endTriage(){tri=null;renderLib();badge();}
function triageBack(){if(tri&&tri.i>0){tri.i--;renderLib();}}
function triageAct(a){
  if(!tri)return;

  if(a==='hard'){trackWord(wid);addHard(wid);S.pick=S.pick||[];if(!S.pick.includes(wid))S.pick.push(wid);tri.n.hard++;}
  else if(a==='learn'){trackWord(wid);tri.n.learn++;}
  else if(a==='know'){markKnown(wid);tri.n.know++;}
  else if(a==='mast'){markMastered(wid);tri.n.mast++;}
  else tri.n.skip++;

}

/* ---------- DRILL ---------- */
const DMODES=[['rec','認字 Recognition','see it · know it'],['tone','聲調 Tones','hear the pattern'],
  ['dict','聽寫 Dictation','audio → write it'],['sent','造句 Sentences','build with the grammar'],
  ['speak','口說 Speaking','say it · record it']];
let drillMode=null, drillScope='lesson', drillLesson=21, dq=null, recState=null;

function drillWords(){
  let pool;
  if(drillScope==='hard') pool=(S.hard||[]).map(id=>byId[id]).filter(Boolean);
  else if(drillScope==='due') pool=WORDS.filter(w=>MODES.some(m=>{const c=S.cards[cardId(w.id,m)];return c&&c.st!==undefined&&c.due<=Date.now();}));
  else if(drillScope==='deck') pool=WORDS.filter(w=>tracked(w.id));
  else pool=WORDS.filter(w=>w.l===drillLesson);
  return pool.filter(w=>S.settings.includeNames||!isName(w));
}
function drillPoints(){
  if(drillScope==='lesson') return (GRAMMAR[drillLesson]||[]);
  let out=[]; for(let l=1;l<=MAX_LN;l++) out=out.concat(GRAMMAR[l]||[]);
  return out;
}
function toneSeq(p){
  const parts=String(p).split(/\s+/).filter(Boolean);
  return parts.map(part=>{let t=0;for(const ch of part){if(toneMarks[ch]){t=toneMarks[ch];break;}}return t;});
}
const TONEMARK=['·','ˉ','ˊ','ˇ','ˋ'];
function toneLabel(seq){return seq.map(t=>TONEMARK[t]).join(' ')+'   ('+seq.join('-')+')';}

function startDrill(mode){
  drillMode=mode; dq=null; recState=null;
  const qs=[];
  if(mode==='rec'||mode==='tone'||mode==='dict'){
    let pool=drillWords();
    if(pool.length<2){renderDrill();return;}
    const bank=WORDS.filter(w=>!isName(w));
    const N=Math.min(20,Math.max(6,pool.length));
    const order=shuf(pool).slice(0,N);
    for(const w of order){
      if(mode==='dict'){qs.push({mode:'dict',w});continue;}
      if(mode==='tone'){
        const seq=toneSeq(w.p); if(!seq.length||seq.every(t=>t===0)){continue;}
        const opts=new Set([seq.join('-')]);
        let guard=0;
        while(opts.size<4&&guard++<40){
          const alt=seq.map(t=>Math.random()<0.6?(1+Math.floor(Math.random()*4)):t);
          if(alt.join('-')!==seq.join('-'))opts.add(alt.join('-'));
        }
        qs.push({mode:'tone',w,correct:seq.join('-'),opts:shuf([...opts])});
        continue;
      }
      const kind=['c2m','m2c','a2c'][Math.floor(Math.random()*3)];
      const sameLesson=bank.filter(x=>x.l===w.l&&x.id!==w.id);
      const distr=sample(sameLesson.length>=3?sameLesson:bank.filter(x=>x.id!==w.id),3,[w]);
      qs.push({mode:'rec',kind,w,opts:shuf([w,...distr])});
    }
  } else if(mode==='sent'){
    const pts=drillPoints().filter(p=>p.s&&p.s.length);
    for(const p of shuf(pts).slice(0,10)) qs.push({mode:'sent',p});
  } else if(mode==='speak'){
    const pts=drillPoints().filter(p=>p.s&&p.s.length);
    const lines=[];
    for(const p of pts) for(const s of p.s) lines.push({p,s});
    for(const L of shuf(lines).slice(0,12)) qs.push({mode:'speak',p:L.p,s:L.s});
  }
  dq={qs:shuf(qs),i:0,ok:0,state:'ask',chosen:null};
  renderDrill();
}
function drillAnswer(ok){
  const q=dq.qs[dq.i];
  if(ok)dq.ok++;
  if(!ok&&q.w)drillMiss(q.w.id,q.mode==='dict'?'prod':'rec');
  dq.state='done';renderDrill();
}
function drillPick(i){
  if(!dq||dq.state!=='ask')return;
  const q=dq.qs[dq.i];dq.chosen=i;
  const ok=q.mode==='tone'?q.opts[i]===q.correct:q.opts[i].id===q.w.id;
  drillAnswer(ok);
}
function drillNext(){dq.i++;dq.state='ask';dq.chosen=null;recState=null;renderDrill();}

/* recording */
async function recStart(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(stream);const chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      if(recState&&recState.url)URL.revokeObjectURL(recState.url);
      recState={url:URL.createObjectURL(b),rec:null};
      stream.getTracks().forEach(t=>t.stop());renderDrill();};
    recState={rec:mr,url:null};mr.start();renderDrill();
  }catch(e){recState={err:'Mic unavailable — check the browser permission.'};renderDrill();}
}
function recStop(){if(recState&&recState.rec)recState.rec.stop();}
function recPlay(){if(recState&&recState.url)new Audio(recState.url).play().catch(()=>{});}

let bkHandle=null, bkTimer=null, bkNeedPerm=false, bkBusy=false;
const SNAPKEY='zika_snap_v1';

function bkIDB(){return new Promise((res,rej)=>{
  let r;try{r=indexedDB.open('zika-bk',1);}catch(e){return rej(e);}
  r.onupgradeneeded=()=>{try{r.result.createObjectStore('h');}catch(e){}};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function bkPut(h){try{const db=await bkIDB();return new Promise(res=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(h,'file');t.oncomplete=()=>res(1);t.onerror=()=>res(0);});}catch(e){return 0;}}
async function bkGet(){try{const db=await bkIDB();return new Promise(res=>{const t=db.transaction('h','readonly');const q=t.objectStore('h').get('file');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function bkDel(){try{const db=await bkIDB();return new Promise(res=>{const t=db.transaction('h','readwrite');t.objectStore('h').delete('file');t.oncomplete=()=>res(1);t.onerror=()=>res(0);});}catch(e){return 0;}}

/* rolling in-browser snapshots — cheap insurance against a bad import or a glitch */
function snapshot(){
  try{
    const k=dkey(new Date());
    let snaps={}; try{snaps=JSON.parse(store.getItem(SNAPKEY)||'{}');}catch(e){}
    snaps[k]=JSON.stringify(S);
    const keys=Object.keys(snaps).sort();
    while(keys.length>3){delete snaps[keys.shift()];}
    store.setItem(SNAPKEY,JSON.stringify(snaps));
  }catch(e){}
}
function snapList(){try{const s=JSON.parse(store.getItem(SNAPKEY)||'{}');return Object.keys(s).sort().reverse();}catch(e){return[];}}
function snapRestore(k){
  try{
    const s=JSON.parse(store.getItem(SNAPKEY)||'{}');
    if(!s[k])return;
    if(!confirm('Restore your progress as it was on '+k+'? This replaces what is in this browser now.'))return;
    S=JSON.parse(s[k]); save(); alert('Restored '+k); renderSet(); badge();
  }catch(e){alert('Could not restore that snapshot.');}
}

function bkSupported(){return typeof window!=='undefined'&&!!window.showSaveFilePicker;}
async function bkChoose(){
  if(!bkSupported()){alert('This browser can’t write backup files directly. Use Chrome or Edge on the desktop — or keep using Export.');return;}
  try{
    const h=await window.showSaveFilePicker({suggestedName:'zika-progress.json',
      types:[{description:'字卡 progress',accept:{'application/json':['.json']}}]});
    bkHandle=h; bkNeedPerm=false; await bkPut(h);
    S.settings.autoBackup=true; S.settings.bkName=h.name||'zika-progress.json'; save();
    await bkWrite(); renderSet();
  }catch(e){ /* user cancelled */ }
}
async function bkForget(){
  bkHandle=null; await bkDel();
  S.settings.autoBackup=false; delete S.settings.bkName; save(); renderSet();
}
async function bkWrite(){
  if(!bkHandle||bkBusy)return false;
  bkBusy=true;
  try{
    let p='granted';
    if(bkHandle.queryPermission) p=await bkHandle.queryPermission({mode:'readwrite'});
    if(p!=='granted'){ bkNeedPerm=true; bkBusy=false; return false; }
    const w=await bkHandle.createWritable();
    await w.write(JSON.stringify(Object.assign({},S,{_app:'zika',_savedAt:new Date().toISOString()}),null,1));
    await w.close();
    S.settings.lastBackup=Date.now();
    try{store.setItem(KEY,JSON.stringify(S));}catch(e){}   /* direct write — never re-enter save() */
    bkNeedPerm=false; bkBusy=false;
    const el=document.getElementById('bkStamp'); if(el)el.textContent=bkAgo();
    return true;
  }catch(e){ bkBusy=false; bkNeedPerm=true; return false; }
}
/* ask for the write permission on a real user gesture (Chrome requires one) */
async function bkGrant(){
  if(!bkHandle)return;
  try{
    const r=await bkHandle.requestPermission({mode:'readwrite'});
    if(r==='granted'){bkNeedPerm=false; await bkWrite(); renderSet();}
  }catch(e){}
}
function bkQueue(){
  snapshot();
  if(!bkHandle||!S.settings.autoBackup)return;
  clearTimeout(bkTimer);
  bkTimer=setTimeout(()=>{bkWrite();},4000);
}
function bkAgo(){
  const t=S.settings.lastBackup; if(!t)return 'not yet saved';
  const s=Math.floor((Date.now()-t)/1000);
  if(s<90)return 'saved just now';
  if(s<5400)return 'saved '+Math.round(s/60)+' min ago';
  if(s<172800)return 'saved '+Math.round(s/3600)+' h ago';
  return 'saved '+Math.round(s/86400)+' days ago';
}
function bkStale(){
  if(S.settings.autoBackup&&bkHandle&&!bkNeedPerm)return false;
  const t=S.settings.lastBackup||0;
  return (Date.now()-t)>7*86400000 && Object.values(S.cards).some(c=>c.st!==undefined);
}

   v14 — queue control: sibling burying, uncapped intake,
         and an editable "Up next" priority queue.
   ============================================================ */

/* ============================================================
   v15 — 聽寫 dialogue split. One number per lesson: how many of
   that lesson's words belong to Dialogue I. Everything after is
   Dialogue II. Taken from the textbook vocabulary lists.
   ============================================================ */
var DLGSPLIT={22:19};   /* B2 L7: 垃圾…怎麼辦 = D1 (19), 聊…路上 = D2 (23) */
var DLG={};
(function(){for(const k in DLGSPLIT){const n=+DLGSPLIT[k];
  WORDS.filter(w=>w.l===+k).forEach((w,i)=>{DLG[w.id]=i<n?1:2;});}})();
/* defensive: the app's first render runs before this block executes, so these
   must never throw on undefined — otherwise the rest of the script dies. */
function dlgOf(wid){return (typeof DLG!=='undefined'&&DLG&&DLG[wid])||0;}
function hasDlg(ln){return !!(typeof DLGSPLIT!=='undefined'&&DLGSPLIT&&DLGSPLIT[ln]);}
function dlgWords(ln,d){if(!hasDlg(ln))return [];return WORDS.filter(w=>w.l===ln&&(S.settings.includeNames||!isName(w))&&dlgOf(w.id)===d);}
function dlgTag(wid){const d=dlgOf(wid);return d?`<span class="dtag d${d}">聽寫${d===1?'一':'二'}</span>`:'';}
var qOpen=false;
S.sib = S.sib || {};                              /* {dayKey:{wid:cid}} — who owns the word today */
if(S.settings.burySib===undefined) S.settings.burySib = true;
if(S.settings.newUnlimited===undefined) S.settings.newUnlimited = false;
if(S.settings.revUnlimited===undefined) S.settings.revUnlimited = false;
S.pick = S.pick || [];

/* keep S.sib from growing forever — only today and yesterday matter */
(function pruneSib(){
  const keep=[dkey(new Date()), dkey(new Date(Date.now()-864e5))];
  for(const k in S.sib) if(!keep.includes(k)) delete S.sib[k];
})();

function sibToday(){const t=dkey(new Date());S.sib[t]=S.sib[t]||{};return S.sib[t];}
/* claim a word for one card — called on every grade */
function sibClaim(cid){
  if(!S.settings.burySib)return;
  const wid=cid.split(':')[0], m=sibToday();
  if(!m[wid]) m[wid]=cid;
}
/* a started card is buried when its word is already owned today by its sibling */
function sibBuried(cid){
  if(!S.settings.burySib)return false;
  const wid=cid.split(':')[0], owner=sibToday()[wid];
  return !!owner && owner!==cid;
}

/* ---------- queue: burying + uncapped intake ---------- */
buildQueue=function(){
  const now=Date.now(), today=dkey(new Date());
  const introToday=S.intro[today]||0;
  const learn=[],rev=[],freshAll=[];
  for(const cid in S.cards){
    const c=S.cards[cid], w=wordOf(cid); if(!w)continue;
    if(c.susp)continue;
    if(!S.settings.includeNames&&isName(w))continue;
    if(!S.settings.modes[modeOf(cid)])continue;
    if(c.st===undefined){freshAll.push(cid);continue;}   /* new pairs are never buried */
    if(sibBuried(cid))continue;                          /* sibling already done today */
    if(c.due<=now){(c.st==='rev'?rev:learn).push(cid);}
  }
  learn.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  rev.sort((a,b)=>S.cards[a].due-S.cards[b].due);

  /* both siblings due and neither claimed yet → keep the earlier one, defer the other */
  if(S.settings.burySib){
    const seen={};
    const thin=list=>list.filter(cid=>{
      const wid=cid.split(':')[0];
      if(seen[wid])return false;
      seen[wid]=cid; return true;
    });
    const L=thin(learn), R=thin(rev);
    learn.length=0; learn.push(...L);
    rev.length=0;   rev.push(...R);
  }

  const mOrd={rec:0,prod:1};
  const pickIdx=wid=>{const i=(S.pick||[]).indexOf(wid);return i===-1?9999:i;};
  freshAll.sort((a,b)=>{const wa=wordOf(a),wb=wordOf(b);return pickIdx(wa.id)-pickIdx(wb.id)||wa.l-wb.l||parseInt(wa.id.slice(1))-parseInt(wb.id.slice(1))||mOrd[modeOf(a)]-mOrd[modeOf(b)];});

  const allowance = S.settings.newUnlimited ? Infinity : Math.max(0,S.settings.newPerDay-introToday);
  const planned=new Set(); const fresh=[];
  for(const cid of freshAll){
    const wid=cid.split(':')[0];
    if(wordStartedBefore(wid)||planned.has(wid)){fresh.push(cid);continue;}
    if(planned.size<allowance){planned.add(wid);fresh.push(cid);}
  }
  const revCap = S.settings.revUnlimited ? rev.length : S.settings.maxRev;
  return {learn,rev:rev.slice(0,revCap),fresh};
};

/* claim the word the moment it's graded */
rate=(function(orig){return function(cid,g){orig.apply(this,arguments);sibClaim(cid);};})(rate);

  const a=S.pick[i]; S.pick[i]=S.pick[j]; S.pick[j]=a; save(); renderHome();
}

/* bulk-load a lesson's not-yet-started words onto the end of the queue */
function qLoadLesson(ln,limit,dlg){
  const add=WORDS.filter(w=>w.l===ln)
    .filter(w=>S.settings.includeNames||!isName(w))
    .filter(w=>!dlg||dlgOf(w.id)===dlg)
    .filter(w=>!isKnown(w.id)&&!wordMastAt(w.id))
    .filter(w=>!wordStartedBefore(w.id))
    .map(w=>w.id)
    .filter(wid=>!S.pick.includes(wid));
  const take = limit?add.slice(0,limit):add;
  take.forEach(wid=>{if(!tracked(wid))trackWord(wid);S.pick.push(wid);});
  save(); renderHome(); badge();
  return take.length;
}
function qLoadHard(){
  const add=(S.hard||[]).filter(wid=>!wordStartedBefore(wid)&&!S.pick.includes(wid));
  add.forEach(wid=>{if(!tracked(wid))trackWord(wid);S.pick.push(wid);});
  save(); renderHome(); badge();
}

function qStartingToday(){

/* ============================================================
   v16 — Library search, rebuilt.
   Was: every keystroke re-rendered all 30 lesson accordions,
   ran 60 full scans of WORDS, built ~1MB of HTML for a broad
   query, and replaced the <input> itself (killing caret + IME).
   Now: prebuilt index, tone-insensitive pinyin, ranked flat
   results, capped + chunked painting, persistent input node.
   ============================================================ */
var LIBIDX=null, libTimer=null, libComposing=false, libShowAll=false, libPaintTok=0;
var LIB_PAGE=45;          /* rows painted synchronously */
var LIB_CHUNK=60;         /* rows appended per animation frame */

function libStrip(s){
  /* ā→a etc. so "lese"/"laji" both find 垃圾 and "nuli" finds 努力 */
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
/* Thorne learned mainland readings; he will type those. Taiwan reading stays
   primary everywhere in the UI — these are search aliases only. */
var READ_ALIAS={'垃圾':'laji','星期':'xingqi','法國':'faguo','網路':'wangluo','期':'qi',
  '和':'he','企業':'qiye','危險':'weixian'};
function buildLibIdx(){
  if(LIBIDX)return LIBIDX;
  LIBIDX=WORDS.map(w=>{
    const p=libStrip(w.p);
    const pn=p.replace(/[^a-z0-9]/g,'');
    const al=READ_ALIAS[w.t]||'';
    return {w, t:w.t, p, pn, alias:al, m:libStrip(w.m)};
  });
  return LIBIDX;
}
function libWordStart(hay,q){
  let i=hay.indexOf(q);
  while(i>-1){ if(i===0||!/[a-z0-9]/.test(hay[i-1]))return true; i=hay.indexOf(q,i+1); }
  return false;
}
/* higher = better. 0 means no match. */
function libScore(e,q,qn){
  if(e.t===q)return 100;
  if(e.t.indexOf(q)===0)return 92;
  if(e.t.indexOf(q)>-1)return 84;
  if(qn){
    if(e.pn===qn)return 76;
    if(e.alias&&e.alias===qn)return 74;
    if(e.pn.indexOf(qn)===0)return 68;
    if(e.alias&&e.alias.indexOf(qn)===0)return 66;
    if(e.p.indexOf(qn)>-1||e.pn.indexOf(qn)>-1)return 52;
  }
  if(e.m===q)return 48;
  if(e.m.indexOf(q)===0)return 40;
  if(libWordStart(e.m,q))return 32;
  if(e.m.indexOf(q)>-1)return 18;
  return 0;
}
function libPassesFilter(w){
  if(!S.settings.includeNames&&isName(w))return false;
  if(libFilter==='all')return true;
  const st=wordStatus(w.id);
  if(libFilter==='tracked')return !!st;
  if(libFilter==='untracked')return !st;
  if(libFilter==='due')return !!st&&st.k==='due';
  if(libFilter==='simp')return !!w.s;
  return true;
}
function libMatches(q){
  const idx=buildLibIdx();
  const qq=libStrip(q).trim();
  const qn=qq.replace(/[^a-z0-9]/g,'');
  /* one Latin letter matches 80% of the dictionary as a substring, which is noise
     and slow. Demand a real match: 字, pinyin prefix, or start of a meaning word. */
  const floor=(qq.length===1&&/^[a-z0-9]$/.test(qq))?66:1;
  const hits=[];
  for(let k=0;k<idx.length;k++){
    const e=idx[k];
    const s=libScore(e,qq,qn);
    if(s<floor)continue;
    if(!libPassesFilter(e.w))continue;
    hits.push({w:e.w,s:s,k:k});
  }
  hits.sort((a,b)=>b.s-a.s || a.w.l-b.w.l || a.k-b.k);
  return hits;
}

/* ---------- results ---------- */
function renderLibResults(){
  const box=document.getElementById('libResults'); if(!box)return;
  const keepScroll=window.scrollY;                 /* row buttons re-render; don't jump */
  requestAnimationFrame(()=>{if(Math.abs(window.scrollY-keepScroll)>4)window.scrollTo(0,keepScroll);});
  const tok=++libPaintTok;                     /* cancels any in-flight chunked paint */
  const q=libSearch.trim();
  if(q){
    const hits=libMatches(q);
    if(!hits.length){
      box.innerHTML=`<div class="card"><div class="small muted" style="text-align:center;padding:18px 0">
        Nothing matches <b>${esc(q)}</b>${libFilter!=='all'?` in <b>${esc(libFilter)}</b>`:''}.
        ${libFilter!=='all'?`<div style="margin-top:8px"><span class="link" onclick="libFilter='all';libSyncChrome();renderLibResults()">search all words instead</span></div>`:''}
      </div></div>`;
      return;
    }
    const cap=libShowAll?hits.length:Math.min(hits.length,LIB_PAGE);
    box.innerHTML=`<div class="card">
      <div class="row spread" style="margin-bottom:4px">
        <div class="lab" style="margin-bottom:0">${hits.length} match${hits.length===1?'':'es'}</div>
        ${hits.length>LIB_PAGE&&!libShowAll?`<button class="btn sm ghost" onclick="libShowAll=true;renderLibResults()">Show all ${hits.length}</button>`:''}
      </div>
      <div class="wl" id="libRows"></div>
      <div class="small muted" id="libMore" style="margin-top:10px"></div>
    </div>`;
    const rows=document.getElementById('libRows');
    const first=Math.min(cap,LIB_PAGE);
    rows.innerHTML=hits.slice(0,first).map(h=>wrowHtml(h.w,true)).join('');
    if(cap>first){
      /* paint the rest across frames so the keystroke never blocks */
      let i=first;
      const step=()=>{
        if(tok!==libPaintTok)return;
        const end=Math.min(i+LIB_CHUNK,cap);
        rows.insertAdjacentHTML('beforeend',hits.slice(i,end).map(h=>wrowHtml(h.w,true)).join(''));
        i=end;
        if(i<cap)requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    const more=document.getElementById('libMore');
    if(more)more.textContent = hits.length>cap
      ? `Showing the ${cap} closest matches of ${hits.length}.`
      : (hits.length>6?`Ranked: exact 字 first, then pinyin, then meaning.`:'');
    return;
  }
  /* no query — the lesson accordions, unchanged in behaviour */
  const lnStart=(libBook-1)*15+1, lnEnd=libBook*15;
  let html='';
  for(let ln=lnStart;ln<=lnEnd;ln++){
    const all=LESSON_WORDS[ln]||[];
    const ws=all.filter(libPassesFilter);
    if(!ws.length&&libFilter!=='all')continue;
    const nTracked=all.filter(w=>tracked(w.id)).length;
    const open=!!openLessons[ln]||libFilter!=='all';
    html+=`<div class="lesson ${open?'open':''}">
      <div class="head" onclick="openLessons[${ln}]=!openLessons[${ln}];renderLibResults()">
        <span class="car">▶</span>
        <div><div class="ttl">${lnLabel(ln)} · ${LESSON_TITLES[ln]}</div><div class="sub">${nTracked} of ${all.length} in deck</div></div>
        <div class="acts">
          <button class="btn sm" onclick="event.stopPropagation();startTriage(${ln})" title="step through this lesson word by word and sort it">Triage</button>
          ${hasDlg(ln)?`<button class="btn sm ghost" onclick="event.stopPropagation();startTriage(${ln},1)" title="only the Dialogue I words — the 聽寫一 set">Triage 聽寫一</button>
          <button class="btn sm ghost" onclick="event.stopPropagation();startTriage(${ln},2)" title="only the Dialogue II words — the 聽寫二 set">Triage 聽寫二</button>`:''}
          ${nTracked<all.length?`<button class="btn sm ghost" onclick="event.stopPropagation();(LESSON_WORDS[${ln}]||[]).forEach(w=>trackWord(w.id));renderLib();badge()">Study lesson</button>
          <button class="btn sm ghost" title="mark whole lesson as already known" onclick="event.stopPropagation();if(confirm('Mark all of ${lnLabel(ln)} as already known? They skip learning and re-check in about 3 weeks.')){(LESSON_WORDS[${ln}]||[]).forEach(w=>markKnown(w.id));renderLib();badge();}">Know it all</button>`
          :`<button class="btn sm ghost" onclick="event.stopPropagation();if(confirm('Remove all ${lnLabel(ln)} cards and their progress?')){(LESSON_WORDS[${ln}]||[]).forEach(w=>untrackWord(w.id));renderLib();badge();}">Remove</button>`}
        </div>

      ${open?`<div class="wl">${ws.map(w=>wrowHtml(w)).join('')}</div>`:''}
    </div>`;
  }
  box.innerHTML=html;
}

/* ============================================================
   v17 — Confidence levels, one scale shared with Notion.
   1 Hard · 2 Learning · 3 Know · 4 Mastered.
   Derived from the real card state every time it is read, so
   reviews can promote a word (stable ≥21 d → Know, ≥60 d →
   Mastered) or demote it (a lapse drops it back to Learning).
   The hard list always wins. S.conf carries a snapshot keyed
   "詞|B2 L6" → level, which is what the Notion sync reads.
   ============================================================ */
const CONF=[null,
  {t:'Hard',     c:'c1', d:'on the hard list — drill it'},
  {t:'Learning', c:'c2', d:'in the deck, not yet stable'},
  {t:'Know',     c:'c3', d:'stable for 3 weeks or more'},
  {t:'Mastered', c:'c4', d:'stable for 2 months or more'}];
function confOf(wid){
  if(isHard(wid))return 1;
  const cs=MODES.map(m=>S.cards[cardId(wid,m)]).filter(Boolean);
  if(!cs.length)return 0;
  const real=cs.filter(c=>c.st!==undefined);
  if(!real.length||real.length<cs.length)return 2;
  const minS=Math.min(...real.map(c=>c.S||0));
  return minS>=60?4:minS>=21?3:2;
}
function confCounts(ln){
  const n=[0,0,0,0,0];
  for(const w of WORDS){ if(ln&&w.l!==ln)continue; if(!S.settings.includeNames&&isName(w))continue; n[confOf(w.id)]++; }
  return n;
}
function confSnapshot(){
  const words={};
  for(const w of WORDS){ const l=confOf(w.id); if(l) words[w.t+'|'+lnLabel(w.l)]=l; }
  return {v:1, at:new Date().toISOString(), scale:{1:'Hard',2:'Learning',3:'Know',4:'Mastered'}, words};
}
/* every save refreshes the snapshot, so the backup file and Export always carry it */
const _save17=save;
save=function(){ try{ S.conf=confSnapshot(); }catch(e){} _save17(); };
/* saying "I know it" / "mastered" takes a word off the hard list — otherwise Hard would keep winning */
const _markKnown17=markKnown, _markMastered17=markMastered;
markKnown=function(wid){ if(isHard(wid))S.hard=S.hard.filter(x=>x!==wid); _markKnown17(wid); };
markMastered=function(wid){ if(isHard(wid))S.hard=S.hard.filter(x=>x!==wid); _markMastered17(wid); };
/* Triage: "Learning" on a word already Know/Mastered resets its cards so the level really drops */
const _triageAct17=triageAct;
triageAct=function(a){
  if(tri){ const wid=tri.list[tri.i];
    if(wid&&a==='learn'){ if(isHard(wid))S.hard=S.hard.filter(x=>x!==wid); if(confOf(wid)>=3)MODES.forEach(m=>{if(S.settings.modes[m])S.cards[cardId(wid,m)]={};}); }
  }
  _triageAct17(a);
};

const _wrow17=wrowHtml;
wrowHtml=function(w,showLn){
