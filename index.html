<script>
/* ============ VERSION ============ */
const APP_VERSION=62;   /* keep in step with VERSION in sw.js — tools/check.mjs verifies it */

/* ============ THEME ============ */
function curTheme(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
function applyTheme(t){
  if(!t||t==='auto')t=sysDark()?'dark':'light';
  if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  const b=document.getElementById('themeBtn'); if(b)b.textContent=t==='dark'?'☀':'☾';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',cssVar('--bg')||'#faf9f7');
  try{shLook();}catch(e){}
}
function toggleTheme(){const t=curTheme()==='dark'?'light':'dark';S.settings.theme=t;save();applyTheme(t);
  if(view==='brain')renderBrain(); if(view==='home')renderHome();}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
/* ============ DATA ============ */
const LESSON_TITLES = {1:"Welcome to Taiwan!",2:"My Family",3:"What Are You Doing Over the Weekend?",4:"Excuse Me. How Much Does That Cost in Total?",5:"Beef Noodles Are Really Delicious",6:"Their School Is Up in the Mountains",7:"Going to KTV at 9 o'clock in the Morning",8:"Taking a Train to Tainan",9:"Where Will You Go for the Holidays?",10:"The Fruit in Taiwan Tastes Really Good",11:"I Would Like to Rent a Place",12:"How Long Will You Be Studying Chinese in Taiwan?",13:"Happy Birthday!",14:"It's So Cold!",15:"I Don't Feel Well",16:"Excuse Me. How Do You Get to Shida?",17:"Take the MRT Instead!",18:"Your Chinese Has Improved!",19:"I Work Part-time. I Teach French.",20:"Attending a Wedding Reception",21:"I Plan to Move Closer to School",22:"The Garbage Truck Is Here!",23:"Learning Kung Fu",24:"That City Is Really Beautiful",25:"Come to My Place to Make Dumplings",26:"Taiwan Really Has Lots of Fun Places",27:"How to Have a Healthy Diet?",28:"I Lost My Cell Phone",29:"I Am Going to Start Looking for a Job",30:"Lunar New Year",31:"School Starts",32:"Up to 20% off",33:"Did You Bring Your Coat?",34:"I Love Taiwanese Hospitality"};
const byId = {}; WORDS.forEach(w=>byId[w.id]=w);
const isName = w => /^a (woman|man) from/.test(w.m)||/name of a (girl|boy|man|woman)|, a (man|woman) from/.test(w.m);
/* Books and lessons. Lessons are numbered globally and contiguously; a new book is one entry here plus its data. */
const BOOKS=[{n:1,zh:'一',first:1,count:15},{n:2,zh:'二',first:16,count:15},{n:3,zh:'三',first:31,count:4}];
const MAX_LN=BOOKS[BOOKS.length-1].first+BOOKS[BOOKS.length-1].count-1;
const bookAt=ln=>BOOKS.find(b=>ln>=b.first&&ln<b.first+b.count)||BOOKS[BOOKS.length-1];
const bookOf=ln=>bookAt(ln).n;
const bookRange=n=>{const b=BOOKS.find(x=>x.n===n)||BOOKS[0];return [b.first,b.first+b.count-1];};
const lessonsOf=n=>{const [a,z]=bookRange(n);return Array.from({length:z-a+1},(_,i)=>a+i);};
const lnInBook=ln=>ln-bookAt(ln).first+1;
const lnLabel=ln=>'B'+bookOf(ln)+' L'+lnInBook(ln);
const lnShort=ln=>(bookOf(ln)===1?'':bookAt(ln).zh)+lnInBook(ln);
/* Lessons are always chosen book by book: pick the book, then the lesson inside it.
   `js` runs with `v` = the chosen lesson (the internal lesson index never reaches the screen). */
function lessonPick(cur,js){
  const b=bookAt(cur);
  return '<span class="lpick"><select class="vsel" aria-label="Book" onchange="{const v=bookRange(+this.value)[0];'+js+'}">'
    +BOOKS.map(x=>'<option value="'+x.n+'"'+(x.n===b.n?' selected':'')+'>Book '+x.n+'</option>').join('')+'</select>'
    +'<select class="vsel" aria-label="Lesson" onchange="{const v=+this.value;'+js+'}">'
    +lessonsOf(b.n).map(l=>'<option value="'+l+'"'+(l===cur?' selected':'')+'>Lesson '+lnInBook(l)+'</option>').join('')+'</select></span>';
}
const bookButtons=(cur,onclick)=>BOOKS.map(b=>'<button class="'+(cur===b.n?'on':'')+'" data-bk="'+b.n+'"'+(onclick?' onclick="'+onclick(b)+'"':'')+'>'+b.zh+' Book '+b.n+'</button>').join('');

/* ============ SAFE STORAGE ============ */
const store = (()=>{try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}catch(e){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('storageBanner').style.display='block'});const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const KEY='shida_b1_fsrs_v2';

/* ============ STATE ============ */
let S = {cards:{}, settings:{retention:0.9, newPerDay:9, maxRev:200, modes:{rec:true,prod:true}, includeNames:false, ghost:true, earlyDrill:true, writeTarget:20, autoplayAudio:true, speechRate:0.85, voiceName:'', strokeAnim:true}, log:{}, intro:{}, hist:{d:[],s:[]} };
const MASTER_S=45; // days of stability = "mastered"
/* Every change to S ends in save(). Many changes in one tick make one write (saveNow): the state is stored, the
   backup file and the cloud push are queued, and whatever cached a view of the deck is told it is stale. */
let savePending=false;
function save(){
  SYNC.gen=(SYNC.gen||0)+1;                  /* a push that began before this change must not clear the dirty mark */
  if(savePending)return; savePending=true;
  queueMicrotask(()=>{savePending=false;try{saveNow();}catch(e){}});
}
/* store the deck on this device and queue the backup file; nothing else */
function saveLocal(){try{store.setItem(KEY,JSON.stringify(S))}catch(e){} bkQueue();}
function saveNow(){
  QV++;                                       /* the cached queue is out of date */
  try{S.conf=confSnapshot();}catch(e){}       /* the confidence snapshot travels with every copy of the deck */
  try{store.setItem(KEY,JSON.stringify(S))}catch(e){}
  bkQueue();
  if(SYNC.applying)return;                    /* taking the cloud's copy is not a change made here */
  SYNC.dirty=true;syncMetaSave();fbSchedulePush();
}

/* ============ FSRS-5 ============ */
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5, FACTOR=19/81, DAY=86400000, MIN=60000;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const retrievability=(t,s)=>Math.pow(1+FACTOR*t/s,DECAY);
function nextIntervalDays(s){const r=S.settings.retention;return clamp(Math.round(s/FACTOR*(Math.pow(r,1/DECAY)-1)),1,365);}
const initS=g=>W[g-1];
const initD=g=>clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
function updD(d,g){let nd=d-W[6]*(g-3)*((10-d)/9);nd=W[7]*initD(4)+(1-W[7])*nd;return clamp(nd,1,10);}
function stabRecall(s,d,r,g){const hard=g===2?W[15]:1, easy=g===4?W[16]:1;return s*(Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp(W[10]*(1-r))-1)*hard*easy+1);}
function stabForget(s,d,r){return Math.min(s, W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp(W[14]*(1-r)));}
function stabShort(s,g){return s*Math.exp(W[17]*(g-3+W[18]));}
function fuzz(days){if(days<3)return days;const f=days*0.05;return Math.round(days+(Math.random()*2-1)*f);}
// early-drill: force writing cards back on day 1, 2, 3 before FSRS takes over
function capEarly(c,cid,days){
  if(!S.settings.earlyDrill||modeOf(cid)!=='prod')return days;
  const d=(c&&c.days)||0;
  if(d===0)return Math.min(days,1);
  if(d===1)return Math.min(days,2);
  if(d===2)return Math.min(days,3);
  return days;
}
function previewIv(c,cid,g){
  const now=Date.now();
  const fmt=d=>d+'d';
  if(!c||c.st===undefined){
    if(g===1)return'1m'; if(g===2)return'5m'; if(g===3)return'10m';
    return fmt(capEarly(c,cid,nextIntervalDays(initS(4))));
  }
  if(c.st==='learn'||c.st==='relearn'){
    if(g===1)return'1m'; if(g===2)return'5m';
    return fmt(capEarly(c,cid,Math.max(1,nextIntervalDays(stabShort(c.S,g)))));
  }
  const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S);
  if(g===1)return'5m';
  return fmt(capEarly(c,cid,nextIntervalDays(stabRecall(c.S,c.D,r,g))));
}
function wordStartedBefore(wid){return MODES.some(m=>{const c=S.cards[cardId(wid,m)];return c&&c.st!==undefined;});}
/* One answer on one card: `g` is 1 Again, 2 Hard, 3 Good, 4 Easy. Updates the card (FSRS-5), the day's counts,
   and which daily allowance a newly started word was taken from. */
function rate(cid,g){
  const now=Date.now(), today=dkey(new Date()), gram=isGram(cid);
  const fresh=!S.cards[cid]||S.cards[cid].st===undefined, introBefore=S.intro[today]||0;
  /* a word started for the first time counts against its lane's allowance; worked out before the card changes */
  const lane=!gram&&fresh&&!wordStartedBefore(cid.split(':')[0])?laneOf(cid):null;

  let c=S.cards[cid];
  S.log[today]=S.log[today]||{rev:0,new:0};
  const schedule=(days)=>{days=capEarly(c,cid,days);c.due=now+fuzz(days)*DAY;c.days=(c.days||0)+1;};
  if(fresh){
    const wid=cid.split(':')[0];
    if(!wordStartedBefore(wid)){S.intro[today]=(S.intro[today]||0)+1;if(S.pick)S.pick=S.pick.filter(x=>x!==wid);}
    c={st:'learn',S:initS(g),D:initD(g),due:0,last:now,reps:1,lapses:0,days:0};
    S.cards[cid]=c;
    S.log[today].new++;
    if(g===1)c.due=now+1*MIN; else if(g===2)c.due=now+5*MIN; else if(g===3)c.due=now+10*MIN;
    else {c.st='rev'; schedule(nextIntervalDays(c.S));}
  } else if(c.st==='learn'||c.st==='relearn'){
    S.log[today].rev++;
    c.reps++;c.last=now;c.S=stabShort(c.S,g);c.D=updD(c.D,g);
    if(g===1)c.due=now+1*MIN; else if(g===2)c.due=now+5*MIN;
    else {c.st='rev'; schedule(Math.max(1,nextIntervalDays(c.S)));}
  } else {
    S.log[today].rev++;
    const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S);
    const d0=c.D;            /* FSRS-5: the new stability uses the difficulty the card had going in */
    c.D=updD(d0,g); c.reps++; c.last=now;
    if(g===1){c.lapses++;c.S=stabForget(c.S,d0,r);c.st='relearn';c.due=now+5*MIN;}
    else {c.S=stabRecall(c.S,d0,r,g);schedule(nextIntervalDays(c.S));}
  }
  /* mastery timestamps for the Brain view */
  if(c.st==='rev'&&c.S>=MASTER_S){if(!c.mastAt)c.mastAt=now;}
  else if(c.mastAt){delete c.mastAt;}
  save();

  sibClaim(cid);                                   /* the word is this card's for today: its sibling waits */
  /* a grammar card is not a word: it counts against the grammar allowance, never the word one */
  if(gram){S.intro[today]=introBefore;if(fresh){S.gintro=S.gintro||{};S.gintro[today]=(S.gintro[today]||0)+1;}save();}
  /* leeches: the 4th miss puts the word on the hard list, the 7th parks the card until it is un-parked in Settings */
  if(!gram&&g===1)try{
    const wid=cid.split(':')[0];
    if(c.lapses===LEECH_TAG){addHard(wid);toast('4th miss on '+esc(byId[wid].t)+' — on the hard list and tonight’s paper');}
    if(c.lapses>=LEECH_PARK&&!c.susp){c.susp=1;c.leech=1;save();addHard(wid);toast('Leech parked: '+esc(byId[wid].t)+' · un-park it in Settings → Card strategy',{ms:6000});
      if(rq){['learn','rev','fresh'].forEach(k=>{rq[k]=rq[k].filter(x=>x!==cid);});}}
  }catch(e){}
  if(lane==='catch'){S.intro[today]=introBefore;S.cintro=S.cintro||{};S.cintro[today]=(S.cintro[today]||0)+1;save();}
}

/* ============ CARDS / MODES ============ */
const MODES=['rec','prod'];
const MODE_LABEL={rec:'Recognize · 認字',prod:'Write · 聽寫'};
function cardId(wid,m){return wid+':'+m;}
function wordOf(cid){return byId[cid.split(':')[0]];}
function modeOf(cid){return cid.split(':')[1];}
function tracked(wid){return MODES.some(m=>S.cards[cardId(wid,m)]);}
function trackWord(wid){MODES.forEach(m=>{if(S.settings.modes[m]&&!S.cards[cardId(wid,m)])S.cards[cardId(wid,m)]={};});save();}
function untrackWord(wid){MODES.forEach(m=>{delete S.cards[cardId(wid,m)];});save();}
function markKnown(wid){ // "I already know this" — skip learning, verify in ~3 weeks
  if(isHard(wid))S.hard=S.hard.filter(x=>x!==wid);
  if(S.pick)S.pick=S.pick.filter(x=>x!==wid);
  MODES.forEach(m=>{
    if(!S.settings.modes[m])return;
    const k=cardId(wid,m), c=S.cards[k];
    if(c&&c.st==='rev'&&c.S>=21)return;
    S.cards[k]={st:'rev',S:21,D:4,due:Date.now()+fuzz(21)*DAY,last:Date.now(),reps:1,lapses:0,days:99,known:1};
  });
  save();
}
function markMastered(wid){ // "I've mastered this" — straight onto the shelf, resurface in ~3 months, NO paper reps
  if(isHard(wid))S.hard=S.hard.filter(x=>x!==wid);
  if(S.pick)S.pick=S.pick.filter(x=>x!==wid);
  MODES.forEach(m=>{
    if(!S.settings.modes[m])return;
    S.cards[cardId(wid,m)]={st:'rev',S:90,D:3,due:Date.now()+fuzz(90)*DAY,last:Date.now(),reps:1,lapses:0,days:99,known:1,mastAt:Date.now()};
  });
  save();
}
function isKnown(wid){return MODES.some(m=>(S.cards[cardId(wid,m)]||{}).known);}
function wordStatus(wid){
  let states=MODES.map(m=>S.cards[cardId(wid,m)]).filter(Boolean);
  if(!states.length)return null;
  const real=states.filter(c=>c.st!==undefined);
  if(!real.length)return{k:'new',t:'queued'};
  if(real.some(c=>c.due<=Date.now()))return{k:'due',t:'due'};
  if(real.length===states.length&&Math.min(...real.map(c=>c.S||0))>=21)return{k:'mat',t:'solid'};
  return{k:'ok',t:'learning'};
}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ============ QUEUE ============ */
/* What is ready to study now: {learn, rev, fresh}, each a list of card ids in the order they are served.
   Built in steps (words, grammar cards, write cards out of scope, the backlog after days away, the per-lane
   allowance of new words) and kept for 400 ms, because one paint asks for it several times. `QV` moves on
   every save, which drops the kept copy. */
let QV=0, QCACHE=null;
function buildQueue(){
  const now=Date.now();
  if(QCACHE&&QCACHE.v===QV&&now-QCACHE.t<400){const q=QCACHE.q;return {learn:q.learn.slice(),rev:q.rev.slice(),fresh:q.fresh.slice()};}
  const q=queueLanes(queueBacklog(queueScope(queueGrammar(queueWords()))));
  QCACHE={v:QV,t:now,q:{learn:q.learn.slice(),rev:q.rev.slice(),fresh:q.fresh.slice()}};
  return q;
}
/* word cards: learning steps, due reviews (siblings kept apart), and the new ones the day still allows */
function queueWords(){
  const now=Date.now(), today=dkey(new Date());
  const introToday=S.intro[today]||0;
  const learn=[],rev=[],freshAll=[];
  for(const cid in S.cards){
    const c=S.cards[cid], w=wordOf(cid); if(!w)continue;
    if(c.susp)continue;
    if(!S.settings.includeNames&&isName(w))continue;
    if(!S.settings.modes[modeOf(cid)])continue;
    if(c.st===undefined){freshAll.push(cid);continue;}   /* new pairs are never buried */
    /* a write card that is out of scope is never served, so it must not hold the word ahead of its sibling */
    if(modeOf(cid)==='prod'&&typeof prodInScope==='function'&&!prodInScope(w.id))continue;
    if(c.st==='rev'&&sibBuried(cid))continue;            /* sibling already done today; learning steps always finish */
    if(c.due<=now){(c.st==='rev'?rev:learn).push(cid);}
  }
  learn.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  rev.sort((a,b)=>S.cards[a].due-S.cards[b].due);

  /* both siblings due and neither claimed yet → keep the earlier one, defer the other */
  if(S.settings.burySib){
    const seen={};
    const thin=list=>list.filter(cid=>{
      const wid=cid.split(':')[0];
      if(seen[wid])return false;
      seen[wid]=cid; return true;
    });
    const L=thin(learn), R=thin(rev);
    learn.length=0; learn.push(...L);
    rev.length=0;   rev.push(...R);
  }

  const mOrd={rec:0,prod:1};
  const pickIdx=wid=>{const i=(S.pick||[]).indexOf(wid);return i===-1?9999:i;};
  freshAll.sort((a,b)=>{const wa=wordOf(a),wb=wordOf(b);return pickIdx(wa.id)-pickIdx(wb.id)||wa.l-wb.l||parseInt(wa.id.slice(1))-parseInt(wb.id.slice(1))||mOrd[modeOf(a)]-mOrd[modeOf(b)];});

  const allowance = S.settings.newUnlimited ? Infinity : Math.max(0,S.settings.newPerDay-introToday);
  const planned=new Set(); const fresh=[];
  for(const cid of freshAll){
    const wid=cid.split(':')[0];
    if(wordStartedBefore(wid)||planned.has(wid)){fresh.push(cid);continue;}
    if(planned.size<allowance){planned.add(wid);fresh.push(cid);}
  }
  const revCap = S.settings.revUnlimited ? rev.length : S.settings.maxRev;
  return {learn,rev:rev.slice(0,revCap),fresh};
}
/* grammar cards ride along with the word cards */
function queueGrammar(q){
  if(S.settings.gramCards===false)return q;
  const now=Date.now(), today=dkey(new Date());
  const fresh=[],learn=[],rev=[];
  for(const cid in S.cards){
    if(!isGram(cid))continue; const c=S.cards[cid]; if(!c||c.susp||!GP[cid.slice(2)])continue;
    if(c.st===undefined){fresh.push(cid);continue;}
    if(c.due<=now)(c.st==='rev'?rev:learn).push(cid);
  }
  const _cl=S.settings.curLesson||26; fresh.sort((a,b)=>((GP[b.slice(2)].l>=_cl-1)-(GP[a.slice(2)].l>=_cl-1))||(GP[b.slice(2)].l-GP[a.slice(2)].l));
  const allow=Math.max(0,(S.settings.newGramPerDay??4)-((S.gintro||{})[today]||0));
  q.learn=q.learn.concat(learn).sort((a,b)=>S.cards[a].due-S.cards[b].due);
  q.rev=q.rev.concat(rev.sort((a,b)=>S.cards[a].due-S.cards[b].due));
  q.fresh=q.fresh.concat(fresh.slice(0,allow));
  return q;
}
/* write cards are only served for words in scope (Settings → Card strategy) */
function queueScope(q){
  if((S.settings.prodScope||'current')==='all')return q;
  const keep=cid=>!(modeOf(cid)==='prod'&&!prodInScope(cid.split(':')[0]));
  q.learn=q.learn.filter(keep); q.rev=q.rev.filter(keep); q.fresh=q.fresh.filter(keep);
  return q;
}
/* after days away the pile of due reviews is served a quarter at a time, the live lesson and the cards most
   likely still remembered first, and new words wait; BACKLOG tells Today that this is happening */
function queueBacklog(q){
  BACKLOG=null;
  try{
    const now=Date.now(), maxRev=S.settings.revUnlimited?9999:(S.settings.maxRev||200), cl=S.settings.curLesson||23;
    const due=[];
    for(const cid in S.cards){const c=S.cards[cid],w=wordOf(cid);if(!w||!c||c.susp||c.st!=='rev'||c.due>now)continue;if(!S.settings.includeNames&&isName(w))continue;if(!S.settings.modes[modeOf(cid)])continue;if(modeOf(cid)==='prod'&&!prodInScope(w.id))continue;if(sibBuried(cid))continue;due.push(cid);}
    const gap=lastStudyGap();
    if(!(due.length>maxRev*1.25||(gap>=5&&due.length>40)))return q;
    const live=cid=>{const w=wordOf(cid);return w.l>=cl-1||isHard(w.id);};
    const R=cid=>{const c=S.cards[cid];return retrievability(Math.max(0.01,(now-c.last)/DAY),c.S);};
    due.sort((a,b)=>(live(b)-live(a))||(R(b)-R(a)));
    if(S.settings.burySib){const seen=new Set();for(let i=0;i<due.length;i++){const wid=due[i].split(':')[0];if(seen.has(wid))due.splice(i--,1);else seen.add(wid);}}
    const today=Math.min(maxRev,Math.max(60,Math.ceil(due.length/4)));
    const gram=q.rev.filter(isGram);
    q.rev=due.slice(0,today).concat(gram);
    q.fresh=q.fresh.filter(isGram);
    BACKLOG={due:due.length,today,gap,live:due.filter(live).length};
  }catch(e){}
  return q;
}
/* new words are let in lane by lane: this week's lessons and the catch-up lane each have their own daily allowance */
function queueLanes(q){
  try{
    const today=dkey(new Date()), now=Date.now();
    const allow={live:Math.max(0,(S.settings.newUnlimited?9999:(S.settings.newPerDay??8))-((S.intro||{})[today]||0)),catch:Math.max(0,(S.settings.newCatchPerDay??5)-((S.cintro||{})[today]||0)),maint:0};
    const all=[];
    for(const cid in S.cards){const c=S.cards[cid];if(!c||c.susp||c.st!==undefined||isGram(cid))continue;const w=wordOf(cid);if(!w)continue;if(!S.settings.includeNames&&isName(w))continue;if(!S.settings.modes[modeOf(cid)])continue;if(modeOf(cid)==='prod'&&!prodInScope(w.id))continue;all.push(cid);}
    const mOrd={rec:0,prod:1}, pickIdx=wid=>{const i=(S.pick||[]).indexOf(wid);return i===-1?9999:i;};
    all.sort((a,b)=>{const wa=wordOf(a),wb=wordOf(b);return pickIdx(wa.id)-pickIdx(wb.id)||wa.l-wb.l||parseInt(wa.id.slice(1))-parseInt(wb.id.slice(1))||mOrd[modeOf(a)]-mOrd[modeOf(b)];});
    const planned={live:new Set(),catch:new Set(),maint:new Set()}, fresh=[];
    for(const cid of all){const wid=cid.split(':')[0], k=laneOf(cid);
      if(wordStartedBefore(wid)||planned[k].has(wid)){fresh.push(cid);continue;}
      if(planned[k].size<allow[k]){planned[k].add(wid);fresh.push(cid);}}
    const gf=q.fresh.filter(isGram).sort((a,b)=>((laneOf(b)==='live')-(laneOf(a)==='live'))||(GP[b.slice(2)].l-GP[a.slice(2)].l));
    q.fresh=BACKLOG?gf:fresh.concat(gf);
  }catch(e){}
  return q;
}

/* ============ TONE COLORING ============ */
/* Pinyin in the data is written word by word (huānyíng), so tones are read per syllable, not per token. */
const toneMarks={'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4};
const PY_BASE={'ā':'a1','á':'a2','ǎ':'a3','à':'a4','ē':'e1','é':'e2','ě':'e3','è':'e4','ī':'i1','í':'i2','ǐ':'i3','ì':'i4','ō':'o1','ó':'o2','ǒ':'o3','ò':'o4','ū':'u1','ú':'u2','ǔ':'u3','ù':'u4','ǖ':'ü1','ǘ':'ü2','ǚ':'ü3','ǜ':'ü4','ń':'n2','ň':'n3','ǹ':'n4','ḿ':'m2'};
const PY_SYL=new Set(('a ai an ang ao e ei en eng er o ou '+
 'ba bai ban bang bao bei ben beng bi bian biao bie bin bing bo bu '+
 'pa pai pan pang pao pei pen peng pi pian piao pie pin ping po pou pu '+

 'ga gai gan gang gao ge gei gen geng gong gou gu gua guai guan guang gui gun guo '+
 'ka kai kan kang kao ke kei ken keng kong kou ku kua kuai kuan kuang kui kun kuo '+
 'ha hai han hang hao he hei hen heng hong hou hu hua huai huan huang hui hun huo '+
 'ji jia jian jiang jiao jie jin jing jiong jiu ju juan jue jun '+
 'qi qia qian qiang qiao qie qin qing qiong qiu qu quan que qun '+
 'xi xia xian xiang xiao xie xin xing xiong xiu xu xuan xue xun '+
 'zha zhai zhan zhang zhao zhe zhei zhen zheng zhi zhong zhou zhu zhua zhuai zhuan zhuang zhui zhun zhuo '+
 'cha chai chan chang chao che chen cheng chi chong chou chu chua chuai chuan chuang chui chun chuo '+
 'sha shai shan shang shao she shei shen sheng shi shou shu shua shuai shuan shuang shui shun shuo '+
 'ra ran rang rao re ren reng ri rong rou ru rua ruan rui run ruo '+
 'za zai zan zang zao ze zei zen zeng zi zong zou zu zuan zui zun zuo '+
 'ca cai can cang cao ce cen ceng ci cong cou cu cuan cui cun cuo '+
 'sa sai san sang sao se sen seng si song sou su suan sui sun suo '+

 'wa wai wan wang wei wen weng wo wu r m n ng hm').split(' '));
/* split one run of pinyin letters into syllables: [{text, tone}] ; want = expected count (0 = unknown) */
function pySplit(run,want){let strict=true;
  const chars=[...run], base=[], tones=[];
  for(const ch of chars){const lo=ch.toLowerCase(), m=PY_BASE[lo]; base.push(m?m[0]:lo); tones.push(m?+m[1]:0);}
  const n=base.length, memo=new Map();
  /* fewest-syllable segmentation that respects apostrophes; prefer exactly `want` syllables when possible */
  function seg(i,left){ /* returns array of end indices or null */
    if(i===n)return (left===0||left<0)?[]:null;
    if(left===0)return null;
    const key=i+'|'+left; if(memo.has(key))return memo.get(key);
    let best=null;
    for(let j=Math.min(n,i+6);j>i;j--){
      const s=base.slice(i,j).join('');
      if(s.includes("'")||s.includes('’'))continue;
      if(!PY_SYL.has(s))continue;
      /* orthography: a syllable starting with a, e or o inside a word is written with an apostrophe */
      if(strict&&i>0&&'aeo'.includes(base[i])&&base[i-1]!=="'"&&base[i-1]!=='’')continue;
      /* a syllable carries at most one tone mark */
      let marks=0; for(let k=i;k<j;k++)if(tones[k])marks++; if(marks>1)continue;
      let nx=j; if(base[nx]==="'"||base[nx]==='’')nx++;
      const rest=seg(nx,left>0?left-1:left);
      if(rest){best=[j].concat(rest);break;}
    }
    memo.set(key,best); return best;
  }
  let ends=want>0?seg(0,want):null;
  if(!ends){memo.clear();ends=seg(0,-1);}
  if(!ends){strict=false;memo.clear();ends=seg(0,-1);}
  if(!ends)return null;
  const out=[]; let i=0;
  for(const j of ends){let tone=0;for(let k=i;k<j;k++)if(tones[k])tone=tones[k];out.push({text:chars.slice(i,j).join(''),tone});i=j;if(base[i]==="'"||base[i]==='’'){out[out.length-1].text+=chars[i];i++;}}
  return out;
}
const PY_RUN=/(&[#\w]+;)|([A-Za-zÀ-ɏḿ'’]+)/g;
/* colour each syllable by its own tone; anything that is not pinyin passes through untouched */
function tonePinyin(p){
  return String(p).replace(PY_RUN,(m,ent,run)=>{
    if(ent)return ent;
    const syl=pySplit(run,0);
    if(!syl){let t=0;for(const ch of run){const k=toneMarks[ch.toLowerCase()];if(k){t=k;break;}}return '<span class="tone'+t+'">'+run+'</span>';}
    return syl.map(s=>'<span class="tone'+s.tone+'">'+s.text+'</span>').join('');
  });
}
/* tones of a word, one per syllable (first reading only when alternatives are listed) */
function toneSeq(p){
  const first=String(p).split(/[\/,;(（]/)[0], out=[];
  (first.match(/[A-Za-zÀ-ɏḿ'’]+/g)||[]).forEach(run=>{const syl=pySplit(run,0);if(syl)syl.forEach(s=>out.push(s.tone));});
  return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---- PAPER PRACTICE ---- */
function paperList(){
  // day 1 = full drilling (×writeTarget), day 2 = a few reps (×5), day 3 = one re-exposure (×1).
  // Words marked ✓known or ★mastered never appear here — you already own them.
  const d=new Date();d.setHours(0,0,0,0);const t0=d.getTime();
  const seen=new Set(),out=[];
  for(const cid in S.cards){
    if(!cid.endsWith(':prod'))continue;
    const c=S.cards[cid]; if(!c||c.st===undefined||c.last<t0||c.known)continue;
    const wid=cid.split(':')[0], w=byId[wid];
    if(!w||seen.has(wid))continue;
    const T=S.settings.writeTarget||20;
    if(c.st==='relearn'||c.lapses>0&&c.st!=='rev'){seen.add(wid);out.push({w,tag:'again',reps:10});}
    else if((c.days||0)<=1){seen.add(wid);out.push({w,tag:'day 1',reps:T});}
    else if((c.days||0)===2){seen.add(wid);out.push({w,tag:'day 2',reps:5});}
    else if((c.days||0)===3){seen.add(wid);out.push({w,tag:'day 3',reps:1});}
  }
  const ord={'again':0,'day 1':1,'day 2':2,'day 3':3};
  return out.sort((a,b)=>ord[a.tag]-ord[b.tag]);
}
function printPaperSheet(){
  const list=paperList(); if(!list.length)return;
  const host=document.getElementById('printSheet');
  let html='<h1>字卡 · paper practice — '+dkey(new Date())+' · day 1 ×'+(S.settings.writeTarget||20)+' · day 2 ×5 · day 3 ×1</h1>';
  list.forEach(it=>{
    const chars=[...it.w.t.split('（')[0]].filter(ch=>/\p{Script=Han}/u.test(ch));
    chars.forEach((ch,ci)=>{
      let boxes='';
      for(let i=0;i<it.reps;i++)boxes+='<div class="pbox">'+(i===0?ch:'')+'</div>';
      html+='<div class="prow"><div class="plab">'+ch+' <span class="pm">'+it.tag+' ×'+it.reps+(ci===0?' · '+esc(it.w.p)+' · '+esc(it.w.m):'')+'</span></div><div class="pboxes">'+boxes+'</div></div>';
    });
  });
  host.innerHTML=html;
  window.print();
}

let VOICES=[];
function loadVoices(){try{VOICES=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^(zh|cmn)/i.test(v.lang)||/中文|國語|粵語|普通话/.test(v.name));}catch(e){VOICES=[];}}
function rankVoice(v){
  let s=0; const nm=v.name+' '+v.lang;
  if(/國語|臺灣|Taiwan/i.test(nm))s+=50;
  if(/zh[-_]TW/i.test(v.lang))s+=25;
  if(/Google/i.test(v.name))s+=30;
  const male=voiceId()!=='f';
  if(/Mei-?Jia|美佳|Yating|雅婷|Hsiao|曉|Ting-?Ting|婷|Xiaoxiao|Female|女/i.test(nm))s+=male?-30:40;
  if(/Liang|Aaron|YunJhe|雲哲|Kangkang|\bMale|男/i.test(nm))s+=male?40:-30;
  if(/zh[-_]CN|cmn/i.test(v.lang))s+=8;

  if(!v.localService)s+=6;
  return s;

/* Bundled neural audio: one pack per voice (a single file of MP3 clips plus an index of offsets),
   with the system speech voice as the fallback for anything the pack does not hold. */
const VOICE_PACKS={f:{file:'audio-tw',name:'曉臻',who:'female'},m:{file:'audio-tw-m',name:'雲哲',who:'male'},me:{file:'audio-me',name:'我的聲音',who:'your own voice'}};
function voiceId(){return VOICE_PACKS[S.settings.voicePack]?S.settings.voicePack:'f';}
/* which packs this deployment actually carries — Settings only offers voices that exist */
const VOICE_OK={f:true};
const AUDIO_MISS={};
let curAudio=null;
function audioKey(t){t=String(t).split('（')[0];const h=t.replace(/[^㐀-鿿]/g,'');return h||t.replace(/[^A-Za-z0-9]/g,'');}
/* Words that share characters but not sound (了 le / liǎo, 得 de / děi) have one clip per reading, keyed 字@pinyin.
   tools/build_voice_pack_breezy.py builds the same string in py_id(). */
function pyKey(p){return String(p||'').split('/')[0].toLowerCase().normalize('NFC').replace(/[\s'’\-·,，!！]/g,'');}
let APACK=null,APACKP=null,AIDX=null,AURL={},APACK_ID=null;
function loadPack(){
  const want=voiceId();
  if(APACKP&&APACKP.want===want)return APACKP;
  const get=v=>Promise.all([
    fetch('assets/'+VOICE_PACKS[v].file+'-index.json').then(r=>{if(!r.ok)throw 0;return r.json()}),
    fetch('assets/'+VOICE_PACKS[v].file+'.pack').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
  ]).then(([idx,buf])=>({v,idx,buf}));
  const pr=get(want).catch(e=>{if(want==='f')throw e;return get('f');})   /* a voice that is not on the server falls back to the default one */
    .then(got=>{
      if(APACKP!==pr)return APACKP||false;                                /* the voice changed while this one was loading */
      for(const k in AURL)URL.revokeObjectURL(AURL[k]); AURL={}; for(const k in AUDIO_MISS)delete AUDIO_MISS[k];
      AIDX=got.idx; APACK=got.buf; APACK_ID=got.v; return true;
    })
    .catch(()=>{if(APACKP===pr)APACKP=null;return false;});               /* a failed load is retried on the next play, not remembered */
  pr.want=want; APACKP=pr; return pr;
}
function playBundled(text,onFail,py){
  const base=audioKey(text);
  if(!base||AUDIO_MISS[base]){onFail();return;}
  loadPack().then(ok=>{
    if(!ok||!AIDX){onFail();return;}
    const exact=py?base+'@'+pyKey(py):'', k=exact&&AIDX[exact]?exact:base;
    if(!AIDX[k]){AUDIO_MISS[k]=1;onFail();return;}
    try{
      if(!AURL[k]){
        const[o,l]=AIDX[k];
        AURL[k]=URL.createObjectURL(new Blob([APACK.slice(o,o+l)],{type:'audio/mpeg'}));
      }
      if(curAudio){try{curAudio.pause();}catch(e){}}
      const a=new Audio(AURL[k]);
      a.playbackRate=Math.min(1.3,audioSpeed()/0.9); // clips are recorded slightly slow — the speed setting scales them
      curAudio=a;
      a.onerror=()=>{AUDIO_MISS[k]=1;onFail();};
      a.play().catch(()=>{onFail();});
    }catch(e){onFail();}
  });
}
/* 'auto' and 'bundled' both play the bundled Taiwan voice first; 'system' always uses the device's speech voice */
function playAudio(text,py){
  if((S.settings.audioSrc||'auto')==='system'){speakText(text);return;}
  playBundled(text,()=>speakText(text),py);
}
function setVoice(v){
  if(!VOICE_PACKS[v])return;
  S.settings.voicePack=v; save(); if(view==='set')renderSet();
  loadPack().then(ok=>{ if(ok&&APACK_ID===v)playAudio('謝謝'); else toast(VOICE_PACKS[v].name+' could not be loaded — check the connection and try again'); });
}
function pickVoice(){
  if(!VOICES.length)loadVoices();
  if(S.settings.voiceName){const m=VOICES.find(v=>v.name===S.settings.voiceName);if(m)return m;}
  return VOICES.slice().sort((a,b)=>rankVoice(b)-rankVoice(a))[0]||null;

function audioSpeed(){return S.settings.audioSpeed||0.9;}
function speakText(text){

/* ============ GRAMMAR DRILLS ============ */
let gramLesson=1, gq=null, gramOpen={};
const GPOOL=['嗎','呢','吧','的','得','都','也','很','不','沒','了','還是','或是','可以','會','能','想','要','先','再','就','比','跟','給','把','別','最','更','太','常','剛','已經','應該','打算','因為','所以','可是','不過','要是','一樣','每','只','又','從','到','在','離','當然','好像','需要','希望','一直','最好'];
const DICT=(()=>{const s=new Set(GPOOL);WORDS.forEach(w=>{const h=w.t.split('（')[0].replace(/[^㐀-鿿]/g,'');if(h)s.add(h);});return s;})();
function segZh(zh){
  const clean=zh.replace(/[。？！]/g,'');
  const parts=clean.split(/(，)/).filter(Boolean);
  const out=[];
  for(const part of parts){
    if(part==='，'){out.push('，');continue;}
    let i=0;
    while(i<part.length){
      let hit=null;
      for(let L=Math.min(5,part.length-i);L>=2;L--){
        if(DICT.has(part.substr(i,L))){hit=part.substr(i,L);break;}
      }
      if(hit){out.push(hit);i+=hit.length;}
      else{out.push(part[i]);i++;}
    }
  }
  // merge lone singles with a neighbor to keep chips meaningful
  const merged=[];
  for(const c of out){
    if(c.length===1&&c!=='，'&&merged.length&&merged[merged.length-1].length===1&&merged[merged.length-1]!=='，')merged[merged.length-1]+=c;
    else merged.push(c);
  }
  return merged;
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n,excl){const pool=a.filter(x=>!excl.includes(x));return shuf(pool).slice(0,n);}
function gStat(id){return S.gram&&S.gram[id]?S.gram[id]:{n:0,ok:0};}
function gMark(id,ok){S.gram=S.gram||{};const g=S.gram[id]=S.gram[id]||{n:0,ok:0};g.n++;if(ok)g.ok++;save();}
function gDots(id){const g=gStat(id);const d=g.n===0?0:(g.ok/g.n>=0.8&&g.n>=6)?3:(g.ok/g.n>=0.6&&g.n>=3)?2:1;return '<span class="gdots">'+[1,2,3].map(i=>'<span class="gdot'+(i<=d?' on':'')+'"></span>').join('')+'</span>';}
function tgtIn(p,zh){return p.tgt.find(t=>zh.includes(t));}
/* question builders — each returns {type,p,html-parts...} */
function buildQuestion(p,type){
  const hasT=p.tgt&&p.tgt.length&&p.s.some(x=>tgtIn(p,x.zh));
  if(!hasT&&(type==='fib'||type==='mc'))type=(p.s.length>1?'build':'create');
  const sents=p.s.filter(s=>tgtIn(p,s.zh));
  const s=(type==='fib'||type==='mc')&&sents.length?sents[Math.floor(Math.random()*sents.length)]:p.s[Math.floor(Math.random()*p.s.length)];
  if(type==='fib'){
    const t=tgtIn(p,s.zh)||p.tgt[0];
    const opts=shuf([t,...sample(p.alt.concat(GPOOL),3,[t,...p.tgt])]);
    return {type,p,s,t,opts,blanked:s.zh.replace(t,'⬚')};
  }
  if(type==='mc'){
    const t=tgtIn(p,s.zh)||p.tgt[0];
    const altTok=(p.alt[0]&&!s.zh.includes(p.alt[0]))?p.alt[0]:sample(GPOOL,1,[t])[0];
    const c1=s.zh.replace(t,altTok);
    const c2=s.zh.replace(t,'');
    const segs=segZh(s.zh);
    let c3=s.zh;
    if(segs.length>2){const sw=shuf(segs.slice());c3=sw.join('')+(s.zh.match(/[。？！]$/)||[''])[0];if(c3===s.zh)c3=segs.slice().reverse().join('');}
    const opts=shuf([...new Set([s.zh,c1,c2,c3])].slice(0,4));
    return {type,p,s,opts,correct:s.zh};
  }
  if(type==='build'){
    let chunks=segZh(s.zh);
    let sh=shuf(chunks);
    let guard=0; while(sh.join('')===chunks.join('')&&guard++<5)sh=shuf(chunks);
    return {type,p,s,chunks,shuffled:sh,picked:[]};
  }
  if(type==='finish'){
    const cut=Math.max(2,Math.floor(s.zh.length*0.45));
    return {type,p,s,head:s.zh.slice(0,cut)};
  }
  return {type:'create',p,s};
}
const GTYPES=[['fib','Fill in the blank'],['mc','Multiple choice'],['build','Build the sentence'],['finish','Finish the sentence'],['create','Create your own']];
function startGramQuiz(scope){ // scope: array of points
  const pts=(scope||[]).filter(p=>p.s&&p.s.length);
  if(!pts.length){toast('No grammar points for this lesson yet');return;}
  const qs=[];
  const types=GTYPES.map(t=>t[0]);
  const n=Math.min(12,Math.max(6,pts.length*2));
  for(let i=0;i<n;i++){
    const p=pts[i%pts.length];
    qs.push(buildQuestion(p,types[Math.floor(Math.random()*types.length)]));
  }
  gq={qs:shuf(qs),i:0,ok:0,state:'ask',chosen:null};
  renderGram();
}
function gramAnswer(ok){const q=gq.qs[gq.i];gMark(q.p.id,ok);if(ok)gq.ok++;gq.state='done';renderGram();}
function gramPick(idx){ // fib / mc click
  const q=gq.qs[gq.i];
  if(gq.state!=='ask')return;
  gq.chosen=idx;
  const ok=q.type==='fib'?q.opts[idx]===q.t:q.opts[idx]===q.correct;
  gramAnswer(ok);
}
function gramChunk(i){
  const q=gq.qs[gq.i]; if(gq.state!=='ask')return;
  if(q.picked.includes(i))return;
  q.picked.push(i);
  if(q.picked.length===q.shuffled.length){
    const built=q.picked.map(x=>q.shuffled[x]).join('');
    gramAnswer(built===q.chunks.join(''));
  } else renderGram();
}
function gramUnchunk(k){const q=gq.qs[gq.i];if(gq.state!=='ask')return;q.picked.splice(k,1);renderGram();}
function gramNext(){gq.i++;gq.state='ask';gq.chosen=null;renderGram();}
function gramPaint(){
  const el=document.getElementById('vGram');
  window.AUDS=window.AUDS||[];
  const aud=t=>{const i=AUDS.push(t)-1;return '<button class="spk" title="listen" onclick="event.stopPropagation();playAudio(AUDS['+i+'])">'+SPK_SVG+'</button>';};
  if(gq){ /* ---- quiz runner ---- */
    if(gq.i>=gq.qs.length){
      const pct=Math.round(gq.ok/gq.qs.length*100);

/* ============ STROKE ORDER (Hanzi Writer) ============ */
let HWPromise=null;
function ensureHW(){
  if(window.HanziWriter)return Promise.resolve(true);
  if(HWPromise)return HWPromise;
  HWPromise=new Promise(res=>{
    const tryLoad=srcs=>{
      if(!srcs.length)return res(false);
      const s=document.createElement('script'); s.src=srcs[0];
      s.onload=()=>res(!!window.HanziWriter); s.onerror=()=>tryLoad(srcs.slice(1));
      document.head.appendChild(s);
    };
    tryLoad(['assets/hanzi-writer.min.js','https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js','https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.5.0/hanzi-writer.min.js']);
  });
  return HWPromise;
}
let STROKES=null,STROKESP=null;
function loadStrokes(){
  if(STROKES)return Promise.resolve(STROKES);
  if(STROKESP)return STROKESP;
  STROKESP=fetch('assets/strokes.json?v=2')   /* bump ?v= whenever strokes.json changes, here and in sw.js */
    .then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{STROKES=d;return d;}).catch(()=>{STROKES={};return STROKES;});
  return STROKESP;
}
function strokeDataLoader(char,onComplete,onErr){
  loadStrokes().then(d=>{
    if(d[char]){onComplete(d[char]);return;}
    fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/'+encodeURIComponent(char)+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(onComplete).catch(()=>onErr&&onErr());
  });
}
let strokeWriters=[];
function renderStrokes(hostId,text,opts){
  opts=opts||{};
  const host=document.getElementById(hostId); if(!host)return;
  const chars=[...text].filter(ch=>/\p{Script=Han}/u.test(ch));
  if(!chars.length)return;
  ensureHW().then(ok=>{
    if(!ok){host.style.display='none';const fb=document.getElementById(hostId+'-fb');if(fb)fb.style.display='';return;}
    host.innerHTML=chars.map((c,i)=>'<div class="strokebox" id="'+hostId+'-c'+i+'"></div>').join('');
    strokeWriters=[];
    const size=opts.size||102;
    chars.forEach((ch,i)=>{
      try{
        const wtr=HanziWriter.create(hostId+'-c'+i,ch,{
          width:size,height:size,padding:6,
          strokeColor:cssVar('--ink')||'#1d1c1a',outlineColor:cssVar('--line2')||'#e3dfd8',radicalColor:cssVar('--acc')||'#0e7266',
          strokeAnimationSpeed:1.05,delayBetweenStrokes:110,delayBetweenLoops:2500,
          showCharacter:false,showOutline:true,
          charDataLoader:(c,onC)=>strokeDataLoader(c,onC,()=>{const b=document.getElementById(hostId+'-c'+i);if(b)b.style.display='none';})
        });
        strokeWriters.push(wtr);
      }catch(e){}
    });
    playStrokes();
    setTimeout(()=>{ // if no stroke data ever arrived, fall back to the static character
      if(!host.querySelector('svg path')){
        host.style.display='none';
        const t=document.querySelector('.stroketools'); if(t)t.style.display='none';
        const fb=document.getElementById(hostId+'-fb'); if(fb)fb.style.display='';
      }
    },3500);
  });
}
function playStrokes(){
  const ws=strokeWriters.slice(); if(!ws.length)return;
  const next=i=>{ if(i>=ws.length)return; try{ws[i].animateCharacter({onComplete:()=>setTimeout(()=>next(i+1),260)});}catch(e){next(i+1);} };
  ws.forEach(w=>{try{w.hideCharacter({duration:0})}catch(e){}});
  next(0);
}

/* ============ TIME-LAPSE SNAPSHOTS ============ */
function stageString(){return WORDS.map(w=>wordStage(w.id)).join('');}
/* `quiet` is for the entry start-up adds by itself: it is stored on this device without the cloud push, so that
   merely opening the app never makes a device look as if it held unsent work */
function takeSnapshot(quiet){
  const write=quiet?saveLocal:save;
  try{
    if(!S.hist)S.hist={d:[],s:[]};
    const today=dkey(new Date()), s=stageString();
    const n=S.hist.d.length;
    if(n&&S.hist.d[n-1]===today){if(S.hist.s[n-1]!==s){S.hist.s[n-1]=s;write();}return;}
    S.hist.d.push(today);S.hist.s.push(s);
    if(S.hist.d.length>180){S.hist.d.shift();S.hist.s.shift();}
    write();
  }catch(e){}
}

/* ---- BRAIN ---- */
let brainView='chars', brainGroup='stage', brainSel=null, brainTime=null, brainScope=1;
const STAGE_NAMES=['Not started','Learning','Young','Solid','Mastered'];
const STAGE_DESC=['not yet studied','in short-step drilling (first days)','memory holds < 3 weeks','memory holds 3–6 weeks','memory holds 6+ weeks'];
function wordCards(wid){return MODES.filter(m=>S.settings.modes[m]).map(m=>S.cards[cardId(wid,m)]).filter(Boolean);}
function wordStage(wid){
  const cards=wordCards(wid); if(!cards.length)return 0;
  const started=cards.filter(c=>c.st!==undefined);
  if(!started.length)return 0;
  if(started.length<cards.length||started.some(c=>c.st==='learn'||c.st==='relearn'))return 1;
  const minS=Math.min(...started.map(c=>c.S));
  if(minS<7)return 1; if(minS<21)return 2; if(minS<MASTER_S)return 3; return 4;
}
function wordMem(wid){ // current recall probability (weakest card)
  const started=wordCards(wid).filter(c=>c.st!==undefined&&c.st==='rev');
  if(!started.length)return null;
  return Math.min(...started.map(c=>retrievability(Math.max(0.01,(Date.now()-c.last)/DAY),c.S)));
}
function wordDueNow(wid){return wordCards(wid).some(c=>c.st!==undefined&&c.due<=Date.now());}
function wordMastAt(wid){
  const cards=wordCards(wid); if(!cards.length)return null;
  if(!cards.every(c=>c.mastAt))return null;
  return Math.max(...cards.map(c=>c.mastAt));
}
function studyWords(){
  const ws=WORDS.filter(w=>!isName(w)||S.settings.includeNames);
  return (brainCat&&renderBrain._in)?ws.filter(w=>wordCat(w)===brainCat):ws;   /* inside the Brain, a chosen word type narrows everything */
}
const SIMP_CHAR={}; WORDS.forEach(w=>{if(w.s&&w.s.length===w.t.length){for(let i=0;i<w.t.length;i++){if(w.t[i]!==w.s[i])SIMP_CHAR[w.t[i]]=w.s[i];}}});
function charModel(){
  const map=new Map();
  studyWords().forEach(w=>{
    for(const ch of w.t){
      if(!/\p{Script=Han}/u.test(ch))continue;
      if(!map.has(ch))map.set(ch,{ch,words:[],stage:0,due:false,lesson:99,mem:null,mastAt:null});
      const e=map.get(ch);
      e.words.push(w.id);
      e.lesson=Math.min(e.lesson,w.l);
      const st=wordStage(w.id);
      if(st>e.stage){e.stage=st;}
      if(wordDueNow(w.id))e.due=true;
      const m=wordMem(w.id); if(m!==null)e.mem=e.mem===null?m:Math.max(e.mem,m);
      const ma=wordMastAt(w.id); if(ma)e.mastAt=e.mastAt?Math.min(e.mastAt,ma):ma;
    }
  });
  return [...map.values()];
}
function firstTone(p){for(const ch of String(p)){const t=toneMarks[ch.toLowerCase()];if(t)return t;}return 0;}
function posGroup(w){
  if(isName(w))return 'Names';
  const p=w.pos;
  if(!p)return 'Proper nouns';
  if(/^Vs/.test(p))return 'Adjectives 形';
  if(/^V/.test(p))return 'Verbs 動';
  if(p==='N')return 'Nouns 名';
  if(p==='Adv')return 'Adverbs 副';
  if(p==='M')return 'Measure words 量';
  if(p==='Ptc')return 'Particles 助';
  if(p==='Det')return 'Determiners';
  if(p==='Prep')return 'Prepositions';
  if(p==='Conj')return 'Conjunctions';
  if(p==='Ph')return 'Phrases 語';
  return 'Other';
}
function fmtAgo(ts){const d=Math.floor((Date.now()-ts)/DAY);return d<=0?'today':d===1?'1d ago':d+'d ago';}
function fmtDueIn(c){
  if(!c||c.st===undefined)return 'not started';
  const ms=c.due-Date.now();
  if(ms<=0)return 'due now';
  if(ms<DAY)return 'due in '+Math.max(1,Math.round(ms/3600000))+'h';
  return 'due in '+Math.round(ms/DAY)+'d';
}
function stageCounts(items){const c=[0,0,0,0,0];items.forEach(i=>c[i.stage!==undefined?i.stage:wordStage(i.id)]++);return c;}
function tileTitle(label,stage,mem,due){
  let t=label+' · '+STAGE_NAMES[stage];
  if(mem!==null&&mem!==undefined)t+=' · memory now '+Math.round(mem*100)+'%';
  if(due)t+=' · due for review';
  return t;
}
function tlChart(){
  const H=S.hist,n=H.d.length; if(n<2)return '';
  const Wd=640,Hh=88;
  let maxTot=1; const layers=[];
  for(let i=0;i<n;i++){
    const c=[0,0,0,0,0];
    for(const d of H.s[i])c[+d]++;
    layers.push(c);
    maxTot=Math.max(maxTot,c[1]+c[2]+c[3]+c[4]);
  }
  const x=i=>n===1?0:i/(n-1)*Wd;
  const y=v=>Hh-4-(v/maxTot)*(Hh-10);
  // stack bottom→top: mastered, solid, young, learning
  const order=[4,3,2,1];
  const cum=layers.map(c=>{let a=0;const m={};order.forEach(st=>{a+=c[st];m[st]=a;});return m;});
  let polys='';
  order.forEach((st,k)=>{
    let top='',bot='';
    for(let i=0;i<n;i++)top+=(i?' ':'')+x(i).toFixed(1)+','+y(cum[i][st]).toFixed(1);
    for(let i=n-1;i>=0;i--)bot+=' '+x(i).toFixed(1)+','+(k===0?Hh-4:y(cum[i][order[k-1]])).toFixed(1);
    const cls='s'+st;
    const col=cssVar('--s'+st+'bg')||{4:'#0b5d54',3:'#2f9184',2:'#7fbfb3',1:'#dcebe7'}[st];
    polys+='<polygon points="'+top+bot+'" fill="'+col+'"><title>'+STAGE_NAMES[st]+'</title></polygon>';
  });
  return '<svg class="tl-chart" viewBox="0 0 '+Wd+' '+Hh+'" preserveAspectRatio="none">'+polys+'</svg>';
}

let rq=null, cur=null, revealed=false, undoStack=[], sessionN=0, hintShown=false;
/* A review sitting. REV_FILTER and REV_CAP are set by whoever starts it (a lane, one catch-up lesson, a quick 20) and used once. */
function startReview(){
  sesReset(); undoStack.length=0; rq=buildQueue(); sessionN=0;
  if(REV_FILTER){['learn','rev','fresh'].forEach(k=>{rq[k]=rq[k].filter(REV_FILTER);});}
  if(REV_CAP){let left=REV_CAP-rq.learn.length;rq.learn=rq.learn.slice(0,REV_CAP);rq.rev=rq.rev.slice(0,Math.max(0,left));left-=rq.rev.length;rq.fresh=rq.fresh.slice(0,Math.max(0,left));}
  REV_FILTER=null; REV_CAP=0; nextCard();
}
function pickNext(){
  const now=Date.now();
  const learnDue=rq.learn.filter(cid=>S.cards[cid]&&S.cards[cid].st!==undefined&&S.cards[cid].due<=now);
  if(learnDue.length)return learnDue[0];
  if(rq.rev.length)return rq.rev[0];
  if(rq.fresh.length)return rq.fresh[0];
  if(rq.learn.length)return rq.learn[0];
  return null;
}
function nextCard(){cur=pickNext();revealed=false;hintShown=false;renderRev();}

/* One grade = one undo step. The snapshot holds everything a grade can touch, so undo is exact. */
function grade(g){
  lastGrade=g;haptic(g===1?'again':'good');
  if(animOn()){const st=document.querySelector('#vRev .stage');if(st){st.classList.add(g===1?'swipe-left':'swipe-right');}}
  if(!cur)return;
  const snap=o=>JSON.parse(JSON.stringify(o||{}));
  undoStack.push({cid:cur,card:snap(S.cards[cur]),log:snap(S.log),intro:snap(S.intro),cintro:snap(S.cintro),gintro:snap(S.gintro),sib:snap(S.sib),hard:(S.hard||[]).slice(),pick:(S.pick||[]).slice(),ses:snap(SES)});
  if(undoStack.length>25)undoStack.shift();
  const was=S.cards[cur]; if(!was||was.st===undefined)SES.newN++;
  SES.n++; SES.g[g]=(SES.g[g]||0)+1;
  if(g>=3){SES.run++;if(SES.run>SES.best)SES.best=SES.run;} else SES.run=0;
  rate(cur,g);sessionN++;
  ['learn','rev','fresh'].forEach(k=>{const i=rq[k].indexOf(cur);if(i>-1)rq[k].splice(i,1);});
  const c=S.cards[cur];
  /* still in its learning steps → back into this session, unless the grade just parked it as a leech */
  if(!c.susp&&c.due<=Date.now()+15*MIN&&(c.st==='learn'||c.st==='relearn'))rq.learn.push(cur);
  nextCard();
}
function doUndo(){ // step back through as many cards as the stack holds
  const u=undoStack.pop(); if(!u)return;
  const had=Object.keys(u.card).length;
  S.cards[u.cid]=had?u.card:{};
  S.log=u.log;S.intro=u.intro;
  if(u.sib){S.cintro=u.cintro;S.gintro=u.gintro;S.sib=u.sib;S.hard=u.hard;S.pick=u.pick;}
  if(u.ses)Object.assign(SES,u.ses);
  save();
  cur=u.cid;revealed=true;sessionN=Math.max(0,sessionN-1);renderRev();
}

function isHard(wid){return (S.hard||[]).includes(wid);}
function addHard(wid){S.hard=S.hard||[];if(!S.hard.includes(wid))S.hard.push(wid);if(!tracked(wid))trackWord(wid);save();}
function dropHard(wid){S.hard=(S.hard||[]).filter(x=>x!==wid);save();}
function toggleHard(wid){isHard(wid)?dropHard(wid):addHard(wid);}

/* penalise a miss without inflating schedules on a hit */
function drillMiss(wid,mode){
  addHard(wid);
  const m = mode==='prod' ? 'prod' : 'rec';
  const c = S.cards[cardId(wid,m)];
  if(c && c.st!==undefined) rate(cardId(wid,m),1);
  save();
}

/* ---------- TRIAGE ---------- */
let tri=null;
function startTriage(ln,dlg){
  const list=WORDS.filter(w=>w.l===ln&&(S.settings.includeNames||!isName(w))
    &&(!dlg||dlgOf(w.id)===dlg)).map(w=>w.id);
  tri={ln,dlg:dlg||0,list,i:0,n:{hard:0,learn:0,know:0,mast:0,skip:0}};
  renderLib();
}
function endTriage(){tri=null;renderLib();badge();}
function triageBack(){if(tri&&tri.i>0){tri.i--;renderLib();}}
function triageAct(a){
  if(!tri)return;
  const wid=tri.list[tri.i];
  /* 'learn' on a word already marked known or hard starts it over as a new card */
  if(wid&&a==='learn'){ if(isHard(wid))S.hard=S.hard.filter(x=>x!==wid); if(confOf(wid)>=3)MODES.forEach(m=>{if(S.settings.modes[m])S.cards[cardId(wid,m)]={};}); }
  if(!wid)return;
  tri.acts=tri.acts||{}; if(tri.acts[wid])tri.n[tri.acts[wid]]--; tri.acts[wid]=['hard','learn','know','mast'].includes(a)?a:'skip';

/* ---------- DRILL ---------- */
const DMODES=[['rec','認字 Recognition','see it · know it'],['tone','聲調 Tones','hear the pattern'],
  ['dict','聽寫 Dictation','audio → write it'],['sent','造句 Sentences','build with the grammar'],
  ['speak','口說 Speaking','say it · record it']];
let drillMode=null, drillScope='lesson', drillLesson=21, dq=null, recState=null;

function drillWords(){
  /* a pile from the exam set */
  if(drillScope==='examset')return EXAM_POOL.map(id=>byId[id]).filter(Boolean).filter(w=>S.settings.includeNames||!isName(w));
  /* a frequency tier */
  if(drillScope==='tier')return tierWords(TIERS[drillTier-1]||TIERS[0]).filter(w=>S.settings.includeNames||!isName(w));
  let pool;
  if(drillScope==='hard') pool=(S.hard||[]).map(id=>byId[id]).filter(Boolean);
  else if(drillScope==='due') pool=WORDS.filter(w=>MODES.some(m=>{const c=S.cards[cardId(w.id,m)];return c&&c.st!==undefined&&c.due<=Date.now();}));
  else if(drillScope==='deck') pool=WORDS.filter(w=>tracked(w.id));
  else pool=WORDS.filter(w=>w.l===drillLesson);
  return pool.filter(w=>S.settings.includeNames||!isName(w));
}
function drillPoints(){
  if(drillScope==='lesson') return (GRAMMAR[drillLesson]||[]);
  let out=[]; for(let l=1;l<=MAX_LN;l++) out=out.concat(GRAMMAR[l]||[]);
  return out;
}
const TONEMARK=['·','ˉ','ˊ','ˇ','ˋ'];
function toneLabel(seq){return seq.map(t=>TONEMARK[t]).join(' ')+'   ('+seq.join('-')+')';}

function startDrill(mode){
  /* a full-screen drill mode (DRILL_SCREENS) starts itself */
  const x=DRILL_SCREENS[mode];if(x)return x.start();
  /* the tone coach lets go of the microphone; its own mode starts itself */
  tcRelease();if(mode==='tcoach')return tcStart();
  /* speech and the microphone never outlive the screen that started them */
  recKill();if(mode!=='listen')try{lpStop();}catch(e){}
  /* the mastery test */
  if(mode==='mtest')return mtResume();
  /* sentence dictation */
  if(mode==='sdict')return startSdict();
  /* the listening player, on the lesson in scope */
  if(mode==='listen'){LP.ln=drillScope==='lesson'?drillLesson:(S.settings.curLesson||23);LP.src=DIALOGUES[LP.ln]?'dlg':'sent';return startListen();}
  /* "which one?" and the reading sprint */
  if(mode==='confuse')return startConfuse(null);if(mode==='read')return startRead();
  /* rec / tone / dict / sent / speak: build the question list */
  drillMode=mode; dq=null; recState=null;
  const qs=[];
  if(mode==='rec'||mode==='tone'||mode==='dict'){
    let pool=drillWords();
    if(pool.length<2){renderDrill();return;}
    const bank=WORDS.filter(w=>!isName(w));
    const N=Math.min(20,Math.max(6,pool.length));
    const order=shuf(pool).slice(0,N);
    for(const w of order){
      if(mode==='dict'){qs.push({mode:'dict',w});continue;}
      if(mode==='tone'){
        const seq=toneSeq(w.p); if(!seq.length||seq.every(t=>t===0)){continue;}
        const opts=new Set([seq.join('-')]);
        let guard=0;
        while(opts.size<4&&guard++<40){
          const alt=seq.map(t=>Math.random()<0.6?(1+Math.floor(Math.random()*4)):t);
          if(alt.join('-')!==seq.join('-'))opts.add(alt.join('-'));
        }
        qs.push({mode:'tone',w,correct:seq.join('-'),opts:shuf([...opts])});
        continue;
      }
      const kind=['c2m','m2c','a2c'][Math.floor(Math.random()*3)];
      const seenT=new Set([w.t]), seenM=new Set([w.m]);
      const distinct=list=>shuf(list).filter(x=>x.id!==w.id&&!seenT.has(x.t)&&!seenM.has(x.m)&&seenT.add(x.t)&&seenM.add(x.m));
      let distr=distinct(bank.filter(x=>x.l===w.l)).slice(0,3);
      if(distr.length<3)distr=distr.concat(distinct(bank).slice(0,3-distr.length));
      qs.push({mode:'rec',kind,w,opts:shuf([w,...distr])});
    }
  } else if(mode==='sent'){
    const pts=drillPoints().filter(p=>p.s&&p.s.length);
    for(const p of shuf(pts).slice(0,10)) qs.push({mode:'sent',p});
  } else if(mode==='speak'){
    const pts=drillPoints().filter(p=>p.s&&p.s.length);
    const lines=[];
    for(const p of pts) for(const s of p.s) lines.push({p,s});
    for(const L of shuf(lines).slice(0,12)) qs.push({mode:'speak',p:L.p,s:L.s});
  }
  dq={qs:shuf(qs),i:0,ok:0,state:'ask',chosen:null};
  renderDrill();
}
function drillAnswer(ok){
  /* a miss comes back once at the end of the round */
  try{const q=dq&&dq.qs[dq.i];if(q&&!ok&&!q._requeued&&q.w){const c=Object.assign({},q,{_requeued:true,_played:0});dq.qs.push(c);}}catch(e){}
  const q=dq.qs[dq.i];
  if(ok)dq.ok++;
  if(!ok&&q.w)drillMiss(q.w.id,q.mode==='dict'?'prod':'rec');
  dq.state='done';renderDrill();
}
function drillPick(i){
  if(!dq||dq.state!=='ask')return;
  const q=dq.qs[dq.i];dq.chosen=i;
  const ok=q.mode==='tone'?q.opts[i]===q.correct:q.opts[i].id===q.w.id;
  drillAnswer(ok);
}
function drillNext(){recKill();dq.i++;dq.state='ask';dq.chosen=null;recState=null;renderDrill();}

/* recording */
let REC_ACTIVE=null;   /* the one live MediaRecorder, tracked apart from recState so it can always be stopped */
async function recStart(){
  recKill();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(stream);const chunks=[];
    if(recState&&recState.url)URL.revokeObjectURL(recState.url);
    const mine={rec:mr,url:null};
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());          /* release the microphone whatever happens next */
      if(REC_ACTIVE===mr)REC_ACTIVE=null;
      if(recState!==mine)return;                         /* the card moved on — this take belongs to nothing */
      recState={url:URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'})),rec:null};
      if(view==='drill')renderDrill();};
    recState=mine;REC_ACTIVE=mr;mr.start();renderDrill();
  }catch(e){recState={err:'Mic unavailable — check the browser permission.'};renderDrill();}
}
function recStop(){if(recState&&recState.rec)recState.rec.stop();}
function recPlay(){if(recState&&recState.url)new Audio(recState.url).play().catch(()=>{});}

function makeExam(){

  examP={title:LESSON_TITLES[ln]||'',ln,

  renderDrill();

/* The clock and the recording are one thing: they start together (every take gets its own three minutes),
   and they stop together — on Stop, when the time is up, and when the card is no longer on screen. */
function examStart(){
  if(!examP)return;examP.started=true;examP.left=180;examP.spoke=null;
  if(examT)clearInterval(examT);
  examT=setInterval(()=>{if(!examP){clearInterval(examT);examT=null;return;}
    examP.left--;
    const el=document.getElementById('examClock');
    if(el)el.textContent=String(Math.floor(examP.left/60))+':'+String(examP.left%60).padStart(2,'0');
    if(examP.left<=0||!el||view!=='drill'){examP.left=Math.max(0,examP.left);examStop();}},1000);
  recStart();renderDrill();
}
function examStop(){
  if(examT){clearInterval(examT);examT=null;}
  if(examP&&examP.started&&examP.spoke==null)examP.spoke=180-examP.left;
  if(recState&&recState.rec)recStop(); else if(view==='drill')renderDrill();
}

let bkHandle=null, bkTimer=null, bkNeedPerm=false, bkBusy=false;
const SNAPKEY='zika_snap_v1';

function bkIDB(){return new Promise((res,rej)=>{
  let r;try{r=indexedDB.open('zika-bk',1);}catch(e){return rej(e);}
  r.onupgradeneeded=()=>{try{r.result.createObjectStore('h');}catch(e){}};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function bkPut(h){try{const db=await bkIDB();return new Promise(res=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(h,'file');t.oncomplete=()=>res(1);t.onerror=()=>res(0);});}catch(e){return 0;}}
async function bkGet(){try{const db=await bkIDB();return new Promise(res=>{const t=db.transaction('h','readonly');const q=t.objectStore('h').get('file');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function bkDel(){try{const db=await bkIDB();return new Promise(res=>{const t=db.transaction('h','readwrite');t.objectStore('h').delete('file');t.oncomplete=()=>res(1);t.onerror=()=>res(0);});}catch(e){return 0;}}

/* rolling in-browser snapshots — cheap insurance against a bad import or a glitch */
/* a copy of the deck in the browser, one per day for three days, written at most every ten minutes */
let snapLast=0;
function snapshot(){
  const n=Date.now();if(n-snapLast<600000)return;snapLast=n;
  try{
    const k=dkey(new Date());
    let snaps={}; try{snaps=JSON.parse(store.getItem(SNAPKEY)||'{}');}catch(e){}
    snaps[k]=JSON.stringify(S);
    const keys=Object.keys(snaps).sort();
    while(keys.length>3){delete snaps[keys.shift()];}
    store.setItem(SNAPKEY,JSON.stringify(snaps));
  }catch(e){}
}
function snapList(){try{const s=JSON.parse(store.getItem(SNAPKEY)||'{}');return Object.keys(s).sort().reverse();}catch(e){return[];}}
function snapRestore(k){
  try{
    const s=JSON.parse(store.getItem(SNAPKEY)||'{}');
    if(!s[k])return;
    if(!confirm('Restore your progress as it was on '+k+'? This replaces what is in this browser now.'))return;
    S=JSON.parse(s[k]);normalizeState(); save(); alert('Restored '+k); renderSet(); badge();

function bkSupported(){return typeof window!=='undefined'&&!!window.showSaveFilePicker;}
async function bkChoose(){
  if(!bkSupported()){alert('This browser can’t write backup files directly. Use Chrome or Edge on the desktop — or keep using Export.');return;}
  try{
    const h=await window.showSaveFilePicker({suggestedName:'zika-progress.json',
      types:[{description:'字卡 progress',accept:{'application/json':['.json']}}]});
    bkHandle=h; bkNeedPerm=false; await bkPut(h);

    await bkWrite(); renderSet();
  }catch(e){ /* user cancelled */ }
}
async function bkForget(){
  bkHandle=null; await bkDel();
  S.settings.autoBackup=false; delete S.settings.bkName; save(); renderSet();
}
async function bkWrite(){
  if(!bkHandle||bkBusy)return false;
  bkBusy=true;
  try{
    let p='granted';
    if(bkHandle.queryPermission) p=await bkHandle.queryPermission({mode:'readwrite'});
    if(p!=='granted'){ bkNeedPerm=true; bkBusy=false; return false; }
    const w=await bkHandle.createWritable();
    await w.write(JSON.stringify(Object.assign({},S,{_app:'zika',_savedAt:new Date().toISOString()}),null,1));
    await w.close();
    S.settings.lastBackup=Date.now();
    try{store.setItem(KEY,JSON.stringify(S));}catch(e){}   /* direct write — never re-enter save() */
    bkNeedPerm=false; bkBusy=false;
    const el=document.getElementById('bkStamp'); if(el)el.textContent=bkAgo();
    return true;
  }catch(e){ bkBusy=false; bkNeedPerm=true; return false; }
}
/* ask for the write permission on a real user gesture (Chrome requires one) */
async function bkGrant(){
  if(!bkHandle)return;
  try{
    const r=await bkHandle.requestPermission({mode:'readwrite'});
    if(r==='granted'){bkNeedPerm=false; await bkWrite(); renderSet();}
  }catch(e){}
}
function bkQueue(){
  snapshot();
  if(!bkHandle||!S.settings.autoBackup)return;
  clearTimeout(bkTimer);
  bkTimer=setTimeout(()=>{bkWrite();},4000);
}
function bkAgo(){
  const t=S.settings.lastBackup; if(!t)return 'not yet saved';
  const s=Math.floor((Date.now()-t)/1000);
  if(s<90)return 'saved just now';
  if(s<5400)return 'saved '+Math.round(s/60)+' min ago';
  if(s<172800)return 'saved '+Math.round(s/3600)+' h ago';
  return 'saved '+Math.round(s/86400)+' days ago';
}
function bkStale(){
  if(S.settings.autoBackup&&bkHandle&&!bkNeedPerm)return false;
  const t=S.settings.lastBackup||0;
  return (Date.now()-t)>7*86400000 && Object.values(S.cards).some(c=>c.st!==undefined);
}

var DLGMAP={1:'1111111111111111111111112222222222222222222',2:'1111111111111111111111222222222222222',3:'11111111111111111111111222222222222222222',4:'111111111111111111122222222222221222',5:'11111111111111111111122222222222222222',6:'11111111111111111111111222212222222222222',7:'111111111111111112222222222222222222222',8:'1111111111111111111122222222222222',9:'111111111111112222222222222222',10:'1111111111111112222222222222222222',11:'1111111111111111111111122222222222222222',12:'1111111111111111111111222212222222222',13:'1111111111111111111111122222222222222222',14:'11111111111111111122222222222222222',15:'11111111111111111111122222222222222222222222',16:'11111111111111111111111222222222222222222222',17:'1111111111111111111112222222222222222222222222',18:'11111111111111111111111122222222222222222',19:'111111111111111111111111111222222222222222222',20:'11111111111111111222222222222222222222222222',21:'111111111111111111111111111112222222222222222222',22:'111111111111111111122222222222222222222222',23:'111111111111111111111222222222222222',24:'111111111111111111112222222222222222222222',25:'111111111111111111111111111112222222222222222',26:'1111111111111111111111112222222222222222222222',27:'11111111111111111111111111111222222222222222222',28:'11111111111111111111111222222222222222222222',29:'11111111111111111111112222222222222222222222222',30:'111111111111111111222222222222222222222222',31:'11111111111111111111111111111111111222222222222222222222',32:'11111111111111111111111111111111222222222222222222222222',33:'11111111111111111111111111111111111112222222222222222222222222222222222222',34:'1111111111111111111111111111111111122222222222222222222222222222'};
var DLGSPLIT={}, DLG={};
(function(){for(const k in DLGMAP){const s=DLGMAP[k];DLGSPLIT[k]=(s.match(/1/g)||[]).length;
  WORDS.filter(w=>w.l===+k).forEach((w,i)=>{const d=+s[i];if(d)DLG[w.id]=d;});}})();
/* defensive: the app's first render runs before this block executes, so these

/* ============================================================
   v16 — Library search, rebuilt.
   Was: every keystroke re-rendered all 30 lesson accordions,
   ran 60 full scans of WORDS, built ~1MB of HTML for a broad
   query, and replaced the <input> itself (killing caret + IME).
   Now: prebuilt index, tone-insensitive pinyin, ranked flat
   results, capped + chunked painting, persistent input node.
   ============================================================ */
var LIBIDX=null, libTimer=null, libComposing=false, libShowAll=false, libPaintTok=0;
var LIB_PAGE=45;          /* rows painted synchronously */
var LIB_CHUNK=60;         /* rows appended per animation frame */

function libStrip(s){
  /* ā→a etc. so "lese"/"laji" both find 垃圾 and "nuli" finds 努力 */
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
/* Thorne learned mainland readings; he will type those. Taiwan reading stays
   primary everywhere in the UI — these are search aliases only. */
var READ_ALIAS={'垃圾':'laji','星期':'xingqi','法國':'faguo','網路':'wangluo','期':'qi',
  '和':'he','企業':'qiye','危險':'weixian'};
function buildLibIdx(){
  if(LIBIDX)return LIBIDX;
  LIBIDX=WORDS.map(w=>{
    const p=libStrip(w.p);
    const pn=p.replace(/[^a-z0-9]/g,'');
    const al=READ_ALIAS[w.t]||'';
    return {w, t:w.t, p, pn, alias:al, m:libStrip(w.m)};
  });
  return LIBIDX;
}
function libWordStart(hay,q){
  let i=hay.indexOf(q);
  while(i>-1){ if(i===0||!/[a-z0-9]/.test(hay[i-1]))return true; i=hay.indexOf(q,i+1); }
  return false;
}
/* higher = better. 0 means no match. */
function libScore(e,q,qn){
  if(e.t===q)return 100;
  if(e.t.indexOf(q)===0)return 92;
  if(e.t.indexOf(q)>-1)return 84;
  let py=0, en=0;
  if(qn){
    if(e.pn===qn)py=76;
    else if(e.alias&&e.alias===qn)py=74;
    else if(e.pn.indexOf(qn)===0)py=68;
    else if(e.alias&&e.alias.indexOf(qn)===0)py=66;
    else if(e.p.indexOf(qn)>-1||e.pn.indexOf(qn)>-1)py=52;
  }
  /* an English word that is the whole gloss, or one of its senses, outranks a pinyin fragment:
     "he" should find 他 before every word whose pinyin merely contains "he" */
  if(e.m===q)en=72;
  else if(libSense(e.m,q))en=70;
  else if(e.m.indexOf(q)===0)en=40;
  else if(libWordStart(e.m,q))en=32;
  else if(e.m.indexOf(q)>-1)en=18;
  return Math.max(py,en);
}
/* true when q is one complete sense of a gloss: "to eat; to have a meal" → "eat" */
function libSense(m,q){
  return String(m).split(/[,;\/()]/).some(s=>s.trim().replace(/^(to|a|an|the) /,'')===q);
}
function libPassesFilter(w){
  if(!S.settings.includeNames&&isName(w))return false;
  if(libFilter==='all')return true;
  const st=wordStatus(w.id);
  if(libFilter==='tracked')return !!st;
  if(libFilter==='untracked')return !st;
  if(libFilter==='due')return !!st&&st.k==='due';
  if(libFilter==='simp')return !!w.s;
  return true;
}
function libMatches(q){
  const idx=buildLibIdx();
  const qq=libStrip(q).trim();
  const qn=qq.replace(/[^a-z0-9]/g,'');
  /* one Latin letter matches 80% of the dictionary as a substring, which is noise
     and slow. Demand a real match: 字, pinyin prefix, or start of a meaning word. */
  const floor=(qq.length===1&&/^[a-z0-9]$/.test(qq))?66:1;
  const hits=[];
  for(let k=0;k<idx.length;k++){
    const e=idx[k];
    const s=libScore(e,qq,qn);
    if(s<floor)continue;
    if(!libPassesFilter(e.w))continue;
    hits.push({w:e.w,s:s,k:k});
  }
  hits.sort((a,b)=>b.s-a.s || a.w.l-b.w.l || a.k-b.k);
  return hits;
}

/* ============================================================
   v17 — Confidence levels, one scale shared with Notion.
   1 Hard · 2 Learning · 3 Know · 4 Mastered.
   Derived from the real card state every time it is read, so
   reviews can promote a word (stable ≥21 d → Know, ≥60 d →
   Mastered) or demote it (a lapse drops it back to Learning).
   The hard list always wins. S.conf carries a snapshot keyed
   "詞|B2 L6" → level, which is what the Notion sync reads.
   ============================================================ */
const CONF=[null,
  {t:'Hard',     c:'c1', d:'on the hard list — drill it'},
  {t:'Learning', c:'c2', d:'in the deck, not yet stable'},
  {t:'Know',     c:'c3', d:'stable for 3 weeks or more'},
  {t:'Mastered', c:'c4', d:'stable for 2 months or more'}];
function confOf(wid){
  if(isHard(wid))return 1;
  const cs=MODES.map(m=>S.cards[cardId(wid,m)]).filter(Boolean);
  if(!cs.length)return 0;
  const real=cs.filter(c=>c.st!==undefined);
  if(!real.length||real.length<cs.length)return 2;
  const minS=Math.min(...real.map(c=>c.S||0));
  return minS>=60?4:minS>=21?3:2;
}
function confCounts(ln){
  const n=[0,0,0,0,0];
  for(const w of WORDS){ if(ln&&w.l!==ln)continue; if(!S.settings.includeNames&&isName(w))continue; n[confOf(w.id)]++; }
  return n;
}
function confSnapshot(){
  const words={};
  for(const w of WORDS){ const l=confOf(w.id); if(l) words[w.t+'|'+lnLabel(w.l)]=l; }
  return {v:1, at:new Date().toISOString(), scale:{1:'Hard',2:'Learning',3:'Know',4:'Mastered'}, words};
}

/* ---- 4. SDK loading (module script injected at runtime; retried when we come back online) ---- */
let fbLoading=false;
function fbLoad(){
  if(SYNC.fb||fbLoading)return; if(!fbConfig()){syncUI('off');return;}
  if(window.__fbSDK){fbBoot();return;}
  fbLoading=true; syncUI('connecting');
  const s=document.createElement('script'); s.type='module';
  s.textContent=`import{initializeApp}from'${FB_SDK}firebase-app.js';
import{getDatabase,ref,set,get,onValue,push,serverTimestamp}from'${FB_SDK}firebase-database.js';
import{getAuth,signInAnonymously,onAuthStateChanged}from'${FB_SDK}firebase-auth.js';
window.__fbSDK={initializeApp,getDatabase,ref,set,get,onValue,push,serverTimestamp,getAuth,signInAnonymously,onAuthStateChanged};
window.fbBoot();`;
  s.onerror=()=>{fbLoading=false;SYNC.lastErr='Could not load the Firebase SDK';syncUI(navigator.onLine?'error':'offline');};
  document.head.appendChild(s);
  /* a module import failure does not fire onerror on the tag — poll instead */
  setTimeout(()=>{if(!window.__fbSDK&&fbLoading){fbLoading=false;SYNC.lastErr='Firebase SDK did not load (offline?)';syncUI(navigator.onLine?'error':'offline');}},8000);
}

window.fbBoot=async function(){
  fbLoading=false;
  const sdk=window.__fbSDK, cfg=fbConfig();
  if(!sdk||!cfg){syncUI('off');return;}
  if(SYNC.fb)return;
  try{
    const app=sdk.initializeApp(cfg), db=sdk.getDatabase(app), auth=sdk.getAuth(app);
    SYNC.fb=Object.assign({},sdk,{app,db,auth});
    syncUI('connecting');
    sdk.onAuthStateChanged(auth,u=>{if(u&&!SYNC.uid){SYNC.uid=u.uid;fbLogLocal('auth',u.uid.slice(0,6));fbStart();}});
    sdk.onValue(sdk.ref(db,'.info/connected'),s=>{
      const on=!!s.val(); SYNC.online=on;
      if(!on){if(SYNC.status!=='off')syncUI('offline');}
      else{ if(SYNC.status==='offline')syncUI(SYNC.dirty?'syncing':'ok'); if(SYNC.dirty&&SYNC.code)fbSchedulePush(); }
    });
    await sdk.signInAnonymously(auth);
  }catch(e){SYNC.lastErr=String(e&&e.message||e);fbLogLocal('error',SYNC.lastErr);syncUI('error');}
};
function fbStart(){
  if(!SYNC.fb||!SYNC.uid)return;
  if(!SYNC.code){syncUI('setup');return;}

function fbListen(){
  if(SYNC.unsub){try{SYNC.unsub();}catch(e){}SYNC.unsub=null;}
  const f=SYNC.fb; SYNC.first=true; syncUI('connecting');
  SYNC.unsub=f.onValue(f.ref(f.db,fbPath()),snap=>{
    const r=snap.val();
    if(SYNC.first){SYNC.first=false;fbInitial(r);} else fbOnRemote(r);
  },err=>{SYNC.lastErr=String(err&&err.message||err);fbLogLocal('error',SYNC.lastErr);syncUI('error');});
}

/* ---- 5. reconcile ---- */
function fbInitial(r){
  fbLogLocal('connect',r?(r.device+' @ '+fmtT(r.synced_at)):'empty');
  if(!r||!r.json){ if(!localEmpty())fbPush(); else {syncUI('ok');} return; }
  const ours=r.device_id===DEVICE.id;
  if(ours){ if(SYNC.dirty)fbPush(); else {SYNC.remoteAt=r.synced_at;SYNC.remoteDev=r.device;syncUI('ok');} return; }
  /* another device wrote since we last synced */
  if(localEmpty()||(!SYNC.dirty&&SYNC.at>0)){ fbAdopt(r,'quiet'); return; }
  /* both sides hold something: this device has unsynced work, or it has never synced */
  fbConflict(r,SYNC.at?'unsynced':'first');
}
function fbOnRemote(r){
  if(!r||!r.json)return;
  if(r.device_id===DEVICE.id){SYNC.remoteAt=r.synced_at;SYNC.remoteDev=r.device;if(!SYNC.dirty)syncUI('ok');return;}
  if(SYNC.dirty){
    /* real-time clash: the other device saved while this one has unsent changes — this device's push wins (last write), offer the other side */
    SYNC.clash={r,at:Date.now()}; SYNC.remoteAt=Math.max(SYNC.remoteAt||0,r.synced_at||0);
    fbLogLocal('clash',r.device+' @ '+fmtT(r.synced_at));
    toast(`${esc(r.device)} also saved at ${fmtT(r.synced_at)} — ${esc(DEVICE.name)} wins`,{action:'Use '+r.device+"'s",onAction:()=>fbAdopt(r,'manual'),ms:7000});
    fbSchedulePush();
    return;
  }
  fbAdopt(r,'live');
}
const LOCAL_SETTINGS=['voiceName','audioSrc','theme','lastBackup','bkName','autoBackup','haptics','_bkWarned'];   /* kept when this device has a value */
const STRICT_LOCAL=['preloadedAt'];   /* facts about this device only: never inherited from another one */
function strictLocalGet(){const own={};STRICT_LOCAL.forEach(k=>{if(S.settings&&k in S.settings)own[k]=S.settings[k];});return own;}
function strictLocalPut(own){STRICT_LOCAL.forEach(k=>{if(k in own)S.settings[k]=own[k];else delete S.settings[k];});}
function fbAdopt(r,how){
  let p=null; try{p=JSON.parse(r.json);}catch(e){}
  if(!p||!p.cards){SYNC.lastErr='Cloud state unreadable';syncUI('error');try{shLook();}catch(e){}return;}
  const before=JSON.stringify(S), keep={}, prevFlags={}; for(const k in (S.settings||{}))if(/^_/.test(k))prevFlags[k]=S.settings[k];
  LOCAL_SETTINGS.forEach(k=>{if(S.settings&&k in S.settings)keep[k]=S.settings[k];});
  const own=strictLocalGet();
  SYNC.revert={json:before,dev:r.device,at:r.synced_at};
  SYNC.applying=true;
  try{
    S=p; S.settings=Object.assign({},S.settings||{},keep,prevFlags); strictLocalPut(own); S.settings.modes=Object.assign({rec:true,prod:true},S.settings.modes||{});
    S.pick=S.pick||[]; S.hard=S.hard||[]; S.log=S.log||{}; S.intro=S.intro||{}; S.hist=S.hist||{d:[],s:[]};
    try{store.setItem(KEY,JSON.stringify(S));}catch(e){}
    try{bkQueue();}catch(e){}
    SYNC.at=r.synced_at; SYNC.remoteAt=r.synced_at; SYNC.remoteDev=r.device; SYNC.dirty=false; SYNC.clash=null; syncMetaSave();
  }finally{SYNC.applying=false;}
  fbLogLocal('pull',r.device+' @ '+fmtT(r.synced_at));
  syncUI('ok');
  rerenderAfterSync();
  if(how!=='quiet')toast(`↓ synced from ${esc(r.device)} · ${fmtT(r.synced_at)}`,{action:'Undo',onAction:fbRevert,ms:6000});
  else toast(`↓ synced from ${esc(r.device)}`,{ms:2500});
  try{shLook();}catch(e){}   /* the adopted deck may carry another palette, accent or character face */
}
function fbRevert(){
  const rv=SYNC.revert; if(!rv)return;
  let p=null; try{p=JSON.parse(rv.json);}catch(e){return;}
  const keep={}, own=strictLocalGet(); LOCAL_SETTINGS.forEach(k=>{if(S.settings&&k in S.settings)keep[k]=S.settings[k];});
  S=p; S.settings=Object.assign({},S.settings||{},keep); strictLocalPut(own); SYNC.revert=null;
  save(); rerenderAfterSync(); toast('Reverted — this device\'s version is now the cloud version');
}
function rerenderAfterSync(){
  QV++;   /* the deck was replaced: the kept queue is out of date */
  try{
    undoStack.length=0;
    badge();
    if(view==='rev'){ if(rq){rq=buildQueue();['learn','rev','fresh'].forEach(k=>{rq[k]=rq[k].filter(c=>c!==cur);});} if(cur&&!S.cards[cur])nextCard(); else renderRev(); }
    else if(view==='set')renderSet(); else go(view);
  }catch(e){}
}
function fbConflict(r,why){
  const host=document.getElementById('syncModal'); if(!host)return;
  const mine=DEVICE.name, theirs=r.device||'the other device';
  const msg=why==='first'
    ?`The cloud already holds <b>${esc(theirs)}</b>'s progress (saved ${fmtT(r.synced_at)}), and this <b>${esc(mine)}</b> has its own. Which one should both devices use from now on?`
    :`<b>${esc(theirs)}</b> synced a newer version at ${fmtT(r.synced_at)}, but this <b>${esc(mine)}</b> has changes it never sent (last synced ${fmtT(SYNC.at)}).`;
  SYNC.blocked=true;
  host.innerHTML=`<div class="modal-card">
    <div class="lab">Sync conflict</div>
    <div style="font-size:14px;margin-bottom:14px">${msg}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="btn" id="cfUse">Use ${esc(theirs)}'s version</button>
      <button class="btn ghost" id="cfKeep">Keep ${esc(mine)}'s version</button>
    </div>
    <div class="small muted" style="margin-top:10px">Whichever you pick becomes the cloud copy. The other is kept for one Undo in Settings → Cloud sync.</div>
  </div>`;
  host.style.display='flex';
  document.getElementById('cfUse').onclick=()=>{SYNC.blocked=false;host.style.display='none';fbAdopt(r,'manual');};
  document.getElementById('cfKeep').onclick=()=>{SYNC.blocked=false;host.style.display='none';SYNC.revert={json:r.json,dev:r.device,at:r.synced_at};SYNC.remoteAt=r.synced_at;fbPush();};
}

/* ---- 6. push ---- */
function fbSchedulePush(){
  if(SYNC.blocked)return;   /* no cloud writes while the conflict dialog is open */
  if(!SYNC.fb||!SYNC.code||!SYNC.uid)return;
  clearTimeout(SYNC.timer); SYNC.timer=setTimeout(fbPush,700); syncUI('syncing');
}
async function fbPush(){
  if(SYNC.blocked)return;
  clearTimeout(SYNC.timer);
  if(!SYNC.fb||!SYNC.code||!SYNC.uid)return;
  if(SYNC.pushing){SYNC.again=true;return;}
  SYNC.pushing=true; syncUI('syncing');
  const at=Math.max(Date.now(),(SYNC.remoteAt||0)+1);
  const f=SYNC.fb, p=fbPayload(at), gen0=SYNC.gen||0;
  try{
    await f.set(f.ref(f.db,fbPath()),p);
    SYNC.at=at; SYNC.remoteAt=at; SYNC.remoteDev=DEVICE.name; SYNC.dirty=(SYNC.gen||0)!==gen0; SYNC.retry=0; syncMetaSave(); if(SYNC.dirty)SYNC.again=true;
    fbLogLocal('push',Math.round(p.bytes/1024)+' KB');
    try{f.push(f.ref(f.db,'rooms/'+SYNC.code+'/sync_log'),{device:DEVICE.name,device_id:DEVICE.id,at,bytes:p.bytes,due:p.summary.due});}catch(e){}
    fbPruneLog();
    syncUI('ok');
  }catch(e){
    SYNC.lastErr=String(e&&e.message||e); fbLogLocal('error',SYNC.lastErr);
    if(/PERMISSION_DENIED|permission/i.test(SYNC.lastErr)){
      /* the rules rejected an older write — someone else is ahead; pull and ask */
      try{const snap=await f.get(f.ref(f.db,fbPath()));const r=snap.val();if(r&&r.json&&r.device_id!==DEVICE.id){fbConflict(r,'unsynced');}else syncUI('error');}catch(e2){syncUI('error');}
    } else {
      syncUI(SYNC.online?'error':'offline');
      SYNC.retry=Math.min(30000,Math.max(1000,SYNC.retry*2||1000));
      setTimeout(()=>{if(SYNC.dirty)fbSchedulePush();},SYNC.retry);
    }
  }finally{
    SYNC.pushing=false;
    if(SYNC.again){SYNC.again=false;fbSchedulePush();}
  }
}
/* the sync log is a diagnostic trail, not history: once per session it is trimmed to its last 50 entries */
async function fbPruneLog(){
  if(SYNC.pruned||!SYNC.fb||!SYNC.code)return; SYNC.pruned=true;
  try{
    const f=SYNC.fb, ref=f.ref(f.db,'rooms/'+SYNC.code+'/sync_log'), v=(await f.get(ref)).val(); if(!v)return;
    const keys=Object.keys(v).sort(); if(keys.length<=60)return;
    const keep={}; keys.slice(-50).forEach(k=>{keep[k]=v[k];});
    await f.set(ref,keep); fbLogLocal('trim',(keys.length-50)+' old log entries');
  }catch(e){}
}

  const dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cv.style.display='block';
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cols=[cssVar('--lant'),cssVar('--acc'),cssVar('--gold'),cssVar('--blue'),cssVar('--plum'),cssVar('--amber')];
  const P=[]; for(let i=0;i<140;i++)P.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[i%cols.length]});
  const t0=performance.now();
  (function frame(t){

    P.forEach(p=>{p.vy+=0.35;p.vx*=0.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-Math.max(0,k-1.6)/0.8);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(k<2.6)requestAnimationFrame(frame); else {cv.style.display='none';ctx.clearRect(0,0,innerWidth,innerHeight);}
  })(t0);
}
