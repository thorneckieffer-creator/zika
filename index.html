const GRAMMAR = {"1":[{"id":"g1-1","t":"Questions with 嗎","e":"Add 嗎 to the end of any statement to make a yes/no question — word order never changes.","tgt":["嗎"],"alt":["呢","吧","啊"],"s":[{"zh":"你是李小姐嗎？","en":"Are you Miss Li?","py":"nǐ shì lǐ xiǎo jiě ma?"},{"zh":"這是咖啡嗎？","en":"Is this coffee?","py":"zhè shì kā fēi ma?"},{"zh":"你要喝茶嗎？","en":"Do you want to drink tea?","py":"nǐ yào hē chá ma?"},{"zh":"他是美國人嗎？","en":"Is he American?","py":"tā shì měi guó rén ma?"},{"zh":"請問，你們學校附近有好吃的牛肉麵嗎？","en":"Excuse me, is there good beef noodle soup near your school?","py":"qǐng wèn, nǐ men xué xiào fù jìn yǒu hǎo chī de niú ròu miàn ma?"},{"zh":"你朋友也要跟我們一起去看電影嗎？","en":"Is your friend also coming to the movies with us?","py":"nǐ péng yǒu yě yào gēn wǒ men yì qǐ qù kàn diàn yǐng ma?"}],"cy":"Turn any statement about yourself into a yes/no question with 嗎."},{"id":"g1-2","t":"姓 and 叫 — Introducing yourself","e":"姓 gives your surname; 叫 gives your full or given name.","tgt":["姓","叫"],"alt":["是","要"],"s":[{"zh":"我姓王。","en":"My surname is Wang.","py":"wǒ xìng wáng."},{"zh":"我叫王開文。","en":"I'm called Wang Kaiwen.","py":"wǒ jiào wáng kāi wén."},{"zh":"請問你姓什麼？","en":"May I ask your surname?","py":"qǐng wèn nǐ xìng shén me?"},{"zh":"他叫李明華。","en":"He is called Li Minghua.","py":"tā jiào lǐ míng huá."},{"zh":"我們的老師姓王，可是我不知道他叫什麼名字。","en":"Our teacher's surname is Wang, but I don't know his full name.","py":"wǒ men de lǎo shī xìng wáng, kě shì wǒ bù zhī dào tā jiào shén me míng zì."},{"zh":"請問你姓什麼？我姓李，叫李明華。","en":"May I ask your surname? Mine is Li — Li Minghua.","py":"qǐng wèn nǐ xìng shén me? wǒ xìng lǐ, jiào lǐ míng huá."}],"cy":"Introduce yourself twice: once with 姓, once with 叫."},{"id":"g1-3","t":"Bounce-back 呢","e":"呢 bounces a question back: 我很好，你呢？","tgt":["呢"],"alt":["嗎","吧","啊"],"s":[{"zh":"我很好，你呢？","en":"I'm good, and you?","py":"wǒ hěn hǎo, nǐ ne?"},{"zh":"我喜歡喝茶，你呢？","en":"I like drinking tea, and you?","py":"wǒ xǐ huān hē chá, nǐ ne?"},{"zh":"我是美國人，你呢？","en":"I'm American, and you?","py":"wǒ shì měi guó rén, nǐ ne?"},{"zh":"我很喜歡臺灣的烏龍茶，你呢？你喜歡喝什麼？","en":"I really like Taiwanese oolong — and you? What do you like to drink?","py":"wǒ hěn xǐ huān tái wān de wū lóng chá, nǐ ne? nǐ xǐ huān hē shén me?"},{"zh":"我週末想去游泳，你呢？","en":"I want to go swimming this weekend — how about you?","py":"wǒ zhōu mò xiǎng qù yóu yǒng, nǐ ne?"}],"cy":"State a preference of yours, then bounce it back with 呢."},{"id":"g1-4","t":"Negation with 不","e":"Place 不 directly before the verb to negate it.","tgt":["不"],"alt":["沒","很","都"],"s":[{"zh":"我不喜歡咖啡。","en":"I don't like coffee.","py":"wǒ bù xǐ huān kā fēi."},{"zh":"他不是日本人。","en":"He isn't Japanese.","py":"tā bú shì rì běn rén."},{"zh":"我不喝烏龍茶。","en":"I don't drink oolong tea.","py":"wǒ bù hē wū lóng chá."},{"zh":"他不是臺灣人，可是他很喜歡臺灣菜。","en":"He isn't Taiwanese, but he loves Taiwanese food.","py":"tā bú shì tái wān rén, kě shì tā hěn xǐ huān tái wān cài."},{"zh":"我不想喝咖啡，我要喝熱茶。","en":"I don't want coffee; I'll have hot tea.","py":"wǒ bù xiǎng hē kā fēi, wǒ yào hē rè chá."}],"cy":"Say two things you don't do or don't like, using 不."}],"2":[{"id":"g2-1","t":"Possessive 的","e":"的 links possessor and noun: 我的家人 my family; also links descriptions: 漂亮的房子.","tgt":["的"],"alt":["得","了","都"],"s":[{"zh":"這是我的家人。","en":"This is my family.","py":"zhè shì wǒ de jiā rén."},{"zh":"那是老師的書。","en":"That is the teacher's book.","py":"nà shì lǎo shī de shū."},{"zh":"她的照片很好看。","en":"Her photos are good-looking.","py":"tā de zhào piān hěn hǎo kàn."},{"zh":"他們的房子很漂亮。","en":"Their house is beautiful.","py":"tā men de fáng zi hěn piào liàng."},{"zh":"這是我媽媽的照片，她的房子在山上。","en":"This is my mom's photo — her house is in the mountains.","py":"zhè shì wǒ mā mā de zhào piān, tā de fáng zi zài shān shàng."},{"zh":"老師的書都很有意思，你可以看看。","en":"The teacher's books are all interesting — take a look.","py":"lǎo shī de shū dōu hěn yǒu yì si, nǐ kě yǐ kàn kàn."}],"cy":"Describe two things you own using 的."},{"id":"g2-2","t":"Measure words 個 and 張","e":"Numbers need a measure word: 個 for people/general, 張 for flat things (photos, paper).","tgt":["個","張"],"alt":["杯","家","支"],"s":[{"zh":"我有兩個姐姐。","en":"I have two older sisters.","py":"wǒ yǒu liǎng gè jiě jiě."},{"zh":"他有三個哥哥。","en":"He has three older brothers.","py":"tā yǒu sān gè gē gē."},{"zh":"這是一張照片。","en":"This is one photo.","py":"zhè shì yī zhāng zhào piān."},{"zh":"我要五張紙。","en":"I want five sheets of paper.","py":"wǒ yào wǔ zhāng zhǐ."},{"zh":"我家有五個人：爸爸、媽媽、兩個哥哥和我。","en":"There are five people in my family: dad, mom, two older brothers, and me.","py":"wǒ jiā yǒu wǔ gè rén ： bà bà, mā mā, liǎng gè gē gē hé wǒ."},{"zh":"這三張照片都是在學校前面照的。","en":"All three of these photos were taken in front of the school.","py":"zhè sān zhāng zhào piān dōu shì zài xué xiào qián miàn zhào de."}],"cy":"Count your family members with 個 and something flat with 張."},{"id":"g2-3","t":"有 and 沒有","e":"有 = to have / there is. Negate 有 with 沒, never 不.","tgt":["有","沒有"],"alt":["是","不是"],"s":[{"zh":"我有兩個姐姐。","en":"I have two older sisters.","py":"wǒ yǒu liǎng gè jiě jiě."},{"zh":"你有兄弟嗎？","en":"Do you have brothers?","py":"nǐ yǒu xiōng dì ma?"},{"zh":"我沒有妹妹。","en":"I don't have a younger sister.","py":"wǒ méi yǒu mèi mèi."},{"zh":"這裡有很多照片。","en":"There are many photos here.","py":"zhè lǐ yǒu hěn duō zhào piān."},{"zh":"我們學校有很多學生，可是沒有游泳池。","en":"Our school has lots of students but no swimming pool.","py":"wǒ men xué xiào yǒu hěn duō xué shēng, kě shì méi yǒu yóu yǒng chí."},{"zh":"你有沒有你家人的照片？給我看看。","en":"Do you have photos of your family? Show me.","py":"nǐ yǒu méi yǒu nǐ jiā rén de zhào piān? gěi wǒ kàn kàn."}],"cy":"Say one thing you have (有) and one you don't (沒有)."},{"id":"g2-4","t":"都 — all / both","e":"都 goes AFTER the subject and BEFORE the verb: 我們都是學生.","tgt":["都"],"alt":["也","很","常"],"s":[{"zh":"我們都是學生。","en":"We are all students.","py":"wǒ men dōu shì xué shēng."},{"zh":"他們都很好看。","en":"They are all good-looking.","py":"tā men dōu hěn hǎo kàn."},{"zh":"照片都很漂亮。","en":"The photos are all beautiful.","py":"zhào piān dōu hěn piào liàng."},{"zh":"我的兄弟姐妹都不住在臺灣。","en":"None of my siblings live in Taiwan.","py":"wǒ de xiōng dì jiě mèi dōu bú zhù zài tái wān."},{"zh":"他們家的人都很喜歡照相。","en":"Everyone in their family loves taking photos.","py":"tā men jiā de rén dōu hěn xǐ huān zhào xiàng."}],"cy":"Say something true of your whole family/class using 都."},{"id":"g2-5","t":"幾 — how many","e":"幾 asks small quantities and always needs a measure word: 幾個, 幾張.","tgt":["幾"],"alt":["多少","什麼","誰"],"s":[{"zh":"你有幾個兄弟？","en":"How many brothers do you have?","py":"nǐ yǒu jǐ gè xiōng dì?"},{"zh":"你家有幾個人？","en":"How many people are in your family?","py":"nǐ jiā yǒu jǐ gè rén?"},{"zh":"這是幾張照片？","en":"How many photos is this?","py":"zhè shì jǐ zhāng zhào piān?"},{"zh":"你們家有幾個人？都住在哪裡？","en":"How many people are in your family? Where do they all live?","py":"nǐ men jiā yǒu jǐ gè rén? dōu zhù zài nǎ lǐ?"},{"zh":"請問，這個字有幾個意思？","en":"Excuse me, how many meanings does this character have?","py":"qǐng wèn, zhè ge zì yǒu jǐ gè yì si?"}],"cy":"Ask someone a 幾 + measure word question about their family."},{"id":"g2-6","t":"兩 vs 二","e":"Counting things: 兩 + measure word (兩個人). Counting numbers: 二 (一、二、三).","tgt":["兩"],"alt":["二","幾","個"],"s":[{"zh":"我有兩個姐姐。","en":"I have two older sisters.","py":"wǒ yǒu liǎng gè jiě jiě."},{"zh":"他買了兩張照片。","en":"He bought two photos.","py":"tā mǎi le liǎng zhāng zhào piān."},{"zh":"我們家有兩個哥哥。","en":"Our family has two older brothers.","py":"wǒ men jiā yǒu liǎng gè gē gē."},{"zh":"我要兩杯咖啡，一杯大的，一杯小的。","en":"I'd like two coffees — one large, one small.","py":"wǒ yào liǎng bēi kā fēi, yī bēi dà de, yī bēi xiǎo de."},{"zh":"我們兩個人常常一起吃晚飯。","en":"The two of us often eat dinner together.","py":"wǒ men liǎng gè rén cháng cháng yì qǐ chī wǎn fàn."}],"cy":"Mention two of something you have, using 兩 + the right measure word."}],"3":[{"id":"g3-1","t":"打 vs 踢 — playing sports","e":"打 for hand sports (打籃球/棒球/網球); 踢 for foot sports (踢足球).","tgt":["打","踢"],"alt":["做","玩"],"s":[{"zh":"我常打籃球。","en":"I often play basketball.","py":"wǒ cháng dǎ lán qiú."},{"zh":"他喜歡打網球。","en":"He likes playing tennis.","py":"tā xǐ huān dǎ wǎng qiú."},{"zh":"我們週末踢足球。","en":"We play soccer on weekends.","py":"wǒ men zhōu mò tī zú qiú."},{"zh":"我哥哥常打棒球，我妹妹喜歡踢足球。","en":"My older brother often plays baseball; my younger sister likes soccer.","py":"wǒ gē gē cháng dǎ bàng qiú, wǒ mèi mèi xǐ huān tī zú qiú."},{"zh":"你想打網球還是打籃球？我都可以。","en":"Tennis or basketball? Either works for me.","py":"nǐ xiǎng dǎ wǎng qiú hái shì dǎ lán qiú? wǒ dōu kě yǐ."}],"cy":"Say which sports you play, choosing 打 or 踢 correctly."},{"id":"g3-2","t":"想 — want / think","e":"想 + verb = want to; 想 + clause = think; 想 + person = miss.","tgt":["想"],"alt":["要","會","喜歡"],"s":[{"zh":"我想去看電影。","en":"I want to go watch a movie.","py":"wǒ xiǎng qù kàn diàn yǐng."},{"zh":"你想吃什麼？","en":"What do you want to eat?","py":"nǐ xiǎng chī shén me?"},{"zh":"我想他是老師。","en":"I think he is a teacher.","py":"wǒ xiǎng tā shì lǎo shī."},{"zh":"週末我想在家聽音樂，不想運動。","en":"This weekend I want to stay home listening to music, not exercise.","py":"zhōu mò wǒ xiǎng zài jiā tīng yīn yuè, bù xiǎng yùn dòng."},{"zh":"我想去臺灣學中文，也想吃很多小吃。","en":"I want to go to Taiwan to study Chinese — and eat lots of street food.","py":"wǒ xiǎng qù tái wān xué zhōng wén, yě xiǎng chī hěn duō xiǎo chī."}],"cy":"Say two things you want to do this weekend with 想."},{"id":"g3-3","t":"還是 — or (in questions)","e":"還是 offers a choice in questions. In statements use 或是.","tgt":["還是"],"alt":["或是","也","和"],"s":[{"zh":"你想看電影還是聽音樂？","en":"Do you want to watch a movie or listen to music?","py":"nǐ xiǎng kàn diàn yǐng hái shì tīng yīn yuè?"},{"zh":"你要喝茶還是咖啡？","en":"Do you want tea or coffee?","py":"nǐ yào hē chá hái shì kā fēi?"},{"zh":"我們今天去還是明天去？","en":"Do we go today or tomorrow?","py":"wǒ men jīn tiān qù hái shì míng tiān qù?"},{"zh":"我們早上去游泳還是下午去打網球？","en":"Shall we swim in the morning or play tennis in the afternoon?","py":"wǒ men zǎo shàng qù yóu yǒng hái shì xià wǔ qù dǎ wǎng qiú?"},{"zh":"你覺得看電影好還是去KTV唱歌好？","en":"Do you think a movie is better, or singing at KTV?","py":"nǐ jué de kàn diàn yǐng hǎo hái shì qù K T V chàng gē hǎo?"}],"cy":"Ask a friend an A-還是-B question about the weekend."},{"id":"g3-4","t":"Suggestion 吧","e":"吧 softens a sentence into a suggestion (我們去吧) or a guess (你是美國人吧？).","tgt":["吧"],"alt":["嗎","呢","啊"],"s":[{"zh":"我們去看電影吧。","en":"Let's go watch a movie.","py":"wǒ men qù kàn diàn yǐng ba."},{"zh":"吃晚飯吧。","en":"Let's eat dinner.","py":"chī wǎn fàn ba."},{"zh":"你是美國人吧？","en":"You're American, right?","py":"nǐ shì měi guó rén ba?"},{"zh":"今天我們一起去看電影吧，明天再運動。","en":"Let's go see a movie today — we can exercise tomorrow.","py":"jīn tiān wǒ men yì qǐ qù kàn diàn yǐng ba, míng tiān zài yùn dòng."},{"zh":"我們晚上七點在學校前面見面吧。","en":"Let's meet at seven in front of the school.","py":"wǒ men wǎn shàng qī diǎn zài xué xiào qián miàn jiàn miàn ba."}],"cy":"Make two suggestions to a friend using 吧."},{"id":"g3-5","t":"好不好 / 怎麼樣","e":"Tag onto a suggestion to seek agreement: …，好不好？ …，怎麼樣？","tgt":["好不好","怎麼樣"],"alt":["是不是","對不對"],"s":[{"zh":"我們明天去游泳，好不好？","en":"Let's go swimming tomorrow, okay?","py":"wǒ men míng tiān qù yóu yǒng, hǎo bù hǎo?"},{"zh":"今天晚上看電影，怎麼樣？","en":"How about watching a movie tonight?","py":"jīn tiān wǎn shàng kàn diàn yǐng, zěn me yàng?"},{"zh":"我們先吃晚飯，再去看電影，好不好？","en":"Dinner first, then the movie — sound good?","py":"wǒ men xiān chī wǎn fàn, zài qù kàn diàn yǐng, hǎo bù hǎo?"},{"zh":"星期六早上去山上走走，怎麼樣？","en":"How about a walk in the mountains Saturday morning?","py":"xīng qī liù zǎo shàng qù shān shàng zǒu zǒu, zěn me yàng?"}],"cy":"Propose a plan and tag it with 好不好 or 怎麼樣."},{"id":"g3-6","t":"也 — also","e":"也 sits after the subject, before the verb — never at the end.","tgt":["也"],"alt":["都","還","again"],"s":[{"zh":"我喜歡籃球，我也喜歡足球。","en":"I like basketball, and I also like soccer.","py":"wǒ xǐ huān lán qiú, wǒ yě xǐ huān zú qiú."},{"zh":"他也想去。","en":"He also wants to go.","py":"tā yě xiǎng qù."},{"zh":"我也常游泳。","en":"I also often swim.","py":"wǒ yě cháng yóu yǒng."},{"zh":"她會說中文，也會說一點日文。","en":"She speaks Chinese, and a little Japanese too.","py":"tā huì shuō zhōng wén, yě huì shuō yì diǎn rì wén."},{"zh":"我常游泳，我朋友也常跟我一起去。","en":"I swim often, and my friend often comes along.","py":"wǒ cháng yóu yǒng, wǒ péng yǒu yě cháng gēn wǒ yì qǐ qù."}],"cy":"Agree with something a friend likes using 也."},{"id":"g3-7","t":"常 — often","e":"常 before the verb: 我常運動.","tgt":["常"],"alt":["都","也","很"],"s":[{"zh":"我常運動。","en":"I often exercise.","py":"wǒ cháng yùn dòng."},{"zh":"你常看電影嗎？","en":"Do you often watch movies?","py":"nǐ cháng kàn diàn yǐng ma?"},{"zh":"我們常一起吃晚飯。","en":"We often eat dinner together.","py":"wǒ men cháng yì qǐ chī wǎn fàn."},{"zh":"我們常在學校旁邊的餐廳吃飯。","en":"We often eat at the restaurant next to school.","py":"wǒ men cháng zài xué xiào páng biān de cān tīng chī fàn."},{"zh":"你常聽什麼音樂？可以教我嗎？","en":"What music do you often listen to? Can you show me?","py":"nǐ cháng tīng shén me yīn yuè? kě yǐ jiào wǒ ma?"}],"cy":"Say two things you often do with 常."}],"4":[{"id":"g4-1","t":"多少 vs 幾","e":"多少 for big/unknown amounts & prices (no measure word needed); 幾 for small counts (needs measure word).","tgt":["多少","幾"],"alt":["什麼","怎麼"],"s":[{"zh":"這個多少錢？","en":"How much is this?","py":"zhè ge duō shǎo qián?"},{"zh":"一共多少錢？","en":"How much altogether?","py":"yī gòng duō shǎo qián?"},{"zh":"你要幾杯咖啡？","en":"How many cups of coffee do you want?","py":"nǐ yào jǐ bēi kā fēi?"},{"zh":"你有幾個姐姐？","en":"How many older sisters do you have?","py":"nǐ yǒu jǐ gè jiě jiě?"},{"zh":"老闆，這種包子一個多少錢？我要買五個。","en":"Boss, how much is this kind of bun? I'll take five.","py":"lǎo bǎn, zhè zhǒng bāo zi yí gè duō shǎo qián? wǒ yào mǎi wǔ gè."},{"zh":"你們學校有多少學生？有幾個美國人？","en":"How many students does your school have? How many Americans?","py":"nǐ men xué xiào yǒu duō shǎo xué shēng? yǒu jǐ gè měi guó rén?"}],"cy":"Ask a shop owner the price of something with 多少錢."},{"id":"g4-2","t":"太…了 — too…","e":"太 + adjective + 了: the 了 is required — 太貴 alone sounds unfinished.","tgt":["太","了"],"alt":["很","真","最"],"s":[{"zh":"這個手機太貴了。","en":"This phone is too expensive.","py":"zhè ge shǒu jī tài guì le."},{"zh":"那個包子太大了。","en":"That steamed bun is too big.","py":"nà ge bāo zi tài dà le."},{"zh":"我的手機太舊了。","en":"My phone is too old.","py":"wǒ de shǒu jī tài jiù le."},{"zh":"這家店的東西太貴了，我們去別家看看吧。","en":"This shop is too expensive — let's check another one.","py":"zhè jiā diàn de dōng xī tài guì le, wǒ men qù bié jiā kàn kàn ba."},{"zh":"今天太熱了，我想喝一杯大杯的冰咖啡。","en":"It's too hot today — I want a large iced coffee.","py":"jīn tiān tài rè le, wǒ xiǎng hē yī bēi dà bēi de bīng kā fēi."}],"cy":"Complain about two things with 太…了."},{"id":"g4-3","t":"能 vs 可以","e":"能 = ability/possibility; 可以 = permission/acceptability.","tgt":["能","可以"],"alt":["會","要"],"s":[{"zh":"這支手機能上網。","en":"This phone can go online.","py":"zhè zhī shǒu jī néng shàng wǎng."},{"zh":"你能幫我嗎？","en":"Can you help me?","py":"nǐ néng bāng wǒ ma?"},{"zh":"我可以看看嗎？","en":"May I take a look?","py":"wǒ kě yǐ kàn kàn ma?"},{"zh":"這裡可以內用。","en":"You can dine in here.","py":"zhè lǐ kě yǐ nèi yòng."},{"zh":"這裡不能照相，可是外面可以。","en":"You can't take photos in here, but outside is fine.","py":"zhè lǐ bù néng zhào xiàng, kě shì wài miàn kě yǐ."},{"zh":"我今天不能去上課，你可以幫我問老師嗎？","en":"I can't make class today — could you ask the teacher for me?","py":"wǒ jīn tiān bù néng qù shàng kè, nǐ kě yǐ bāng wǒ wèn lǎo shī ma?"}],"cy":"Ask permission with 可以, then state an ability with 能."},{"id":"g4-4","t":"Measure words 杯 / 支 / 種","e":"杯 cups of drinks; 支 long thin objects (phones, pens); 種 kinds/types.","tgt":["杯","支","種"],"alt":["個","張","家"],"s":[{"zh":"我要一杯咖啡。","en":"I want one cup of coffee.","py":"wǒ yào yī bēi kā fēi."},{"zh":"他買了一支手機。","en":"He bought a cell phone.","py":"tā mǎi le yī zhī shǒu jī."},{"zh":"你們有幾種包子？","en":"How many kinds of steamed buns do you have?","py":"nǐ men yǒu jǐ zhǒng bāo zi?"},{"zh":"我要兩杯大杯的熱咖啡，外帶，謝謝。","en":"Two large hot coffees to go, thanks.","py":"wǒ yào liǎng bēi dà bēi de rè kā fēi, wài dài, xiè xiè."},{"zh":"老闆，這種手機有沒有便宜一點的？","en":"Boss, is there a cheaper version of this kind of phone?","py":"lǎo bǎn, zhè zhǒng shǒu jī yǒu méi yǒu pián yi yì diǎn de?"}],"cy":"Order a drink and ask about types (種) of something."},{"id":"g4-5","t":"為什麼 — why","e":"為什麼 before the verb phrase asks why.","tgt":["為什麼"],"alt":["怎麼","什麼","多少"],"s":[{"zh":"為什麼這麼貴？","en":"Why is it so expensive?","py":"wèi shén me zhè me guì?"},{"zh":"你為什麼要買新手機？","en":"Why do you want to buy a new phone?","py":"nǐ wèi shén me yào mǎi xīn shǒu jī?"},{"zh":"你為什麼不買那支新手機？太貴了嗎？","en":"Why aren't you buying that new phone? Too expensive?","py":"nǐ wèi shén me bù mǎi nà zhī xīn shǒu jī? tài guì le ma?"},{"zh":"為什麼這家店的包子這麼有名？","en":"Why are this shop's buns so famous?","py":"wèi shén me zhè jiā diàn de bāo zi zhè me yǒu míng?"}],"cy":"Ask why something is so expensive / so good with 為什麼."},{"id":"g4-6","t":"了 — change of state","e":"Sentence-final 了 marks a new situation: 包子冷了 the bun has gotten cold.","tgt":["了"],"alt":["的","得","嗎"],"s":[{"zh":"我的手機太舊了。","en":"My phone is too old now.","py":"wǒ de shǒu jī tài jiù le."},{"zh":"包子冷了。","en":"The bun has gotten cold.","py":"bāo zi lěng le."},{"zh":"這支手機不能上網了，我要買新的。","en":"This phone can't get online anymore — I need a new one.","py":"zhè zhī shǒu jī bù néng shàng wǎng le, wǒ yào mǎi xīn de."},{"zh":"包子都冷了，我幫你微波一下吧。","en":"The buns have gone cold — let me microwave them for you.","py":"bāo zi dōu lěng le, wǒ bāng nǐ wēi bō yī xià ba."}],"cy":"Describe something that has changed recently with 了."}],"5":[{"id":"g5-1","t":"最 — superlative","e":"最 + adjective/verb = the most: 最有名, 最喜歡.","tgt":["最"],"alt":["很","太","更"],"s":[{"zh":"這家店最有名。","en":"This shop is the most famous.","py":"zhè jiā diàn zuì yǒu míng."},{"zh":"牛肉麵是最好吃的。","en":"Beef noodle soup is the most delicious.","py":"niú ròu miàn shì zuì hǎo chī de."},{"zh":"我最喜歡小籠包。","en":"I like xiaolongbao the most.","py":"wǒ zuì xǐ huān xiǎo lóng bāo."},{"zh":"這家餐廳的小籠包最有名，每天都有很多人。","en":"This restaurant's xiaolongbao is the most famous — it's packed every day.","py":"zhè jiā cān tīng de xiǎo lóng bāo zuì yǒu míng, měi tiān dōu yǒu hěn duō rén."},{"zh":"我覺得臺灣最好吃的小吃是臭豆腐。","en":"I think Taiwan's best street food is stinky tofu.","py":"wǒ jué de tái wān zuì hǎo chī de xiǎo chī shì chòu dòu fǔ."}],"cy":"Name your favorite Taiwanese food using 最."},{"id":"g5-2","t":"真 vs 很","e":"真 = really! (exclamation, surprise); 很 = neutral 'very'.","tgt":["真","很"],"alt":["太","最"],"s":[{"zh":"這個真好吃！","en":"This is really delicious!","py":"zhè ge zhēn hǎo chī!"},{"zh":"你真會做飯。","en":"You really know how to cook.","py":"nǐ zhēn huì zuò fàn."},{"zh":"這個很好吃。","en":"This is (very) delicious.","py":"zhè ge hěn hǎo chī."},{"zh":"你做的甜點真好吃！你真會做飯！","en":"Your desserts are really delicious — you can really cook!","py":"nǐ zuò de tián diǎn zhēn hǎo chī! nǐ zhēn huì zuò fàn!"},{"zh":"這碗牛肉麵很大，湯也很好喝。","en":"This bowl of beef noodles is big, and the broth is great too.","py":"zhè wǎn niú ròu miàn hěn dà, tāng yě hěn hǎo hē."}],"cy":"React to a meal with 真, then describe it neutrally with 很."},{"id":"g5-3","t":"有一點 — a little (negative)","e":"有一點 + adjective implies mild complaint: 有一點辣 a bit (too) spicy.","tgt":["有一點"],"alt":["一點","很","真"],"s":[{"zh":"這個菜有一點辣。","en":"This dish is a little spicy.","py":"zhè ge cài yǒu yì diǎn là."},{"zh":"湯有一點鹹。","en":"The soup is a little salty.","py":"tāng yǒu yì diǎn xián."},{"zh":"這家店的菜有一點辣，可是真好吃。","en":"This place's food is a little spicy, but really good.","py":"zhè jiā diàn de cài yǒu yì diǎn là, kě shì zhēn hǎo chī."},{"zh":"今天我有一點忙，我們明天見面吧。","en":"I'm a bit busy today — let's meet tomorrow.","py":"jīn tiān wǒ yǒu yì diǎn máng, wǒ men míng tiān jiàn miàn ba."}],"cy":"Politely complain about a dish with 有一點."},{"id":"g5-4","t":"會 — learned ability","e":"會 = can (because you learned it): 我會做飯. Compare 能 (circumstances), 可以 (permission).","tgt":["會"],"alt":["能","可以","要"],"s":[{"zh":"我會做飯。","en":"I can cook.","py":"wǒ huì zuò fàn."},{"zh":"你會說中文嗎？","en":"Can you speak Chinese?","py":"nǐ huì shuō zhōng wén ma?"},{"zh":"她會做小籠包。","en":"She can make xiaolongbao.","py":"tā huì zuò xiǎo lóng bāo."},{"zh":"我會做一點臺灣菜，可是不會做小籠包。","en":"I can cook a little Taiwanese food, but not xiaolongbao.","py":"wǒ huì zuò yì diǎn tái wān cài, kě shì bú huì zuò xiǎo lóng bāo."},{"zh":"你會不會說中文？說得怎麼樣？","en":"Can you speak Chinese? How well?","py":"nǐ huì bú huì shuō zhōng wén? shuō dé zěn me yàng?"}],"cy":"Say two skills you have with 會 and one you don't (不會)."},{"id":"g5-5","t":"可是 and 所以","e":"可是 = but; 所以 = so/therefore.","tgt":["可是","所以"],"alt":["因為","還是"],"s":[{"zh":"我喜歡臭豆腐，可是我朋友不喜歡。","en":"I like stinky tofu, but my friend doesn't.","py":"wǒ xǐ huān chòu dòu fǔ, kě shì wǒ péng yǒu bù xǐ huān."},{"zh":"我怕辣，所以我不吃。","en":"I'm afraid of spicy food, so I don't eat it.","py":"wǒ pà là, suǒ yǐ wǒ bù chī."},{"zh":"這個很好吃，所以我常來。","en":"This is delicious, so I come often.","py":"zhè ge hěn hǎo chī, suǒ yǐ wǒ cháng lái."},{"zh":"我很喜歡吃辣，可是我朋友怕辣，所以我們點了不辣的菜。","en":"I love spicy food, but my friend can't handle it, so we ordered mild dishes.","py":"wǒ hěn xǐ huān chī là, kě shì wǒ péng yǒu pà là, suǒ yǐ wǒ men diǎn le bù là de cài."},{"zh":"這家店很有名，所以我們得早一點去。","en":"This place is famous, so we'd better go early.","py":"zhè jiā diàn hěn yǒu míng, suǒ yǐ wǒ men dé zǎo yì diǎn qù."}],"cy":"Make one sentence with 可是 and one with 所以 about food."},{"id":"g5-6","t":"Measure words 碗 and 家","e":"碗 bowls of food; 家 businesses/shops/restaurants.","tgt":["碗","家"],"alt":["杯","個","張"],"s":[{"zh":"我要一碗牛肉麵。","en":"I want one bowl of beef noodle soup.","py":"wǒ yào yī wǎn niú ròu miàn."},{"zh":"這家店很有名。","en":"This shop is very famous.","py":"zhè jiā diàn hěn yǒu míng."},{"zh":"那家餐廳不錯。","en":"That restaurant is pretty good.","py":"nà jiā cān tīng bù cuò."},{"zh":"我們去那家有名的店，一人點一碗牛肉麵吧。","en":"Let's hit that famous place — a bowl of beef noodles each.","py":"wǒ men qù nà jiā yǒu míng de diàn, yī rén diǎn yī wǎn niú ròu miàn ba."},{"zh":"這家餐廳的湯真不錯，我要再點一碗。","en":"The soup here is great — I'm ordering another bowl.","py":"zhè jiā cān tīng de tāng zhēn bù cuò, wǒ yào zài diǎn yī wǎn."}],"cy":"Order a bowl of something at a famous 店 using both 碗 and 家."},{"id":"g5-7","t":"得 — complement marker","e":"Verb + 得 + how well: 他做得很好. The 得 links a verb to its quality.","tgt":["得"],"alt":["的","了","地"],"s":[{"zh":"他做得很好。","en":"He does it very well.","py":"tā zuò dé hěn hǎo."},{"zh":"你說得對。","en":"You're right.","py":"nǐ shuō dé duì."},{"zh":"她吃得很少。","en":"She eats very little.","py":"tā chī dé hěn shǎo."},{"zh":"你中文說得真好，是在哪裡學的？","en":"Your Chinese is really good — where did you learn it?","py":"nǐ zhōng wén shuō dé zhēn hǎo, shì zài nǎ lǐ xué de?"},{"zh":"我媽媽做飯做得比餐廳的還好吃。","en":"My mom cooks even better than restaurants.","py":"wǒ mā mā zuò fàn zuò dé bǐ cān tīng de hái hǎo chī."}],"cy":"Compliment someone's cooking or Chinese with V + 得 + …"}],"6":[{"id":"g6-1","t":"在 — location verb","e":"在 states location: X 在 place; also 'at' before place + verb: 我在教室上課.","tgt":["在"],"alt":["有","是","到"],"s":[{"zh":"圖書館在哪裡？","en":"Where is the library?","py":"tú shū guǎn zài nǎ lǐ?"},{"zh":"學校在山上。","en":"The school is on the mountain.","py":"xué xiào zài shān shàng."},{"zh":"我在教室上課。","en":"I attend class in the classroom.","py":"wǒ zài jiào shì shàng kè."},{"zh":"他們在外面吃飯。","en":"They are eating outside.","py":"tā men zài wài miàn chī fàn."},{"zh":"我們學校在山上，前面有海，風景真美。","en":"Our school is on a mountain with the ocean in front — the view is gorgeous.","py":"wǒ men xué xiào zài shān shàng, qián miàn yǒu hǎi, fēng jǐng zhēn měi."},{"zh":"你現在在哪裡？我在圖書館裡面看書。","en":"Where are you right now? I'm in the library reading.","py":"nǐ xiàn zài zài nǎ lǐ? wǒ zài tú shū guǎn lǐ miàn kàn shū."}],"cy":"Say where you live and where you study using 在."},{"id":"g6-2","t":"Position words","e":"前面 front, 後面 back, 旁邊 beside, 裡面 inside, 外面 outside, 附近 nearby.","tgt":["前面","旁邊","附近","後面"],"alt":["裡面","外面"],"s":[{"zh":"學校前面有海。","en":"In front of the school there is the ocean.","py":"xué xiào qián miàn yǒu hǎi."},{"zh":"圖書館旁邊是教室。","en":"Beside the library is the classroom.","py":"tú shū guǎn páng biān shì jiào shì."},{"zh":"商店在宿舍附近。","en":"The shop is near the dormitory.","py":"shāng diàn zài sù shè fù jìn."},{"zh":"我的宿舍在圖書館後面，旁邊有一家商店。","en":"My dorm is behind the library, with a shop next door.","py":"wǒ de sù shè zài tú shū guǎn hòu miàn, páng biān yǒu yī jiā shāng diàn."},{"zh":"教室外面有很多學生在照相。","en":"Outside the classroom, lots of students are taking photos.","py":"jiào shì wài miàn yǒu hěn duō xué shēng zài zhào xiàng."}],"cy":"Describe what's around your home with two position words."},{"id":"g6-3","t":"這裡 / 那裡 / 哪裡","e":"Here / there / where.","tgt":["哪裡","這裡","那裡"],"alt":["什麼","誰"],"s":[{"zh":"你在哪裡？","en":"Where are you?","py":"nǐ zài nǎ lǐ?"},{"zh":"我在這裡。","en":"I'm here.","py":"wǒ zài zhè lǐ."},{"zh":"那裡的風景很美。","en":"The scenery there is very beautiful.","py":"nà lǐ de fēng jǐng hěn měi."},{"zh":"你知道游泳池在哪裡嗎？就在那裡，大樓的後面。","en":"Do you know where the pool is? Right there, behind the building.","py":"nǐ zhī dào yóu yǒng chí zài nǎ lǐ ma? jiù zài nà lǐ, dà lóu de hòu miàn."},{"zh":"這裡的東西比那裡的便宜。","en":"Things here are cheaper than over there.","py":"zhè lǐ de dōng xī bǐ nà lǐ de pián yi."}],"cy":"Ask where something is, then answer with 這裡/那裡."},{"id":"g6-4","t":"遠 and 近","e":"X 離 Y 遠/近 — far/near from. 離 marks the reference point.","tgt":["遠","近","離"],"alt":["快","慢"],"s":[{"zh":"學校離這裡遠嗎？","en":"Is the school far from here?","py":"xué xiào lí zhè lǐ yuǎn ma?"},{"zh":"宿舍離教室很近。","en":"The dormitory is very close to the classroom.","py":"sù shè lí jiào shì hěn jìn."},{"zh":"海離學校不遠。","en":"The ocean is not far from the school.","py":"hǎi lí xué xiào bù yuǎn."},{"zh":"我家離學校很近，走路十分鐘就到了。","en":"My place is close to school — a ten-minute walk.","py":"wǒ jiā lí xué xiào hěn jìn, zǒu lù shí fēn zhōng jiù dào le."},{"zh":"花蓮離臺北有一點遠，得坐火車去。","en":"Hualien is a bit far from Taipei — you have to take the train.","py":"huā lián lí tái běi yǒu yì diǎn yuǎn, dé zuò huǒ chē qù."}],"cy":"Say how far your home is from school using 離…遠/近."},{"id":"g6-5","t":"聽說 — I heard that…","e":"聽說 + clause reports hearsay.","tgt":["聽說"],"alt":["知道","覺得","想"],"s":[{"zh":"聽說花蓮的風景很美。","en":"I heard Hualien's scenery is beautiful.","py":"tīng shuō huā lián de fēng jǐng hěn měi."},{"zh":"聽說那裡的小吃很好吃。","en":"I heard the snacks there are delicious.","py":"tīng shuō nà lǐ de xiǎo chī hěn hǎo chī."},{"zh":"聽說你們學校附近的小吃又便宜又好吃。","en":"I hear the street food near your school is cheap and delicious.","py":"tīng shuō nǐ men xué xiào fù jìn de xiǎo chī yòu pián yi yòu hǎo chī."},{"zh":"聽說他下個月要回國了，是真的嗎？","en":"I heard he's going back home next month — is that true?","py":"tīng shuō tā xià gè yuè yào huí guó le, shì zhēn de ma?"}],"cy":"Report something you heard about Taiwan with 聽說."},{"id":"g6-6","t":"Measure words 樓 and 棟","e":"樓 floors (三樓 3rd floor); 棟 whole buildings.","tgt":["樓","棟"],"alt":["間","家","個"],"s":[{"zh":"我住在三樓。","en":"I live on the third floor.","py":"wǒ zhù zài sān lóu."},{"zh":"教室在五樓。","en":"The classroom is on the fifth floor.","py":"jiào shì zài wǔ lóu."},{"zh":"那棟大樓是圖書館。","en":"That building is the library.","py":"nà dòng dà lóu shì tú shū guǎn."},{"zh":"我住的宿舍有五棟，我住在三樓。","en":"My dorm complex has five buildings; I'm on the third floor.","py":"wǒ zhù de sù shè yǒu wǔ dòng, wǒ zhù zài sān lóu."},{"zh":"圖書館的二樓可以看書，不能吃東西。","en":"You can read on the library's second floor, but no eating.","py":"tú shū guǎn de èr lóu kě yǐ kàn shū, bù néng chī dōng xī."}],"cy":"Say which floor you live on and point out a building with 棟."}],"7":[{"id":"g7-1","t":"Telling time — 點 and 分","e":"X點Y分; 半 = half past. Time words go BEFORE the verb.","tgt":["點","分","半"],"alt":["號","月"],"s":[{"zh":"現在幾點？","en":"What time is it now?","py":"xiàn zài jǐ diǎn?"},{"zh":"你幾點下課？","en":"What time does your class end?","py":"nǐ jǐ diǎn xià kè?"},{"zh":"我們三點半見面。","en":"We meet at 3:30.","py":"wǒ men sān diǎn bàn jiàn miàn."},{"zh":"我早上八點上課，下午四點半下課。","en":"I start class at 8 a.m. and finish at 4:30 p.m.","py":"wǒ zǎo shàng bā diǎn shàng kè, xià wǔ sì diǎn bàn xià kè."},{"zh":"我們明天中午十二點在學校門口見面吧。","en":"Let's meet at noon tomorrow at the school gate.","py":"wǒ men míng tiān zhōng wǔ shí èr diǎn zài xué xiào mén kǒu jiàn miàn ba."}],"cy":"Say when you get up, start class, and eat dinner."},{"id":"g7-2","t":"從…到… — from…to…","e":"Works for time and places: 從三點到五點, 從學校到銀行.","tgt":["從","到"],"alt":["在","離"],"s":[{"zh":"從三點到五點我有課。","en":"From 3:00 to 5:00 I have class.","py":"cóng sān diǎn dào wǔ diǎn wǒ yǒu kè."},{"zh":"從星期一到星期五我上課。","en":"From Monday to Friday I attend class.","py":"cóng xīng qī yī dào xīng qī wǔ wǒ shàng kè."},{"zh":"從學校到銀行很近。","en":"From school to the bank is close.","py":"cóng xué xiào dào yín háng hěn jìn."},{"zh":"我從早上九點到晚上六點都有課，真忙。","en":"I have class from 9 a.m. to 6 p.m. — so busy.","py":"wǒ cóng zǎo shàng jiǔ diǎn dào wǎn shàng liù diǎn dōu yǒu kè, zhēn máng."},{"zh":"從我家到捷運站，走路只要五分鐘。","en":"From my place to the MRT, it's just a five-minute walk.","py":"cóng wǒ jiā dào jié yùn zhàn, zǒu lù zhǐ yào wǔ fēn zhōng."}],"cy":"Describe your class schedule with 從…到…"},{"id":"g7-3","t":"得 (děi) — must / have to","e":"得 before a verb = have to. Same character as complement 得(de) — context decides.","tgt":["得"],"alt":["要","會","能"],"s":[{"zh":"我得去銀行。","en":"I have to go to the bank.","py":"wǒ dé qù yín háng."},{"zh":"你得早一點來。","en":"You have to come earlier.","py":"nǐ dé zǎo yì diǎn lái."},{"zh":"明天我得上課。","en":"Tomorrow I have to attend class.","py":"míng tiān wǒ dé shàng kè."},{"zh":"我今天得去銀行，不能跟你們去KTV。","en":"I have to go to the bank today, so I can't join you at KTV.","py":"wǒ jīn tiān dé qù yín háng, bù néng gēn nǐ men qù K T V."},{"zh":"明天有書法課，我得早一點到學校。","en":"There's calligraphy class tomorrow — I have to get to school early.","py":"míng tiān yǒu shū fǎ kè, wǒ dé zǎo yì diǎn dào xué xiào."}],"cy":"List two things you have to do tomorrow with 得."},{"id":"g7-4","t":"剛 — just now","e":"剛 before the verb: it happened moments ago.","tgt":["剛"],"alt":["常","再","就"],"s":[{"zh":"我剛下課。","en":"I just finished class.","py":"wǒ gāng xià kè."},{"zh":"他剛到。","en":"He just arrived.","py":"tā gāng dào."},{"zh":"比賽剛結束。","en":"The game just ended.","py":"bǐ sài gāng jié shù."},{"zh":"我剛下課，現在要去吃午餐，你要一起來嗎？","en":"I just got out of class and I'm heading to lunch — want to come?","py":"wǒ gāng xià kè, xiàn zài yào qù chī wǔ cān, nǐ yào yì qǐ lái ma?"},{"zh":"他剛從臺南回來，帶了很多好吃的東西。","en":"He just got back from Tainan with lots of good food.","py":"tā gāng cóng tái nán huí lái, dài le hěn duō hǎo chī de dōng xī."}],"cy":"Say two things that just happened with 剛."},{"id":"g7-5","t":"每 — every","e":"每 + measure word + noun; usually pairs with 都: 我每天都上課.","tgt":["每","都"],"alt":["常","也"],"s":[{"zh":"我每天都上課。","en":"I have class every day.","py":"wǒ měi tiān dōu shàng kè."},{"zh":"每個星期六我去KTV。","en":"Every Saturday I go to KTV.","py":"měi gè xīng qī liù wǒ qù K T V."},{"zh":"我每天早上都喝一杯咖啡，喝了才能上課。","en":"I drink a coffee every morning — only then can I face class.","py":"wǒ měi tiān zǎo shàng dōu hē yī bēi kā fēi, hē le cái néng shàng kè."},{"zh":"他每個週末都去圖書館念書。","en":"He studies at the library every weekend.","py":"tā měi gè zhōu mò dōu qù tú shū guǎn niàn shū."}],"cy":"Describe a routine with 每…都…"},{"id":"g7-6","t":"…的時候 — when…","e":"Clause + 的時候 = when/while: 下課的時候.","tgt":["的時候"],"alt":["以後","以前"],"s":[{"zh":"下課的時候，你在哪裡？","en":"When class ended, where were you?","py":"xià kè de shí hòu, nǐ zài nǎ lǐ?"},{"zh":"我忙的時候，不能見面。","en":"When I'm busy, I can't meet.","py":"wǒ máng de shí hòu, bù néng jiàn miàn."},{"zh":"你有空的時候，我們去唱歌吧。","en":"When you're free, let's go sing.","py":"nǐ yǒu kòng de shí hòu, wǒ men qù chàng gē ba."},{"zh":"我上課的時候，不能看手機。","en":"I can't look at my phone during class.","py":"wǒ shàng kè de shí hòu, bù néng kàn shǒu jī."},{"zh":"我有空的時候，常去學校旁邊的茶館喝茶。","en":"When I'm free, I often go drink tea at the teahouse near school.","py":"wǒ yǒu kòng de shí hòu, cháng qù xué xiào páng biān de chá guǎn hē chá."}],"cy":"Say what you do 有空的時候 (when free)."},{"id":"g7-7","t":"有空 vs 有事","e":"有空 = free; 有事 = busy / have something on.","tgt":["有空","有事"],"alt":["有課","沒有"],"s":[{"zh":"你明天有空嗎？","en":"Are you free tomorrow?","py":"nǐ míng tiān yǒu kòng ma?"},{"zh":"我下午有空。","en":"I'm free in the afternoon.","py":"wǒ xià wǔ yǒu kòng."},{"zh":"對不起，我今天有事。","en":"Sorry, I'm busy today.","py":"duì bù qǐ, wǒ jīn tiān yǒu shì."},{"zh":"你星期五晚上有空嗎？我們去唱歌吧。","en":"Are you free Friday night? Let's go sing.","py":"nǐ xīng qī wǔ wǎn shàng yǒu kòng ma? wǒ men qù chàng gē ba."},{"zh":"不好意思，我今天有事，下次再一起去吧。","en":"Sorry, I've got something on today — next time.","py":"bù hǎo yì sī, wǒ jīn tiān yǒu shì, xià cì zài yì qǐ qù ba."}],"cy":"Invite a friend out, and decline politely using 有事."}],"8":[{"id":"g8-1","t":"坐 vs 騎 — transport","e":"坐 for vehicles you sit inside (火車/高鐵/捷運/公車/計程車); 騎 for ones you straddle (機車/腳踏車).","tgt":["坐","騎"],"alt":["開","走"],"s":[{"zh":"我坐火車去臺南。","en":"I take the train to Tainan.","py":"wǒ zuò huǒ chē qù tái nán."},{"zh":"他坐捷運上課。","en":"He takes the MRT to class.","py":"tā zuò jié yùn shàng kè."},{"zh":"我騎機車去學校。","en":"I ride a scooter to school.","py":"wǒ qí jī chē qù xué xiào."},{"zh":"在臺北，很多人騎機車上班，也有很多人坐捷運。","en":"In Taipei, lots of people scooter to work — and lots take the MRT.","py":"zài tái běi, hěn duō rén qí jī chē shàng bān, yě yǒu hěn duō rén zuò jié yùn."},{"zh":"我們坐高鐵去臺南吧，比火車快多了。","en":"Let's take the HSR to Tainan — way faster than the train.","py":"wǒ men zuò gāo tiě qù tái nán ba, bǐ huǒ chē kuài duō le."}],"cy":"Say how you get to school and how you'd travel to Tainan."},{"id":"g8-2","t":"比 — comparison","e":"A 比 B + adjective: 高鐵比火車快. Add amount after: 快兩個鐘頭.","tgt":["比"],"alt":["跟","比較","更"],"s":[{"zh":"高鐵比火車快。","en":"The HSR is faster than the train.","py":"gāo tiě bǐ huǒ chē kuài."},{"zh":"捷運比公車方便。","en":"The MRT is more convenient than the bus.","py":"jié yùn bǐ gōng chē fāng biàn."},{"zh":"高鐵比火車快兩個鐘頭。","en":"The HSR is two hours faster than the train.","py":"gāo tiě bǐ huǒ chē kuài liǎng gè zhōng tóu."},{"zh":"高鐵比火車貴，可是快兩個多鐘頭。","en":"The HSR costs more than the train, but it's over two hours faster.","py":"gāo tiě bǐ huǒ chē guì, kě shì kuài liǎng gè duō zhōng tóu."},{"zh":"我覺得夜市的東西比餐廳的便宜。","en":"I think night-market food is cheaper than restaurants.","py":"wǒ jué de yè shì de dōng xī bǐ cān tīng de pián yi."}],"cy":"Compare two ways to travel with 比."},{"id":"g8-3","t":"比較 — relatively / prefer","e":"比較 + adjective/verb softens comparison: 我比較喜歡坐火車.","tgt":["比較"],"alt":["比","最","更"],"s":[{"zh":"我比較喜歡坐火車。","en":"I prefer taking the train.","py":"wǒ bǐ jiào xǐ huān zuò huǒ chē."},{"zh":"高鐵比較舒服。","en":"The HSR is more comfortable.","py":"gāo tiě bǐ jiào shū fú."},{"zh":"這個比較好。","en":"This one is better.","py":"zhè ge bǐ jiào hǎo."},{"zh":"我比較喜歡騎機車，因為比較方便。","en":"I prefer riding a scooter — it's more convenient.","py":"wǒ bǐ jiào xǐ huān qí jī chē, yīn wèi bǐ jiào fāng biàn."},{"zh":"這兩家店，哪一家比較好吃？","en":"Of these two places, which one's better?","py":"zhè liǎng jiā diàn, nǎ yī jiā bǐ jiào hǎo chī?"}],"cy":"State a soft preference with 比較喜歡."},{"id":"g8-4","t":"又…又… — both…and…","e":"又 A 又 B stacks two qualities: 又快又舒服.","tgt":["又"],"alt":["也","都","和"],"s":[{"zh":"高鐵又快又舒服。","en":"The HSR is both fast and comfortable.","py":"gāo tiě yòu kuài yòu shū fú."},{"zh":"這個地方又遠又貴。","en":"This place is both far and expensive.","py":"zhè ge dì fāng yòu yuǎn yòu guì."},{"zh":"夜市的小吃又便宜又好吃。","en":"Night-market snacks are both cheap and delicious.","py":"yè shì de xiǎo chī yòu pián yi yòu hǎo chī."},{"zh":"坐高鐵又快又舒服，可是有一點貴。","en":"The HSR is fast and comfortable, but a bit pricey.","py":"zuò gāo tiě yòu kuài yòu shū fú, kě shì yǒu yì diǎn guì."}],"cy":"Describe something with 又…又…"},{"id":"g8-5","t":"怎麼 — how","e":"怎麼 + verb asks method: 怎麼去？ 怎麼買票？","tgt":["怎麼"],"alt":["為什麼","什麼","哪裡"],"s":[{"zh":"你怎麼去臺南？","en":"How do you get to Tainan?","py":"nǐ zěn me qù tái nán?"},{"zh":"怎麼買票？","en":"How do you buy tickets?","py":"zěn me mǎi piào?"},{"zh":"請問到故宮博物院怎麼走？坐公車可以到嗎？","en":"How do I get to the National Palace Museum? Can I take a bus?","py":"qǐng wèn dào gù gōng bó wù yuàn zěn me zǒu? zuò gōng chē kě yǐ dào ma?"},{"zh":"高鐵的車票怎麼買？網路上可以買嗎？","en":"How do you buy HSR tickets? Can you buy them online?","py":"gāo tiě de chē piào zěn me mǎi? wǎng lù shàng kě yǐ mǎi ma?"}],"cy":"Ask how to get somewhere and how to buy the ticket."},{"id":"g8-6","t":"或是 vs 還是","e":"或是 = or in statements; 還是 = or in questions.","tgt":["或是","還是"],"alt":["也是","可是"],"s":[{"zh":"你可以坐火車或是高鐵。","en":"You can take the train or the HSR.","py":"nǐ kě yǐ zuò huǒ chē huò shì gāo tiě."},{"zh":"你要坐火車還是高鐵？","en":"Do you want the train or the HSR?","py":"nǐ yào zuò huǒ chē hái shì gāo tiě?"},{"zh":"你可以坐捷運或是騎機車來我家。","en":"You can take the MRT or ride a scooter to my place.","py":"nǐ kě yǐ zuò jié yùn huò shì qí jī chē lái wǒ jiā."},{"zh":"我們這個週末去臺南還是花蓮？","en":"This weekend — Tainan or Hualien?","py":"wǒ men zhè ge zhōu mò qù tái nán hái shì huā lián?"}],"cy":"Give a friend two options (或是), then ask which they want (還是)."},{"id":"g8-7","t":"Duration — 鐘頭","e":"Verb + 要 + duration: 坐火車要四個鐘頭.","tgt":["鐘頭"],"alt":["點","分鐘","小時"],"s":[{"zh":"坐火車要四個鐘頭。","en":"The train takes four hours.","py":"zuò huǒ chē yào sì gè zhōng tóu."},{"zh":"高鐵只要一個半鐘頭。","en":"The HSR only takes an hour and a half.","py":"gāo tiě zhǐ yào yí gè bàn zhōng tóu."},{"zh":"從臺北坐火車到花蓮要三個鐘頭左右。","en":"The train from Taipei to Hualien takes about three hours.","py":"cóng tái běi zuò huǒ chē dào huā lián yào sān gè zhōng tóu zuǒ yòu."},{"zh":"我每天坐捷運差不多一個鐘頭。","en":"I spend about an hour a day on the MRT.","py":"wǒ měi tiān zuò jié yùn chà bu duō yí gè zhōng tóu."}],"cy":"Say how long your commute takes with 要…鐘頭/分鐘."}],"9":[{"id":"g9-1","t":"Days & dates","e":"星期+number (星期天 Sunday); dates: 月 + 號: 三月五號.","tgt":["星期","號","月"],"alt":["點","天"],"s":[{"zh":"我星期三有課。","en":"I have class on Wednesday.","py":"wǒ xīng qī sān yǒu kè."},{"zh":"星期六你有空嗎？","en":"Are you free on Saturday?","py":"xīng qī liù nǐ yǒu kòng ma?"},{"zh":"我的生日是三月五號。","en":"My birthday is March 5th.","py":"wǒ de shēng rì shì sān yuè wǔ hào."},{"zh":"我打算七月十號回國，八月一號再回來。","en":"I plan to go home on July 10th and come back August 1st.","py":"wǒ dǎ suàn qī yuè shí hào huí guó, bā yuè yī hào zài huí lái."},{"zh":"你的生日是幾月幾號？我們一起過吧。","en":"When's your birthday? Let's celebrate it together.","py":"nǐ de shēng rì shì jǐ yuè jǐ hào? wǒ men yì qǐ guò ba."}],"cy":"Say your birthday and one weekly commitment."},{"id":"g9-2","t":"打算 — to plan","e":"打算 + verb phrase directly (no 要): 我打算下個星期去臺東.","tgt":["打算"],"alt":["希望","想","要"],"s":[{"zh":"你打算什麼時候回國？","en":"When do you plan to return home?","py":"nǐ dǎ suàn shén me shí hòu huí guó?"},{"zh":"我打算下個星期去臺東。","en":"I plan to go to Taitung next week.","py":"wǒ dǎ suàn xià gè xīng qī qù tái dōng."},{"zh":"放假的時候，你打算做什麼？","en":"What do you plan to do on vacation?","py":"fàng jià de shí hòu, nǐ dǎ suàn zuò shén me?"},{"zh":"放假的時候，我打算跟朋友去臺東玩一個星期。","en":"Over the break, I plan to spend a week in Taitung with friends.","py":"fàng jià de shí hòu, wǒ dǎ suàn gēn péng yǒu qù tái dōng wán yí gè xīng qī."},{"zh":"你打算在臺灣學多久的中文？","en":"How long do you plan to study Chinese in Taiwan?","py":"nǐ dǎ suàn zài tái wān xué duō jiǔ de zhōng wén?"}],"cy":"Share your holiday plan with 打算."},{"id":"g9-3","t":"要是…就… — if…then…","e":"要是 A，(subject) 就 B: 就 comes after the subject in the result clause.","tgt":["要是","就"],"alt":["因為","所以"],"s":[{"zh":"要是明天下雨，我就不出去。","en":"If it rains tomorrow, I won't go out.","py":"yào shì míng tiān xià yǔ, wǒ jiù bù chū qù."},{"zh":"要是你有空，我們就一起去。","en":"If you're free, let's go together.","py":"yào shì nǐ yǒu kòng, wǒ men jiù yì qǐ qù."},{"zh":"要是你想去夜市，我就帶你去。","en":"If you want the night market, I'll take you.","py":"yào shì nǐ xiǎng qù yè shì, wǒ jiù dài nǐ qù."},{"zh":"要是週末不下雨，我們就去山上走走。","en":"If it doesn't rain this weekend, let's go walk in the mountains.","py":"yào shì zhōu mò bù xià yǔ, wǒ men jiù qù shān shàng zǒu zǒu."},{"zh":"要是你沒空，我們就下次再見面。","en":"If you're not free, we'll just meet next time.","py":"yào shì nǐ méi kòng, wǒ men jiù xià cì zài jiàn miàn."}],"cy":"Make an if-then plan for the weekend with 要是…就…"},{"id":"g9-4","t":"應該 — should","e":"應該 suggests (softer than must): 你應該去貓空看看.","tgt":["應該"],"alt":["得","會","要"],"s":[{"zh":"你應該去貓空看看。","en":"You should go check out Maokong.","py":"nǐ yīng gāi qù māo kōng kàn kàn."},{"zh":"我們應該早一點決定。","en":"We should decide earlier.","py":"wǒ men yīng gāi zǎo yì diǎn jué dìng."},{"zh":"你來臺灣，應該去夜市吃吃看臭豆腐。","en":"Since you're in Taiwan, you should try stinky tofu at a night market.","py":"nǐ lái tái wān, yīng gāi qù yè shì chī chī kàn chòu dòu fǔ."},{"zh":"我們應該早一點買車票，因為放假的時候人很多。","en":"We should buy tickets early — holidays get crowded.","py":"wǒ men yīng gāi zǎo yì diǎn mǎi chē piào, yīn wèi fàng jià de shí hòu rén hěn duō."}],"cy":"Give a friend two recommendations for Taipei with 應該."},{"id":"g9-5","t":"多久 — how long","e":"多久 asks duration: 你要去多久？","tgt":["多久"],"alt":["多少","幾點","什麼時候"],"s":[{"zh":"你要去多久？","en":"How long will you go for?","py":"nǐ yào qù duō jiǔ?"},{"zh":"從臺北到臺東要多久？","en":"How long from Taipei to Taitung?","py":"cóng tái běi dào tái dōng yào duō jiǔ?"},{"zh":"從你家走路到捷運站要多久？","en":"How long is the walk from your place to the MRT?","py":"cóng nǐ jiā zǒu lù dào jié yùn zhàn yào duō jiǔ?"},{"zh":"你打算在臺灣住多久？一年還是兩年？","en":"How long will you stay in Taiwan — one year or two?","py":"nǐ dǎ suàn zài tái wān zhù duō jiǔ? yī nián hái shì liǎng nián?"}],"cy":"Ask a classmate how long they'll study Chinese with 多久."},{"id":"g9-6","t":"還 — still / in addition","e":"還 = still (還在/還沒) or additionally (還想去…).","tgt":["還"],"alt":["就","再","又"],"s":[{"zh":"你還在學校嗎？","en":"Are you still at school?","py":"nǐ hái zài xué xiào ma?"},{"zh":"我還沒決定。","en":"I still haven't decided.","py":"wǒ hái méi jué dìng."},{"zh":"我想去夜市，還想去茶館。","en":"I want the night market, and also a teahouse.","py":"wǒ xiǎng qù yè shì, hái xiǎng qù chá guǎn."},{"zh":"我還沒去過貓空，聽說那裡的茶館很特別。","en":"I still haven't been to Maokong — I hear the teahouses there are special.","py":"wǒ hái méi qù guò māo kōng, tīng shuō nà lǐ de chá guǎn hěn tè bié."},{"zh":"我想吃小籠包，還想去逛夜市。","en":"I want xiaolongbao — and to wander a night market too.","py":"wǒ xiǎng chī xiǎo lóng bāo, hái xiǎng qù guàng yè shì."}],"cy":"Say something you still haven't done with 還沒."},{"id":"g9-7","t":"有時候 — sometimes","e":"有時候 before the clause: 有時候我在家看電視.","tgt":["有時候"],"alt":["常","每天","的時候"],"s":[{"zh":"有時候我在家看電視。","en":"Sometimes I watch TV at home.","py":"yǒu shí hòu wǒ zài jiā kàn diàn shì."},{"zh":"我有時候會去那家茶館。","en":"I sometimes go to that teahouse.","py":"wǒ yǒu shí hòu huì qù nà jiā chá guǎn."},{"zh":"我有時候自己做飯，有時候去外面吃。","en":"Sometimes I cook, sometimes I eat out.","py":"wǒ yǒu shí hòu zì jǐ zuò fàn, yǒu shí hòu qù wài miàn chī."},{"zh":"他有時候坐捷運上課，有時候騎機車。","en":"Sometimes he MRTs to class, sometimes he scooters.","py":"tā yǒu shí hòu zuò jié yùn shàng kè, yǒu shí hòu qí jī chē."}],"cy":"Describe two 'sometimes' habits with 有時候."}],"10":[{"id":"g10-1","t":"Colors + 的","e":"Color + 色 + 的 + noun: 黃色的芒果 (or short: 黃芒果).","tgt":["黃色","紅色","藍色"],"alt":["顏色"],"s":[{"zh":"我要買黃色的芒果。","en":"I want to buy yellow mangoes.","py":"wǒ yào mǎi huáng sè de máng guǒ."},{"zh":"她穿紅色的衣服。","en":"She wears red clothes.","py":"tā chuān hóng sè de yī fú."},{"zh":"這是藍色的窗戶。","en":"This is a blue window.","py":"zhè shì lán sè de chuāng hù."},{"zh":"她今天穿黃色的衣服，很好看。","en":"She's wearing yellow today — looks great.","py":"tā jīn tiān chuān huáng sè de yī fú, hěn hǎo kàn."},{"zh":"我想買藍色的，可是店裡只有紅色的。","en":"I wanted the blue one, but the shop only had red.","py":"wǒ xiǎng mǎi lán sè de, kě shì diàn lǐ zhǐ yǒu hóng sè de."}],"cy":"Describe what you're wearing today with colors + 的."},{"id":"g10-2","t":"給 — to give / for","e":"給 + person + thing (給你一個芒果); or 給 + person + verb (我給你看 I'll show you).","tgt":["給"],"alt":["幫","替","跟"],"s":[{"zh":"我給你一個芒果。","en":"I give you a mango.","py":"wǒ gěi nǐ yí gè máng guǒ."},{"zh":"這是給你的。","en":"This is for you.","py":"zhè shì gěi nǐ de."},{"zh":"給我拍一張照片。","en":"Take a photo for me.","py":"gěi wǒ pāi yī zhāng zhào piān."},{"zh":"這些芒果是我房東給我的，你吃吃看。","en":"My landlord gave me these mangoes — try one.","py":"zhè xiē máng guǒ shì wǒ fáng dōng gěi wǒ de, nǐ chī chī kàn."},{"zh":"你可以給我拍一張照片嗎？我想給媽媽看。","en":"Could you take a photo of me? I want to show my mom.","py":"nǐ kě yǐ gěi wǒ pāi yī zhāng zhào piān ma? wǒ xiǎng gěi mā mā kàn."}],"cy":"Offer something to a friend with 給."},{"id":"g10-3","t":"V-V-看 — try doing","e":"Doubling the verb + 看 = give it a try: 吃吃看, 穿穿看.","tgt":["吃吃看","穿穿看","看看"],"alt":["試試看"],"s":[{"zh":"這個芒果很甜，你吃吃看。","en":"This mango is sweet — try it.","py":"zhè ge máng guǒ hěn tián, nǐ chī chī kàn."},{"zh":"這件衣服很好看，你穿穿看。","en":"This looks nice — try it on.","py":"zhè jiàn yī fú hěn hǎo kàn, nǐ chuān chuān kàn."},{"zh":"這種水果你吃吃看，真的很甜。","en":"Try this fruit — it's really sweet.","py":"zhè zhǒng shuǐ guǒ nǐ chī chī kàn, zhēn de hěn tián."},{"zh":"這些衣服都很漂亮，你穿穿看。","en":"These clothes are all lovely — try them on.","py":"zhè xiē yī fú dōu hěn piào liàng, nǐ chuān chuān kàn."}],"cy":"Urge a friend to try a food and to try on clothes with V-V-看."},{"id":"g10-4","t":"因為…所以… — because…so…","e":"Both halves usually appear together in Chinese.","tgt":["因為","所以"],"alt":["可是","要是"],"s":[{"zh":"因為芒果很甜，所以我很喜歡。","en":"Because mangoes are sweet, I like them a lot.","py":"yīn wèi máng guǒ hěn tián, suǒ yǐ wǒ hěn xǐ huān."},{"zh":"因為他很高，所以打籃球打得很好。","en":"Because he's tall, he plays basketball well.","py":"yīn wèi tā hěn gāo, suǒ yǐ dǎ lán qiú dǎ dé hěn hǎo."},{"zh":"因為臺灣的芒果又香又甜，所以夏天大家都買。","en":"Because Taiwan's mangoes are fragrant and sweet, everyone buys them in summer.","py":"yīn wèi tái wān de máng guǒ yòu xiāng yòu tián, suǒ yǐ xià tiān dà jiā dōu mǎi."},{"zh":"因為我以前沒吃過臭豆腐，所以想吃吃看。","en":"Because I'd never had stinky tofu before, I wanted to try it.","py":"yīn wèi wǒ yǐ qián méi chī guò chòu dòu fǔ, suǒ yǐ xiǎng chī chī kàn."}],"cy":"Explain why you like something with 因為…所以…"},{"id":"g10-5","t":"以前 — before / in the past","e":"以前 opens a past-time frame; clause + 以前 = before doing X.","tgt":["以前"],"alt":["以後","現在","上個月"],"s":[{"zh":"以前我不喜歡吃芒果。","en":"Before, I didn't like mangoes.","py":"yǐ qián wǒ bù xǐ huān chī máng guǒ."},{"zh":"來臺灣以前，我沒吃過西瓜。","en":"Before coming to Taiwan, I'd never eaten watermelon.","py":"lái tái wān yǐ qián, wǒ méi chī guò xī guā."},{"zh":"來臺灣以前，我沒吃過這麼甜的西瓜。","en":"Before coming to Taiwan, I'd never had watermelon this sweet.","py":"lái tái wān yǐ qián, wǒ méi chī guò zhè me tián de xī guā."},{"zh":"以前我常打籃球，現在比較常游泳。","en":"I used to play a lot of basketball; now I swim more.","py":"yǐ qián wǒ cháng dǎ lán qiú, xiàn zài bǐ jiào cháng yóu yǒng."}],"cy":"Contrast a past habit (以前) with now (現在)."},{"id":"g10-6","t":"這些 / 那些 — these / those","e":"Plural demonstratives: 這些水果, 那些衣服.","tgt":["這些","那些"],"alt":["這個","那個"],"s":[{"zh":"這些水果都很甜。","en":"These fruits are all sweet.","py":"zhè xiē shuǐ guǒ dōu hěn tián."},{"zh":"那些衣服很好看。","en":"Those clothes look nice.","py":"nà xiē yī fú hěn hǎo kàn."},{"zh":"這些照片都是我上個月在臺東拍的。","en":"These photos are all from my Taitung trip last month.","py":"zhè xiē zhào piān dōu shì wǒ shàng gè yuè zài tái dōng pāi de."},{"zh":"那些穿藍色衣服的學生都是我同學。","en":"Those students in blue are all my classmates.","py":"nà xiē chuān lán sè yī fú de xué shēng dōu shì wǒ tóng xué."}],"cy":"Point out things around you with 這些/那些."}],"11":[{"id":"g11-1","t":"就 — only / right away","e":"就 conveys 'merely/immediately': 走路就五分鐘; 出門就到了; 就是這間.","tgt":["就"],"alt":["才","再","還"],"s":[{"zh":"走路就五分鐘。","en":"It's only a 5-minute walk.","py":"zǒu lù jiù wǔ fēn zhōng."},{"zh":"房租就一萬塊。","en":"The rent is only 10,000 NT.","py":"fáng zū jiù yī wàn kuài."},{"zh":"往右轉就是超市。","en":"Turn right and there's the supermarket.","py":"wǎng yòu zhuǎn jiù shì chāo shì."},{"zh":"我就住在這裡。","en":"I live right here.","py":"wǒ jiù zhù zài zhè lǐ."},{"zh":"我家旁邊就有超市，買東西很方便。","en":"There's a supermarket right next to my place — shopping is easy.","py":"wǒ jiā páng biān jiù yǒu chāo shì, mǎi dōng xī hěn fāng biàn."},{"zh":"你出捷運站，往右走就到了。","en":"Exit the MRT, turn right, and you're there.","py":"nǐ chū jié yùn zhàn, wǎng yòu zǒu jiù dào le."}],"cy":"Brag how close something is to your place using 就."},{"id":"g11-2","t":"到 — arrive / until / result","e":"到 = arrive (我到了), up to (住到下個月), and result complement (看到/聽到/收到).","tgt":["到"],"alt":["在","去","從"],"s":[{"zh":"我到了。","en":"I've arrived.","py":"wǒ dào le."},{"zh":"我在這裡住到下個月。","en":"I'm staying here until next month.","py":"wǒ zài zhè lǐ zhù dào xià gè yuè."},{"zh":"房東已經收到了。","en":"The landlord already received it.","py":"fáng dōng yǐ jīng shōu dào le."},{"zh":"房租我已經付了，你收到了嗎？","en":"I've already paid the rent — did you receive it?","py":"fáng zū wǒ yǐ jīng fù le, nǐ shōu dào le ma?"},{"zh":"我在臺灣要住到明年六月。","en":"I'm staying in Taiwan until next June.","py":"wǒ zài tái wān yào zhù dào míng nián liù yuè."}],"cy":"Text a friend that you've arrived and until when you'll stay."},{"id":"g11-3","t":"間 — rooms; 空 — vacant","e":"間 measures rooms: 一間套房; 空 = empty/free: 空房間, 你有空嗎.","tgt":["間","空"],"alt":["棟","樓","家"],"s":[{"zh":"我要租一間套房。","en":"I want to rent a studio.","py":"wǒ yào zū yī jiān tào fáng."},{"zh":"有空房間嗎？","en":"Are there vacant rooms?","py":"yǒu kòng fáng jiān ma?"},{"zh":"這裡有三間空房間。","en":"There are three empty rooms here.","py":"zhè lǐ yǒu sān jiān kòng fáng jiān."},{"zh":"請問你們還有沒有空房間？我想這個月就租。","en":"Do you still have any vacant rooms? I'd like to rent this month.","py":"qǐng wèn nǐ men hái yǒu méi yǒu kòng fáng jiān? wǒ xiǎng zhè ge yuè jiù zū."},{"zh":"這間套房不大，可是廚房浴室都有。","en":"This studio isn't big, but it has a kitchen and bathroom.","py":"zhè jiān tào fáng bù dà, kě shì chú fáng yù shì dōu yǒu."}],"cy":"Ask a landlord about vacant rooms using 間 and 空."},{"id":"g11-4","t":"左邊 / 右邊","e":"X 的左邊/右邊; 往右邊走 go right.","tgt":["左邊","右邊"],"alt":["旁邊","前面","後面"],"s":[{"zh":"左邊是廚房，右邊是浴室。","en":"Kitchen on the left, bathroom on the right.","py":"zuǒ biān shì chú fáng, yòu biān shì yù shì."},{"zh":"超市在旅館的左邊。","en":"The supermarket is left of the hotel.","py":"chāo shì zài lǚ guǎn de zuǒ biān."},{"zh":"客廳的左邊是廚房，右邊是我的房間。","en":"Left of the living room is the kitchen; my room's on the right.","py":"kè tīng de zuǒ biān shì chú fáng, yòu biān shì wǒ de fáng jiān."},{"zh":"超市就在銀行的右邊，很好找。","en":"The supermarket is right of the bank — easy to find.","py":"chāo shì jiù zài yín háng de yòu biān, hěn hǎo zhǎo."}],"cy":"Describe your room layout with 左邊/右邊."},{"id":"g11-5","t":"再 — again / then","e":"再 = again (再說一次) and 'then, afterwards': 先看房子，再決定.","tgt":["再"],"alt":["又","還","就"],"s":[{"zh":"我想再去一次。","en":"I want to go once more.","py":"wǒ xiǎng zài qù yī cì."},{"zh":"先看房子，再決定。","en":"First see the place, then decide.","py":"xiān kàn fáng zi, zài jué dìng."},{"zh":"我回去想想，再告訴你。","en":"I'll think it over, then tell you.","py":"wǒ huí qù xiǎng xiǎng, zài gào sù nǐ."},{"zh":"我們先去看那間套房，再決定租不租。","en":"Let's see that studio first, then decide whether to rent.","py":"wǒ men xiān qù kàn nà jiān tào fáng, zài jué dìng zū bù zū."},{"zh":"這個問題我想想，明天再告訴你。","en":"Let me think it over — I'll tell you tomorrow.","py":"zhè ge wèn tí wǒ xiǎng xiǎng, míng tiān zài gào sù nǐ."}],"cy":"Politely delay a decision with 先…再…"},{"id":"g11-6","t":"已經…了 — already","e":"已經 + verb + 了: 我已經付房租了.","tgt":["已經","了"],"alt":["還沒","剛"],"s":[{"zh":"我已經付房租了。","en":"I've already paid the rent.","py":"wǒ yǐ jīng fù fáng zū le."},{"zh":"他已經習慣了。","en":"He's already used to it.","py":"tā yǐ jīng xí guàn le."},{"zh":"已經很晚了。","en":"It's already very late.","py":"yǐ jīng hěn wǎn le."},{"zh":"我已經在臺北住了三個月了，都習慣了。","en":"I've been in Taipei three months now — all settled in.","py":"wǒ yǐ jīng zài tái běi zhù le sān gè yuè le, dōu xí guàn le."},{"zh":"已經十二點了，早一點睡吧。","en":"It's already midnight — get to bed.","py":"yǐ jīng shí èr diǎn le, zǎo yì diǎn shuì ba."}],"cy":"Say two things you've already done today with 已經…了."},{"id":"g11-7","t":"好像 — it seems","e":"好像 softens claims: 熱水器好像壞了.","tgt":["好像"],"alt":["一定","真的","當然"],"s":[{"zh":"熱水器好像壞了。","en":"The water heater seems broken.","py":"rè shuǐ qì hǎo xiàng huài le."},{"zh":"他好像不在家。","en":"He doesn't seem to be home.","py":"tā hǎo xiàng bù zài jiā."},{"zh":"這間房間好像比較小。","en":"This room seems smaller.","py":"zhè jiān fáng jiān hǎo xiàng bǐ jiào xiǎo."},{"zh":"熱水器好像又壞了，我得打電話給房東。","en":"The water heater seems broken again — I have to call the landlord.","py":"rè shuǐ qì hǎo xiàng yòu huài le, wǒ dé dǎ diàn huà gěi fáng dōng."},{"zh":"外面好像在下雨，你帶傘了嗎？","en":"Looks like it's raining out — did you bring an umbrella?","py":"wài miàn hǎo xiàng zài xià yǔ, nǐ dài sǎn le ma?"}],"cy":"Report a problem to your landlord softly with 好像."},{"id":"g11-8","t":"不好意思 / 沒關係","e":"不好意思 = sorry/excuse me; the reply is 沒關係 it's fine.","tgt":["不好意思","沒關係"],"alt":["對不起","謝謝"],"s":[{"zh":"不好意思，我忘了。","en":"Sorry, I forgot.","py":"bù hǎo yì sī, wǒ wàng le."},{"zh":"不好意思，可以問你一個問題嗎？","en":"Excuse me, may I ask a question?","py":"bù hǎo yì sī, kě yǐ wèn nǐ yí gè wèn tí ma?"},{"zh":"沒關係，明天可以。","en":"No problem, tomorrow works.","py":"méi guān xì, míng tiān kě yǐ."},{"zh":"不好意思，房租我下個星期付，可以嗎？","en":"Sorry — can I pay the rent next week?","py":"bù hǎo yì sī, fáng zū wǒ xià gè xīng qī fù, kě yǐ ma?"},{"zh":"沒關係，你方便的時候再付就可以了。","en":"No problem, pay whenever it's convenient.","py":"méi guān xì, nǐ fāng biàn de shí hòu zài fù jiù kě yǐ le."}],"cy":"Apologize for being late and accept an apology."},{"id":"g11-9","t":"不過 — however","e":"不過 = but (softer than 可是): 這間不大，不過很乾淨.","tgt":["不過"],"alt":["可是","所以","因為"],"s":[{"zh":"這間套房不大，不過很乾淨。","en":"This studio isn't big, but it's clean.","py":"zhè jiān tào fáng bù dà, bù guò hěn gān jìng."},{"zh":"房租有點貴，不過有家具。","en":"Rent's a bit high, but it's furnished.","py":"fáng zū yǒu diǎn guì, bù guò yǒu jiā jù."},{"zh":"這間房間有一點小，不過離學校很近。","en":"The room's a bit small, but it's really close to school.","py":"zhè jiān fáng jiān yǒu yì diǎn xiǎo, bù guò lí xué xiào hěn jìn."},{"zh":"房租不便宜，不過裡面什麼都有。","en":"The rent isn't cheap, but it has everything.","py":"fáng zū bù biàn yí, bù guò lǐ miàn shén me dōu yǒu."}],"cy":"Weigh an apartment's pros/cons with 不過."}],"12":[{"id":"g12-1","t":"先…再… — first…then…","e":"Sequences plans: 先念大學，再工作.","tgt":["先","再"],"alt":["就","才","又"],"s":[{"zh":"先念大學，再工作。","en":"First university, then work.","py":"xiān niàn dà xué, zài gōng zuò."},{"zh":"我想先吃飯，再去看電影。","en":"I want to eat first, then see a movie.","py":"wǒ xiǎng xiān chī fàn, zài qù kàn diàn yǐng."},{"zh":"先在語言中心念一年，再念大學。","en":"First a year at the language center, then university.","py":"xiān zài yǔ yán zhōng xīn niàn yī nián, zài niàn dà xué."},{"zh":"我打算先在語言中心念一年中文，再念大學。","en":"I plan to study Chinese at the language center for a year first, then university.","py":"wǒ dǎ suàn xiān zài yǔ yán zhōng xīn niàn yī nián zhōng wén, zài niàn dà xué."},{"zh":"你先想想要不要，明天再告訴我。","en":"Think about whether you want it first — tell me tomorrow.","py":"nǐ xiān xiǎng xiǎng yào bú yào, míng tiān zài gào sù wǒ."}],"cy":"Lay out your study-then-work plan with 先…再…"},{"id":"g12-2","t":"花 — to spend","e":"花 + time/money (+ verb): 花很多時間學中文; 學費要花二十萬.","tgt":["花"],"alt":["要","買","用"],"s":[{"zh":"我每天花兩個小時念書。","en":"I spend two hours studying daily.","py":"wǒ měi tiān huā liǎng gè xiǎo shí niàn shū."},{"zh":"念大學要花很多錢。","en":"University costs a lot.","py":"niàn dà xué yào huā hěn duō qián."},{"zh":"你花了多久？","en":"How long did you spend?","py":"nǐ huā le duō jiǔ?"},{"zh":"我每天花一個鐘頭寫字、念書。","en":"I spend an hour a day writing characters and studying.","py":"wǒ měi tiān huā yí gè zhōng tóu xiě zì, niàn shū."},{"zh":"在臺北租房子要花不少錢。","en":"Renting in Taipei costs quite a bit.","py":"zài tái běi zū fáng zi yào huā bù shǎo qián."}],"cy":"Say how much time you spend on Chinese every day with 花."},{"id":"g12-3","t":"需要 — to need","e":"需要 + noun or verb: 需要時間, 需要念四年.","tgt":["需要"],"alt":["想要","希望","應該"],"s":[{"zh":"你需要幫忙嗎？","en":"Do you need help?","py":"nǐ xū yào bāng máng ma?"},{"zh":"需要多少錢？","en":"How much money is needed?","py":"xū yào duō shǎo qián?"},{"zh":"不需要擔心。","en":"No need to worry.","py":"bù xū yào dān xīn."},{"zh":"念大學需要好的中文成績，所以我得加油。","en":"University requires good Chinese grades, so I have to push.","py":"niàn dà xué xū yào hǎo de zhōng wén chéng jì, suǒ yǐ wǒ dé jiā yóu."},{"zh":"你需要我替你做什麼嗎？","en":"Anything you need me to do for you?","py":"nǐ xū yào wǒ tì nǐ zuò shén me ma?"}],"cy":"State two things you need to reach your goal with 需要."},{"id":"g12-4","t":"以後 — after / in the future","e":"Clause + 以後 = after X; alone = in the future.","tgt":["以後"],"alt":["以前","的時候","現在"],"s":[{"zh":"念完大學以後，我想找工作。","en":"After university, I want to find work.","py":"niàn wán dà xué yǐ hòu, wǒ xiǎng zhǎo gōng zuò."},{"zh":"下課以後我們去吃飯吧。","en":"After class let's eat.","py":"xià kè yǐ hòu wǒ men qù chī fàn ba."},{"zh":"以後想做什麼？","en":"What do you want to do in the future?","py":"yǐ hòu xiǎng zuò shén me?"},{"zh":"下課以後，我常跟同學去打籃球。","en":"After class, I often play basketball with classmates.","py":"xià kè yǐ hòu, wǒ cháng gēn tóng xué qù dǎ lán qiú."},{"zh":"工作以後，我希望能常回臺灣看看。","en":"Once I'm working, I hope to come back to Taiwan often.","py":"gōng zuò yǐ hòu, wǒ xī wàng néng cháng huí tái wān kàn kàn."}],"cy":"Describe your after-graduation plan with …以後."},{"id":"g12-5","t":"希望 — to hope","e":"希望 + clause: 我希望找到好工作.","tgt":["希望"],"alt":["打算","需要","覺得"],"s":[{"zh":"我希望找到好工作。","en":"I hope to find a good job.","py":"wǒ xī wàng zhǎo dào hǎo gōng zuò."},{"zh":"他希望能拿到獎學金。","en":"He hopes to get a scholarship.","py":"tā xī wàng néng ná dào jiǎng xué jīn."},{"zh":"希望你能幫我。","en":"I hope you can help me.","py":"xī wàng nǐ néng bāng wǒ."},{"zh":"我希望明年能拿到獎學金。","en":"I hope I can get a scholarship next year.","py":"wǒ xī wàng míng nián néng ná dào jiǎng xué jīn."},{"zh":"爸媽希望我念完書以後回國工作。","en":"My parents hope I'll go home to work after finishing my studies.","py":"bà mā xī wàng wǒ niàn wán shū yǐ hòu huí guó gōng zuò."}],"cy":"Share two hopes for your year in Taiwan with 希望."},{"id":"g12-6","t":"替 — on behalf of","e":"替 + person + verb: 公司替我付學費.","tgt":["替"],"alt":["給","幫","跟"],"s":[{"zh":"公司替我付學費。","en":"The company pays my tuition.","py":"gōng sī tì wǒ fù xué fèi."},{"zh":"我替你問問看。","en":"I'll ask for you.","py":"wǒ tì nǐ wèn wèn kàn."},{"zh":"替我加油！","en":"Cheer for me!","py":"tì wǒ jiā yóu!"},{"zh":"他今天有事，我替他來問老師一個問題。","en":"He's tied up today, so I'm here to ask the teacher a question for him.","py":"tā jīn tiān yǒu shì, wǒ tì tā lái wèn lǎo shī yí gè wèn tí."},{"zh":"你去比賽，我們都替你加油！","en":"You compete — we'll all be cheering for you!","py":"nǐ qù bǐ sài, wǒ men dōu tì nǐ jiā yóu!"}],"cy":"Offer to do something for a friend with 替."},{"id":"g12-7","t":"試試看 — give it a try","e":"試試看 / V+試試看: 你試試看; 做試試看.","tgt":["試試看"],"alt":["看看","吃吃看"],"s":[{"zh":"你試試看。","en":"You try and see.","py":"nǐ shì shì kàn."},{"zh":"我試試看，可能會成功。","en":"I'll try — maybe it'll work.","py":"wǒ shì shì kàn, kě néng huì chéng gōng."},{"zh":"試試看再說。","en":"Try first, then talk.","py":"shì shì kàn zài shuō."},{"zh":"這個工作不好找，可是我想試試看。","en":"This kind of job is hard to find, but I want to try.","py":"zhè ge gōng zuò bù hǎo zhǎo, kě shì wǒ xiǎng shì shì kàn."},{"zh":"沒關係，你先試試看，不難。","en":"It's fine — just try it, it isn't hard.","py":"méi guān xì, nǐ xiān shì shì kàn, bù nán."}],"cy":"Encourage yourself about a hard task with 試試看 and 加油."}],"13":[{"id":"g13-1","t":"祝 — wishing someone","e":"祝 + person + wish: 祝你生日快樂！ 祝你萬事如意！","tgt":["祝"],"alt":["請","給","對"],"s":[{"zh":"祝你生日快樂！","en":"Wishing you a happy birthday!","py":"zhù nǐ shēng rì kuài lè!"},{"zh":"祝你萬事如意！","en":"May everything go your way!","py":"zhù nǐ wàn shì rú yì!"},{"zh":"祝你心想事成！","en":"May your wishes come true!","py":"zhù nǐ xīn xiǎng shì chéng!"},{"zh":"祝你生日快樂，萬事如意，心想事成！","en":"Happy birthday — may everything go your way and your wishes come true!","py":"zhù nǐ shēng rì kuài lè, wàn shì rú yì, xīn xiǎng shì chéng!"},{"zh":"祝你們新年快樂，身體健康！","en":"Happy New Year, and good health to you all!","py":"zhù nǐ men xīn nián kuài lè, shēn tǐ jiàn kāng!"}],"cy":"Write a birthday message stacking two 祝 wishes."},{"id":"g13-2","t":"怎麼 — how come?","e":"怎麼 + verb can mean surprised 'how come': 你怎麼忘了？","tgt":["怎麼"],"alt":["為什麼","什麼","多久"],"s":[{"zh":"你怎麼忘了？","en":"How come you forgot?","py":"nǐ zěn me wàng le?"},{"zh":"他怎麼還沒來？","en":"Why hasn't he come yet?","py":"tā zěn me hái méi lái?"},{"zh":"怎麼說？","en":"How do you say it?","py":"zěn me shuō?"},{"zh":"今天是你女朋友的生日，你怎麼忘了呢？","en":"It's your girlfriend's birthday — how could you forget?","py":"jīn tiān shì nǐ nǚ péng yǒu de shēng rì, nǐ zěn me wàng le ne?"},{"zh":"他怎麼還沒來？我們已經等了半個鐘頭了。","en":"Why isn't he here yet? We've been waiting half an hour.","py":"tā zěn me hái méi lái? wǒ men yǐ jīng děng le bàn gè zhōng tóu le."}],"cy":"Express surprise that a friend forgot something with 怎麼."},{"id":"g13-3","t":"忘了 vs 記得","e":"忘了 forgot (done); 記得 remember (state): 記得帶書 remember to bring the book.","tgt":["忘了","記得"],"alt":["知道","想"],"s":[{"zh":"我忘了帶錢。","en":"I forgot to bring money.","py":"wǒ wàng le dài qián."},{"zh":"你記得嗎？","en":"Do you remember?","py":"nǐ jì de ma?"},{"zh":"記得打電話給我。","en":"Remember to call me.","py":"jì de dǎ diàn huà gěi wǒ."},{"zh":"我忘了買禮物，怎麼辦？","en":"I forgot to buy a gift — what do I do?","py":"wǒ wàng le mǎi lǐ wù, zěn me bàn?"},{"zh":"記得七點以前到餐廳，我們訂了位子。","en":"Remember to reach the restaurant by seven — we reserved a table.","py":"jì de qī diǎn yǐ qián dào cān tīng, wǒ men dìng le wèi zi."}],"cy":"Admit something you forgot, then a reminder with 記得."},{"id":"g13-4","t":"當然 — of course","e":"當然 answers emphatically: 當然記得！","tgt":["當然"],"alt":["一定","真的","好像"],"s":[{"zh":"當然記得！","en":"Of course I remember!","py":"dāng rán jì de!"},{"zh":"當然可以。","en":"Of course you can.","py":"dāng rán kě yǐ."},{"zh":"當然要去。","en":"Of course I'll go.","py":"dāng rán yào qù."},{"zh":"你記得我們第一次見面的地方嗎？當然記得！","en":"Remember where we first met? Of course I do!","py":"nǐ jì de wǒ men dì yī cì jiàn miàn de dì fāng ma? dāng rán jì de!"},{"zh":"「你要來過生日嗎？」「當然要！」","en":"\"Coming to the birthday dinner?\" \"Of course!\"","py":"「 nǐ yào lái guò shēng rì ma? 」 「 dāng rán yào! 」"}],"cy":"Answer an invitation enthusiastically with 當然."},{"id":"g13-5","t":"跟…一樣 — same as","e":"A 跟 B 一樣 (+adjective): 今年跟去年一樣熱.","tgt":["一樣","跟"],"alt":["比","也","都"],"s":[{"zh":"這個跟那個一樣。","en":"This one is the same as that one.","py":"zhè ge gēn nà ge yī yàng."},{"zh":"我的想法跟你一樣。","en":"My thoughts are the same as yours.","py":"wǒ de xiǎng fǎ gēn nǐ yī yàng."},{"zh":"今年跟去年一樣熱。","en":"This year is as hot as last year.","py":"jīn nián gēn qù nián yī yàng rè."},{"zh":"我的手機跟你的一樣，都是去年買的。","en":"My phone's the same as yours — both bought last year.","py":"wǒ de shǒu jī gēn nǐ de yī yàng, dōu shì qù nián mǎi de."},{"zh":"今年的天氣跟去年不一樣，更熱了。","en":"This year's weather isn't like last year's — it's even hotter.","py":"jīn nián de tiān qì gēn qù nián bù yí yàng, gèng rè le."}],"cy":"Compare two things that are alike with 跟…一樣."},{"id":"g13-6","t":"過 — celebrate / experience","e":"過生日 celebrate; verb+過 = have done before: 我去過臺灣.","tgt":["過"],"alt":["了","在","到"],"s":[{"zh":"你怎麼過生日？","en":"How do you celebrate your birthday?","py":"nǐ zěn me guò shēng rì?"},{"zh":"我去過臺灣。","en":"I've been to Taiwan.","py":"wǒ qù guò tái wān."},{"zh":"你吃過豬腳麵線嗎？","en":"Have you eaten pork knuckle noodles?","py":"nǐ chī guò zhū jiǎo miàn xiàn ma?"},{"zh":"你在臺灣過過生日嗎？大家會請你吃豬腳麵線。","en":"Ever had a birthday in Taiwan? People treat you to pork-knuckle noodles.","py":"nǐ zài tái wān guò guò shēng rì ma? dà jiā huì qǐng nǐ chī zhū jiǎo miàn xiàn."},{"zh":"我還沒去過花蓮，明年一定要去一次。","en":"I still haven't been to Hualien — next year for sure.","py":"wǒ hái méi qù guò huā lián, míng nián yí dìng yào qù yī cì."}],"cy":"Ask a friend two 'have you ever' questions with V+過."},{"id":"g13-7","t":"左右 — approximately","e":"Amount + 左右: 十個人左右, 五點左右.","tgt":["左右"],"alt":["差不多","大概","一點"],"s":[{"zh":"他三十歲左右。","en":"He's around thirty.","py":"tā sān shí suì zuǒ yòu."},{"zh":"我們十個人左右會去。","en":"About ten of us will go.","py":"wǒ men shí gè rén zuǒ yòu huì qù."},{"zh":"五點左右見面吧。","en":"Let's meet around five.","py":"wǔ diǎn zuǒ yòu jiàn miàn ba."},{"zh":"我們訂了晚上七點左右的位子，別太晚到。","en":"We booked around seven — don't be late.","py":"wǒ men dìng le wǎn shàng qī diǎn zuǒ yòu de wèi zi, bié tài wǎn dào."},{"zh":"這個蛋糕五百塊左右，不太貴。","en":"The cake is around five hundred NT — not too bad.","py":"zhè ge dàn gāo wǔ bǎi kuài zuǒ yòu, bù tài guì."}],"cy":"Estimate a party's size and time with 左右."},{"id":"g13-8","t":"哪裡哪裡 — humble reply","e":"Deflect a compliment: 哪裡哪裡 / 不必客氣 replies politely.","tgt":["哪裡哪裡","不必客氣"],"alt":["謝謝","不客氣"],"s":[{"zh":"哪裡哪裡。","en":"Not at all (you flatter me).","py":"nǎ lǐ nǎ lǐ."},{"zh":"不必客氣。","en":"Don't mention it.","py":"bù bì kè qì."},{"zh":"你太客氣了。","en":"You're too kind.","py":"nǐ tài kè qì le."},{"zh":"「你的中文說得真好！」「哪裡哪裡，還差得遠。」","en":"\"Your Chinese is great!\" \"Oh, hardly — still a long way to go.\"","py":"「 nǐ de zhōng wén shuō dé zhēn hǎo! 」 「 nǎ lǐ nǎ lǐ, hái chà de yuǎn. 」"},{"zh":"「謝謝你的禮物！」「不必客氣，一點心意。」","en":"\"Thanks for the gift!\" \"Please — just a small token.\"","py":"「 xiè xiè nǐ de lǐ wù! 」 「 bù bì kè qì, yì diǎn xīn yì. 」"}],"cy":"Respond humbly to '你中文說得真好！'"}],"14":[{"id":"g14-1","t":"Weather + change 了","e":"天氣變冷了 it's gotten cold; 下雨了 it's started raining.","tgt":["了"],"alt":["嗎","的","得"],"s":[{"zh":"天氣變冷了。","en":"The weather has gotten cold.","py":"tiān qì biàn lěng le."},{"zh":"下雨了！","en":"It's (started) raining!","py":"xià yǔ le!"},{"zh":"雨停了。","en":"The rain stopped.","py":"yǔ tíng le."},{"zh":"下了一個星期的雨，今天天氣變好了。","en":"After a week of rain, the weather's finally turned nice.","py":"xià le yí gè xīng qī de yǔ, jīn tiān tiān qì biàn hǎo le."},{"zh":"颱風來了，外面的風真大。","en":"The typhoon's here — the wind outside is fierce.","py":"tái fēng lái le, wài miàn de fēng zhēn dà."}],"cy":"Describe today's weather change with …了."},{"id":"g14-2","t":"只 — only","e":"只 before the verb: 台北只有冬天冷.","tgt":["只"],"alt":["就","都","才"],"s":[{"zh":"只有一個。","en":"There's only one.","py":"zhǐ yǒu yí gè."},{"zh":"台北只有冬天冷。","en":"Taipei is only cold in winter.","py":"tái běi zhǐ yǒu dōng tiān lěng."},{"zh":"只要十分鐘。","en":"It only takes ten minutes.","py":"zhǐ yào shí fēn zhōng."},{"zh":"我只去過臺北和臺南，別的地方都還沒去過。","en":"I've only been to Taipei and Tainan — nowhere else yet.","py":"wǒ zhǐ qù guò tái běi hé tái nán, bié de dì fāng dōu hái méi qù guò."},{"zh":"天氣太熱，我只想在家看電視。","en":"Too hot out — I just want to stay in and watch TV.","py":"tiān qì tài rè, wǒ zhǐ xiǎng zài jiā kàn diàn shì."}],"cy":"Say what you only like about one season with 只."},{"id":"g14-3","t":"更 — even more","e":"更 + adjective raises the degree: 今天比昨天更冷.","tgt":["更"],"alt":["最","很","太"],"s":[{"zh":"今天比昨天更冷。","en":"Today is even colder than yesterday.","py":"jīn tiān bǐ zuó tiān gèng lěng."},{"zh":"台北比高雄更濕。","en":"Taipei is even more humid than Kaohsiung.","py":"tái běi bǐ gāo xióng gèng shī."},{"zh":"颱風天更可怕。","en":"Typhoon days are even scarier.","py":"tái fēng tiān gèng kě pà."},{"zh":"聽說明天會更冷，你要多穿衣服。","en":"They say tomorrow's even colder — wear more layers.","py":"tīng shuō míng tiān huì gèng lěng, nǐ yào duō chuān yī fú."},{"zh":"我喜歡春天，可是更喜歡秋天。","en":"I like spring, but autumn even more.","py":"wǒ xǐ huān chūn tiān, kě shì gèng xǐ huān qiū tiān."}],"cy":"Escalate a comparison with 比…更…"},{"id":"g14-4","t":"要…了 / 快…了 — about to","e":"Imminent events: 要下雨了; 快新年了.","tgt":["要","快","了"],"alt":["就","剛"],"s":[{"zh":"要下雨了。","en":"It's about to rain.","py":"yào xià yǔ le."},{"zh":"颱風要來了。","en":"The typhoon is coming.","py":"tái fēng yào lái le."},{"zh":"快新年了。","en":"New Year is almost here.","py":"kuài xīn nián le."},{"zh":"快到了。","en":"Almost there.","py":"kuài dào le."},{"zh":"快下雨了，我們快回家吧。","en":"It's about to rain — let's hurry home.","py":"kuài xià yǔ le, wǒ men kuài huí jiā ba."},{"zh":"十二月底玉山要下雪了，我們去看看吧。","en":"Yushan will get snow by late December — let's go see it.","py":"shí èr yuè dǐ yù shān yào xià xuě le, wǒ men qù kàn kàn ba."}],"cy":"Warn a friend /* ============ FSRS-5 ============ */
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5, FACTOR=19/81, DAY=86400000, MIN=60000;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const retrievability=(t,s)=>Math.pow(1+FACTOR*t/s,DECAY);
function nextIntervalDays(s){const r=S.settings.retention;return clamp(Math.round(s/FACTOR*(Math.pow(r,1/DECAY)-1)),1,365);}
const initS=g=>W[g-1];
const initD=g=>clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
function updD(d,g){let nd=d-W[6]*(g-3)*((10-d)/9);nd=W[7]*initD(4)+(1-W[7])*nd;return clamp(nd,1,10);}
function stabRecall(s,d,r,g){const hard=g===2?W[15]:1, easy=g===4?W[16]:1;return s*(Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp(W[10]*(1-r))-1)*hard*easy+1);}
function stabForget(s,d,r){return Math.min(s, W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp(W[14]*(1-r)));}
function stabShort(s,g){return s*Math.exp(W[17]*(g-3+W[18]));}
function fuzz(days){if(days<3)return days;const f=days*0.05;return Math.round(days+(Math.random()*2-1)*f);}
// early-drill: force writing cards back on day 1, 2, 3 before FSRS takes over
function capEarly(c,cid,days){
  if(!S.settings.earlyDrill||modeOf(cid)!=='prod')return days;
  const d=(c&&c.days)||0;
  if(d===0)return Math.min(days,1);
  if(d===1)return Math.min(days,2);
  if(d===2)return Math.min(days,3);
  return days;
}
function previewIv(c,cid,g){
  const now=Date.now();
  const fmt=d=>d+'d';
  if(!c||c.st===undefined){
    if(g===1)return'1m'; if(g===2)return'5m'; if(g===3)return'10m';
    return fmt(capEarly(c,cid,nextIntervalDays(initS(4))));
  }
  if(c.st==='learn'||c.st==='relearn'){
    if(g===1)return'1m'; if(g===2)return'5m';
    return fmt(capEarly(c,cid,Math.max(1,nextIntervalDays(stabShort(c.S,g)))));
  }
  const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S);
  if(g===1)return'5m';
  return fmt(capEarly(c,cid,nextIntervalDays(stabRecall(c.S,c.D,r,g))));
}
function wordStartedBefore(wid){return MODES.some(m=>{const c=S.cards[cardId(wid,m)];return c&&c.st!==undefined;});}
function rate(cid,g){
  const now=Date.now(); let c=S.cards[cid];
  const today=dkey(new Date());
  S.log[today]=S.log[today]||{rev:0,new:0};
  const schedule=(days)=>{days=capEarly(c,cid,days);c.due=now+fuzz(days)*DAY;c.days=(c.days||0)+1;};
  if(!c||c.st===undefined){
    const wid=cid.split(':')[0];
    if(!wordStartedBefore(wid)){S.intro[today]=(S.intro[today]||0)+1;if(S.pick)S.pick=S.pick.filter(x=>x!==wid);}
    c={st:'learn',S:initS(g),D:initD(g),due:0,last:now,reps:1,lapses:0,days:0};
    S.cards[cid]=c;
    S.log[today].new++;
    if(g===1)c.due=now+1*MIN; else if(g===2)c.due=now+5*MIN; else if(g===3)c.due=now+10*MIN;
    else {c.st='rev'; schedule(nextIntervalDays(c.S));}
  } else if(c.st==='learn'||c.st==='relearn'){
    S.log[today].rev++;
    c.reps++;c.last=now;c.S=stabShort(c.S,g);
    if(g===1)c.due=now+1*MIN; else if(g===2)c.due=now+5*MIN;
    else {c.st='rev'; schedule(Math.max(1,nextIntervalDays(c.S)));}
  } else {
    S.log[today].rev++;
    const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S);
    c.D=updD(c.D,g); c.reps++; c.last=now;
    if(g===1){c.lapses++;c.S=stabForget(c.S,c.D,r);c.st='relearn';c.due=now+5*MIN;}
    else {c.S=stabRecall(c.S,c.D,r,g);schedule(nextIntervalDays(c.S));}
  }
  // mastery timestamps for the Brain view
  if(c.st==='rev'&&c.S>=MASTER_S){if(!c.mastAt)c.mastAt=now;}
  else if(c.mastAt){delete c.mastAt;}
  save();
}

function untrackWord(wid){MODES.forEach(m=>{delete S.cards[cardId(wid,m)];});save();}
function markKnown(wid){ // "I already know this" — skip learning, verify in ~3 weeks
  MODES.forEach(m=>{
    if(!S.settings.modes[m])return;
    const k=cardId(wid,m), c=S.cards[k];

}
function markMastered(wid){ // "I've mastered this" — straight onto the shelf, resurface in ~3 months, NO paper reps
  MODES.forEach(m=>{
    if(!S.settings.modes[m])return;
    S.cards[cardId(wid,m)]={st:'rev',S:90,D:3,due:Date.now()+fuzz(90)*DAY,last:Date.now(),reps:1,lapses:0,days:99,known:1,mastAt:Date.now()};
  });

}
function isKnown(wid){return MODES.some(m=>(S.cards[cardId(wid,m)]||{}).known);}
function wordStatus(wid){
  let states=MODES.map(m=>S.cards[cardId(wid,m)]).filter(Boolean);
  if(!states.length)return null;
  const real=states.filter(c=>c.st!==undefined);
  if(!real.length)return{k:'new',t:'queued'};
  if(real.some(c=>c.due<=Date.now()))return{k:'due',t:'due'};
  if(real.length===states.length&&Math.min(...real.map(c=>c.S||0))>=21)return{k:'mat',t:'solid'};
  return{k:'ok',t:'learning'};
}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ============ QUEUE ============ */
function buildQueue(){
  const now=Date.now(), today=dkey(new Date());
  const introToday=S.intro[today]||0;
  const learn=[],rev=[],freshAll=[];
  for(const cid in S.cards){
    const c=S.cards[cid], w=wordOf(cid); if(!w)continue;
    if(c.susp)continue;
    if(!S.settings.includeNames&&isName(w))continue;
    if(!S.settings.modes[modeOf(cid)])continue;
    if(c.st===undefined){freshAll.push(cid);continue;}
    if(c.due<=now){(c.st==='rev'?rev:learn).push(cid);}
  }
  learn.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  rev.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  const mOrd={rec:0,prod:1};
  const pickIdx=wid=>{const i=(S.pick||[]).indexOf(wid);return i===-1?9999:i;};
  freshAll.sort((a,b)=>{const wa=wordOf(a),wb=wordOf(b);return pickIdx(wa.id)-pickIdx(wb.id)||wa.l-wb.l||parseInt(wa.id.slice(1))-parseInt(wb.id.slice(1))||mOrd[modeOf(a)]-mOrd[modeOf(b)];});
  // newPerDay counts WORDS, not cards: both cards of an introduced word may start the same day
  const allowance=Math.max(0,S.settings.newPerDay-introToday);
  const planned=new Set(); const fresh=[];
  for(const cid of freshAll){
    const wid=cid.split(':')[0];
    if(wordStartedBefore(wid)||planned.has(wid)){fresh.push(cid);continue;}
    if(planned.size<allowance){planned.add(wid);fresh.push(cid);}
  }
  return {learn,rev:rev.slice(0,S.settings.maxRev),fresh};
}
function dueCount(){const q=buildQueue();return q.learn.length+q.rev.length+q.fresh.length;}

const toneMarks={'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4};
function tonePinyin(p){
  return p.split(/(\s+|\/|,|·|\+)/).map(part=>{
    if(/^\s*$|^\/$|^,$|^\+$/.test(part))return part;
    let tone=0;
    for(const ch of part){if(toneMarks[ch]){tone=toneMarks[ch];break;}}
    return '<span class="tone'+tone+'">'+part+'</span>';
  }).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function paperList(){
  // day 1 = full drilling (×writeTarget), day 2 = a few reps (×5), day 3 = one re-exposure (×1).
  // Words marked ✓known or ★mastered never appear here — you already own them.
  const d=new Date();d.setHours(0,0,0,0);const t0=d.getTime();
  const seen=new Set(),out=[];
  for(const cid in S.cards){
    if(!cid.endsWith(':prod'))continue;
    const c=S.cards[cid]; if(!c||c.st===undefined||c.last<t0||c.known)continue;
    const wid=cid.split(':')[0], w=byId[wid];
    if(!w||seen.has(wid))continue;
    const T=S.settings.writeTarget||20;
    if(c.st==='relearn'||c.lapses>0&&c.st!=='rev'){seen.add(wid);out.push({w,tag:'again',reps:10});}
    else if((c.days||0)<=1){seen.add(wid);out.push({w,tag:'day 1',reps:T});}
    else if((c.days||0)===2){seen.add(wid);out.push({w,tag:'day 2',reps:5});}
    else if((c.days||0)===3){seen.add(wid);out.push({w,tag:'day 3',reps:1});}
  }
  const ord={'again':0,'day 1':1,'day 2':2,'day 3':3};
  return out.sort((a,b)=>ord[a.tag]-ord[b.tag]);
}

}

/* ============ AUDIO (speechSynthesis, best zh-TW voice) ============ */
let VOICES=[];
function loadVoices(){try{VOICES=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^(zh|cmn)/i.test(v.lang)||/中文|國語|粵語|普通话/.test(v.name));}catch(e){VOICES=[];}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function rankVoice(v){
  let s=0; const nm=v.name+' '+v.lang;
  if(/國語|臺灣|Taiwan/i.test(nm))s+=50;
  if(/zh[-_]TW/i.test(v.lang))s+=25;
  if(/Google/i.test(v.name))s+=30;
  if(/Mei-?Jia|美佳|Yating|雅婷|Hsiao|曉|Ting-?Ting|婷|Xiaoxiao|Female|女/i.test(nm))s+=40;
  if(/Liang|Aaron|YunJhe|雲哲|Kangkang|Male|男/i.test(nm))s-=30;
  if(/zh[-_]CN|cmn/i.test(v.lang))s+=8;
  if(/粵|Cantonese|HK/i.test(nm))s-=40;
  if(!v.localService)s+=6;
  return s;
}
/* bundled neural audio (female standard Mandarin) with speech-synthesis fallback */
const AUDIO_MISS={};
let curAudio=null;
function audioKey(t){t=String(t).split('（')[0];const h=t.replace(/[^㐀-鿿]/g,'');return h||t.replace(/[^A-Za-z0-9]/g,'');}
function hasTwVoice(){if(!VOICES.length)loadVoices();return VOICES.some(v=>/zh[-_]TW/i.test(v.lang)||/國語|臺灣|Taiwan|Mei-?Jia/i.test(v.name));}
let APACK=null,APACKP=null,AIDX=null,AURL={};
function loadPack(){
  if(APACK)return Promise.resolve(true);
  if(APACKP)return APACKP;
  APACKP=Promise.all([
    fetch('assets/audio-index.json').then(r=>{if(!r.ok)throw 0;return r.json()}),
    fetch('assets/audio.pack').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
  ]).then(([idx,buf])=>{AIDX=idx;APACK=buf;return true;}).catch(()=>false);
  return APACKP;
}
function playBundled(text,onFail){
  const k=audioKey(text);
  if(!k||AUDIO_MISS[k]){onFail();return;}
  loadPack().then(ok=>{
    if(!ok||!AIDX[k]){AUDIO_MISS[k]=1;onFail();return;}
    try{
      if(!AURL[k]){
        const[o,l]=AIDX[k];
        AURL[k]=URL.createObjectURL(new Blob([APACK.slice(o,o+l)],{type:'audio/mpeg'}));
      }
      if(curAudio){try{curAudio.pause();}catch(e){}}
      const a=new Audio(AURL[k]);
      a.playbackRate=Math.min(1.3,audioSpeed()/0.9); // clips were recorded at 0.9× — speed setting scales them
      curAudio=a;
      a.onerror=()=>{AUDIO_MISS[k]=1;onFail();};
      a.play().catch(()=>{AUDIO_MISS[k]=1;onFail();});
    }catch(e){onFail();}
  });
}
function playAudio(text){
  const mode=S.settings.audioSrc||'auto';
  // Taiwanese-accented system voices (Google 國語（臺灣）, Mei-Jia) beat the bundled
  // mainland-accented recording — prefer them whenever one exists.
  if(mode==='bundled'){playBundled(text,()=>speakText(text));return;}
  if(mode==='system'){speakText(text);return;}
  if(hasTwVoice()){speakText(text);}else{playBundled(text,()=>speakText(text));}
}
function pickVoice(){
  if(!VOICES.length)loadVoices();
  if(S.settings.voiceName){const m=VOICES.find(v=>v.name===S.settings.voiceName);if(m)return m;}
  return VOICES.slice().sort((a,b)=>rankVoice(b)-rankVoice(a))[0]||null;
}
function audioSpeed(){return S.settings.audioSpeed||0.9;}
function speakText(text){
  if(!window.speechSynthesis||!text)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;}else u.lang='zh-TW';
    u.rate=audioSpeed();
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakWord(wid){
  const w=byId[wid]; if(!w)return;
  playAudio(w.t);
}

function compLines(word){ // compact per-char lines for review reveals
