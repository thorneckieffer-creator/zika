e how/when/where/who of a past event.","ov":"Competition — 是…的 vs 了 (the finished-action 了, B1 L13). Both point at the past; they answer different questions. 你昨天去哪裡了？ — did it happen/what happened? The event itself is the news. 你昨天是怎麼去的？ — we both know you went; you're filling in the how/when/where/who. Minimal pair: 我坐公車去學校了 = I went to school by bus (reporting the trip). 我是坐公車去學校的 = it was by bus that I went (the going is old news). Test: if both of you already know the thing happened and you're only settling a detail, it's 是…的; if the event is the news, it's 了. They don't combine — ✗我是坐公車去的了。 The 了 family runs B1 L13 → B1 L14 → B2 L3; this is the one pattern that competes with it rather than joining it.","tw":"Hard pinyin: 公車 gōngchē — the Taiwan word for a city bus; mainland 公交車 gōngjiāochē, in Taiwan you also hear 搭公車; 學費 xuéfèi — tuition; 替 tì — on behalf of/for someone; 付 fù — to pay; 週末 zhōumò — Taiwan writes 週末, mainland writes 周末, same reading. In speech, 是 is often dropped (你哪裡買的？), 的 never is. Trad/simp: 費 → 费, 麼 → 么, 裡 → 里, 車 → 车","src":"B1L12"},{"id":"n12-3","t":"以後 / 以前 · time word and \"after / before X\"","e":"以後/以前 have two jobs: as a standalone time word meaning 'in the future/in the past', or attached after a time or event to mean 'after/before that'. Word order is reversed from English — the reference point comes first, then 以後/以前.","pat":"Two jobs. (a) Standalone time word = \"in the future / in the past\", placed before or after the subject. (b) Attached to a time or event = \"after / before that\": Time + 以後, VP + 以後. Note the word order is the reverse of English: the thing you're measuring from comes first, then 以後.","tgt":["以後","以前"],"alt":["後來","然後","之前"],"s":[{"zh":"以前，我不喜歡吃芒果。","en":"In the past, I didn't like eating mango. (time word)","py":"yǐ qián, wǒ bù xǐ huān chī máng guǒ."},{"zh":"以後她還想跟他們一起住嗎？","en":"In the future, will she still want to live with them?","py":"yǐ hòu tā hái xiǎng gēn tā men yì qǐ zhù ma?"},{"zh":"來臺灣以後，我喜歡吃芒果了。","en":"After coming to Taiwan, I've come to like eating mango.","py":"lái tái wān yǐ hòu, wǒ xǐ huān chī máng guǒ le."},{"zh":"九點以後，我開始上班。","en":"After nine o'clock, I start work.","py":"jiǔ diǎn yǐ hòu, wǒ kāi shǐ shàng bān."},{"zh":"他們六點半以後吃晚飯。","en":"They eat dinner after six thirty.","py":"tā men liù diǎn bàn yǐ hòu chī wǎn fàn."}],"cy":"Write your own sentence using 以後 or 以前, both as a standalone time word and attached after an event.","ov":"","tw":"Hard pinyin: 芒果 mángguǒ — mango; 臺灣 Táiwān — 臺 is the formal/official form used on documents here, 台灣 is what everyone actually writes; mainland 台湾. Trad/simp: 後 → 后, 還 → 还, 點 → 点, 開 → 开","src":"B1L12"},{"id":"n12-4","t":"好 / 難 + V · easy to / hard to","e":"好/難 + V forms a new state verb meaning 'good/easy to V' or 'hard to V', which then takes 很 and negates with 不. With sensory verbs, 好 means 'good to' (好吃, 好看); with action verbs, 好 means 'easy to' (好做, 好找).","pat":"好/難 + V makes a new state verb (Vs), so it takes 很 and is negated with 不: 不好找, 不難學. With sensory verbs (吃喝看聽) 好 = \"good to\": 好吃 tasty, 好看 good-looking. With action verbs 好 = \"easy to\": 好做 easy to make, 好找 easy to find.","tgt":["好+V","難+V"],"alt":["V起來","容易","難以"],"s":[{"zh":"這種衣服，我覺得很好看。","en":"I think these clothes look good.","py":"zhè zhǒng yī fú, wǒ jué de hěn hǎo kàn."},{"zh":"小籠包很好吃，可是很難做。","en":"Xiaolongbao is tasty, but hard to make.","py":"xiǎo lóng bāo hěn hǎo chī, kě shì hěn nán zuò."},{"zh":"水煮蛋很好做，小籠包很難做。","en":"A boiled egg is easy to make, xiaolongbao is hard to make.","py":"shuǐ zhǔ dàn hěn hǎo zuò, xiǎo lóng bāo hěn nán zuò."},{"zh":"好學／難學　好寫／難寫　好做／難做　好找／難找　好唱／難唱","en":"easy/hard to learn, write, make, find, sing (teacher's slide list)","py":"hào xué ／ nán xué hǎo xiě ／ nán xiě hǎo zuò ／ nán zuò hǎo zhǎo ／ nán zhǎo hǎo chàng ／ nán chàng"}],"cy":"Write your own sentence using 好+V or 難+V to say something is easy or hard to do.","ov":"Competition — 好／難 + V vs V起來 + Vs (B2 L1 point 2). Both turn a verb into a verdict about the thing, and in most sentences either sounds fine: 中文字好學嗎？／中文字學起來怎麼樣？ 這支筆好寫。／這支筆寫起來很不錯。 小籠包很難做。／小籠包做起來很麻煩。 What actually differs: 好／難+V IS the verdict — a finished Vs with only two settings, easy or hard, ready to take 很 and 不 (很好找、不難學). V起來 leaves the verdict slot empty — it only names the way you're judging, and you supply whatever Vs you want after it: 看起來很美、吃起來非常甜、穿起來很不舒服. So 好吃 is locked at \"good\", while 吃起來 can be followed by 甜、苦、鹹 — anything. Test: 這支筆好寫。 is complete; ✗這支筆寫起來。 is not. Don't stack them: ✗好吃起來. Both patterns take one-syllable verbs only (學、寫、做、找、吃、看).","tw":"Hard pinyin: 種 zhǒng — measure word, kind/type of; 小籠包 xiǎolóngbāo — soup dumplings, the Taipei specialty, simplified 小笼包; 水煮蛋 shuǐzhǔdàn — a boiled egg; 煮 zhǔ — to boil/cook. Trad/simp: 難 → 难, 學 → 学, 寫 → 写, 籠 → 笼","src":"B1L12"}],"13":[{"id":"n13-1","t":"一…，就… · as soon as","e":"一 + VP1，就 + VP2 says the second thing happens immediately or automatically right after the first. Subjects can be the same or different across the two clauses.","pat":"一 + VP₁，就 + VP₂. The second thing happens immediately or automatically after the first. Subjects can be the same or different (爸爸一到家，我們就…). Compare with V了…就 in L15, which is looser.","tgt":["一...就"],"alt":["V了...就","先...再","才"],"s":[{"zh":"我一有問題，就打電話給房東。","en":"As soon as I have a problem, I call the landlord.","py":"wǒ yī yǒu wèn tí, jiù dǎ diàn huà gěi fáng dōng."},{"zh":"爸爸一到家，我們就吃飯。","en":"As soon as Dad gets home, we eat.","py":"bà bà yī dào jiā, wǒ men jiù chī fàn."},{"zh":"他一到家，就睡覺。","en":"As soon as he gets home, he goes to sleep.","py":"tā yī dào jiā, jiù shuì jiào."},{"zh":"他們一到餐廳，就看菜單。","en":"As soon as they get to the restaurant, they look at the menu.","py":"tā men yī dào cān tīng, jiù kàn cài dān."}],"cy":"Write your own sentence using 一…，就… to describe something that happens immediately after another event.","ov":"Compare with V了…就 in L15, which is looser (merely sequential rather than immediate).","tw":"Hard pinyin: 一 yī — the base reading of this 一…就… 一; it still takes normal sandhi in speech: 一有 yì yǒu, 一到 yí dào; 房東 fángdōng — landlord; 菜單 càidān — menu. Trad/simp: 問題 → 问题, 電話 → 电话, 東 → 东, 覺 → 觉, 廳 → 厅, 單 → 单","src":"B1L13"},{"id":"n13-2","t":"V 了 / 沒 V · completed action","e":"S + V + 了 + O marks a single finished action. Negative is 沒 + V with no 了 (never 沒喝了). Two equivalent question forms exist: S+V(+O)+了嗎？ or S+V+了(+O)+沒有？ 了 is incompatible with habitual 常.","pat":"S + V + 了 + O for a finished action. Negative is 沒 + V with no 了 (沒喝, never 沒喝了). Two equivalent question forms: S + V (+O) + 了嗎？ or S + V + 了 (+O) + 沒有？","tgt":["V了"],"alt":["是...的","沒","不"],"s":[{"zh":"他吃了三個西瓜。","en":"He ate three watermelons.","py":"tā chī le sān gè xī guā."},{"zh":"小姐買了蘋果。","en":"The young woman bought apples.","py":"xiǎo jiě mǎi le píng guǒ."},{"zh":"我沒喝那杯咖啡。","en":"I didn't drink that coffee.","py":"wǒ méi hē nà bēi kā fēi."},{"zh":"我要買水果。→ 我買了水果。→ 我常買水果。→ ✗我常買了水果。","en":"I want to buy fruit (future) → I bought fruit (completed) → I often buy fruit (habitual) → ✗ungrammatical mixing of 了 with habitual 常.","py":"wǒ yào mǎi shuǐ guǒ. → wǒ mǎi le shuǐ guǒ. → wǒ cháng mǎi shuǐ guǒ. → ✗ wǒ cháng mǎi le shuǐ guǒ."},{"zh":"她買東西了嗎？= 她買了東西沒有？","en":"Did she buy things? (two equivalent question forms)","py":"tā mǎi dōng xī le ma? = tā mǎi le dōng xī méi yǒu?"},{"zh":"你今天喝咖啡了嗎？= 你今天喝了咖啡沒有？","en":"Did you drink coffee today? (two equivalent question forms)","py":"nǐ jīn tiān hē kā fēi le ma? = nǐ jīn tiān hē le kā fēi méi yǒu?"},{"zh":"明天我有事，不去上課。","en":"I have something on tomorrow, I won't go to class. (不 = intention)","py":"míng tiān wǒ yǒu shì, bù qù shàng kè."},{"zh":"他肚子很餓，因為他沒吃飯。","en":"He's very hungry because he didn't eat. (沒 = event didn't happen)","py":"tā dǔ zi hěn è, yīn wèi tā méi chī fàn."},{"zh":"他說中文不難。(✗他說中文沒難)","en":"He says Chinese isn't hard. (state verb takes 不, not 沒)","py":"tā shuō zhōng wén bù nán. ( ✗ tā shuō zhōng wén méi nán )"},{"zh":"他還沒決定放假去哪裡旅行。(✗他不決定...)","en":"He hasn't yet decided where to travel on vacation. (undecided event takes 還沒, not 不)","py":"tā hái méi jué dìng fàng jià qù nǎ lǐ lǚ xíng. ( ✗ tā bù jué dìng . . . )"}],"cy":"Write your own sentence using V了 for a completed action, and one using 沒V to negate it.","ov":"The 了 family — where this one sits (9/8): 咖啡貴了 (B1 L10 point 4) / 我買了水果 (here) / 我住了三年 (B1 L14 point 1) / 我住了三年了 (B1 L14 point 2) / 快下雨了 (B1 L14 point 3) / 我寫作業寫得差不多了 (B2 L3 point 1). Sort any 了 by where it sits: right after the verb = event finished or clock ran that long; end of sentence = situation changed. What's new here vs B1 L10: L10's 了 was end-of-sentence (change, no event); this lesson adds the verb-attached 了 that closes a single event. Everything in B1 L14 and B2 L3 combines these two. Trap: this L13 了 drops under 沒 (沒喝, never ✗沒喝了); the end-of-sentence one negates as 不…了 = \"not anymore\". The one pattern that competes with 了 instead of joining the family: 是…的 (B1 L12 point 2) — 我坐公車去學校了 (trip is the news) vs 我是坐公車去學校的 (bus is the news); they never combine — ✗我是坐公車去的了。","tw":"Hard pinyin: 西瓜 xīguā — watermelon, same word in Taiwan and mainland; 肚子 dùzi — stomach/belly; 決定 juédìng — to decide, negated with 沒 since it's an event; 放假 fàngjià — to have time off/a holiday; 旅行 lǚxíng — to travel. Trad/simp: 沒 → 没, 還 → 还, 飯 → 饭, 買 → 买, 蘋果 → 苹果, 個 → 个, 餓 → 饿, 決定 → 决定, 旅行 (same)","src":"B1L13"},{"id":"n13-3","t":"QW + 都 · all-inclusive","e":"A question word (誰/什麼/哪裡/什麼時候) + 都, or 怎麼 + V + 都, turns the question word into 'any-' (anyone/anything/anywhere/anytime/any way). In negatives, 都 or 也 both work.","pat":"什麼／誰／哪裡／什麼時候 + 都, or 怎麼 + V + 都. The question word stops being a question and means \"anything / anyone / anywhere / anytime / any way\". In negatives 都 or 也 both work (什麼都沒吃 = 什麼也沒吃).","tgt":["QW+都"],"alt":["不/沒+V+QW","也","才"],"s":[{"zh":"誰都喜歡收到生日禮物。(= 每一個人都喜歡)","en":"Everyone likes receiving birthday gifts.","py":"shéi dōu xǐ huān shōu dào shēng rì lǐ wù. ( = měi yí gè rén dōu xǐ huān )"},{"zh":"誰都喜歡漂亮的地方。","en":"Everyone likes pretty places.","py":"shéi dōu xǐ huān piào liàng de dì fāng."},{"zh":"台灣哪裡都有便利商店。","en":"There are convenience stores everywhere in Taiwan.","py":"tái wān nǎ li dōu yǒu biàn lì shāng diàn."},{"zh":"她什麼都想買。","en":"She wants to buy everything.","py":"tā shén me dōu xiǎng mǎi."},{"zh":"我什麼時候都有空。","en":"I'm free any time.","py":"wǒ shén me shí hòu dōu yǒu kòng."},{"zh":"你那麼漂亮，怎麼穿都好看！","en":"You're so pretty, you look good no matter how you dress!","py":"nǐ nà me piào liàng, zěn me chuān dōu hǎo kàn!"},{"zh":"我什麼都沒吃。","en":"I didn't eat anything.","py":"wǒ shén me dōu méi chī."},{"zh":"我哪裡都不想去。","en":"I don't want to go anywhere.","py":"wǒ nǎ li dōu bù xiǎng qù."},{"zh":"我怎麼坐都不舒服。","en":"No matter how I sit, I'm not comfortable.","py":"wǒ zěn me zuò dōu bù shū fú."}],"cy":"Write your own sentence using QW + 都 to say 'any-' something (anyone, anything, anywhere).","ov":"Contrast (L15): 不／沒 + V + QW = \"not much / nothing in particular\", the non-committal cousin of this all-inclusive pattern.","tw":"Hard pinyin: 收到 shōudào — to receive; 禮物 lǐwù — gift, same word Taiwan/mainland (simp. 礼物); 便利商店 biànlì shāngdiàn — Taiwan's standard word for convenience store, often shortened to 超商 chāoshāng; mainland says 便利店 biànlìdiàn; 有空 yǒu kòng — 空 is kòng \"free time\" here, not kōng \"empty\". Trad/simp: 誰 → 谁, 哪裡 → 哪里, 麼 → 么, 時候 → 时候, 禮物 → 礼物, 灣 → 湾, 歡 → 欢","src":"B1L13"},{"id":"n13-4","t":"多 / 少 + V + (一點) + O · more / less than usual","e":"多/少 goes before the verb (unlike English 'eat more'), with optional 一點 to soften. Common in giving advice: 你應該多…、少….","pat":"多/少 goes before the verb (not after, as in English \"eat more\"). 一點 is optional and softens it. Common in advice: 你應該多…、少…。","tgt":["多+V","少+V"],"alt":["V+多","V+少","一點"],"s":[{"zh":"週末我想多睡一點覺，少看一點書。","en":"On the weekend I want to sleep a bit more and read a bit less.","py":"zhōu mò wǒ xiǎng duō shuì yì diǎn jué, shǎo kàn yì diǎn shū."},{"zh":"他最近沒錢，應該少買東西。","en":"He's short on money lately, he should buy less stuff.","py":"tā zuì jìn méi qián, yīng gāi shǎo mǎi dōng xī."},{"zh":"他覺得很冷，他應該多穿(一點)衣服。","en":"He feels cold, he should wear a bit more clothing.","py":"tā jué de hěn lěng, tā yīng gāi duō chuān ( yì diǎn ) yī fú."}],"cy":"Write your own sentence using 多+V or 少+V to give advice.","ov":"","tw":"Trad/simp: 點 → 点, 錢 → 钱, 應該 → 应该","src":"B1L13"},{"id":"n13-5","t":"…，是不是…？ · seeking confirmation","e":"是不是 placed in front of the guess you want confirmed means 'is it that…?' / 'right?' — unlike the neutral question particle 嗎, 是不是 already has an answer in mind.","pat":"是不是 in front of the guess you want confirmed = \"is it that…?\" / \"right?\". Different from 嗎, which is a neutral question; 是不是 already has an answer in mind.","tgt":["是不是"],"alt":["嗎","對不對","好不好"],"s":[{"zh":"你不想跟我出去，是不是不喜歡我？","en":"You don't want to go out with me — is it that you don't like me?","py":"nǐ bù xiǎng gēn wǒ chū qù, shì bú shì bù xǐ huān wǒ?"},{"zh":"她是不是週末去的？","en":"Wasn't it on the weekend that she went?","py":"tā shì bú shì zhōu mò qù de?"}],"cy":"Write your own sentence using 是不是 to seek confirmation of a guess.","ov":"","tw":"","src":"B1L13"},{"id":"n13-6","t":"A 跟 B 一樣 (+ Vs / VP) · the same as","e":"A 跟 B 一樣 says A is the same as B; adding a state verb after 一樣 specifies in what way (一樣高, 一樣好喝). The two negative forms differ: A跟B不一樣 means they differ, while A不跟B一樣 means A matches something else instead.","pat":"A 跟 B 一樣 = A is the same as B. Add a Vs after 一樣 to say in what way: 一樣高, 一樣好喝. Two negatives with different meanings: A 跟 B 不一樣 (they differ) vs A 不跟 B 一樣 (A matches something else, not B).","tgt":["跟...一樣"],"alt":["比...更","沒有...那麼","和"],"s":[{"zh":"爸爸的衣服跟弟弟的一樣。","en":"Dad's clothes are the same as younger brother's.","py":"bà bà de yī fú gēn dì di de yī yàng."},{"zh":"他的手機跟我的一樣。","en":"His phone is the same as mine.","py":"tā de shǒu jī gēn wǒ de yī yàng."},{"zh":"左邊的大樓跟右邊的大樓一樣高。","en":"The building on the left is as tall as the one on the right.","py":"zuǒ biān de dà lóu gēn yòu biān de dà lóu yī yàng gāo."},{"zh":"這種紅茶跟我常喝的紅茶一樣好喝。","en":"This kind of black tea tastes as good as the black tea I usually drink.","py":"zhè zhǒng hóng chá gēn wǒ cháng hē de hóng chá yī yàng hǎo hē."},{"zh":"豬腳麵線跟蛋糕一樣，都是生日的時候吃的東西。","en":"Pig's-feet noodles and cake are alike — both are things eaten on birthdays.","py":"zhū jiǎo miàn xiàn gēn dàn gāo yī yàng, dōu shì shēng rì de shí hòu chī de dōng xī."},{"zh":"星期一跟星期二不一樣熱，星期一比較熱。","en":"Monday and Tuesday aren't equally hot — Monday is hotter. (totally different)","py":"xīng qī yī gēn xīng qī èr bù yí yàng rè, xīng qī yī bǐ jiào rè."},{"zh":"星期一不跟星期二一樣熱，跟星期三一樣熱。","en":"Monday isn't as hot as Tuesday, it's as hot as Wednesday. (matches something else instead)","py":"xīng qī yī bù gēn xīng qī èr yī yàng rè, gēn xīng qī sān yī yàng rè."}],"cy":"Write your own sentence using A跟B一樣(+Vs) to compare two things as equal.","ov":"Where this goes next — the comparison ladder (9/8): 跟…一樣 is rung one, and the rest of Book 1 just changes what hangs on the end: 安同跟月美一樣高 (here, equal) → 安同沒有月美那麼高 (B1 L14 point 5, less) → 安同比月美高 (B1 L14, more) → 安同比月美更高 (B1 L14 point 4, even more) → 安同比月美高一點／多了 (B1 L15 point 5, by how much). The frame never changes; only the tail does. Trap that carries across all of them: never put 很 in front of the Vs in a 比 sentence — ✗安同比月美很高. The degree word goes after the Vs (B1 L15 point 5).","tw":"跟 is the default linker here; mainland speech often uses 和. The teacher's own example, 豬腳麵線 zhūjiǎo miànxiàn, is Taiwan-only pig-trotter thin noodles, the traditional Taiwanese birthday dish eaten to wash away bad luck — no mainland equivalent, where birthday noodles are 長壽麵 chángshòumiàn. Hard pinyin: 手機 shǒujī — mobile phone, everyday word both sides (Taiwan's formal/official term is 行動電話 xíngdòng diànhuà, simp. 移动电话); 大樓 dàlóu — multi-storey building; 紅茶 hóngchá — black tea; 蛋糕 dàngāo — cake. Trad/simp: 樣 → 样, 邊 → 边, 樓 → 楼, 紅 → 红, 熱 → 热, 較 → 较, 機 → 机, 種 → 种, 這 → 这, 豬腳麵線 → 猪脚面线, 長壽麵 → 长寿面","src":"B1L13"}],"14":[{"id":"n14-1","t":"V 了 + time duration · how long something lasted","e":"The verb takes 了 and a duration expression right after it to say how long an action lasted; if there's an object, either repeat the verb or put the duration before the object with 的.","pat":"V 了 + duration (units: 分鐘, 鐘頭/小時, 天, 個星期, 個月, 年)","tgt":["了"],"alt":["過","在","著"],"s":[{"zh":"昨天外面下了一天的雨。","en":"It rained outside for a whole day yesterday.","py":"zuó tiān wài miàn xià le yī tiān de yǔ."},{"zh":"週末我們看電影看了三個鐘頭。","en":"We watched a movie for three hours over the weekend.","py":"zhōu mò wǒ men kàn diàn yǐng kàn le sān gè zhōng tóu."},{"zh":"他們去紐約玩了10天。","en":"They went to New York and stayed for 10 days.","py":"tā men qù niǔ yuē wán le 1 0 tiān."},{"zh":"他在美國住了10年。","en":"He lived in America for 10 years.","py":"tā zài měi guó zhù le 1 0 nián."},{"zh":"他在臺灣住了3年9個月。","en":"He lived in Taiwan for 3 years and 9 months.","py":"tā zài tái wān zhù le 3 nián 9 gè yuè."}],"cy":"Write a sentence saying how long you did something, using V 了 + duration.","ov":"First stop in the 了 family this lesson — see point 2's callout for the full spiral: B1 L10 (situation-change 了) → B1 L13 (finished-event 了) → this point (duration, action over) → point 2 (double 了, still going) → point 3 (快…了, about to happen) → B2 L3 (V得差不多了, nearly done).","tw":"Trad/simp: 鐘頭 → 钟头, 紐約 → 纽约, 國 → 国. Taiwan note: 鐘頭 zhōngtóu (colloquial 'hour') and 小時 are both common in Taiwan; mainland prefers 小時 xiǎoshí.","src":"B1L14"},{"id":"n14-2","t":"V 了 + duration + 了 · still going on","e":"Adding a second, sentence-final 了 after V了+duration turns a closed-off past stretch of time into one that continues up to right now — the single most testable point in the lesson.","pat":"S + (VO) + V 了 + duration + 了 — one 了 = closed period in the past; two 了 = the stretch reaches today","tgt":["了"],"alt":["過","已經","著"],"s":[{"zh":"我學中文學了半年了。","en":"I've been studying Chinese for half a year (and still am).","py":"wǒ xué zhōng wén xué le bàn nián le."},{"zh":"他旅行了一個星期了。","en":"He's been traveling for a week (and still is).","py":"tā lǚ xíng le yí gè xīng qī le."},{"zh":"我在台北住了三年。","en":"I lived in Taipei for three years. (implies: not anymore)","py":"wǒ zài tái běi zhù le sān nián."},{"zh":"我(已經)在台北住了三年了。","en":"I've (already) lived in Taipei for three years (and still do).","py":"wǒ ( yǐ jīng ) zài tái běi zhù le sān nián le."},{"zh":"他們學唱歌學了多久了？","en":"How long have they been learning to sing (and still are)?","py":"tā men xué chàng gē xué le duō jiǔ le?"}],"cy":"Write a sentence with V 了 + duration + 了 describing something you've been doing that's still ongoing.","ov":"The 了 family — three of its jobs land in this one lesson (9/8): 咖啡貴了 (B1 L10, situation changed) → 我買了水果 (B1 L13, one event finished) → 我住了三年 (point 1 here, how long it ran, and it's over) → 我住了三年了 (this point, and I still live there) → 快下雨了 (point 3 here, about to change) → 我寫得差不多了 (B2 L3, nearly done). Sorting test: where does 了 sit? On the verb = finished/duration; sentence-final = situation changed; one of each = a stretch reaching today. What changed from B1 L13: that 了 just closes an event; here it gets a duration bolted on, and the sentence-final 了 drags that stretch up to the present. 住了三年 (moved out) vs 住了三年了 (still there) is the whole exam question.","tw":"Trad/simp: 學 → 学, 已經 → 已经. Taiwan note: 星期 is read xīngqí in Taiwan (2nd-tone qí) vs mainland xīngqī.","src":"B1L14"},{"id":"n14-3","t":"快 / 要 / 快要 … 了 · about to","e":"快, 要, and 快要 are interchangeable markers placed before a verb phrase, with sentence-final 了, to say something is about to happen — this 了 signals imminent change, not a completed action.","pat":"快／要／快要 + VP + 了 = something is about to happen (all three interchangeable)","tgt":["快","要","快要"],"alt":["已經","在","過"],"s":[{"zh":"快中午了！","en":"It's almost noon!","py":"kuài zhōng wǔ le!"},{"zh":"快可以吃飯了！","en":"We can eat soon!","py":"kuài kě yǐ chī fàn le!"},{"zh":"外面的風很大，大概快下雨了。","en":"The wind outside is strong, it's probably about to rain.","py":"wài miàn de fēng hěn dà, dà gài kuài xià yǔ le."},{"zh":"快下雨了。","en":"It's about to rain.","py":"kuài xià yǔ le."},{"zh":"要下雨了。","en":"It's going to rain.","py":"yào xià yǔ le."},{"zh":"快要下雨了。","en":"It's about to rain.","py":"kuài yào xià yǔ le."},{"zh":"因為那個家的人快回來了！","en":"Because that family's people are about to come back!","py":"yīn wèi nà ge jiā de rén kuài huí lái le!"},{"zh":"我快到了！","en":"I'm almost there!","py":"wǒ kuài dào le!"}],"cy":"Write a sentence using 快/要/快要…了 to say something is about to happen.","ov":"Fourth appearance of 了 in this lesson's family (see point 2) — this is the sentence-final 'change is coming' 了, distinct from the completed-action/duration 了 in points 1–2.","tw":"Trad/simp: 風 → 风, 來 → 来.","src":"B1L14"},{"id":"n14-4","t":"A 比 B 更 + Vs · even more","e":"更 inserted into a 比 comparison says A is even more Vs than B, presupposing that B is already quite Vs; without 更, 比 just states A > B.","pat":"A 比 B 更 Vs = even more Vs (presupposes B is already Vs)","tgt":["更"],"alt":["很","比較","非常"],"s":[{"zh":"妹妹的房間很大，可是我的房間比妹妹的更大。","en":"My sister's room is big, but mine is even bigger than hers.","py":"mèi mèi de fáng jiān hěn dà, kě shì wǒ de fáng jiān bǐ mèi mèi de gèng dà."},{"zh":"他很高，他姐姐比他更高。","en":"He's tall, but his older sister is even taller than him.","py":"tā hěn gāo, tā jiě jiě bǐ tā gèng gāo."},{"zh":"上次的颱風很可怕。這次的颱風比上次的更可怕。","en":"Last time's typhoon was scary. This one is even scarier than last time's.","py":"shàng cì de tái fēng hěn kě pà. zhè cì de tái fēng bǐ shàng cì de gèng kě pà."}],"cy":"Write a sentence using A 比 B 更 Vs to say A is even more [adjective] than B.","ov":"Fourth rung of the comparison ladder (see point 5's callout): 跟…一樣 (B1 L13, equal) → 沒有…這麼 (point 5 here, less) → 比 (more) → 比…更 (this point, even more) → 比…得多／多了 (B1 L15, by how much).","tw":"Trad/simp: 颱風 → 台风. Taiwan note: 颱風 is the everyday word for typhoon in Taiwan daily life; written 台风 on the mainland.","src":"B1L14"},{"id":"n14-5","t":"Comparing actions: VOV 得 比 … / 沒有 … 這麼","e":"To compare how well two people do an action, repeat the verb and hang the comparison on 得 (VOV得比). To say A isn't as Vs as B, use 沒有 (這麼／那麼) — the negative of 比. These fill out the four-way comparison ladder: 跟…一樣 (equal) / 沒有 (less) / 比 (more) / 比…更 (even more).","pat":"(a) S₁ VOV 得比 S₂ Vs. (b) A 沒有 B (這麼／那麼) Vs = A is not as Vs as B","tgt":["沒有","得"],"alt":["不比","很","一樣"],"s":[{"zh":"他吃飯吃得比我多。","en":"He eats more than I do.","py":"tā chī fàn chī dé bǐ wǒ duō."},{"zh":"我寫中文字寫得比他好。","en":"I write Chinese characters better than he does.","py":"wǒ xiě zhōng wén zì xiě dé bǐ tā hǎo."},{"zh":"張小姐有沒有陳小姐這麼／那麼高？","en":"Is Miss Zhang as tall as Miss Chen?","py":"zhāng xiǎo jiě yǒu méi yǒu chén xiǎo jiě zhè me ／ nà me gāo?"},{"zh":"張小姐沒有陳小姐這麼高。","en":"Miss Zhang is not as tall as Miss Chen.","py":"zhāng xiǎo jiě méi yǒu chén xiǎo jiě zhè me gāo."},{"zh":"張小姐沒陳小姐高。","en":"Miss Zhang is not as tall as Miss Chen. (short form)","py":"zhāng xiǎo jiě méi chén xiǎo jiě gāo."},{"zh":"騎機車沒有開車舒服。","en":"Riding a scooter is not as comfortable as driving.","py":"qí jī chē méi yǒu kāi chē shū fú."},{"zh":"騎機車跟開車一樣舒服。","en":"Riding a scooter is just as comfortable as driving. (equal, contrast)","py":"qí jī chē gēn kāi chē yī yàng shū fú."},{"zh":"騎機車比開車舒服。","en":"Riding a scooter is more comfortable than driving. (more)","py":"qí jī chē bǐ kāi chē shū fú."},{"zh":"騎機車比較舒服。","en":"Riding a scooter is more comfortable. (shortcut, B side dropped)","py":"qí jī chē bǐ jiào shū fú."},{"zh":"坐飛機比開車更舒服。","en":"Taking a plane is even more comfortable than driving. (even more)","py":"zuò fēi jī bǐ kāi chē gèng shū fú."}],"cy":"Write two sentences: one with VOV得比 comparing how well someone does something, one with 沒有…這麼 saying A isn't as Vs as B.","ov":"Completes the B1 L14 comparison ladder alongside point 4: 跟…一樣 (B1 L13, equal) → 沒有…這麼 (this point, less) → 比 (more) → 比…更 (point 4, even more). B1 L15 point 5 adds the final rung: 比…一點／很多／得多／多了 (by how much).","tw":"Trad/simp: 沒 → 没, 騎機車 → 骑机车. Taiwan note: 機車 jīchē is the Taiwan word for scooter/motorbike (mainland says 摩托車 mótuōchē; as slang 機車 also means 'annoying'). 張/陳 simplify to 张/陈 — 陳 is the most common surname in Taiwan.","src":"B1L14"}],"15":[{"id":"n15-1","t":"不 / 沒 + V + QW · non-committal","e":"Putting a question word (什麼/多少/哪裡/幾個) after a negated verb turns it into a vague, deflecting answer — 'not much / not anywhere in particular' — rather than a real question.","pat":"不／沒 + V + 什麼／多少／哪裡／幾個","tgt":["沒","不"],"alt":["都","也","什麼都"],"s":[{"zh":"大家都說他的工作很好，但是他真的沒什麼錢。","en":"Everyone says his job is great, but he really doesn't have much money.","py":"dà jiā dōu shuō tā de gōng zuò hěn hǎo, dàn shì tā zhēn de méi shén me qián."},{"zh":"上個週末我很不舒服，所以沒吃多少東西。","en":"I felt unwell last weekend, so I didn't eat much.","py":"shàng gè zhōu mò wǒ hěn bù shū fú, suǒ yǐ méi chī duō shǎo dōng xī."},{"zh":"妳有多少錢？我沒有多少錢。","en":"How much money do you have? Not much.","py":"nǐ yǒu duō shǎo qián? wǒ méi yǒu duō shǎo qián."},{"zh":"你們說了什麼？我們沒說什麼。","en":"What did you all say? Not much.","py":"nǐ men shuō le shén me? wǒ men méi shuō shén me."},{"zh":"你在看什麼？我沒看什麼。","en":"What are you looking at? Nothing much.","py":"nǐ zài kàn shén me? wǒ méi kàn shén me."},{"zh":"我不想去哪裡。","en":"I don't particularly want to go anywhere.","py":"wǒ bù xiǎng qù nǎ lǐ."},{"zh":"我什麼都喜歡吃。","en":"I like eating everything. (all-inclusive, contrast)","py":"wǒ shén me dōu xǐ huān chī."}],"cy":"Write a sentence using 不/沒 + V + QW to give a vague, non-committal answer.","ov":"Competes with B1 L13's QW + 都 (all-inclusive): 我什麼都沒吃 (ate nothing at all) vs 我沒吃什麼 (didn't eat much, vague deflection). Choosing wrong changes the meaning from total exclusion to a soft dodge.","tw":"Trad/simp: 錢 → 钱, 麼 → 么, 沒 → 没, 幾 → 几.","src":"B1L15"},{"id":"n15-2","t":"S 把 O V 了 · disposal","e":"把 pulls the object in front of the verb to focus on what happened to it (it got eaten, sold, drunk); the object must be definite, and the verb needs something after it — here, 了.","pat":"S + 把 + O + V + 了","tgt":["把"],"alt":["被","一","的"],"s":[{"zh":"誰把我買的咖啡喝了？","en":"Who drank the coffee I bought?","py":"shuí bǎ wǒ mǎi de kā fēi hē le?"},{"zh":"房東要把房子賣了，所以我得找一個新房子。","en":"The landlord is going to sell the house, so I have to find a new place.","py":"fáng dōng yào bǎ fáng zi mài le, suǒ yǐ wǒ dé zhǎo yí gè xīn fáng zi."},{"zh":"我吃了西瓜。","en":"I ate watermelon. (fact, contrast)","py":"wǒ chī le xī guā."},{"zh":"我把西瓜吃了。","en":"I ate up the watermelon. (it's gone)","py":"wǒ bǎ xī guā chī le."},{"zh":"弟弟把我的咖啡喝了。","en":"My little brother drank my coffee.","py":"dì di bǎ wǒ de kā fēi hē le."},{"zh":"我想把手機賣了。","en":"I want to sell the phone. (✓ definite)","py":"wǒ xiǎng bǎ shǒu jī mài le."},{"zh":"我想把那支手機賣了。","en":"I want to sell that phone. (✓ definite)","py":"wǒ xiǎng bǎ nà zhī shǒu jī mài le."},{"zh":"我想把一支手機賣了。","en":"✗ ungrammatical — 一支手機 is indefinite, which fails after 把.","py":"wǒ xiǎng bǎ yī zhī shǒu jī mài le."}],"cy":"Write a sentence using 把 to say what happened to a specific (definite) object.","ov":"First door into 把; directly extended in B2 L6 (current class lesson), where the pattern becomes A 把 B + V + 到／在／給 + location/person (把書放在桌子上, 把錢給他, 把東西搬到樓下). The definiteness rule for O carries over unchanged.","tw":"Trad/simp: 賣 → 卖, 東 → 东, 機 → 机.","src":"B1L15"},{"id":"n15-3","t":"V 了 … (以後)，就 … · after doing X, then Y","e":"了 attaches right after the first verb (before its object), and 就 introduces what happens next — a sequence, not necessarily an immediate one.","pat":"V₁ 了 (O) (以後)，就 V₂","tgt":["了","就"],"alt":["一","才","以後"],"s":[{"zh":"請你等一下，我下了課，就去找你。","en":"Please wait a moment — once I finish class, I'll come find you.","py":"qǐng nǐ děng yí xià, wǒ xià le kè, jiù qù zhǎo nǐ."},{"zh":"他每天晚上吃了飯，就到樓下運動。","en":"Every night after he eats, he goes downstairs to exercise.","py":"tā měi tiān wǎn shàng chī le fàn, jiù dào lóu xià yùn dòng."},{"zh":"他吃了飯以後，就吃藥。","en":"After he eats, he takes medicine.","py":"tā chī le fàn yǐ hòu, jiù chī yào."},{"zh":"他吃了藥以後，就睡覺。","en":"After he takes medicine, he goes to sleep.","py":"tā chī le yào yǐ hòu, jiù shuì jiào."},{"zh":"她是不是寫了功課以後，就吃飯？","en":"Does she eat after finishing her homework?","py":"tā shì bú shì xiě le gōng kè yǐ hòu, jiù chī fàn?"},{"zh":"我一吃藥，就去睡覺。","en":"As soon as I take medicine, I go to sleep. (immediate, contrast)","py":"wǒ yī chī yào, jiù qù shuì jiào."},{"zh":"我吃了藥，就去睡覺。","en":"After I took the medicine, I went to sleep. (sequential, not necessarily immediate)","py":"wǒ chī le yào, jiù qù shuì jiào."}],"cy":"Write a sentence using V了…就… to describe what you do right after finishing something.","ov":"Competes with B1 L13's 一…就… (immediate): 我一吃藥，就去睡覺 (right now, immediately) vs 我吃了藥，就去睡覺 (after, not necessarily immediately). Same 就, different first half changes the timing.","tw":"Trad/simp: 後 → 后, 樓 → 楼, 藥 → 药, 覺 → 觉. Taiwan note: 藥局 yàojú is Taiwan's word for pharmacy (not mainland 藥店/藥房); 功課 gōngkè is Taiwan's normal word for homework (mainland usually 作業).","src":"B1L15"},{"id":"n15-4","t":"一點 vs 有一點","e":"一點 has three distinct jobs depending on position: after a verb before a noun it's 'a small amount of'; after an adjective it's 'a bit more' (neutral/positive); moved in front of the adjective as 有一點 it becomes a mild complaint ('a bit too').","pat":"V + 一點 + N (a small amount) / Vs + 一點 (a bit more) / 有一點 + Vs (a bit too, complaint)","tgt":["一點","有一點"],"alt":["有點","一些","很"],"s":[{"zh":"今天很熱，我想喝一點冰的東西。","en":"It's hot today, I want to drink something a little cold.","py":"jīn tiān hěn rè, wǒ xiǎng hē yì diǎn bīng de dōng xī."},{"zh":"我不舒服，得吃一點藥。","en":"I'm not feeling well, I need to take a little medicine.","py":"wǒ bù shū fú, dé chī yì diǎn yào."},{"zh":"我喝了一點珍珠奶茶，現在覺得開心一點了。","en":"I drank a little bubble tea, and now I feel a bit happier.","py":"wǒ hē le yì diǎn zhēn zhū nǎi chá, xiàn zài jué de kāi xīn yì diǎn le."},{"zh":"我喜歡苦一點的。","en":"I like it a bit more bitter.","py":"wǒ xǐ huān kǔ yì diǎn de."},{"zh":"甜一點的，更好。","en":"A bit sweeter would be even better.","py":"tián yì diǎn de, gèng hǎo."},{"zh":"我想喝熱一點的咖啡。","en":"I want to drink slightly hotter coffee.","py":"wǒ xiǎng hē rè yì diǎn de kā fēi."},{"zh":"那杯咖啡有一點大，你能幫我喝嗎？","en":"That coffee is a bit too much, can you help me drink it?","py":"nà bēi kā fēi yǒu yì diǎn dà, nǐ néng bāng wǒ hē ma?"},{"zh":"我覺得紅茶有一點甜。","en":"I think the black tea is a bit too sweet. (complaint)","py":"wǒ jué de hóng chá yǒu yì diǎn tián."},{"zh":"紅茶，我要甜一點。","en":"For the black tea, I'd like it a bit sweeter. (request)","py":"hóng chá, wǒ yào tián yì diǎn."},{"zh":"這個衣服有一點貴。","en":"These clothes are a bit too expensive.","py":"zhè ge yī fú yǒu yì diǎn guì."},{"zh":"這個衣服比那個衣服貴一點。","en":"These clothes are a little more expensive than those.","py":"zhè ge yī fú bǐ nà ge yī fú guì yì diǎn."},{"zh":"外面有一點黑，應該要下雨了。","en":"It's a bit dark outside, it's probably going to rain.","py":"wài miàn yǒu yì diǎn hēi, yīng gāi yào xià yǔ le."}],"cy":"Write two sentences: one using V + 一點 + N and one using 有一點 + Vs as a mild complaint.","ov":"Extended in B2 L2: the Vs+一點 half becomes a command, V + Vs + 一點 (請說慢一點, 吃快一點!) — same 'a bit more' meaning, now aimed at telling someone to act differently. The 有一點 complaint half does NOT travel there (✗請說有一點慢).","tw":"Trad/simp: 點 → 点, 熱 → 热, 開 → 开, 貴 → 贵. Taiwan note: 有點 is commonly heard as the short form of 有一點 (有點貴).","src":"B1L15"},{"id":"n15-5","t":"A 比 B + Vs + 一點 / 很多 / 得多 / 多了 · by how much","e":"Adding a degree word after the adjective in a 比 comparison says by how much A exceeds B, on a scale from slight to large.","pat":"A 比 B Vs + 一點／很多／得多／多了 — scale: 一點 < 很多 ≈ 得多 < 多了","tgt":["一點","很多","得多"],"alt":["很","更","非常"],"s":[{"zh":"右邊的珍珠奶茶比左邊的貴一點。","en":"The bubble tea on the right is a little more expensive than the one on the left. (35 vs 45 元)","py":"yòu biān de zhēn zhū nǎi chá bǐ zuǒ biān de guì yì diǎn."},{"zh":"安同比月美高一點。","en":"Antong is a little taller than Yuemei. (160 vs 153)","py":"ān tóng bǐ yuè měi gāo yì diǎn."},{"zh":"安同比月美高很多／得多。","en":"Antong is much taller than Yuemei. (170 vs 150)","py":"ān tóng bǐ yuè měi gāo hěn duō ／ dé duō."},{"zh":"安同比月美高多了。","en":"Antong is a lot taller than Yuemei. (190 vs 150)","py":"ān tóng bǐ yuè měi gāo duō le."},{"zh":"臺北101比我的學校高多了。","en":"Taipei 101 is way taller than my school.","py":"tái běi 1 0 1 bǐ wǒ de xué xiào gāo duō le."},{"zh":"從我家去學校比去銀行近得多。","en":"Going to school from my house is much closer than going to the bank.","py":"cóng wǒ jiā qù xué xiào bǐ qù yín háng jìn dé duō."}],"cy":"Write a sentence using A 比 B + Vs + 一點/很多/得多/多了 to say by how much A exceeds B.","ov":"Final rung of the comparison ladder: 跟…一樣 (B1 L13, equal) → 沒有…這麼 / 比…更 (B1 L14, less / even more) → this point (by how much). One frame, five settings across three lessons.","tw":"Trad/simp: 邊 → 边, 銀 → 银. Taiwan note: 臺北 is the formal/official variant of 台北, used officially in Taiwan. 銀行's 行 is read háng here, not xíng.","src":"B1L15"},{"id":"n15-6","t":"Note · Separable verbs (textbook VII)","e":"Some verb-object compounds (like 睡覺, 看病) split apart when 了, a duration, or a measure word needs to go in the middle — the insert goes between V and O, not after the whole compound.","pat":"VO compound splits: V + 了／duration／measure + O","tgt":["睡覺","看病"],"alt":["睡覺了","看病了"],"s":[{"zh":"睡覺 → 睡了八個小時的覺","en":"to sleep → slept for eight hours","py":"shuì jiào → shuì le bā gè xiǎo shí de jué"},{"zh":"看病 → 看了病","en":"to see a doctor → saw a doctor","py":"kàn bìng → kàn le bìng"},{"zh":"發燒、生病、感冒、上課、唱歌、吃飯","en":"run a fever, get sick, catch a cold, attend class, sing, eat — all separable (V-SEP) verbs","py":"fā shāo, shēng bìng, gǎn mào, shàng kè, chàng gē, chī fàn"},{"zh":"睡了三個小時的覺","en":"slept for three hours","py":"shuì le sān gè xiǎo shí de jué"},{"zh":"上了兩堂課","en":"attended two class periods","py":"shàng le liǎng táng kè"}],"cy":"Write a sentence using a separable verb (like 睡覺 or 上課) with 了 or a duration inserted in the middle.","ov":"","tw":"","src":"B1L15"}],"16":[{"id":"n16-1","t":"從 Place 往 Direction + V · from X, go toward Y","e":"從 marks the starting point and 往 marks the direction to head (前/後/左/右/外/北, etc.) before the motion verb; 就 in the following clause means 'and then you're there'.","pat":"從 + starting point, 往 + direction, + motion verb (往前走, 往右轉, 過馬路)","tgt":["從","往"],"alt":["到","在","離"],"s":[{"zh":"你從這裡往前走，就到學校了。","en":"Go straight ahead from here, and you'll reach the school.","py":"nǐ cóng zhè lǐ wǎng qián zǒu, jiù dào xué xiào le."},{"zh":"從旅館的窗戶(裡面)往外看，有藍色的海。","en":"Looking out from inside the hotel window, there's a blue sea.","py":"cóng lǚ guǎn de chuāng hù ( lǐ miàn ) wǎng wài kàn, yǒu lán sè de hǎi."},{"zh":"從這裡往前走，就有一家超商。","en":"Go straight ahead from here, and there's a convenience store.","py":"cóng zhè lǐ wǎng qián zǒu, jiù yǒu yī jiā chāo shāng."}],"cy":"Write a sentence using 從…往… to give directions from a starting point toward a direction.","ov":"Extended in B2 L6: here it's 從 + start + 往 + direction + V (從這裡往前走 — which way to head, no endpoint named). In B2 L6 it becomes 從 + start + V + 到 + endpoint (從台北騎到花蓮 — where you ended up, direction not named). 往 answers 'which way?', 到 answers 'and got where?' — don't swap them (✗從這裡到前走, ✗從台北騎往花蓮).","tw":"Trad/simp: 從 → 从, 館 → 馆, 戶 → 户, 藍 → 蓝, 轉 → 转. Taiwan note: 超商 chāoshāng (short for 便利商店) is Taiwan-only for convenience store; mainland says 便利店. 窗戶's 戶 gets a full 4th tone in Taiwan vs a neutralized one on the mainland. Taipei addresses read 路→段→巷→弄→號.","src":"B2L1"},{"id":"n16-2","t":"V 起來 + Vs · judging by doing","e":"V起來 names the sense you're using to judge something (看起來 looks, 吃起來 tastes, 聽起來 sounds) and the Vs after it gives the verdict; restricted to one-syllable verbs.","pat":"V + 起來 + (不) Vs — one-syllable verbs only (看/聽/喝/吃/聞/摸/笑/坐/穿/寫/說/念/學/住/逛/走)","tgt":["起來"],"alt":["得","著","過"],"s":[{"zh":"這支筆寫／用起來很不錯。","en":"This pen is quite good to write/use with.","py":"zhè zhī bǐ xiě ／ yòng qǐ lái hěn bú cuò."},{"zh":"他做的蛋糕吃起來非常甜。","en":"The cake he made tastes very sweet.","py":"tā zuò de dàn gāo chī qǐ lái fēi cháng tián."},{"zh":"高跟鞋看起來很美，可是穿起來很不舒服。","en":"High heels look beautiful, but they're uncomfortable to wear.","py":"gāo gēn xié kàn qǐ lái hěn měi, kě shì chuān qǐ lái hěn bù shū fú."},{"zh":"這杯咖啡看起來不苦，可是喝起來非常苦。","en":"This coffee doesn't look bitter, but it tastes very bitter.","py":"zhè bēi kā fēi kàn qǐ lái bù kǔ, kě shì hē qǐ lái fēi cháng kǔ."},{"zh":"聽起來不難，做起來很難。","en":"It sounds easy, but it's hard to do.","py":"tīng qǐ lái bù nán, zuò qǐ lái hěn nán."}],"cy":"Write a sentence using V起來+Vs to say how something seems based on doing/experiencing it.","ov":"Connects back to B1 L12 point 4 (好／難 + V): 中文字學起來怎麼樣？ = 中文字好學嗎？ — same job (judging how a verb goes), different shape. 好／難+V is itself the verdict with only two settings (easy/hard); V起來 only names the way you're judging and leaves the verdict open to any Vs (吃起來 can be 甜/苦/鹹, while 好吃 is locked at 'good'). Test: 這支筆好寫 stands alone; ✗這支筆寫起來 does not — it's still waiting for a Vs. Don't stack them: ✗好吃起來.","tw":"Trad/simp: 來 → 来, 筆 → 笔, 錯 → 错, 聽 → 听.","src":"B2L1"},{"id":"n16-3","t":"V 著 · ongoing state","e":"著 attached to a verb marks a state that continues after the action completes (standing, seated, holding, wearing) — contrast with 在+V, which is the action still in progress.","pat":"V + 著 = ongoing state (站著, 坐著, 拿著, 穿著, 開著); V+著+O+VP = doing VP while in that state","tgt":["著"],"alt":["在","了","過"],"s":[{"zh":"搭捷運的時候，他喜歡站著。","en":"When taking the MRT, he likes to stand.","py":"dā jié yùn de shí hòu, tā xǐ huān zhàn zhù."},{"zh":"孩子在玩的時候，大人看著他們比較好。","en":"While the kids are playing, it's better for adults to keep watching them.","py":"hái zi zài wán de shí hòu, dà rén kàn zhù tā men bǐ jiào hǎo."},{"zh":"她穿著衣服拍照。","en":"She has her clothes on while taking photos.","py":"tā chuān zhù yī fú pāi zhào."},{"zh":"她在穿衣服。","en":"She is in the middle of putting her clothes on. (contrast: action in progress)","py":"tā zài chuān yī fú."},{"zh":"她穿著衣服。","en":"She has her clothes on. (contrast: state after finishing)","py":"tā chuān zhù yī fú."}],"cy":"Write a sentence using V著 to describe an ongoing state (standing, sitting, holding, wearing).","ov":"Contrasts directly with 在 + V: 在穿衣服 = the action from start to finish (putting clothes on); 穿著衣服 = after finishing, still in that state (has them on). The same instinct — checking whether you mean the action or the resulting state/location — resurfaces in B2 L6's 到 vs 在 competition (moving verbs take 到, placing verbs take 在).","tw":"Trad/simp: 著 → 着 (same pronunciation zhe in both). Taiwan note: 捷運 jiéyùn (MRT) is Taiwan-only; mainland says 地鐵. 搭捷運／搭公車 is the normal Taiwan collocation, mainland more often 坐地鐵.","src":"B2L1"},{"id":"n16-4","t":"一邊 …，一邊 … · doing two things at once","e":"一邊 before each of two verb phrases says the same subject is doing both actions simultaneously; the main action usually comes second.","pat":"一邊 + VP₁，一邊 + VP₂","tgt":["一邊"],"alt":["又","再","就"],"s":[{"zh":"我喜歡一邊吃飯，一邊看電視。","en":"I like eating while watching TV.","py":"wǒ xǐ huān yī biān chī fàn, yī biān kàn diàn shì."},{"zh":"一邊準備考試，一邊聊天不太好。","en":"It's not great to chat while studying for an exam.","py":"yī biān zhǔn bèi kǎo shì, yī biān liáo tiān bù tài hǎo."},{"zh":"他一邊看地圖，一邊走路。","en":"He walks while looking at a map.","py":"tā yī biān kàn dì tú, yī biān zǒu lù."},{"zh":"他一邊聽音樂，一邊畫畫。","en":"He listens to music while drawing.","py":"tā yī biān tīng yīn yuè, yī biān huà huà."}],"cy":"Write a sentence using 一邊…一邊… to describe two things you do at the same time.","ov":"","tw":"Trad/simp: 邊 → 边, 電視 → 电视, 準備 → 准备, 圖 → 图, 樂 → 乐, 畫 → 画.","src":"B2L1"},{"id":"n16-5","t":"A 離 B + 遠 / 近 · distance from","e":"離 is a preposition meaning '(measured) from', used for static distance between two places — not to be confused with 從, which marks a starting point for movement.","pat":"A 離 B + 很遠／很近／不遠／近一點","tgt":["離"],"alt":["從","往","到"],"s":[{"zh":"我家離學校很遠，每天都要花很多時間搭車。","en":"My house is far from school, so I have to spend a lot of time on transport every day.","py":"wǒ jiā lí xué xiào hěn yuǎn, měi tiān dōu yào huā hěn duō shí jiān dā chē."},{"zh":"我想住在離學校近一點的地方。","en":"I want to live somewhere a bit closer to school.","py":"wǒ xiǎng zhù zài lí xué xiào jìn yì diǎn de dì fāng."},{"zh":"師大離台北101不遠。","en":"NTNU is not far from Taipei 101.","py":"shī dà lí tái běi 1 0 1 bù yuǎn."},{"zh":"老師的家離台北101很遠。","en":"The teacher's home is far from Taipei 101.","py":"lǎo shī de jiā lí tái běi 1 0 1 hěn yuǎn."},{"zh":"你家離…遠不遠／近不近？","en":"Is your house far from / close to…?","py":"nǐ jiā lí … yuǎn bù yuǎn ／ jìn bù jìn?"},{"zh":"你家離什麼地方很近？","en":"What place is your house close to?","py":"nǐ jiā lí shén me dì fāng hěn jìn?"}],"cy":"Write a sentence using A離B+遠/近 to describe the distance between two places.","ov":"Competes with 從 (point 1): 離 is static distance measurement ('(measured) from'), while 從 marks a starting point for movement. Don't swap them.","tw":"Trad/simp: 離 → 离, 遠 → 远, 師 → 师.","src":"B2L1"}],"17":[{"id":"n17-1","t":"一點也／都不 + Vs · not at all","e":"一點也不 (or 一點都不) before an adjective/verb phrase says 'not even a little' — stronger than 不太, the opposite end of the scale from 非常. With an object, the object slots between 一點 and 也不.","pat":"一點 + 也／都 + 不／沒 + Vs/VP; with an object: S + 一點 + O + 也不 + V","tgt":["一點","也不"],"alt":["不太","很","非常"],"s":[{"zh":"這杯珍珠奶茶一點也不好喝。","en":"This bubble tea is not tasty at all.","py":"zhè bēi zhēn zhū nǎi chá yì diǎn yě bù hǎo hē."},{"zh":"他一點也不餓。","en":"He's not hungry at all.","py":"tā yì diǎn yě bù è."},{"zh":"這支手機看起來一點也不好用。","en":"This phone doesn't look easy to use at all.","py":"zhè zhī shǒu jī kàn qǐ lái yì diǎn yě bù hǎo yòng."},{"zh":"我一點珍珠奶茶也不喝。","en":"I don't drink any bubble tea at all. (object between 一點 and 也不)","py":"wǒ yì diǎn zhēn zhū nǎi chá yě bù hē."},{"zh":"安同一點咖啡也不喝。","en":"Antong doesn't drink any coffee at all.","py":"ān tóng yī diǎn kā fēi yě bù hē."},{"zh":"我一點甜點也不喜歡吃。","en":"I don't like eating any dessert at all.","py":"wǒ yì diǎn tián diǎn yě bù xǐ huān chī."}],"cy":"Write a sentence using 一點也不+Vs to say something is not the case at all.","ov":"Anchors the bottom of the intensity scale from point 3 (不太): 非常 > 很 > 不錯 > 不太 > 不 > 一點也不. Also the extreme end of the 一點 family started in B1 L15 — 一點 as 'a small amount' vs 一點也不 as 'not even a little' are opposite uses of the same word.","tw":"Trad/simp: 點 → 点, 餓 → 饿, 機 → 机, 甜點 → 甜点.","src":"B2L2"},{"id":"n17-2","t":"還是 … 吧！ · you'd better","e":"After weighing options out loud, 還是 + the better choice + 吧 softens the conclusion into a suggestion — 'let's go with / you'd better'. Distinct from the 還是 that appears in A還是B? either/or questions.","pat":"還是 + better choice + 吧","tgt":["還是","吧"],"alt":["或是","應該","要"],"s":[{"zh":"外面下雨了，(你不要走路，)還是搭捷運吧！","en":"It's raining outside, you'd better take the MRT instead!","py":"wài miàn xià yǔ le, ( nǐ bú yào zǒu lù, ) hái shì dā jié yùn ba!"},{"zh":"明天還要上課，你還是早一點睡吧！","en":"You still have class tomorrow, you'd better go to sleep a bit earlier!","py":"míng tiān hái yào shàng kè, nǐ hái shì zǎo yì diǎn shuì ba!"},{"zh":"這家餐廳的菜不太好吃，你還是去別家吧！","en":"This restaurant's food isn't very good, you'd better go to another one!","py":"zhè jiā cān tīng de cài bù tài hǎo chī, nǐ hái shì qù bié jiā ba!"},{"zh":"高鐵1490元2小時，台鐵850元4.5小時……還是坐高鐵吧！","en":"HSR is 1490 for 2 hours, TRA is 850 for 4.5 hours... let's just take the HSR!","py":"gāo tiě 1 4 9 0 yuán 2 xiǎo shí, tái tiě 8 5 0 yuán 4 . 5 xiǎo shí … … hái shì zuò gāo tiě ba!"}],"cy":"Write a sentence using 還是…吧 to suggest the better of two options.","ov":"Watch for the unrelated 還是 in A還是B? either/or questions — same word, a different job from this softened-suggestion use.","tw":"Trad/simp: 還 → 还, 捷運 → 捷运, 鐵 → 铁. Taiwan note: 捷運 jiéyùn (MRT), 高鐵 (THSR) and 台鐵 (TRA) are Taiwan-only transit words.","src":"B2L2"},{"id":"n17-3","t":"不太 + Vs · not very","e":"不太 before an adjective is the polite way to say something negative — it sits one step above a flat 不 on the intensity scale, so 不太冷 still admits some cold.","pat":"不太 + Vs = 'not very'. Scale: 非常 > 很 > 不錯 > 不太 > 不 > 一點也不","tgt":["不太"],"alt":["不","一點也不","很"],"s":[{"zh":"你覺得台灣的冬天冷不冷？台灣的冬天不太冷。","en":"Do you think Taiwan's winter is cold? Taiwan's winter isn't very cold.","py":"nǐ jué de tái wān de dōng tiān lěng bù lěng? tái wān de dōng tiān bù tài lěng."},{"zh":"這家餐廳的菜不太好吃。","en":"This restaurant's food isn't very good.","py":"zhè jiā cān tīng de cài bù tài hǎo chī."}],"cy":"Write a sentence using 不太+Vs to politely say something isn't very [adjective].","ov":"Sits in the middle of the intensity scale that point 1 (一點也不) anchors at the bottom: 非常 > 很 > 不錯 > 不太 > 不 > 一點也不.","tw":"Trad/simp: 灣 → 湾.","src":"B2L2"},{"id":"n17-4","t":"V + Vs 一點 · giving instructions","e":"Vs+一點 attached directly to an action verb (no 得, no object) turns it into a command or request about how to do something, e.g. 說慢一點 'speak a bit slower'.","pat":"V + Vs + 一點, no 得, no object","tgt":["一點"],"alt":["得","有一點","很"],"s":[{"zh":"你說話說得太快了，請說慢一點。","en":"You're speaking too fast, please speak a bit slower.","py":"nǐ shuō huà shuō dé tài kuài le, qǐng shuō màn yì diǎn."},{"zh":"吃快一點！我們沒時間了！","en":"Eat a bit faster! We don't have time!","py":"chī kuài yì diǎn! wǒ men méi shí jiān le!"},{"zh":"上課時間已經到了，他得走快一點。","en":"Class time has arrived, he has to walk a bit faster.","py":"shàng kè shí jiān yǐ jīng dào le, tā dé zǒu kuài yì diǎn."},{"zh":"下課時間快到了，他得寫快一點。","en":"Class is about to end, he has to write a bit faster.","py":"xià kè shí jiān kuài dào le, tā dé xiě kuài yì diǎn."},{"zh":"他說話說得太快了，我想請他說慢一點。","en":"He speaks too fast, I want to ask him to speak a bit slower.","py":"tā shuō huà shuō dé tài kuài le, wǒ xiǎng qǐng tā shuō màn yì diǎn."}],"cy":"Write a command using V+Vs+一點 (no 得, no object) telling someone to do something differently.","ov":"Extends B1 L15's Vs+一點 (comparative 'a bit more of a quality', e.g. 熱一點的咖啡) by hanging it on an action verb to make it a command aimed at someone: 說慢一點. The meaning of 一點 hasn't changed, it just picked up a verb in front. The 有一點 complaint half from B1 L15 does NOT travel here — ✗請說有一點慢. Also no 得 in a command: 請說得慢一點 describes how he speaks, it doesn't ask him to slow down. Quick test: 有一點 in front of the Vs = complaint; Vs + 一點 after = request.","tw":"Trad/simp: 說話 → 说话, 時間 → 时间, 寫 → 写.","src":"B2L2"},{"id":"n17-5","t":"AABB reduplication of two-syllable Vs","e":"Doubling both syllables of a two-syllable state adjective (AB → AABB) makes it vivid and pleasant; it fits three frames (AABB的N, AABB地V, V得AABB的) and never takes 很／非常／不太, since the doubling already carries the intensity.","pat":"AABB的+N / AABB地+V / V得+AABB(的) — state verbs only; rejects 很／非常／不太","tgt":["輕輕鬆鬆","乾乾淨淨"],"alt":["練習練習","很輕鬆","非常乾淨"],"s":[{"zh":"輕鬆 → 輕輕鬆鬆","en":"relaxed → nice and relaxed","py":"qīng sōng → qīng qīng sōng sōng"},{"zh":"漂亮 → 漂漂亮亮","en":"pretty → all dolled up","py":"piào liàng → piāo piāo liàng liàng"},{"zh":"舒服 → 舒舒服服","en":"comfortable → nice and comfy","py":"shū fú → shū shū fú fú"},{"zh":"乾淨 → 乾乾淨淨","en":"clean → squeaky clean","py":"gān jìng → gān gān jìng jìng"},{"zh":"快樂 → 快快樂樂","en":"happy → happy and cheerful","py":"kuài lè → kuài kuài lè lè"},{"zh":"客氣 → 客客氣氣","en":"polite → very politely","py":"kè qì → kè kè qì qì"},{"zh":"開心 → 開開心心","en":"happy → happily","py":"kāi xīn → kāi kāi xīn xīn"},{"zh":"大家都想住乾乾淨淨的房子。","en":"Everyone wants to live in a nice clean house. (AABB的N)","py":"dà jiā dōu xiǎng zhù gān gān jìng jìng de fáng zi."},{"zh":"很多人都想輕輕鬆鬆地學中文。","en":"Many people want to learn Chinese in a relaxed way. (AABB地V)","py":"hěn duō rén dōu xiǎng qīng qīng sōng sōng dì xué zhōng wén."},{"zh":"我們要去餐廳，開開心心地吃飯。","en":"We're going to the restaurant to eat happily. (AABB地V)","py":"wǒ men yào qù cān tīng, kāi kāi xīn xīn dì chī fàn."},{"zh":"可是如果你不好好地學，就一定不能學中文學得輕輕鬆鬆的。","en":"But if you don't study properly, you definitely won't be able to learn Chinese in a relaxed way. (V得AABB的)","py":"kě shì rú guǒ nǐ bù hǎo hǎo dì xué, jiù yí dìng bù néng xué zhōng wén xué dé qīng qīng sōng sōng de."},{"zh":"那家旅館住起來舒舒服服的。","en":"That hotel is nice and comfortable to stay in. (V得AABB的)","py":"nà jiā lǚ guǎn zhù qǐ lái shū shū fú fú de."}],"cy":"Write a sentence using an AABB reduplicated adjective (e.g. 乾乾淨淨的房間) in one of the three frames.","ov":"Competes with B2 L3's ABAB reduplication (練習練習): discriminator is state verb → AABB (乾淨→乾乾淨淨, ✗乾淨乾淨) vs action verb → ABAB (練習→練習練習, ✗練練習習). Each rejects a different intensifier: AABB rejects 很／非常／不太 (✗很乾乾淨淨); ABAB rejects 一點／一下 (✗練習練習一下).","tw":"Trad/simp: 輕鬆 → 轻松, 乾淨 → 干净, 快樂 → 快乐, 客氣 → 客气, 開心 → 开心.","src":"B2L2"},{"id":"n17-6","t":"部 vs 邊 · region vs side","e":"部 places something inside the region it's part of (北部 = the northern part of Taiwan itself); 邊 places something outside, relative to a neighboring place (北邊 = to the north of somewhere else).","pat":"A 在 B 的 X部 = A is within B, in its X region. A 在 B 的 X邊 = A is outside B, on its X side.","tgt":["部","邊"],"alt":["裡","外","方"],"s":[{"zh":"台北在台灣的北部。","en":"Taipei is in the northern part of Taiwan. (inside)","py":"tái běi zài tái wān de běi bù."},{"zh":"台北在台南的北邊。","en":"Taipei is to the north of Tainan. (outside, relative)","py":"tái běi zài tái nán de běi biān."},{"zh":"東部、西部、南部、北部、中部","en":"east, west, south, north, and central regions","py":"dōng bù, xī bù, nán bù, běi bù, zhōng bù"},{"zh":"東邊、西邊、南邊、北邊、東南邊、西北邊","en":"east, west, south, north, southeast, and northwest sides","py":"dōng biān, xī biān, nán biān, běi biān, dōng nán biān, xī běi biān"},{"zh":"羅盤方位：東北、西北、東南、西南","en":"compass directions: northeast, northwest, southeast, southwest (plus 部／邊: 東北部, 西南邊)","py":"luó pán fāng wèi: dōng běi, xī běi, dōng nán, xī nán"}],"cy":"Write two sentences: one using 部 to place something within a region, one using 邊 to place something outside relative to another place.","ov":"","tw":"Trad/simp: 邊 → 边, 東 → 东. Taiwan note: 北部／中部／南部／東部 are how Taiwanese people commonly divide the island in everyday speech (weather, travel, politics).","src":"B2L2"}],"18":[{"id":"n18-1","t":"差不多 · about the same / almost done","e":"差不多 does three jobs: comparing two things as roughly equal, marking an action as nearly finished (V得差不多了), and modifying a state verb or number to mean 'about/roughly'.","pat":"① A 和／跟 B 差不多 = roughly the same. ② V 得差不多了 = almost finished (80–99% done). ③ 差不多 + Vs/number = about, roughly.","tgt":["差不多"],"alt":["一樣","幾乎","快...了"],"s":[{"zh":"我哥哥跟我差不多高。","en":"My older brother is about as tall as me.","py":"wǒ gē gē gēn wǒ chà bu duō gāo."},{"zh":"他們差不多高。","en":"They're about the same height.","py":"tā men chà bu duō gāo."},{"zh":"捷運站和商店差不多近。","en":"The MRT station and the store are about equally close.","py":"jié yùn zhàn hé shāng diàn chà bu duō jìn."},{"zh":"我們開始學中文的時間差不多。","en":"We started learning Chinese at about the same time.","py":"wǒ men kāi shǐ xué zhōng wén de shí jiān chà bù duō."},{"zh":"我寫作業寫得差不多了。","en":"I've almost finished my homework.","py":"wǒ xiě zuò yè xiě dé chà bu duō le."},{"zh":"晚飯做得差不多了，可以準備吃飯了！","en":"Dinner's almost done, we can get ready to eat!","py":"wǎn fàn zuò dé chà bu duō le, kě yǐ zhǔn bèi chī fàn le!"},{"zh":"買得差不多了，我們去付錢吧！","en":"We've bought almost everything, let's go pay!","py":"mǎi dé chà bu duō le, wǒ men qù fù qián ba!"},{"zh":"我差不多學了五個月了。","en":"I've studied for about five months.","py":"wǒ chà bu duō xué le wǔ gè yuè le."}],"cy":"Write one sentence comparing two things with 跟…差不多, then one using V得差不多了 for something you're almost finished with.","ov":"The 了 at the end of V得差不多了 belongs to the 了 family: 咖啡貴了 (B1 L10 pt.4) → 我買了水果 (B1 L13 pt.2) → 我住了三年 (B1 L14 pt.1) → 我住了三年了 (B1 L14 pt.2) → 快下雨了 (B1 L14 pt.3) → 我寫作業寫得差不多了 (here, the last rung). This is sentence-final 了 ('nearly there, things have changed'), not the completed-action 了 from B1 L13, which is exactly why it can't be negated with 沒 (✗沒寫得差不多了 — say 還沒寫完 instead). Shape note: it's V + 得 + 差不多 + 了, the same V得 frame as 說得很快, so an object must be handled by repeating the verb (寫作業寫得差不多了, ✗寫得作業差不多了).","tw":"捷運站 (jiéyùnzhàn) is the Taiwan word for MRT station — mainland says 地鐵站 (dìtiězhàn). 作業 (homework) appears here, but in Taiwan you'll hear 功課 (gōngkè) at least as often.","src":"B2L3"},{"id":"n18-2","t":"V 過 / 沒 V 過 · have (never) done before","e":"Marks whether you have ever had a particular experience. The negative keeps 過 (unlike 了, which drops under negation).","pat":"V + 過 = experience, 'have ever done'. 沒 V 過 keeps 過. 還沒 V 過 = haven't yet. Question: V 過…嗎？ or V 過…沒有？","tgt":["過"],"alt":["了","已經","曾經"],"s":[{"zh":"他來台灣這麼久了，還沒去過台北101。","en":"He's been in Taiwan so long, but he still hasn't been to Taipei 101.","py":"tā lái tái wān zhè me jiǔ le, hái méi qù guò tái běi 1 0 1."},{"zh":"你吃過芒果冰嗎？","en":"Have you ever had mango shaved ice?","py":"nǐ chī guò máng guǒ bīng ma?"},{"zh":"我沒學過中文，可是想學學看。","en":"I've never studied Chinese, but I'd like to give it a try.","py":"wǒ méi xué guò zhōng wén, kě shì xiǎng xué xué kàn."}],"cy":"Write a question with V過…嗎 asking if you've ever done something, then a negative sentence with 沒 V過.","ov":"學學看 in the third example is B1 L10's VV看 (one-syllable verb doubled + 看 = 'give it a try and see'): 吃吃看, 試試看, 喝喝看. It pairs naturally with 沒V過 — you haven't done it, so you try it. Two carry-overs from B1 L10: no object after VV看 (front it instead: 中文，我想學學看), and plain VV with no 看 just means 'do a little' with no trying implied. For two-syllable verbs there's no 看 version at all — use this lesson's own ABAB (point 5) instead: 練習練習 ✓, ✗練習練習看.","tw":"過 (guò) keeps its full 4th tone in Taiwan as the experience marker; mainland speech usually reduces it to a neutral guo.","src":"B2L3"},{"id":"n18-3","t":"Topic，S 想起來了 / 沒想起來 · recall","e":"Puts the thing you're trying to remember first as the topic, then states whether it came back to you (想起來了) or didn't (沒想起來).","pat":"[Thing you're recalling as topic], S 想起來了 (it came back to me) / S 沒想起來 (it didn't). Short objects can go in the middle (想起他的名字來了), but topic-first is what the class uses.","tgt":["想起來"],"alt":["記得","想到","知道"],"s":[{"zh":"那個人的名字，我想起來了。","en":"That person's name — I've remembered it now.","py":"nà ge rén de míng zì, wǒ xiǎng qǐ lái le."},{"zh":"可是我是怎麼認識他的，我沒想起來。","en":"But how I know him — I couldn't recall.","py":"kě shì wǒ shì zěn me rèn shí tā de, wǒ méi xiǎng qǐ lái."},{"zh":"剛剛我們在路上看見的那個人叫什麼名字？我想起來了，他叫月美。","en":"What was the name of the person we just saw on the road? I remember now — he's called Yueměi.","py":"gāng gāng wǒ men zài lù shàng kàn jiàn de nà ge rén jiào shén me míng zì? wǒ xiǎng qǐ lái le, tā jiào yuè měi."}],"cy":"Write a sentence naming something you're trying to recall as the topic, then say whether it came back to you (想起來了) or not (沒想起來).","ov":"","tw":"剛剛 (gānggāng, 'just now') is the everyday Taiwan choice; mainland speech often reaches for 剛才 (gāngcái) instead. 認識 keeps a full 4th tone on 識 in Taiwan; mainland standard is neutral rènshi.","src":"B2L3"},{"id":"n18-4","t":"才 · merely / later than expected","e":"才 has two faces: before a verb or bare number it means 'only/merely' (less than you'd think); with a time expression it means 'not until' (later than expected). It contrasts with 就 (sooner/earlier than expected) and with 只 (purely quantitative, no judgment).","pat":"才 + (V) + number = 'only/merely'. S + time + 才 + VP = 'not until', later than expected. 才 can sit directly before a bare number (才一百塊 ✓); 只 cannot (只一百塊 ✗).","tgt":["才"],"alt":["就","只","再"],"s":[{"zh":"這件衣服，網路上才(賣)兩百塊錢。","en":"This piece of clothing is only 200 dollars online.","py":"zhè jiàn yī fú, wǎng lù shàng cái ( mài ) liǎng bǎi kuài qián."},{"zh":"你看！我買的這件衣服才200塊。","en":"Look! The clothes I bought were only 200 dollars.","py":"nǐ kàn! wǒ mǎi de zhè jiàn yī fú cái 2 0 0 kuài."},{"zh":"他每天都吃四個包子，今天他才吃了一個。","en":"He eats four buns every day, but today he only ate one.","py":"tā měi tiān dōu chī sì gè bāo zi, jīn tiān tā cái chī le yí gè."},{"zh":"這本書才賣一百塊。","en":"This book only sells for 100 dollars.","py":"zhè běn shū cái mài yì bǎi kuài."},{"zh":"這本書才一百塊。","en":"This book is only 100 dollars.","py":"zhè běn shū cái yì bǎi kuài."},{"zh":"我訂了這件衣服，可是一個月以後才收到。","en":"I ordered these clothes, but I didn't receive them until a month later.","py":"wǒ dìng le zhè jiàn yī fú, kě shì yí gè yuè yǐ hòu cái shōu dào."},{"zh":"安同七歲才會寫字，如玉五歲就會了。","en":"Antong couldn't write until age 7; Ruyu could already at 5.","py":"ān tóng qī suì cái huì xiě zì, rú yù wǔ suì jiù huì le."},{"zh":"為什麼安同每天都很晚才睡覺？","en":"Why doesn't Antong go to sleep until so late every day?","py":"wèi shén me ān tóng měi tiān dōu hěn wǎn cái shuì jiào?"},{"zh":"哥哥一歲就會說話，弟弟兩歲才會說話。","en":"The older brother could talk at age 1; the younger brother not until age 2.","py":"gē gē yī suì jiù huì shuō huà, dì di liǎng suì cái huì shuō huà."},{"zh":"哥哥一歲就會走路，弟弟兩歲半才會走路。","en":"The older brother could walk at 1; the younger brother not until 2.5.","py":"gē gē yī suì jiù huì zǒu lù, dì di liǎng suì bàn cái huì zǒu lù."},{"zh":"哥哥四歲就會看書、寫字，弟弟六歲才會。","en":"The older brother could read and write at 4; the younger brother not until 6.","py":"gē gē sì suì jiù huì kàn shū, xiě zì, dì di liù suì cái huì."},{"zh":"哥哥三歲就會自己吃飯，弟弟五歲才會自己吃飯。","en":"The older brother could feed himself at 3; the younger brother not until 5.","py":"gē gē sān suì jiù huì zì jǐ chī fàn, dì di wǔ suì cái huì zì jǐ chī fàn."}],"cy":"Write a pair of sentences: one using 就 for something that happened sooner than expected, one using 才 for something later than expected.","ov":"才 is the mirror of B1 L11's 就: 就 = sooner/earlier/cheaper than expected, 才 = later/slower/less than expected. 七歲才會 vs 五歲就會 is the pair to memorize. This is the competition pair named directly in the project's overlap map (B1 L11 → B2 L3).","tw":"網路 (wǎnglù) is both a Taiwan word and Taiwan reading for 'the internet'; mainland says 網絡/网络 (wǎngluò). 才 (cái) is rising 2nd tone — don't let it slide to 4th-tone cài (菜). 塊 (kuài) is the spoken unit for NT dollars; the formal written form is 元 (yuán).","src":"B2L3"},{"id":"n18-5","t":"ABAB reduplication of two-syllable action verbs","e":"Doubling a two-syllable action verb (AB → ABAB) softens it to mean 'do a bit of / give it a try' — the same job 一下 or 一點 does after a one-syllable verb, but for action verbs specifically, not state verbs.","pat":"AB → ABAB for two-syllable action verbs: 'do a bit of / give it a try'. Rejects 一點／一下 (don't stack them: 練習練習一下 ✗).","tgt":["練習練習"],"alt":["一下","一點"],"s":[{"zh":"練習 → 練習練習","en":"to practice → practice a bit","py":"liàn xí → liàn xí liàn xí"},{"zh":"認識 → 認識認識","en":"to get to know → get to know a bit","py":"rèn shí → rèn shí rèn shí"},{"zh":"了解 → 了解了解","en":"to understand → look into a bit","py":"liǎo jiě → liǎo jiě liǎo jiě"},{"zh":"準備 → 準備準備","en":"to prepare → prepare a bit","py":"zhǔn bèi → zhǔn bèi zhǔn bèi"},{"zh":"參觀 → 參觀參觀","en":"to visit/tour → have a look around","py":"cān guān → cān guān cān guān"},{"zh":"關心 → 關心關心","en":"to care about → show a bit of care","py":"guān xīn → guān xīn guān xīn"},{"zh":"休息 → 休息休息","en":"to rest → rest a bit","py":"xiū xī → xiū xī xiū xī"},{"zh":"那裡有一個新的博物館，我想去參觀參觀。","en":"There's a new museum there, I'd like to go have a look around.","py":"nà lǐ yǒu yí gè xīn de bó wù guǎn, wǒ xiǎng qù cān guān cān guān."},{"zh":"我要練習練習剛學的漢字，明天我們有聽寫。","en":"I want to practice the characters I just learned a bit; we have dictation tomorrow.","py":"wǒ yào liàn xí liàn xí gāng xué de hàn zì, míng tiān wǒ men yǒu tīng xiě."},{"zh":"下星期放假，我要好好地休息休息。","en":"Next week is a holiday, I want to rest properly.","py":"xià xīng qī fàng jià, wǒ yào hǎo hǎo dì xiū xī xiū xī."}],"cy":"Take a two-syllable action verb from this lesson and use it in ABAB form to mean 'do a bit of it'.","ov":"Keep the two reduplications straight: Vs → AABB (輕輕鬆鬆, B2 L2) takes state verbs and rejects 很／非常／不太; V → ABAB (練習練習, here) takes action verbs and rejects 一點／一下. Each reduplication already carries its own degree, so nothing stacks on top of either one. This is the AABB/ABAB competition pair from the project's overlap map (B2 L2 → B2 L3).","tw":"休息 gives 息 a full 2nd tone in Taiwan; mainland standard is neutral xiūxi. 認識 keeps a full 4th tone on 識 in Taiwan; mainland neutral rènshi. 漢字 (Hànzì) — in Taiwan you'll more often hear 國字 (guózì) for 'Chinese characters'.","src":"B2L3"}],"19":[{"id":"n19-1","t":"除了 A (以外)，都… / 也／還… · except for / in addition to","e":"除了 sets up either an exception or an inclusion — which one depends entirely on what follows. 都 after it means 'everyone/everything except A'; 也/還 after it means 'A and also'.","pat":"除了 X 以外，都… = everything except X. 除了 X 以外，也／還… = X and also. 以外 is optional in speech. If the subject is the same, 除了…以外 usually goes after the subject.","tgt":["除了...都","除了...也/還"],"alt":["只有","要是...就","不但...而且"],"s":[{"zh":"除了星期天以外，我每天都打工。","en":"Except for Sunday, I work part-time every day.","py":"chú le xīng qī tiān yǐ wài, wǒ měi tiān dōu dǎ gōng."},{"zh":"除了他以外，大家都來了。","en":"Except for him, everyone came.","py":"chú le tā yǐ wài, dà jiā dōu lái le."},{"zh":"除了英文以外，她還會說法文。","en":"Besides English, she can also speak French.","py":"chú le yīng wén yǐ wài, tā hái huì shuō fǎ wén."},{"zh":"除了打工，他也在念書。","en":"Besides working part-time, he's also studying.","py":"chú le dǎ gōng, tā yě zài niàn shū."}],"cy":"Write one sentence with 除了…都 (an exception) and one with 除了…也/還 (an addition).","ov":"","tw":"還 → 还, 會 → 会, 念書 → 念书 (simplified forms to log).","src":"B2L4"},{"id":"n19-2","t":"當 + role · to work as, to serve as","e":"當 plus a job or role noun means to work as or serve in that role — it is not the equivalent of 是.","pat":"當 + job/role noun = be / work as. Not 是. 當老師, 當助教, 當爸爸.","tgt":["當"],"alt":["是","做","成為"],"s":[{"zh":"我暑假想當助教。","en":"I want to work as a teaching assistant this summer.","py":"wǒ shǔ jià xiǎng dāng zhù jiào."},{"zh":"她在公司當主任，薪水很高。","en":"She works as a director at the company; the pay is high.","py":"tā zài gōng sī dāng zhǔ rèn, xīn shuǐ hěn gāo."},{"zh":"他以後想當老師。","en":"He wants to be a teacher in the future.","py":"tā yǐ hòu xiǎng dāng lǎo shī."}],"cy":"Write a sentence saying what role you want to 當 (work as) in the future.","ov":"","tw":"當 is pronounced dāng here (dàng is a different word/reading). 薪水 (salary) is the Taiwan word; mainland says 工資.","src":"B2L4"},{"id":"n19-3","t":"按照 + N · according to","e":"A preposition phrase meaning 'according to' a rule, standard, or what someone said; it goes before the verb it modifies.","pat":"按照 + (rule / standard / what someone said) + VP.","tgt":["按照"],"alt":["根據","照著","依照"],"s":[{"zh":"鐘點費按照小時算。","en":"Hourly pay is calculated according to the hour.","py":"zhōng diǎn fèi àn zhào xiǎo shí suàn."},{"zh":"按照學校的規定，學生一個星期只能打工二十個小時。","en":"According to school regulations, students can only work 20 hours a week.","py":"àn zhào xué xiào de guī dìng, xué shēng yí gè xīng qī zhǐ néng dǎ gōng èr shí gè xiǎo shí."},{"zh":"我們按照他說的做就好。","en":"We'll just do it according to what he said.","py":"wǒ men àn zhào tā shuō de zuò jiù hǎo."}],"cy":"Write a sentence describing a rule or standard using 按照.","ov":"","tw":"Taiwan note: the student work-permit reality is 20 hrs/week during term, exactly as in the example sentence.","src":"B2L4"},{"id":"n19-4","t":"算 · to calculate / to count as","e":"算 means to calculate or work out (as with pay), and pairs naturally with 按照 in talk about wages.","pat":"算 = calculate (算錢, 算起來 = when you add it up). Pairs naturally with 按照 in pay talk. 算了 (forget it) is a different, very common idiom.","tgt":["算"],"alt":["計算","算了","當作"],"s":[{"zh":"他們是按照小時算錢的。","en":"They calculate pay by the hour.","py":"tā men shì àn zhào xiǎo shí suàn qián de."},{"zh":"這份工作的薪水怎麼算？","en":"How is the pay for this job calculated?","py":"zhè fèn gōng zuò de xīn shuǐ zěn me suàn?"},{"zh":"一個小時一百六十塊，一天八個小時，算起來一天一千二百八十塊。","en":"160 dollars an hour, 8 hours a day — adding it up, that's 1,280 dollars a day.","py":"yí gè xiǎo shí yì bǎi liù shí kuài, yī tiān bā gè xiǎo shí, suàn qǐ lái yī tiān yī qiān èr bǎi bā shí kuài."}],"cy":"Write a sentence using 算起來 to add something up, noting that 算了 means something completely different ('forget it').","ov":"","tw":"","src":"B2L4"},{"id":"n19-5","t":"…，然後… · and then (sequence)","e":"然後 starts the second clause in a sequence of actions, similar to 再 in 先…再… but usable across longer stretches and even with different subjects.","pat":"然後 starts the second clause, like 再 in 先…再… (B1 L12), but usable with longer stretches and different subjects. 先…，然後… is the common combination.","tgt":["然後"],"alt":["再","接著","於是"],"s":[{"zh":"我先寫履歷表，然後去面談。","en":"First I'll write my resume, then go to the interview.","py":"wǒ xiān xiě lǚ lì biǎo, rán hòu qù miàn tán."},{"zh":"主任先介紹了工作的情形，然後說明薪水怎麼算。","en":"The director first introduced the work situation, then explained how pay is calculated.","py":"zhǔ rèn xiān jiè shào le gōng zuò de qíng xíng, rán hòu shuō míng xīn shuǐ zěn me suàn."}],"cy":"Write a two-step sequence using 先…，然後…","ov":"然後 does the same job as 再 in B1 L12's 先…再…, but can span longer stretches and different subjects — worth logging as a family with 先…再….","tw":"履歷表 (resume/CV) is the Taiwan term; mainland uses 簡歷. 面談 (interview) is Taiwan usage.","src":"B2L4"},{"id":"n19-6","t":"沒想到 · unexpectedly","e":"An exclamation meaning 'I didn't expect that…', usually placed at the start of the sentence with the subject often dropped.","pat":"沒想到 + clause = 'I didn't expect that…'. Sentence-initial, subject often dropped. Positive cousin 想到 = to think of.","tgt":["沒想到"],"alt":["以為","沒想起來","誰知道"],"s":[{"zh":"沒想到面談那麼順利！","en":"I didn't expect the interview to go so smoothly!","py":"méi xiǎng dào miàn tán nà me shùn lì!"},{"zh":"我沒想到他馬上就答應了。","en":"I didn't expect that he'd agree right away.","py":"wǒ méi xiǎng dào tā mǎ shàng jiù dā yìng le."}],"cy":"Write a sentence starting with 沒想到 to express surprise about an unexpected outcome.","ov":"Keep this apart from B2 L7's 以為 (a belief that turned out wrong — the mistake is in the speaker's own head) and B2 L3's 想起來/沒想起來 (recall of something forgotten) — three related but distinct 想/以為 expressions that are easy to blur together.","tw":"","src":"B2L4"}],"20":[{"id":"n20-1","t":"Vs + 得不得了 · extremely","e":"A degree complement stronger than 非常, meaning 'extremely'. Used only with state verbs and feeling verbs.","pat":"Vs + 得 + 不得了 = extremely Vs, stronger than 非常. It's a degree complement, so it goes after the Vs with 得, same slot as 得很／得多. Only for Vs and feeling verbs (高興, 開心, 累). 不得了 on its own = 'oh no / terrible'.","tgt":["得不得了"],"alt":["非常","得很","極了"],"s":[{"zh":"喜宴上的人多得不得了。","en":"There were an extreme number of people at the wedding banquet.","py":"xǐ yàn shàng de rén duō dé bù dé le."},{"zh":"新娘漂亮得不得了。","en":"The bride was extremely beautiful.","py":"xīn niáng piào liàng dé bù dé le."},{"zh":"這家餐廳熱鬧得不得了。","en":"This restaurant is extremely lively.","py":"zhè jiā cān tīng rè nào dé bù dé le."},{"zh":"他高興得不得了，因為他要結婚了。","en":"He's extremely happy because he's getting married.","py":"tā gāo xìng dé bù dé le, yīn wèi tā yào jié hūn le."}],"cy":"Write a sentence describing something with Vs得不得了 to say it's extremely so.","ov":"","tw":"熱鬧 → 热闹, 興 → 兴, 結婚 → 结婚 (simplified forms to log).","src":"B2L5"},{"id":"n20-2","t":"有 V 有 V · doing both, lively","e":"A fixed phrase pattern joining two one-syllable verbs after 有 to describe a lively scene where both things are happening.","pat":"有 + V₁ + 有 + V₂ with two one-syllable verbs = 'there was V₁-ing and V₂-ing', a set phrase for a lively scene. Fixed pairs only, don't invent new ones at this level: 有說有笑, 有吃有喝.","tgt":["有...有..."],"alt":["又...又...","一邊...一邊..."],"s":[{"zh":"客人們有說有笑，很熱鬧。","en":"The guests were chatting and laughing, very lively.","py":"kè rén men yǒu shuō yǒu xiào, hěn rè nào."},{"zh":"喜宴上有吃有喝，大家都很開心。","en":"At the wedding banquet there was eating and drinking, everyone was happy.","py":"xǐ yàn shàng yǒu chī yǒu hē, dà jiā dōu hěn kāi xīn."}],"cy":"Use one of the fixed 有V有V phrases (有說有笑 or 有吃有喝) to describe a lively scene.","ov":"","tw":"","src":"B2L5"},{"id":"n20-3","t":"另外 · another / in addition","e":"另外 has two uses: 另外 + number + measure + noun means 'a further one on top of what's there' (so it can take a number); at the start of a clause, 另外 means 'in addition, besides'. It contrasts with 別的, which means 'a different one instead' and never takes a number.","pat":"另外 + 一 + M + N = another one (a further one). 另外，…／另外還… at the start of a clause = in addition, besides.","tgt":["另外"],"alt":["別的","其他","再"],"s":[{"zh":"這件禮服太正式了，我想看另外一件。","en":"This dress is too formal, I'd like to see another one.","py":"zhè jiàn lǐ fú tài zhèng shì le, wǒ xiǎng kàn lìng wài yī jiàn."},{"zh":"我們送了紅包，另外還送了一個禮物。","en":"We gave a red envelope, and on top of that also gave a gift.","py":"wǒ men sòng le hóng bāo, lìng wài hái sòng le yí gè lǐ wù."},{"zh":"我不要這個，給我別的。","en":"I don't want this one, give me a different one.","py":"wǒ bú yào zhè ge, gěi wǒ bié de."},{"zh":"另外兩位老師也來了。","en":"Two other/additional teachers also came.","py":"lìng wài liǎng wèi lǎo shī yě lái le."}],"cy":"Write one sentence with 另外 + number + measure word (an additional item that counts), and one with 別的 (a different one, no number).","ov":"別的 vs 另外 is a competition asked and answered in B2 L6 class (9/7). 別的 = a different one instead — it swaps out what you just named and stays vague, so it never counts: ✓別的地方、別的人 ✗別的三本書。 另外 = a further one on top of what's already there — it adds, and because it adds it can count: ✓另外一件、另外兩位老師、另外三本書。 Test: if English would let you say 'another two…', it's 另外; if you mean 'some other one, not this one', it's 別的. Full write-up lives in B2 L6 Ⅲ (V 在); this is the same answer, anchored here where 另外 is first taught.","tw":"","src":"B2L5"},{"id":"n20-4","t":"送 vs 給 · giving a gift / seeing someone off","e":"送 does several jobs — give as a free gift, see someone off / go partway with them, or comp something — while 給 is just the plain 'hand over'. Neither is 請, which means to pay for someone.","pat":"送 + person + gift = give as a present (給 is just hand over). 送 + person (+ 到 place) = see someone off / take them somewhere.","tgt":["送"],"alt":["給","請","賣"],"s":[{"zh":"朋友結婚，我送他們一個紅包。","en":"When a friend gets married, I give them a red envelope.","py":"péng yǒu jié hūn, wǒ sòng tā men yí gè hóng bāo."},{"zh":"喜宴以後，新人在門口送客人。","en":"After the banquet, the newlyweds see off the guests at the door.","py":"xǐ yàn yǐ hòu, xīn rén zài mén kǒu sòng kè rén."},{"zh":"我送你到捷運站。","en":"I'll walk you to the MRT station.","py":"wǒ sòng nǐ dào jié yùn zhàn."},{"zh":"老闆送了一盤小菜。","en":"The boss threw in a free side dish.","py":"lǎo bǎn sòng le yī pán xiǎo cài."},{"zh":"今天我請你。","en":"Today it's my treat (I'll pay).","py":"jīn tiān wǒ qǐng nǐ."},{"zh":"我請客。","en":"I'm treating/paying.","py":"wǒ qǐng kè."}],"cy":"Write a sentence using 送 to give a free gift, and a separate sentence using 請 to say you're paying for someone.","ov":"送 is one word doing three jobs (family): ① hand over a gift free of charge (送他們一個紅包) ② see someone off / go partway with them (送客人／送你到捷運站) ③ comp something (老闆送了一盤小菜). Trap: 送 is not 'pay for someone' — that's 請 (今天我請你／我請客). A shop that takes your money 賣給 you; only what costs nothing is 送給. Forward to B2 L6 (family: 給): B2 L6 gives the full frame V給+人+東西 (王先生賣給他一輛機車). Why 送他們一個紅包 has no 給: 給 may drop after verbs that hand something outward (賣、送、付) — 送他們一個紅包 = 送給他們一個紅包, both correct. Verbs that don't hand outward keep 給: 買給我一本書、做給我一個蛋糕 — ✗買我一本書、✗做我一個蛋糕. In B2 L6 the same 送給 also rides inside 把: 我要把這包茶送給老師。","tw":"紅包 → 红包, 禮物 → 礼物, 捷運 → 捷运 (simplified forms). 捷運 is the Taiwan word for the MRT/metro.","src":"B2L5"},{"id":"n20-5","t":"祝 + person + blessing · wedding phrases","e":"祝 introduces a wish or blessing for someone, followed by a fixed four-character phrase — the same shape as 祝你生日快樂 from B1 L13.","pat":"祝 + (person) + four-character blessing, same shape as B1 L13's 祝你生日快樂. 祝福 is the noun/verb 'blessing'; 祝 is what you say. 句 is the measure for utterances: 一句話, 幾句祝福的話.","tgt":["祝"],"alt":["希望","祝福","恭喜"],"s":[{"zh":"祝你們百年好合！","en":"Wishing you a hundred years of harmony (a happy marriage)!","py":"zhù nǐ men bǎi nián hǎo hé!"},{"zh":"祝你們早生貴子！","en":"Wishing you an early birth of a noble child (children soon)!","py":"zhù nǐ men zǎo shēng guì zi!"},{"zh":"大家都對新人說了幾句祝福的話。","en":"Everyone said a few words of blessing to the newlyweds.","py":"dà jiā dōu duì xīn rén shuō le jǐ jù zhù fú de huà."}],"cy":"Write a sentence using 祝 + someone + a blessing, following the same shape as 祝你生日快樂.","ov":"Same shape as B1 L13's 祝你生日快樂 — 祝 + person + fixed blessing phrase.","tw":"At a Taiwanese 喜宴 you'll say 恭喜！ when you hand over the 紅包 at the door (收禮台), and the four-character blessings go in the 紅包 card or the toast.","src":"B2L5"},{"id":"n20-6","t":"Measure words 件 / 句 / 位","e":"件 is used for clothes and also for matters/events; 句 measures sentences/utterances; 位 is the polite measure word for people.","pat":"件 for clothes and for matters/events (一件事, 一件喜事). 句 for sentences. 位 for people when being polite (幾位？ at a restaurant).","tgt":["件","句","位"],"alt":["個","張","人"],"s":[{"zh":"一件西裝、一件禮服、一件喜事","en":"a suit, a formal dress, a happy occasion","py":"yī jiàn xī zhuāng, yī jiàn lǐ fú, yī jiàn xǐ shì"},{"zh":"一句話、幾句祝福","en":"a sentence/remark, a few words of blessing","py":"yī jù huà, jǐ jù zhù fú"},{"zh":"一位客人、幾位親戚","en":"a guest, a few relatives (polite)","py":"yī wèi kè rén, jǐ wèi qīn qī"}],"cy":"Write three short phrases, one using each measure word 件, 句, and 位.","ov":"","tw":"裝 → 装, 親戚 → 亲戚 (simplified forms to log).","src":"B2L5"}],"21":[{"id":"n21-1","t":"Ⅰ. 到 · destination marker: V + 到 + place","e":"A movement verb followed by 到 + place states where the thing or person ended up as a result of that action — only for verbs where something actually travels through space, in contrast to placing verbs, which take 在 instead.","pat":"movement verb + 到 + place. The thing (or person) ends up at that place as a result of the verb. The 到-phrase comes after the verb; 不／沒 goes before the verb, not before 到.","tgt":["到"],"alt":["在","去","給"],"s":[{"zh":"他在踢足球，踢著踢著就踢到學校外面了。","en":"He was playing football, and after kicking it around for a while it ended up outside the school.","py":"tā zài tī zú qiú, tī zhù tī zhù jiù tī dào xué xiào wài miàn le."},{"zh":"馬安同上星期從台北騎機車騎到花蓮。","en":"Last week Ma Antong rode his scooter from Taipei to Hualien.","py":"mǎ ān tóng shàng xīng qī cóng tái běi qí jī chē qí dào huā lián."},{"zh":"這個蛋糕，我打算拿到學校請同學吃。","en":"I plan to take this cake to school and treat my classmates.","py":"zhè ge dàn gāo, wǒ dǎ suàn ná dào xué xiào qǐng tóng xué chī."},{"zh":"我在師大下車，沒搭到台北火車站。","en":"I got off at NTNU — I didn't ride all the way to Taipei Main Station.","py":"wǒ zài shī dà xià chē, méi dā dào tái běi huǒ chē zhàn."},{"zh":"張老師跟他太太決定不搬到西班牙了。","en":"Teacher Zhang and his wife decided not to move to Spain after all.","py":"zhāng lǎo shī gēn tā tài tài jué dìng bù bān dào xī bān yá le."},{"zh":"我的書，妳明天會拿到學校給我嗎？","en":"My book — will you bring it to school for me tomorrow?","py":"wǒ de shū, nǐ míng tiān huì ná dào xué xiào gěi wǒ ma?"},{"zh":"本子和筆，你是不是都放到背包裡了？","en":"The notebook and the pen — did you put them all in your backpack?","py":"běn zi hé bǐ, nǐ shì bú shì dōu fàng dào bēi bāo lǐ le?"},{"zh":"我要到美國去。","en":"I'm going to go to America.","py":"wǒ yào dào měi guó qù."},{"zh":"哥哥要到臺灣來。","en":"Older brother is coming to Taiwan.","py":"gē gē yào dào tái wān lái."},{"zh":"他們打算走到哪裡去？","en":"Where are they planning to walk to?","py":"tā men dǎ suàn zǒu dào nǎ lǐ qù?"},{"zh":"棒球，他們不小心打到樹上了。","en":"They accidentally hit the baseball into the tree.","py":"bàng qiú, tā men bù xiǎo xīn dǎ dào shù shàng le."},{"zh":"從山下爬到山上，需要3個鐘頭。","en":"Climbing from the foot of the mountain to the top takes 3 hours.","py":"cóng shān xià pá dào shān shàng, xū yào 3 gè zhōng tóu."},{"zh":"從捷運站走路走到學校，只需要九分鐘。","en":"Walking from the MRT station to school only takes nine minutes.","py":"cóng jié yùn zhàn zǒu lù zǒu dào xué xiào, zhǐ xū yào jiǔ fēn zhōng."},{"zh":"我們昨天聊到很晚。","en":"We chatted until late last night.","py":"wǒ men zuó tiān liáo dào hěn wǎn."},{"zh":"他工作到十點。","en":"He worked until 10 o'clock.","py":"tā gōng zuò dào shí diǎn."},{"zh":"我看書看到十二點才睡。","en":"I read until midnight before going to sleep.","py":"wǒ kàn shū kàn dào shí èr diǎn cái shuì."},{"zh":"我昨天把行李從機場帶到旅館了。","en":"Yesterday I brought the luggage from the airport to the hotel.","py":"wǒ zuó tiān bǎ xíng lǐ cóng jī chǎng dài dào lǚ guǎn le."},{"zh":"這封信我要寄到美國去。","en":"I want to mail this letter to America.","py":"zhè fēng xìn wǒ yào jì dào měi guó qù."},{"zh":"他每天早上跑到河邊公園，再走回學校。","en":"Every morning he runs to the riverside park, then walks back to school.","py":"tā měi tiān zǎo shàng pǎo dào hé biān gōng yuán, zài zǒu huí xué xiào."},{"zh":"從台北飛到東京，大概三個小時。","en":"Flying from Taipei to Tokyo takes about three hours.","py":"cóng tái běi fēi dào dōng jīng, dà gài sān gè xiǎo shí."},{"zh":"你可以幫我把這箱書搬到樓上去嗎？","en":"Can you help me move this box of books upstairs?","py":"nǐ kě yǐ bāng wǒ bǎ zhè xiāng shū bān dào lóu shàng qù ma?"},{"zh":"老闆說會把午飯送到辦公室來。","en":"The boss said he'd have lunch delivered to the office.","py":"lǎo bǎn shuō huì bǎ wǔ fàn sòng dào bàn gōng shì lái."}],"cy":"Write a sentence naming a movement verb + 到 + a destination place that the thing/person ends up at.","ov":"This is the same 到 that reappears inside Ⅳ's 把 pattern (A 把 B V 到 + place) — the two are one idea, taught together. To distinguish from Ⅲ's V+在: 到 goes with moving verbs (搬, 拿, 送, 踢, 騎, 開 — things that travel), 在 goes with placing verbs (放, 留, 存, 寫 — things that get set down and stay). This is the book's own explicit rule and the most exam-likely discrimination in the lesson. Forward: the same 到+place+來/去 shape returns in B2 L7 point 4, which drops the explicit 到+place and keeps only a bare direction (走出來, 開過來, 丟進去) — the 'where am I standing' test carries over unchanged.","tw":"機車 (jīchē) is the Taiwan word for a scooter; mainland says 摩托車 (mótuōchē). 星期 is read xīngqí in Taiwan vs xīngqī on the mainland. 搭 (dā) is the normal Taiwan verb for taking public transport. 鐘頭 (zhōngtóu) is Taiwan-colloquial for 'an hour'; mainland prefers 小時. 捷運 (jiéyùn) is the Taiwan word for the metro/MRT; mainland 地鐵.","src":"B2L6"},{"id":"n21-2","t":"Ⅱ. 給 · indirect object marker: V + 給 + person + thing","e":"Double-object verbs like 賣, 送, 付 need both a thing that changes hands and a person who ends up with it. 給 marks the receiver right after the verb, while the thing itself carries no marker and sits at the end.","pat":"V給 + 人 + 東西. The person comes straight after 給; the thing trails at the end with nothing marking it.","tgt":["給"],"alt":["到","跟","為"],"s":[{"zh":"王先生賣給他一輛機車。","en":"Mr. Wang sold him a motorcycle.","py":"wáng xiān shēng mài gěi tā yī liàng jī chē."},{"zh":"田中誠一付給房東三個月的房租。","en":"Tanaka paid the landlord three months' rent.","py":"tián zhōng chéng yī fù gěi fáng dōng sān gè yuè de fáng zū."},{"zh":"他從法國回來，送給白如玉一些法國甜點。","en":"He came back from France and gave Bai Ruyu some French sweets.","py":"tā cóng fǎ guó huí lái, sòng gěi bái rú yù yī xiē fǎ guó tián diǎn."},{"zh":"他想賣給我朋友這個電腦。","en":"He wants to sell this computer to my friend.","py":"tā xiǎng mài gěi wǒ péng yǒu zhè ge diàn nǎo."},{"zh":"他想賣這個電腦給我朋友。","en":"He wants to sell this computer to my friend.","py":"tā xiǎng mài zhè ge diàn nǎo gěi wǒ péng yǒu."},{"zh":"這個電腦，他想賣給我朋友。","en":"This computer — he wants to sell it to my friend.","py":"zhè ge diàn nǎo, tā xiǎng mài gěi wǒ péng yǒu."},{"zh":"房東不租給她了。","en":"The landlord won't rent to her anymore.","py":"fáng dōng bù zū gěi tā le."},{"zh":"田中誠一還沒付給房東上個月的房租。","en":"Tanaka hasn't yet paid the landlord last month's rent.","py":"tián zhōng chéng yī hái méi fù gěi fáng dōng shàng gè yuè de fáng zū."},{"zh":"你的腳踏車，賣給白如玉了沒有？","en":"Your bike — have you sold it to Bai Ruyu yet?","py":"nǐ de jiǎo tà chē, mài gěi bái
