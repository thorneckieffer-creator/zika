<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>字卡 · 當代中文</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3edde">

<script>try{var L=JSON.parse(localStorage.getItem('zika_look')||'{}'),R=document.documentElement;if(L.t==='dark'||(L.t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))R.setAttribute('data-theme','dark');if(L.p)R.setAttribute('data-pal',L.p);if(L.a)R.setAttribute('data-accent',L.a);if(L.z)R.setAttribute('data-zh',L.z);}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <header class="mast" id="appBar">
    <button class="brand" type="button" onclick="go('home')" aria-label="字卡 — Today"><span class="logo">字</span><span class="bname">字卡</span></button>
    <span class="grow"></span>
    <button class="tbtn rf" id="refreshBtn" title="refresh — sync and load the latest version" aria-label="refresh" onclick="appRefresh()">↻</button>
    <button class="tbtn" id="themeBtn" title="day / night" aria-label="day / night" onclick="toggleTheme()">☾</button>
    <button class="tbtn" id="setBtn" title="Settings" aria-label="Settings" onclick="go('set')">⚙</button>
    <div class="greet" id="greet" hidden></div>
  </header>
  <div id="bkBanner" class="banner" style="display:none">No backup in over a week — <b>Settings → Backup</b> → choose a file once and it saves itself from then on.</div>
  <div id="storageBanner" class="banner">Browser storage is unavailable here — progress lives in memory only. Export from Settings before closing.</div>
  <div class="tabs">
    <button id="tabHome" class="on" onclick="go('home')">Today<span id="bDue" class="b zero">0</span></button>
    <button id="tabRev" onclick="go('rev')">Review</button>
    <button id="tabDrill" onclick="go('drill')">Drill</button>
    <button id="tabGram" onclick="go('gram')">Grammar</button>
    <button id="tabBrain" onclick="go('brain')">Brain</button>
    <button id="tabLib" onclick="go('lib')">Library</button>
    <button id="tabSet" onclick="go('set')">Settings</button>
  </div>
  <div id="vHome"></div>
  <div id="vDrill" style="display:none"></div>
  <div id="vGram" style="display:none"></div>
  <div id="vBrain" style="display:none"></div>
  <div id="vLib" style="display:none"></div>
  <div id="vRev" style="display:none"></div>
  <div id="vSet" style="display:none"></div>
  <div class="foot">FSRS-5 · <span id="appVer"></span></div>
</div>
<div id="printSheet"></div>
