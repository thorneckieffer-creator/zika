<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>師大 Book 1 · 字卡</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf9f7">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#faf9f7; --panel:#ffffff; --tint:#f4f2ee; --ink:#1d1c1a; --mut:#98928a; --mut2:#c4bfb6;
  --line:#eae7e2; --line2:#dedad3;
  --acc:#0e7266; --accT:#e7f1ef;
  --red:#bc4034; --amber:#a8681b; --blue:#33628f; --plum:#7c5296; --gold:#9a7328;
  --t1:#bc4034; --t2:#2e7d54; --t3:#33628f; --t4:#7c5296; --t0:#98928a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,"Helvetica Neue",Arial,"Noto Sans TC",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.zh{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.kai{font-family:"Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC",serif}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 110px}
.mast{text-align:center;margin-bottom:22px}
.mast .hanzi{font-size:26px;letter-spacing:.35em;margin-left:.35em;font-weight:600}
.mast .eng{font-size:11.5px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.tabs{display:flex;justify-content:center;gap:34px;border-bottom:1px solid var(--line);margin-bottom:26px}
.tabs button{border:0;background:none;padding:10px 2px 12px;font-size:13.5px;font-weight:600;letter-spacing:.02em;color:var(--mut);cursor:pointer;position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.tabs .b{font-size:10.5px;font-weight:700;color:#fff;background:var(--acc);border-radius:99px;padding:1px 6px;margin-left:5px;position:relative;top:-1px}
.tabs .b.zero{background:var(--mut2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px}
.lab{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.muted{color:var(--mut)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;letter-spacing:.01em}
.btn:hover{opacity:.85}
.btn.big{width:100%;padding:14px;font-size:15px;border-radius:12px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{opacity:1;background:var(--tint)}
.btn.sm{padding:5px 12px;font-size:12px;border-radius:8px;font-weight:600}
.btn:disabled{opacity:.35;cursor:default}
.link{color:var(--acc);cursor:pointer;text-decoration:none;font-weight:600}
.link:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:0}
.stat{padding:4px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .n .d{font-size:13px;color:var(--mut2);font-weight:600}
.stat .l{font-size:11px;color:var(--mut);margin-top:1px;letter-spacing:.02em}
.fc{display:flex;gap:8px;align-items:flex-end;height:64px;margin-top:18px}
.fc .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--mut)}
.fc .bar i{display:block;width:100%;max-width:26px;background:var(--line2);border-radius:3px;min-height:2px}
.fc .bar.t i{background:var(--acc)}
.fc .bar b{color:var(--ink);font-size:10.5px;font-variant-numeric:tabular-nums}
details.guide{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
details.guide summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);list-style:none}
details.guide summary::-webkit-details-marker{display:none}
details.guide .gd{font-size:13.5px;color:#4c4a44;margin-top:10px}
details.guide .gd p{margin-bottom:9px}
.search{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:14px;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--line2)}
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filters button{border:1px solid transparent;background:transparent;border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--mut);font-weight:600}
.filters button.on{background:var(--ink);color:#fff}
.lesson{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--panel);overflow:hidden}
.lesson>.head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none}
.lesson>.head:hover{background:var(--tint)}
.lesson .car{color:var(--mut2);font-size:12px;transition:.15s;flex:none}
.lesson.open .car{transform:rotate(90deg)}
.lesson .ttl{font-weight:600;font-size:14px}
.lesson .sub{font-size:11.5px;color:var(--mut);margin-top:1px}
.lesson .acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.prog{height:3px;background:var(--tint)}
.prog i{display:block;height:100%;background:var(--acc)}
.wl{border-top:1px solid var(--line)}
.wrow{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--tint)}
.wrow:last-child{border-bottom:0}
.wrow .tr{font-size:24px;min-width:92px;line-height:1.3}
.wrow .info{flex:1;min-width:0}
.wrow .py{font-size:13px;font-weight:500}
.wrow .mn{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.tag.due{color:var(--red)} .tag.ok{color:var(--acc)} .tag.mat{color:var(--gold)} .tag.known{color:var(--blue)}
.tag.simp{color:var(--plum);text-transform:none;letter-spacing:0;font-size:11.5px}
.wbtn{border:1px solid var(--line2);background:transparent;color:var(--mut);border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.wbtn:hover{background:var(--tint);color:var(--ink)}
.wbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wbtn.kn{font-size:13px}
.wbtn.kn.on{background:var(--acc);border-color:var(--acc)}
.rev-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;color:var(--mut)}
.mtag{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.mtag.rec{color:var(--acc)} .mtag.prod{color:var(--amber)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 24px;text-align:center;min-height:320px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.stage .bigzh{font-size:78px;line-height:1.25;font-weight:500}
.stage .hint{color:var(--mut);font-size:12.5px}
.stage .pyline{font-size:25px;font-weight:500}
.stage .meaning{font-size:16.5px;max-width:480px;margin:0 auto;color:#37352f}
.stage .pos{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
.stage .simpnote{font-size:12.5px;color:var(--plum)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades button{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:10px 4px 8px;cursor:pointer;font-weight:700;font-size:13.5px}
.grades button:hover{background:var(--tint)}
.grades .iv{display:block;font-weight:500;font-size:10.5px;color:var(--mut);margin-top:1px;font-variant-numeric:tabular-nums}
.grades .g1{color:var(--red)}.grades .g2{color:var(--amber)}.grades .g3{color:var(--acc)}.grades .g4{color:var(--blue)}
.canv-box{margin:4px auto 0;position:relative;width:min(280px,100%)}
canvas.pad{background:#fff;border:1px solid var(--line2);border-radius:14px;touch-action:none;width:100%;aspect-ratio:1;display:block}
.canv-ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:190px;color:rgba(29,28,26,.07);pointer-events:none;overflow:hidden}
.canv-tools{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.repchip{font-size:12px;font-weight:700;color:var(--acc);background:var(--accT);border-radius:99px;padding:4px 12px;font-variant-numeric:tabular-nums}
.done{padding:46px 10px;text-align:center}
.done .zhd{font-size:40px;margin-bottom:10px}
kbd{background:var(--tint);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--mut)}
.tone1{color:var(--t1)}.tone2{color:var(--t2)}.tone3{color:var(--t3)}.tone4{color:var(--t4)}.tone0{color:var(--t0)}
.banner{background:#fbf4e4;border:1px solid #eedfb9;color:#8a6414;font-size:12.5px;border-radius:12px;padding:9px 14px;margin-bottom:14px;display:none}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--tint);gap:14px}
.set-row:last-child{border-bottom:0}
.set-row b{font-size:14px;font-weight:600}
.set-row .d{font-size:12px;color:var(--mut);margin-top:1px;max-width:420px}
input[type=range]{accent-color:var(--ink);width:130px}
input[type=number]{width:64px;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:14px;text-align:center;outline:none}
.tgl{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;flex:none;border:0}
.tgl.on{background:var(--ink)}
.tgl i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on i{left:19px}
.foot{text-align:center;color:var(--mut2);font-size:11px;margin-top:26px;letter-spacing:.04em}
/* ---- grammar ---- */
.gpt{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:var(--panel);overflow:hidden}
.gpt>.gh{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}
.gpt>.gh:hover{background:var(--tint)}
.gpt .gt{font-weight:600;font-size:14px}
.gpt .ge{font-size:12px;color:var(--mut);margin-top:1px}
.gdots{margin-left:auto;display:flex;gap:3px;flex:none}
.gdot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.gdot.on{background:var(--acc)}
.gex{border-top:1px solid var(--tint);padding:12px 16px}
.gsent{display:flex;align-items:baseline;gap:9px;padding:6px 0;flex-wrap:wrap}
.gsent .z{font-size:17px}
.gsent .e{font-size:12.5px;color:var(--mut)}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.qtype{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--plum)}
.qzh{font-size:26px;line-height:1.6}
.qzh .blank{display:inline-block;min-width:52px;border-bottom:2px solid var(--ink);margin:0 3px;color:var(--acc);font-weight:700}
.qen{font-size:14px;color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;max-width:460px;margin:4px auto 0;width:100%}
.opts button{border:1px solid var(--line2);background:var(--panel);border-radius:11px;padding:11px 8px;font-size:16px;cursor:pointer}
.opts button:hover{background:var(--tint)}
.opts button.right{background:#e3efe9;border-color:var(--acc);color:var(--acc)}
.opts button.wrong{background:#fdeceb;border-color:var(--red);color:var(--red)}
.opts.sm button{font-size:13.5px;line-height:1.5}
.chunks,.answer-line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px;margin:0 auto}
.chunks button{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 13px;font-size:18px;cursor:pointer}
.chunks button:disabled{opacity:.25}
.answer-line{min-height:46px;background:var(--tint);border-radius:12px;padding:8px;align-items:center}
.answer-line span{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:18px;cursor:pointer}
.gtxt{width:100%;max-width:480px;margin:0 auto;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;font-family:inherit;resize:vertical;min-height:64px;outline:none;background:var(--panel)}
.qfoot{display:flex;gap:8px;justify-content:center;margin-top:6px}
.qprog{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.gres{font-size:14px;font-weight:600}
.gres.ok{color:var(--acc)} .gres.bad{color:var(--red)}
/* paper practice */
.paper-chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;flex-direction:column;align-items:center;background:var(--tint);border-radius:11px;padding:8px 12px;min-width:54px}
.pchip .c{font-size:24px;line-height:1.3}
.pchip .p{font-size:10px;color:var(--mut)}
.pchip .tag2{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
#printSheet{display:none}
@media print{
  body>.wrap{display:none!important}
  #printSheet{display:block!important;font-family:"Noto Serif TC","Songti TC",serif}
  #printSheet .prow{page-break-inside:avoid;margin-bottom:4mm}
  #printSheet .plab{font-size:11pt;margin-bottom:1.5mm}
  #printSheet .plab .pm{color:#666;font-size:9pt;margin-left:3mm}
  #printSheet .pboxes{display:flex;flex-wrap:wrap;gap:0}
  #printSheet .pbox{width:11mm;height:11mm;border:0.25mm solid #bbb;margin:-0.25mm 0 0 -0.25mm;display:flex;align-items:center;justify-content:center;font-size:8.5mm;color:#ccc;background:
    linear-gradient(to right,transparent 49.8%,#eee 49.8%,#eee 50.2%,transparent 50.2%),
    linear-gradient(to bottom,transparent 49.8%,#eee 49.8%,#eee 50.2%,transparent 50.2%)}
  #printSheet h1{font-size:14pt;margin-bottom:4mm}
}
/* ---- brain ---- */
.hero-row{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.hero-big .n{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero-big .n .of{font-size:16px;color:var(--mut2);font-weight:600}
.hero-big .l{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-top:5px}
.hero-sub{font-size:12.5px;color:var(--mut);padding-bottom:6px}
.stagebar{display:flex;height:26px;border-radius:7px;overflow:hidden;gap:2px;margin-top:16px}
.stagebar i{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;min-width:2px;font-style:normal;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--mut)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.05)}
.s0{background:#efede9;color:#a9a49b}
.s1{background:#dcebe7;color:var(--ink)}
.s2{background:#7fbfb3;color:#123f38}
.s3{background:#2f9184;color:#fff}
.s4{background:#0b5d54;color:#fff}
.segbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.segbar .cap{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);margin-right:2px}
.segbar button{border:1px solid transparent;background:transparent;border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--mut);font-weight:600}
.segbar button.on{background:var(--ink);color:#fff}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px}
.wall.words{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
.tile{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;position:relative;transition:transform .08s}
.tile:hover{transform:scale(1.12);z-index:2}
.tile.sel{outline:2px solid var(--ink);outline-offset:1px}
.wall.words .tile{aspect-ratio:auto;padding:8px 4px;font-size:15px;line-height:1.2}
.tile .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--red);border:1px solid #fff}
.grp{margin:18px 0 8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--tint);padding-bottom:5px}
.grp:first-of-type{margin-top:8px}
.grp .gn{color:var(--mut2);font-weight:600;letter-spacing:.02em;text-transform:none}
.ticker{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.tchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--tint);border-radius:11px;padding:9px 13px;cursor:pointer}
.tchip .c{font-size:21px;line-height:1.25}
.tchip .d{font-size:10px;color:var(--mut)}
.detail{border:1px solid var(--line2);border-radius:14px;padding:16px 18px;margin:14px 0;background:var(--tint);display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.detail .big{font-size:54px;line-height:1.15}
.detail .body{flex:1;min-width:220px}
.detail .close{margin-left:auto;border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.wchip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 9px;margin:3px 4px 0 0;font-size:12.5px;cursor:pointer}
.wchip:hover{border-color:var(--line2)}
.kv{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mut)}
.kv b{color:var(--ink);font-weight:600}
.membar{height:4px;border-radius:2px;background:var(--line);margin-top:10px;max-width:260px;overflow:hidden}
.membar i{display:block;height:100%;background:var(--acc)}
/* audio + strokes + timelapse */
.spk{border:1px solid var(--line2);background:var(--panel);color:var(--mut);border-radius:99px;width:30px;height:30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none}
.spk:hover{background:var(--tint);color:var(--ink)}
.spk svg{width:15px;height:15px;fill:currentColor}
.spk.lg{width:38px;height:38px}.spk.lg svg{width:18px;height:18px}
.strokerow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.strokebox{width:104px;height:104px;border:1px solid var(--line);border-radius:12px;background:#fff;position:relative}
.strokebox svg{display:block}
.stroketools{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px}
.tl-chart{width:100%;height:96px;display:block;margin-top:4px}
.tl-scrub{width:100%;accent-color:var(--ink);margin-top:8px}
.tl-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.tl-banner{background:var(--accT);color:var(--acc);font-size:12px;font-weight:600;border-radius:9px;padding:7px 12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
select.vsel{max-width:230px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:12.5px;outline:none;color:var(--ink)}
@media(max-width:560px){.wrow .tr{min-width:70px;font-size:21px}.stage .bigzh{font-size:60px}.tabs{gap:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="hanzi zh">字卡</div>
    <div class="eng">Contemporary Chinese · Book 1 · 師大</div>
  </header>
  <div id="storageBanner" class="banner">Browser storage is unavailable here — progress lives in memory only. Export from Settings before closing.</div>
  <div class="tabs">
    <button id="tabHome" class="on" onclick="go('home')">Today<span id="bDue" class="b zero">0</span></button>
    <button id="tabRev" onclick="go('rev')">Review</button>
    <button id="tabGram" onclick="go('gram')">Grammar</button>

const GRAMMAR = {"1":[{"id":"g1-1","t":"Questions with 嗎","e":"Add 嗎 to the end of any statement to make a yes/no question — word order never changes.","tgt":["嗎"],"alt":["呢","吧","啊"],"s":[{"zh":"你是李小姐嗎？","en":"Are you Miss Li?"},{"zh":"這是咖啡嗎？","en":"Is this coffee?"},{"zh":"你要喝茶嗎？","en":"Do you want to drink tea?"},{"zh":"他是美國人嗎？","en":"Is he American?"}],"cy":"Turn any statement about yourself into a yes/no question with 嗎."},{"id":"g1-2","t":"姓 and 叫 — Introducing yourself","e":"姓 gives your surname; 叫 gives your full or given name.","tgt":["姓","叫"],"alt":["是","要"],"s":[{"zh":"我姓王。","en":"My surname is Wang."},{"zh":"我叫王開文。","en":"I'm called Wang Kaiwen."},{"zh":"請問你姓什麼？","en":"May I ask your surname?"},{"zh":"他叫李明華。","en":"He is called Li Minghua."}],"cy":"Introduce yourself twice: once with 姓, once with 叫."},{"id":"g1-3","t":"Bounce-back 呢","e":"呢 bounces a question back: 我很好，你呢？","tgt":["呢"],"alt":["嗎","吧","啊"],"s":[{"zh":"我很好，你呢？","en":"I'm good, and you?"},{"zh":"我喜歡喝茶，你呢？","en":"I like drinking tea, and you?"},{"zh":"我是美國人，你呢？","en":"I'm American, and you?"}],"cy":"State a preference of yours, then bounce it back with 呢."},{"id":"g1-4","t":"Negation with 不","e":"Place 不 directly before the verb to negate it.","tgt":["不"],"alt":["沒","很","都"],"s":[{"zh":"我不喜歡咖啡。","en":"I don't like coffee."},{"zh":"他不是日本人。","en":"He isn't Japanese."},{"zh":"我不喝烏龍茶。","en":"I don't drink oolong tea."}],"cy":"Say two things you don't do or don't like, using 不."}],"2":[{"id":"g2-1","t":"Possessive 的","e":"的 links possessor and noun: 我的家人 my family; also links descriptions: 漂亮的房子.","tgt":["的"],"alt":["得","了","都"],"s":[{"zh":"這是我的家人。","en":"This is my family."},{"zh":"那是老師的書。","en":"That is the teacher's book."},{"zh":"她的照片很好看。","en":"Her photos are good-looking."},{"zh":"他們的房子很漂亮。","en":"Their house is beautiful."}],"cy":"Describe two things you own using 的."},{"id":"g2-2","t":"Measure words 個 and 張","e":"Numbers need a measure word: 個 for people/general, 張 for flat things (photos, paper).","tgt":["個","張"],"alt":["杯","家","支"],"s":[{"zh":"我有兩個姐姐。","en":"I have two older sisters."},{"zh":"他有三個哥哥。","en":"He has three older brothers."},{"zh":"這是一張照片。","en":"This is one photo."},{"zh":"我要五張紙。","en":"I want five sheets of paper."}],"cy":"Count your family members with 個 and something flat with 張."},{"id":"g2-3","t":"有 and 沒有","e":"有 = to have / there is. Negate 有 with 沒, never 不.","tgt":["有","沒有"],"alt":["是","不是"],"s":[{"zh":"我有兩個姐姐。","en":"I have two older sisters."},{"zh":"你有兄弟嗎？","en":"Do you have brothers?"},{"zh":"我沒有妹妹。","en":"I don't have a younger sister."},{"zh":"這裡有很多照片。","en":"There are many photos here."}],"cy":"Say one thing you have (有) and one you don't (沒有)."},{"id":"g2-4","t":"都 — all / both","e":"都 goes AFTER the subject and BEFORE the verb: 我們都是學生.","tgt":["都"],"alt":["也","很","常"],"s":[{"zh":"我們都是學生。","en":"We are all students."},{"zh":"他們都很好看。","en":"They are all good-looking."},{"zh":"照片都很漂亮。","en":"The photos are all beautiful."}],"cy":"Say something true of your whole family/class using 都."},{"id":"g2-5","t":"幾 — how many","e":"幾 asks small quantities and always needs a measure word: 幾個, 幾張.","tgt":["幾"],"alt":["多少","什麼","誰"],"s":[{"zh":"你有幾個兄弟？","en":"How many brothers do you have?"},{"zh":"你家有幾個人？","en":"How many people are in your family?"},{"zh":"這是幾張照片？","en":"How many photos is this?"}],"cy":"Ask someone a 幾 + measure word question about their family."},{"id":"g2-6","t":"兩 vs 二","e":"Counting things: 兩 + measure word (兩個人). Counting numbers: 二 (一、二、三).","tgt":["兩"],"alt":["二","幾","個"],"s":[{"zh":"我有兩個姐姐。","en":"I have two older sisters."},{"zh":"他買了兩張照片。","en":"He bought two photos."},{"zh":"我們家有兩個哥哥。","en":"Our family has two older brothers."}],"cy":"Mention two of something you have, using 兩 + the right measure word."}],"3":[{"id":"g3-1","t":"打 vs 踢 — playing sports","e":"打 for hand sports (打籃球/棒球/網球); 踢 for foot sports (踢足球).","tgt":["打","踢"],"alt":["做","玩"],"s":[{"zh":"我常打籃球。","en":"I often play basketball."},{"zh":"他喜歡打網球。","en":"He likes playing tennis."},{"zh":"我們週末踢足球。","en":"We play soccer on weekends."}],"cy":"Say which sports you play, choosing 打 or 踢 correctly."},{"id":"g3-2","t":"想 — want / think","e":"想 + verb = want to; 想 + clause = think; 想 + person = miss.","tgt":["想"],"alt":["要","會","喜歡"],"s":[{"zh":"我想去看電影。","en":"I want to go watch a movie."},{"zh":"你想吃什麼？","en":"What do you want to eat?"},{"zh":"我想他是老師。","en":"I think he is a teacher."}],"cy":"Say two things you want to do this weekend with 想."},{"id":"g3-3","t":"還是 — or (in questions)","e":"還是 offers a choice in questions. In statements use 或是.","tgt":["還是"],"alt":["或是","也","和"],"s":[{"zh":"你想看電影還是聽音樂？","en":"Do you want to watch a movie or listen to music?"},{"zh":"你要喝茶還是咖啡？","en":"Do you want tea or coffee?"},{"zh":"我們今天去還是明天去？","en":"Do we go today or tomorrow?"}],"cy":"Ask a friend an A-還是-B question about the weekend."},{"id":"g3-4","t":"Suggestion 吧","e":"吧 softens a sentence into a suggestion (我們去吧) or a guess (你是美國人吧？).","tgt":["吧"],"alt":["嗎","呢","啊"],"s":[{"zh":"我們去看電影吧。","en":"Let's go watch a movie."},{"zh":"吃晚飯吧。","en":"Let's eat dinner."},{"zh":"你是美國人吧？","en":"You're American, right?"}],"cy":"Make two suggestions to a friend using 吧."},{"id":"g3-5","t":"好不好 / 怎麼樣","e":"Tag onto a suggestion to seek agreement: …，好不好？ …，怎麼樣？","tgt":["好不好","怎麼樣"],"alt":["是不是","對不對"],"s":[{"zh":"我們明天去游泳，好不好？","en":"Let's go swimming tomorrow, okay?"},{"zh":"今天晚上看電影，怎麼樣？","en":"How about watching a movie tonight?"}],"cy":"Propose a plan and tag it with 好不好 or 怎麼樣."},{"id":"g3-6","t":"也 — also","e":"也 sits after the subject, before the verb — never at the end.","tgt":["也"],"alt":["都","還","again"],"s":[{"zh":"我喜歡籃球，我也喜歡足球。","en":"I like basketball, and I also like soccer."},{"zh":"他也想去。","en":"He also wants to go."},{"zh":"我也常游泳。","en":"I also often swim."}],"cy":"Agree with something a friend likes using 也."},{"id":"g3-7","t":"常 — often","e":"常 before the verb: 我常運動.","tgt":["常"],"alt":["都","也","很"],"s":[{"zh":"我常運動。","en":"I often exercise."},{"zh":"你常看電影嗎？","en":"Do you often watch movies?"},{"zh":"我們常一起吃晚飯。","en":"We often eat dinner together."}],"cy":"Say two things you often do with 常."}],"4":[{"id":"g4-1","t":"多少 vs 幾","e":"多少 for big/unknown amounts & prices (no measure word needed); 幾 for small counts (needs measure word).","tgt":["多少","幾"],"alt":["什麼","怎麼"],"s":[{"zh":"這個多少錢？","en":"How much is this?"},{"zh":"一共多少錢？","en":"How much altogether?"},{"zh":"你要幾杯咖啡？","en":"How many cups of coffee do you want?"},{"zh":"你有幾個姐姐？","en":"How many older sisters do you have?"}],"cy":"Ask a shop owner the price of something with 多少錢."},{"id":"g4-2","t":"太…了 — too…","e":"太 + adjective + 了: the 了 is required — 太貴 alone sounds unfinished.","tgt":["太","了"],"alt":["很","真","最"],"s":[{"zh":"這個手機太貴了。","en":"This phone is too expensive."},{"zh":"那個包子太大了。","en":"That steamed bun is too big."},{"zh":"我的手機太舊了。","en":"My phone is too old."}],"cy":"Complain about two things with 太…了."},{"id":"g4-3","t":"能 vs 可以","e":"能 = ability/possibility; 可以 = permission/acceptability.","tgt":["能","可以"],"alt":["會","要"],"s":[{"zh":"這支手機能上網。","en":"This phone can go online."},{"zh":"你能幫我嗎？","en":"Can you help me?"},{"zh":"我可以看看嗎？","en":"May I take a look?"},{"zh":"這裡可以內用。","en":"You can dine in here."}],"cy":"Ask permission with 可以, then state an ability with 能."},{"id":"g4-4","t":"Measure words 杯 / 支 / 種","e":"杯 cups of drinks; 支 long thin objects (phones, pens); 種 kinds/types.","tgt":["杯","支","種"],"alt":["個","張","家"],"s":[{"zh":"我要一杯咖啡。","en":"I want one cup of coffee."},{"zh":"他買了一支手機。","en":"He bought a cell phone."},{"zh":"你們有幾種包子？","en":"How many kinds of steamed buns do you have?"}],"cy":"Order a drink and ask about types (種) of something."},{"id":"g4-5","t":"為什麼 — why","e":"為什麼 before the verb phrase asks why.","tgt":["為什麼"],"alt":["怎麼","什麼","多少"],"s":[{"zh":"為什麼這麼貴？","en":"Why is it so expensive?"},{"zh":"你為什麼要買新手機？","en":"Why do you want to buy a new phone?"}],"cy":"Ask why something is so expensive / so good with 為什麼."},{"id":"g4-6","t":"了 — change of state","e":"Sentence-final 了 marks a new situation: 包子冷了 the bun has gotten cold.","tgt":["了"],"alt":["的","得","嗎"],"s":[{"zh":"我的手機太舊了。","en":"My phone is too old now."},{"zh":"包子冷了。","en":"The bun has gotten cold."}],"cy":"Describe something that has changed recently with 了."}],"5":[{"id":"g5-1","t":"最 — superlative","e":"最 + adjective/verb = the most: 最有名, 最喜歡.","tgt":["最"],"alt":["很","太","更"],"s":[{"zh":"這家店最有名。","en":"This shop is the most famous."},{"zh":"牛肉麵是最好吃的。","en":"Beef noodle soup is the most delicious."},{"zh":"我最喜歡小籠包。","en":"I like xiaolongbao the most."}],"cy":"Name your favorite Taiwanese food using 最."},{"id":"g5-2","t":"真 vs 很","e":"真 = really! (exclamation, surprise); 很 = neutral 'very'.","tgt":["真","很"],"alt":["太","最"],"s":[{"zh":"這個真好吃！","en":"This is really delicious!"},{"zh":"你真會做飯。","en":"You really know how to cook."},{"zh":"這個很好吃。","en":"This is (very) delicious."}],"cy":"React to a meal with 真, then describe it neutrally with 很."},{"id":"g5-3","t":"有一點 — a little (negative)","e":"有一點 + adjective implies mild complaint: 有一點辣 a bit (too) spicy.","tgt":["有一點"],"alt":["一點","很","真"],"s":[{"zh":"這個菜有一點辣。","en":"This dish is a little spicy."},{"zh":"湯有一點鹹。","en":"The soup is a little salty."}],"cy":"Politely complain about a dish with 有一點."},{"id":"g5-4","t":"會 — learned ability","e":"會 = can (because you learned it): 我會做飯. Compare 能 (circumstances), 可以 (permission).","tgt":["會"],"alt":["能","可以","要"],"s":[{"zh":"我會做飯。","en":"I can cook."},{"zh":"你會說中文嗎？","en":"Can you speak Chinese?"},{"zh":"她會做小籠包。","en":"She can make xiaolongbao."}],"cy":"Say two skills you have with 會 and one you don't (不會)."},{"id":"g5-5","t":"可是 and 所以","e":"可是 = but; 所以 = so/therefore.","tgt":["可是","所以"],"alt":["因為","還是"],"s":[{"zh":"我喜歡臭豆腐，可是我朋友不喜歡。","en":"I like stinky tofu, but my friend doesn't."},{"zh":"我怕辣，所以我不吃。","en":"I'm afraid of spicy food, so I don't eat it."},{"zh":"這個很好吃，所以我常來。","en":"This is delicious, so I come often."}],"cy":"Make one sentence with 可是 and one with 所以 about food."},{"id":"g5-6","t":"Measure words 碗 and 家","e":"碗 bowls of food; 家 businesses/shops/restaurants.","tgt":["碗","家"],"alt":["杯","個","張"],"s":[{"zh":"我要一碗牛肉麵。","en":"I want one bowl of beef noodle soup."},{"zh":"這家店很有名。","en":"This shop is very famous."},{"zh":"那家餐廳不錯。","en":"That restaurant is pretty good."}],"cy":"Order a bowl of something at a famous 店 using both 碗 and 家."},{"id":"g5-7","t":"得 — complement marker","e":"Verb + 得 + how well: 他做得很好. The 得 links a verb to its quality.","tgt":["得"],"alt":["的","了","地"],"s":[{"zh":"他做得很好。","en":"He does it very well."},{"zh":"你說得對。","en":"You're right."},{"zh":"她吃得很少。","en":"She eats very little."}],"cy":"Compliment someone's cooking or Chinese with V + 得 + …"}],"6":[{"id":"g6-1","t":"在 — location verb","e":"在 states location: X 在 place; also 'at' before place + verb: 我在教室上課.","tgt":["在"],"alt":["有","是","到"],"s":[{"zh":"圖書館在哪裡？","en":"Where is the library?"},{"zh":"學校在山上。","en":"The school is on the mountain."},{"zh":"我在教室上課。","en":"I attend class in the classroom."},{"zh":"他們在外面吃飯。","en":"They are eating outside."}],"cy":"Say where you live and where you study using 在."},{"id":"g6-2","t":"Position words","e":"前面 front, 後面 back, 旁邊 beside, 裡面 inside, 外面 outside, 附近 nearby.","tgt":["前面","旁邊","附近","後面"],"alt":["裡面","外面"],"s":[{"zh":"學校前面有海。","en":"In front of the school there is the ocean."},{"zh":"圖書館旁邊是教室。","en":"Beside the library is the classroom."},{"zh":"商店在宿舍附近。","en":"The shop is near the dormitory."}],"cy":"Describe what's around your home with two position words."},{"id":"g6-3","t":"這裡 / 那裡 / 哪裡","e":"Here / there / where.","tgt":["哪裡","這裡","那裡"],"alt":["什麼","誰"],"s":[{"zh":"你在哪裡？","en":"Where are you?"},{"zh":"我在這裡。","en":"I'm here."},{"zh":"那裡的風景很美。","en":"The scenery there is very beautiful."}],"cy":"Ask where something is, then answer with 這裡/那裡."},{"id":"g6-4","t":"遠 and 近","e":"X 離 Y 遠/近 — far/near from. 離 marks the reference point.","tgt":["遠","近","離"],"alt":["快","慢"],"s":[{"zh":"學校離這裡遠嗎？","en":"Is the school far from here?"},{"zh":"宿舍離教室很近。","en":"The dormitory is very close to the classroom."},{"zh":"海離學校不遠。","en":"The ocean is not far from the school."}],"cy":"Say how far your home is from school using 離…遠/近."},{"id":"g6-5","t":"聽說 — I heard that…","e":"聽說 + clause reports hearsay.","tgt":["聽說"],"alt":["知道","覺得","想"],"s":[{"zh":"聽說花蓮的風景很美。","en":"I heard Hualien's scenery is beautiful."},{"zh":"聽說那裡的小吃很好吃。","en":"I heard the snacks there are delicious."}],"cy":"Report something you heard about Taiwan with 聽說."},{"id":"g6-6","t":"Measure words 樓 and 棟","e":"樓 floors (三樓 3rd floor); 棟 whole buildings.","tgt":["樓","棟"],"alt":["間","家","個"],"s":[{"zh":"我住在三樓。","en":"I live on the third floor."},{"zh":"教室在五樓。","en":"The classroom is on the fifth floor."},{"zh":"那棟大樓是圖書館。","en":"That building is the library."}],"cy":"Say which floor you live on and point out a building with 棟."}],"7":[{"id":"g7-1","t":"Telling time — 點 and 分","e":"X點Y分; 半 = half past. Time words go BEFORE the verb.","tgt":["點","分","半"],"alt":["號","月"],"s":[{"zh":"現在幾點？","en":"What time is it now?"},{"zh":"你幾點下課？","en":"What time does your class end?"},{"zh":"我們三點半見面。","en":"We meet at 3:30."}],"cy":"Say when you get up, start class, and eat dinner."},{"id":"g7-2","t":"從…到… — from…to…","e":"Works for time and places: 從三點到五點, 從學校到銀行.","tgt":["從","到"],"alt":["在","離"],"s":[{"zh":"從三點到五點我有課。","en":"From 3:00 to 5:00 I have class."},{"zh":"從星期一到星期五我上課。","en":"From Monday to Friday I attend class."},{"zh":"從學校到銀行很近。","en":"From school to the bank is close."}],"cy":"Describe your class schedule with 從…到…"},{"id":"g7-3","t":"得 (děi) — must / have to","e":"得 before a verb = have to. Same character as complement 得(de) — context decides.","tgt":["得"],"alt":["要","會","能"],"s":[{"zh":"我得去銀行。","en":"I have to go to the bank."},{"zh":"你得早一點來。","en":"You have to come earlier."},{"zh":"明天我得上課。","en":"Tomorrow I have to attend class."}],"cy":"List two things you have to do tomorrow with 得."},{"id":"g7-4","t":"剛 — just now","e":"剛 before the verb: it happened moments ago.","tgt":["剛"],"alt":["常","再","就"],"s":[{"zh":"我剛下課。","en":"I just finished class."},{"zh":"他剛到。","en":"He just arrived."},{"zh":"比賽剛結束。","en":"The game just ended."}],"cy":"Say two things that just happened with 剛."},{"id":"g7-5","t":"每 — every","e":"每 + measure word + noun; usually pairs with 都: 我每天都上課.","tgt":["每","都"],"alt":["常","也"],"s":[{"zh":"我每天都上課。","en":"I have class every day."},{"zh":"每個星期六我去KTV。","en":"Every Saturday I go to KTV."}],"cy":"Describe a routine with 每…都…"},{"id":"g7-6","t":"…的時候 — when…","e":"Clause + 的時候 = when/while: 下課的時候.","tgt":["的時候"],"alt":["以後","以前"],"s":[{"zh":"下課的時候，你在哪裡？","en":"When class ended, where were you?"},{"zh":"我忙的時候，不能見面。","en":"When I'm busy, I can't meet."},{"zh":"你有空的時候，我們去唱歌吧。","en":"When you're free, let's go sing."}],"cy":"Say what you do 有空的時候 (when free)."},{"id":"g7-7","t":"有空 vs 有事","e":"有空 = free; 有事 = busy / have something on.","tgt":["有空","有事"],"alt":["有課","沒有"],"s":[{"zh":"你明天有空嗎？","en":"Are you free tomorrow?"},{"zh":"我下午有空。","en":"I'm free in the afternoon."},{"zh":"對不起，我今天有事。","en":"Sorry, I'm busy today."}],"cy":"Invite a friend out, and decline politely using 有事."}],"8":[{"id":"g8-1","t":"坐 vs 騎 — transport","e":"坐 for vehicles you sit inside (火車/高鐵/捷運/公車/計程車); 騎 for ones you straddle (機車/腳踏車).","tgt":["坐","騎"],"alt":["開","走"],"s":[{"zh":"我坐火車去臺南。","en":"I take the train to Tainan."},{"zh":"他坐捷運上課。","en":"He takes the MRT to class."},{"zh":"我騎機車去學校。","en":"I ride a scooter to school."}],"cy":"Say how you get to school and how you'd travel to Tainan."},{"id":"g8-2","t":"比 — comparison","e":"A 比 B + adjective: 高鐵比火車快. Add amount after: 快兩個鐘頭.","tgt":["比"],"alt":["跟","比較","更"],"s":[{"zh":"高鐵比火車快。","en":"The HSR is faster than the train."},{"zh":"捷運比公車方便。","en":"The MRT is more convenient than the bus."},{"zh":"高鐵比火車快兩個鐘頭。","en":"The HSR is two hours faster than the train."}],"cy":"Compare two ways to travel with 比."},{"id":"g8-3","t":"比較 — relatively / prefer","e":"比較 + adjective/verb softens comparison: 我比較喜歡坐火車.","tgt":["比較"],"alt":["比","最","更"],"s":[{"zh":"我比較喜歡坐火車。","en":"I prefer taking the train."},{"zh":"高鐵比較舒服。","en":"The HSR is more comfortable."},{"zh":"這個比較好。","en":"This one is better."}],"cy":"State a soft preference with 比較喜歡."},{"id":"g8-4","t":"又…又… — both…and…","e":"又 A 又 B stacks two qualities: 又快又舒服.","tgt":["又"],"alt":["也","都","和"],"s":[{"zh":"高鐵又快又舒服。","en":"The HSR is both fast and comfortable."},{"zh":"這個地方又遠又貴。","en":"This place is both far and expensive."}],"cy":"Describe something with 又…又…"},{"id":"g8-5","t":"怎麼 — how","e":"怎麼 + verb asks method: 怎麼去？ 怎麼買票？","tgt":["怎麼"],"alt":["為什麼","什麼","哪裡"],"s":[{"zh":"你怎麼去臺南？","en":"How do you get to Tainan?"},{"zh":"怎麼買票？","en":"How do you buy tickets?"}],"cy":"Ask how to get somewhere and how to buy the ticket."},{"id":"g8-6","t":"或是 vs 還是","e":"或是 = or in statements; 還是 = or in questions.","tgt":["或是","還是"],"alt":["也是","可是"],"s":[{"zh":"你可以坐火車或是高鐵。","en":"You can take the train or the HSR."},{"zh":"你要坐火車還是高鐵？","en":"Do you want the train or the HSR?"}],"cy":"Give a friend two options (或是), then ask which they want (還是)."},{"id":"g8-7","t":"Duration — 鐘頭","e":"Verb + 要 + duration: 坐火車要四個鐘頭.","tgt":["鐘頭"],"alt":["點","分鐘","小時"],"s":[{"zh":"坐火車要四個鐘頭。","en":"The train takes four hours."},{"zh":"高鐵只要一個半鐘頭。","en":"The HSR only takes an hour and a half."}],"cy":"Say how long your commute takes with 要…鐘頭/分鐘."}],"9":[{"id":"g9-1","t":"Days & dates","e":"星期+number (星期天 Sunday); dates: 月 + 號: 三月五號.","tgt":["星期","號","月"],"alt":["點","天"],"s":[{"zh":"我星期三有課。","en":"I have class on Wednesday."},{"zh":"星期六你有空嗎？","en":"Are you free on Saturday?"},{"zh":"我的生日是三月五號。","en":"My birthday is March 5th."}],"cy":"Say your birthday and one weekly commitment."},{"id":"g9-2","t":"打算 — to plan","e":"打算 + verb phrase directly (no 要): 我打算下個星期去臺東.","tgt":["打算"],"alt":["希望","想","要"],"s":[{"zh":"你打算什麼時候回國？","en":"When do you plan to return home?"},{"zh":"我打算下個星期去臺東。","en":"I plan to go to Taitung next week."},{"zh":"放假的時候，你打算做什麼？","en":"What do you plan to do on vacation?"}],"cy":"Share your holiday plan with 打算."},{"id":"g9-3","t":"要是…就… — if…then…","e":"要是 A，(subject) 就 B: 就 comes after the subject in the result clause.","tgt":["要是","就"],"alt":["因為","所以"],"s":[{"zh":"要是明天下雨，我就不出去。","en":"If it rains tomorrow, I won't go out."},{"zh":"要是你有空，我們就一起去。","en":"If you're free, let's go together."},{"zh":"要是你想去夜市，我就帶你去。","en":"If you want the night market, I'll take you."}],"cy":"Make an if-then plan for the weekend with 要是…就…"},{"id":"g9-4","t":"應該 — should","e":"應該 suggests (softer than must): 你應該去貓空看看.","tgt":["應該"],"alt":["得","會","要"],"s":[{"zh":"你應該去貓空看看。","en":"You should go check out Maokong."},{"zh":"我們應該早一點決定。","en":"We should decide earlier."}],"cy":"Give a friend two recommendations for Taipei with 應該."},{"id":"g9-5","t":"多久 — how long","e":"多久 asks duration: 你要去多久？","tgt":["多久"],"alt":["多少","幾點","什麼時候"],"s":[{"zh":"你要去多久？","en":"How long will you go for?"},{"zh":"從臺北到臺東要多久？","en":"How long from Taipei to Taitung?"}],"cy":"Ask a classmate how long they'll study Chinese with 多久."},{"id":"g9-6","t":"還 — still / in addition","e":"還 = still (還在/還沒) or additionally (還想去…).","tgt":["還"],"alt":["就","再","又"],"s":[{"zh":"你還在學校嗎？","en":"Are you still at school?"},{"zh":"我還沒決定。","en":"I still haven't decided."},{"zh":"我想去夜市，還想去茶館。","en":"I want the night market, and also a teahouse."}],"cy":"Say something you still haven't done with 還沒."},{"id":"g9-7","t":"有時候 — sometimes","e":"有時候 before the clause: 有時候我在家看電視.","tgt":["有時候"],"alt":["常","每天","的時候"],"s":[{"zh":"有時候我在家看電視。","en":"Sometimes I watch TV at home."},{"zh":"我有時候會去那家茶館。","en":"I sometimes go to that teahouse."}],"cy":"Describe two 'sometimes' habits with 有時候."}],"10":[{"id":"g10-1","t":"Colors + 的","e":"Color + 色 + 的 + noun: 黃色的芒果 (or short: 黃芒果).","tgt":["黃色","紅色","藍色"],"alt":["顏色"],"s":[{"zh":"我要買黃色的芒果。","en":"I want to buy yellow mangoes."},{"zh":"她穿紅色的衣服。","en":"She wears red clothes."},{"zh":"這是藍色的窗戶。","en":"This is a blue window."}],"cy":"Describe what you're wearing today with colors + 的."},{"id":"g10-2","t":"給 — to give / for","e":"給 + person + thing (給你一個芒果); or 給 + person + verb (我給你看 I'll show you).","tgt":["給"],"alt":["幫","替","跟"],"s":[{"zh":"我給你一個芒果。","en":"I give you a mango."},{"zh":"這是給你的。","en":"This is for you."},{"zh":"給我拍一張照片。","en":"Take a photo for me."}],"cy":"Offer something to a friend with 給."},{"id":"g10-3","t":"V-V-看 — try doing","e":"Doubling the verb + 看 = give it a try: 吃吃看, 穿穿看.","tgt":["吃吃看","穿穿看","看看"],"alt":["試試看"],"s":[{"zh":"這個芒果很甜，你吃吃看。","en":"This mango is sweet — try it."},{"zh":"這件衣服很好看，你穿穿看。","en":"This looks nice — try it on."}],"cy":"Urge a friend to try a food and to try on clothes with V-V-看."},{"id":"g10-4","t":"因為…所以… — because…so…","e":"Both halves usually appear together in Chinese.","tgt":["因為","所以"],"alt":["可是","要是"],"s":[{"zh":"因為芒果很甜，所以我很喜歡。","en":"Because mangoes are sweet, I like them a lot."},{"zh":"因為他很高，所以打籃球打得很好。","en":"Because he's tall, he plays basketball well."}],"cy":"Explain why you like something with 因為…所以…"},{"id":"g10-5","t":"以前 — before / in the past","e":"以前 opens a past-time frame; clause + 以前 = before doing X.","tgt":["以前"],"alt":["以後","現在","上個月"],"s":[{"zh":"以前我不喜歡吃芒果。","en":"Before, I didn't like mangoes."},{"zh":"來臺灣以前，我沒吃過西瓜。","en":"Before coming to Taiwan, I'd never eaten watermelon."}],"cy":"Contrast a past habit (以前) with now (現在)."},{"id":"g10-6","t":"這些 / 那些 — these / those","e":"Plural demonstratives: 這些水果, 那些衣服.","tgt":["這些","那些"],"alt":["這個","那個"],"s":[{"zh":"這些水果都很甜。","en":"These fruits are all sweet."},{"zh":"那些衣服很好看。","en":"Those clothes look nice."}],"cy":"Point out things around you with 這些/那些."}],"11":[{"id":"g11-1","t":"就 — only / right away","e":"就 conveys 'merely/immediately': 走路就五分鐘; 出門就到了; 就是這間.","tgt":["就"],"alt":["才","再","還"],"s":[{"zh":"走路就五分鐘。","en":"It's only a 5-minute walk."},{"zh":"房租就一萬塊。","en":"The rent is only 10,000 NT."},{"zh":"往右轉就是超市。","en":"Turn right and there's the supermarket."},{"zh":"我就住在這裡。","en":"I live right here."}],"cy":"Brag how close something is to your place using 就."},{"id":"g11-2","t":"到 — arrive / until / result","e":"到 = arrive (我到了), up to (住到下個月), and result complement (看到/聽到/收到).","tgt":["到"],"alt":["在","去","從"],"s":[{"zh":"我到了。","en":"I've arrived."},{"zh":"我在這裡住到下個月。","en":"I'm staying here until next month."},{"zh":"房東已經收到了。","en":"The landlord already received it."}],"cy":"Text a friend that you've arrived and until when you'll stay."},{"id":"g11-3","t":"間 — rooms; 空 — vacant","e":"間 measures rooms: 一間套房; 空 = empty/free: 空房間, 你有空嗎.","tgt":["間","空"],"alt":["棟","樓","家"],"s":[{"zh":"我要租一間套房。","en":"I want to rent a studio."},{"zh":"有空房間嗎？","en":"Are there vacant rooms?"},{"zh":"這裡有三間空房間。","en":"There are three empty rooms here."}],"cy":"Ask a landlord about vacant rooms using 間 and 空."},{"id":"g11-4","t":"左邊 / 右邊","e":"X 的左邊/右邊; 往右邊走 go right.","tgt":["左邊","右邊"],"alt":["旁邊","前面","後面"],"s":[{"zh":"左邊是廚房，右邊是浴室。","en":"Kitchen on the left, bathroom on the right."},{"zh":"超市在旅館的左邊。","en":"The supermarket is left of the hotel."}],"cy":"Describe your room layout with 左邊/右邊."},{"id":"g11-5","t":"再 — again / then","e":"再 = again (再說一次) and 'then, afterwards': 先看房子，再決定.","tgt":["再"],"alt":["又","還","就"],"s":[{"zh":"我想再去一次。","en":"I want to go once more."},{"zh":"先看房子，再決定。","en":"First see the place, then decide."},{"zh":"我回去想想，再告訴你。","en":"I'll think it over, then tell you."}],"cy":"Politely delay a decision with 先…再…"},{"id":"g11-6","t":"已經…了 — already","e":"已經 + verb + 了: 我已經付房租了.","tgt":["已經","了"],"alt":["還沒","剛"],"s":[{"zh":"我已經付房租了。","en":"I've already paid the rent."},{"zh":"他已經習慣了。","en":"He's already used to it."},{"zh":"已經很晚了。","en":"It's already very late."}],"cy":"Say two things you've already done today with 已經…了."},{"id":"g11-7","t":"好像 — it seems","e":"好像 softens claims: 熱水器好像壞了.","tgt":["好像"],"alt":["一定","真的","當然"],"s":[{"zh":"熱水器好像壞了。","en":"The water heater seems broken."},{"zh":"他好像不在家。","en":"He doesn't seem to be home."},{"zh":"這間房間好像比較小。","en":"This room seems smaller."}],"cy":"Report a problem to your landlord softly with 好像."},{"id":"g11-8","t":"不好意思 / 沒關係","e":"不好意思 = sorry/excuse me; the reply is 沒關係 it's fine.","tgt":["不好意思","沒關係"],"alt":["對不起","謝謝"],"s":[{"zh":"不好意思，我忘了。","en":"Sorry, I forgot."},{"zh":"不好意思，可以問你一個問題嗎？","en":"Excuse me, may I ask a question?"},{"zh":"沒關係，明天可以。","en":"No problem, tomorrow works."}],"cy":"Apologize for being late and accept an apology."},{"id":"g11-9","t":"不過 — however","e":"不過 = but (softer than 可是): 這間不大，不過很乾淨.","tgt":["不過"],"alt":["可是","所以","因為"],"s":[{"zh":"這間套房不大，不過很乾淨。","en":"This studio isn't big, but it's clean."},{"zh":"房租有點貴，不過有家具。","en":"Rent's a bit high, but it's furnished."}],"cy":"Weigh an apartment's pros/cons with 不過."}],"12":[{"id":"g12-1","t":"先…再… — first…then…","e":"Sequences plans: 先念大學，再工作.","tgt":["先","再"],"alt":["就","才","又"],"s":[{"zh":"先念大學，再工作。","en":"First university, then work."},{"zh":"我想先吃飯，再去看電影。","en":"I want to eat first, then see a movie."},{"zh":"先在語言中心念一年，再念大學。","en":"First a year at the language center, then university."}],"cy":"Lay out your study-then-work plan with 先…再…"},{"id":"g12-2","t":"花 — to spend","e":"花 + time/money (+ verb): 花很多時間學中文; 學費要花二十萬.","tgt":["花"],"alt":["要","買","用"],"s":[{"zh":"我每天花兩個小時念書。","en":"I spend two hours studying daily."},{"zh":"念大學要花很多錢。","en":"University costs a lot."},{"zh":"你花了多久？","en":"How long did you spend?"}],"cy":"Say how much time you spend on Chinese every day with 花."},{"id":"g12-3","t":"需要 — to need","e":"需要 + noun or verb: 需要時間, 需要念四年.","tgt":["需要"],"alt":["想要","希望","應該"],"s":[{"zh":"你需要幫忙嗎？","en":"Do you need help?"},{"zh":"需要多少錢？","en":"How much money is needed?"},{"zh":"不需要擔心。","en":"No need to worry."}],"cy":"State two things you need to reach your goal with 需要."},{"id":"g12-4","t":"以後 — after / in the future","e":"Clause + 以後 = after X; alone = in the future.","tgt":["以後"],"alt":["以前","的時候","現在"],"s":[{"zh":"念完大學以後，我想找工作。","en":"After university, I want to find work."},{"zh":"下課以後我們去吃飯吧。","en":"After class let's eat."},{"zh":"以後想做什麼？","en":"What do you want to do in the future?"}],"cy":"Describe your after-graduation plan with …以後."},{"id":"g12-5","t":"希望 — to hope","e":"希望 + clause: 我希望找到好工作.","tgt":["希望"],"alt":["打算","需要","覺得"],"s":[{"zh":"我希望找到好工作。","en":"I hope to find a good job."},{"zh":"他希望能拿到獎學金。","en":"He hopes to get a scholarship."},{"zh":"希望你能幫我。","en":"I hope you can help me."}],"cy":"Share two hopes for your year in Taiwan with 希望."},{"id":"g12-6","t":"替 — on behalf of","e":"替 + person + verb: 公司替我付學費.","tgt":["替"],"alt":["給","幫","跟"],"s":[{"zh":"公司替我付學費。","en":"The company pays my tuition."},{"zh":"我替你問問看。","en":"I'll ask for you."},{"zh":"替我加油！","en":"Cheer for me!"}],"cy":"Offer to do something for a friend with 替."},{"id":"g12-7","t":"試試看 — give it a try","e":"試試看 / V+試試看: 你試試看; 做試試看.","tgt":["試試看"],"alt":["看看","吃吃看"],"s":[{"zh":"你試試看。","en":"You try and see."},{"zh":"我試試看，可能會成功。","en":"I'll try — maybe it'll work."},{"zh":"試試看再說。","en":"Try first, then talk."}],"cy":"Encourage yourself about a hard task with 試試看 and 加油."}],"13":[{"id":"g13-1","t":"祝 — wishing someone","e":"祝 + person + wish: 祝你生日快樂！ 祝你萬事如意！","tgt":["祝"],"alt":["請","給","對"],"s":[{"zh":"祝你生日快樂！","en":"Wishing you a happy birthday!"},{"zh":"祝你萬事如意！","en":"May everything go your way!"},{"zh":"祝你心想事成！","en":"May your wishes come true!"}],"cy":"Write a birthday message stacking two 祝 wishes."},{"id":"g13-2","t":"怎麼 — how come?","e":"怎麼 + verb can mean surprised 'how come': 你怎麼忘了？","tgt":["怎麼"],"alt":["為什麼","什麼","多久"],"s":[{"zh":"你怎麼忘了？","en":"How come you forgot?"},{"zh":"他怎麼還沒來？","en":"Why hasn't he come yet?"},{"zh":"怎麼說？","en":"How do you say it?"}],"cy":"Express surprise that a friend forgot something with 怎麼."},{"id":"g13-3","t":"忘了 vs 記得","e":"忘了 forgot (done); 記得 remember (state): 記得帶書 remember to bring the book.","tgt":["忘了","記得"],"alt":["知道","想"],"s":[{"zh":"我忘了帶錢。","en":"I forgot to bring money."},{"zh":"你記得嗎？","en":"Do you remember?"},{"zh":"記得打電話給我。","en":"Remember to call me."}],"cy":"Admit something you forgot, then a reminder with 記得."},{"id":"g13-4","t":"當然 — of course","e":"當然 answers emphatically: 當然記得！","tgt":["當然"],"alt":["一定","真的","好像"],"s":[{"zh":"當然記得！","en":"Of course I remember!"},{"zh":"當然可以。","en":"Of course you can."},{"zh":"當然要去。","en":"Of course I'll go."}],"cy":"Answer an invitation enthusiastically with 當然."},{"id":"g13-5","t":"跟…一樣 — same as","e":"A 跟 B 一樣 (+adjective): 今年跟去年一樣熱.","tgt":["一樣","跟"],"alt":["比","也","都"],"s":[{"zh":"這個跟那個一樣。","en":"This one is the same as that one."},{"zh":"我的想法跟你一樣。","en":"My thoughts are the same as yours."},{"zh":"今年跟去年一樣熱。","en":"This year is as hot as last year."}],"cy":"Compare two things that are alike with 跟…一樣."},{"id":"g13-6","t":"過 — celebrate / experience","e":"過生日 celebrate; verb+過 = have done before: 我去過臺灣.","tgt":["過"],"alt":["了","在","到"],"s":[{"zh":"你怎麼過生日？","en":"How do you celebrate your birthday?"},{"zh":"我去過臺灣。","en":"I've been to Taiwan."},{"zh":"你吃過豬腳麵線嗎？","en":"Have you eaten pork knuckle noodles?"}],"cy":"Ask a friend two 'have you ever' questions with V+過."},{"id":"g13-7","t":"左右 — approximately","e":"Amount + 左右: 十個人左右, 五點左右.","tgt":["左右"],"alt":["差不多","大概","一點"],"s":[{"zh":"他三十歲左右。","en":"He's around thirty."},{"zh":"我們十個人左右會去。","en":"About ten of us will go."},{"zh":"五點左右見面吧。","en":"Let's meet around five."}],"cy":"Estimate a party's size and time with 左右."},{"id":"g13-8","t":"哪裡哪裡 — humble reply","e":"Deflect a compliment: 哪裡哪裡 / 不必客氣 replies politely.","tgt":["哪裡哪裡","不必客氣"],"alt":["謝謝","不客氣"],"s":[{"zh":"哪裡哪裡。","en":"Not at all (you flatter me)."},{"zh":"不必客氣。","en":"Don't mention it."},{"zh":"你太客氣了。","en":"You're too kind."}],"cy":"Respond humbly to '你中文說得真好！'"}],"14":[{"id":"g14-1","t":"Weather + change 了","e":"天氣變冷了 it's gotten cold; 下雨了 it's started raining.","tgt":["了"],"alt":["嗎","的","得"],"s":[{"zh":"天氣變冷了。","en":"The weather has gotten cold."},{"zh":"下雨了！","en":"It's (started) raining!"},{"zh":"雨停了。","en":"The rain stopped."}],"cy":"Describe today's weather change with …了."},{"id":"g14-2","t":"只 — only","e":"只 before the verb: 台北只有冬天冷.","tgt":["只"],"alt":["就","都","才"],"s":[{"zh":"只有一個。","en":"There's only one."},{"zh":"台北只有冬天冷。","en":"Taipei is only cold in winter."},{"zh":"只要十分鐘。","en":"It only takes ten minutes."}],"cy":"Say what you only like about one season with 只."},{"id":"g14-3","t":"更 — even more","e":"更 + adjective raises the degree: 今天比昨天更冷.","tgt":["更"],"alt":["最","很","太"],"s":[{"zh":"今天比昨天更冷。","en":"Today is even colder than yesterday."},{"zh":"台北比高雄更濕。","en":"Taipei is even more humid than Kaohsiung."},{"zh":"颱風天更可怕。","en":"Typhoon days are even scarier."}],"cy":"Escalate a comparison with 比…更…"},{"id":"g14-4","t":"要…了 / 快…了 — about to","e":"Imminent events: 要下雨了; 快新年了.","tgt":["要","快","了"],"alt":["就","剛"],"s":[{"zh":"要下雨了。","en":"It's about to rain."},{"zh":"颱風要來了。","en":"The typhoon is coming."},{"zh":"快新年了。","en":"New Year is almost here."},{"zh":"快到了。","en":"Almost there."}],"cy":"Warn a friend something's about to happen with 要…了."},{"id":"g14-5","t":"這次 / 上次 / 下次","e":"This time / last time / next time.","tgt":["這次","上次","下次"],"alt":["有時候","每次"],"s":[{"zh":"這次的颱風很大。","en":"This typhoon is big."},{"zh":"上次的天氣很好。","en":"The weather was good last time."},{"zh":"這次比上次冷。","en":"This time is colder than last time."}],"cy":"Compare this time with last time using 這次/上次."},{"id":"g14-6","t":"討厭 — to dislike","e":"討厭 + noun/clause: 我討厭下雨.","tgt":["討厭"],"alt":["喜歡","怕","愛"],"s":[{"zh":"我討厭下雨。","en":"I hate rain."},{"zh":"他很討厭颱風。","en":"He really hates typhoons."},{"zh":"真討厭！","en":"How annoying!"}],"cy":"Vent about weather you hate with 討厭."},{"id":"g14-7","t":"小心 / 慢走","e":"小心 be careful (小心風！); 慢走 = 'take care' when someone leaves.","tgt":["小心","慢走"],"alt":["再見","加油"],"s":[{"zh":"路上小心。","en":"Be careful on the road."},{"zh":"大家要小心。","en":"Everyone be careful."},{"zh":"您慢走。","en":"Take care (goodbye)."}],"cy":"Send off a guest politely with 小心 and 慢走."}],"15":[{"id":"g15-1","t":"一直 — continuously","e":"一直 + verb: it keeps happening: 一直流鼻水.","tgt":["一直"],"alt":["常常","剛","又"],"s":[{"zh":"我一直流鼻水。","en":"I keep having a runny nose."},{"zh":"雨一直下。","en":"It keeps raining."},{"zh":"我一直在等你。","en":"I've been waiting for you all along."}],"cy":"Describe a symptom that won't stop with 一直."},{"id":"g15-2","t":"Body part + 痛","e":"頭痛, 肚子痛, 喉嚨痛 — say where it hurts.","tgt":["痛"],"alt":["病","累","辣"],"s":[{"zh":"我頭痛。","en":"My head hurts."},{"zh":"我肚子痛，吐了幾次。","en":"My stomach hurts; I vomited a few times."},{"zh":"喉嚨很痛。","en":"My throat really hurts."}],"cy":"Tell a doctor two places that hurt."},{"id":"g15-3","t":"把 — disposal construction","e":"把 + object + verb + result: 把藥吃了 take the medicine. The verb needs a complement.","tgt":["把"],"alt":["被","給","跟"],"s":[{"zh":"把藥吃了。","en":"Take the medicine."},{"zh":"把水喝完。","en":"Drink all the water."},{"zh":"醫生把藥給了我。","en":"The doctor gave me the medicine."}],"cy":"Give someone two 把-commands (finish the water, take the medicine)."},{"id":"g15-4","t":"別 — don't (command)","e":"別 + verb forbids gently: 別擔心, 別吃冰的.","tgt":["別"],"alt":["不","沒","不要"],"s":[{"zh":"別吃冰的。","en":"Don't eat cold things."},{"zh":"別擔心。","en":"Don't worry."},{"zh":"別客氣。","en":"Don't be polite."}],"cy":"Give a sick friend two 別-instructions."},{"id":"g15-5","t":"怎麼了 — what's wrong?","e":"怎麼了 asks what happened: 你怎麼了？","tgt":["怎麼了"],"alt":["怎麼樣","為什麼"],"s":[{"zh":"你怎麼了？","en":"What's wrong with you?"},{"zh":"沒事。","en":"Nothing's wrong."},{"zh":"我生病了。","en":"I'm sick."}],"cy":"Check in on a sick friend with 怎麼了, and answer as them."},{"id":"g15-6","t":"不用了 — no need","e":"不用(了) declines an offer politely: 不用陪我去.","tgt":["不用"],"alt":["不要","沒有","別"],"s":[{"zh":"不用了，謝謝。","en":"No need, thanks."},{"zh":"不用擔心。","en":"No need to worry."},{"zh":"不用陪我去。","en":"No need to come with me."}],"cy":"Politely decline help twice with 不用."},{"id":"g15-7","t":"最好 — had better","e":"最好 + verb gives strong advice: 最好在家休息.","tgt":["最好"],"alt":["應該","可以","得"],"s":[{"zh":"你最好多喝水。","en":"You'd better drink more water."},{"zh":"最好早一點睡。","en":"Best to sleep early."},{"zh":"感冒的話，最好在家休息。","en":"With a cold, best to rest at home."}],"cy":"Give a sick classmate advice with 最好 + 別."},{"id":"g15-8","t":"次 & 小時 — times & hours","e":"吐了幾次 how many times; 睡了八個小時 slept 8 hours; 一天吃三次藥.","tgt":["次","小時"],"alt":["個","天","鐘頭"],"s":[{"zh":"一天吃三次藥。","en":"Take medicine three times a day."},{"zh":"你睡了幾個小時？","en":"How many hours did you sleep?"},{"zh":"我看了兩次醫生。","en":"I saw the doctor twice."}],"cy":"Describe your sleep and medicine schedule with 次 and 小時."}]};

/* ============ FSRS-5 ============ */
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5, FACTOR=19/81, DAY=86400000, MIN=60000;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const retrievability=(t,s)=>Math.pow(1+FACTOR*t/s,DECAY);
function nextIntervalDays(s){const r=S.settings.retention;return clamp(Math.round(s/FACTOR*(Math.pow(r,1/DECAY)-1)),1,365);}
const initS=g=>W[g-1];
const initD=g=>clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
function updD(d,g){let nd=d-W[6]*(g-3)*((10-d)/9);nd=W[7]*initD(4)+(1-W[7])*nd;return clamp(nd,1,10);}
function stabRecall(s,d,r,g){const hard=g===2?W[15]:1, easy=g===4?W[16]:1;return s*(Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp(W[10]*(1-r))-1)*hard*easy+1);}
function stabForget(s,d,r){return Math.min(s, W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp(W[14]*(1-r)));}
function stabShort(s,g){return s*Math.exp(W[17]*(g-3+W[18]));}
function fuzz(days){if(days<3)return days;const f=days*0.05;return Math.round(days+(Math.random()*2-1)*f);}
// early-drill: force writing cards back on day 1, 2, 3 before FSRS takes over
function capEarly(c,cid,days){
  if(!S.settings.earlyDrill||modeOf(cid)!=='prod')return days;
  const d=(c&&c.days)||0;
  if(d===0)return Math.min(days,1);
  if(d===1)return Math.min(days,2);
  if(d===2)return Math.min(days,3);
  return days;
}
function previewIv(c,cid,g){
  const now=Date.now();
  const fmt=d=>d+'d';
  if(!c||c.st===undefined){
    if(g===1)return'1m'; if(g===2)return'5m'; if(g===3)return'10m';
    return fmt(capEarly(c,cid,nextIntervalDays(initS(4))));
  }
  if(c.st==='learn'||c.st==='relearn'){
    if(g===1)return'1m'; if(g===2)return'5m';
    return fmt(capEarly(c,cid,Math.max(1,nextIntervalDays(stabShort(c.S,g)))));
  }
  const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S);
  if(g===1)return'5m';
  return fmt(capEarly(c,cid,nextIntervalDays(stabRecall(c.S,c.D,r,g))));
}
function wordStartedBefore(wid){return MODES.some(m=>{const c=S.cards[cardId(wid,m)];return c&&c.st!==undefined;});}
function rate(cid,g){
  const now=Date.now(); let c=S.cards[cid];
  const today=dkey(new Date());
  S.log[today]=S.log[today]||{rev:0,new:0};
  const schedule=(days)=>{days=capEarly(c,cid,days);c.due=now+fuzz(days)*DAY;c.days=(c.days||0)+1;};
  if(!c||c.st===undefined){
    const wid=cid.split(':')[0];
    if(!wordStartedBefore(wid))S.intro[today]=(S.intro[today]||0)+1;
    c={st:'learn',S:initS(g),D:initD(g),due:0,last:now,reps:1,lapses:0,days:0};
    S.cards[cid]=c;
    S.log[today].new++;
    if(g===1)c.due=now+1*MIN; else if(g===2)c.due=now+5*MIN; else if(g===3)c.due=now+10*MIN;
    else {c.st='rev'; schedule(nextIntervalDays(c.S));}
  } else if(c.st==='learn'||c.st==='relearn'){
    S.log[today].rev++;
    c.reps++;c.last=now;c.S=stabShort(c.S,g);
    if(g===1)c.due=now+1*MIN; else if(g===2)c.due=now+5*MIN;
    else {c.st='rev'; schedule(Math.max(1,nextIntervalDays(c.S)));}
  } else {
    S.log[today].rev++;
    const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S);
    c.D=updD(c.D,g); c.reps++; c.last=now;
    if(g===1){c.lapses++;c.S=stabForget(c.S,c.D,r);c.st='relearn';c.due=now+5*MIN;}
    else {c.S=stabRecall(c.S,c.D,r,g);schedule(nextIntervalDays(c.S));}
  }
  // mastery timestamps for the Brain view
  if(c.st==='rev'&&c.S>=MASTER_S){if(!c.mastAt)c.mastAt=now;}
  else if(c.mastAt){delete c.mastAt;}
  save();
}

const MODES=['rec','prod'];
const MODE_LABEL={rec:'Recognize · 認字',prod:'Write & pronounce · 寫字'};
function cardId(wid,m){return wid+':'+m;}
function wordOf(cid){return byId[cid.split(':')[0]];}
function modeOf(cid){return cid.split(':')[1];}
function tracked(wid){return MODES.some(m=>S.cards[cardId(wid,m)]);}
function trackWord(wid){MODES.forEach(m=>{if(S.settings.modes[m]&&!S.cards[cardId(wid,m)])S.cards[cardId(wid,m)]={};});save();}
function untrackWord(wid){MODES.forEach(m=>{delete S.cards[cardId(wid,m)];});save();}
function markKnown(wid){ // "I already know this" — skip learning, verify in ~3 weeks
  MODES.forEach(m=>{
    if(!S.settings.modes[m])return;
    const k=cardId(wid,m), c=S.cards[k];

    S.cards[k]={st:'rev',S:21,D:4,due:Date.now()+fuzz(21)*DAY,last:Date.now(),reps:1,lapses:0,days:3,known:1};
  });

}
function markMastered(wid){ // "I've mastered this" — straight onto the shelf, verify in ~2 months
  MODES.forEach(m=>{
    if(!S.settings.modes[m])return;
    S.cards[cardId(wid,m)]={st:'rev',S:60,D:3,due:Date.now()+fuzz(60)*DAY,last:Date.now(),reps:1,lapses:0,days:3,known:1,mastAt:Date.now()};
  });
  save();
}
function isKnown(wid){return MODES.some(m=>(S.cards[cardId(wid,m)]||{}).known);}
function wordStatus(wid){
  let states=MODES.map(m=>S.cards[cardId(wid,m)]).filter(Boolean);
  if(!states.length)return null;
  const real=states.filter(c=>c.st!==undefined);
  if(!real.length)return{k:'new',t:'queued'};
  if(real.some(c=>c.due<=Date.now()))return{k:'due',t:'due'};
  if(real.length===states.length&&Math.min(...real.map(c=>c.S||0))>=21)return{k:'mat',t:'solid'};
  return{k:'ok',t:'learning'};
}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ============ QUEUE ============ */
function buildQueue(){
  const now=Date.now(), today=dkey(new Date());
  const introToday=S.intro[today]||0;
  const learn=[],rev=[],freshAll=[];
  for(const cid in S.cards){
    const c=S.cards[cid], w=wordOf(cid); if(!w)continue;
    if(c.susp)continue;
    if(!S.settings.includeNames&&isName(w))continue;
    if(!S.settings.modes[modeOf(cid)])continue;
    if(c.st===undefined){freshAll.push(cid);continue;}
    if(c.due<=now){(c.st==='rev'?rev:learn).push(cid);}
  }
  learn.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  rev.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  const mOrd={rec:0,prod:1};
  freshAll.sort((a,b)=>{const wa=wordOf(a),wb=wordOf(b);return wa.l-wb.l||parseInt(wa.id.slice(1))-parseInt(wb.id.slice(1))||mOrd[modeOf(a)]-mOrd[modeOf(b)];});
  // newPerDay counts WORDS, not cards: both cards of an introduced word may start the same day
  const allowance=Math.max(0,S.settings.newPerDay-introToday);
  const planned=new Set(); const fresh=[];
  for(const cid of freshAll){
    const wid=cid.split(':')[0];
    if(wordStartedBefore(wid)||planned.has(wid)){fresh.push(cid);continue;}
    if(planned.size<allowance){planned.add(wid);fresh.push(cid);}
  }
  return {learn,rev:rev.slice(0,S.settings.maxRev),fresh};
}
function dueCount(){const q=buildQueue();return q.learn.length+q.rev.length+q.fresh.length;}

const toneMarks={'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4};
function tonePinyin(p){
  return p.split(/(\s+|\/|,|·|\+)/).map(part=>{
    if(/^\s*$|^\/$|^,$|^\+$/.test(part))return part;
    let tone=0;
    for(const ch of part){if(toneMarks[ch]){tone=toneMarks[ch];break;}}
    return '<span class="tone'+tone+'">'+part+'</span>';
  }).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function paperList(){
  const d=new Date();d.setHours(0,0,0,0);const t0=d.getTime();
  const seen=new Set(),out=[];
  for(const cid in S.cards){
    if(!cid.endsWith(':prod'))continue;
    const c=S.cards[cid]; if(!c||c.st===undefined||c.last<t0)continue;
    const wid=cid.split(':')[0], w=byId[wid];
    if(!w||seen.has(wid))continue;
    if(c.st==='relearn'||c.lapses>0&&c.st!=='rev'){seen.add(wid);out.push({w,tag:'again'});}
    else if((c.days||0)<=1){seen.add(wid);out.push({w,tag:'new'});}
    else if((c.days||0)<=3){seen.add(wid);out.push({w,tag:'day '+c.days});}
  }
  return out;
}

  window.print();
}

/* ============ AUDIO (speechSynthesis, best zh-TW voice) ============ */
let VOICES=[];
function loadVoices(){try{VOICES=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^(zh|cmn)/i.test(v.lang)||/中文|國語|粵語|普通话/.test(v.name));}catch(e){VOICES=[];}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function rankVoice(v){
  let s=0; const nm=v.name+' '+v.lang;
  if(/國語|臺灣|Taiwan/i.test(nm))s+=50;
  if(/zh[-_]TW/i.test(v.lang))s+=25;
  if(/Google/i.test(v.name))s+=30;
  if(/Mei-?Jia|美佳|Yating|雅婷|Hsiao|曉|Ting-?Ting|婷|Xiaoxiao|Female|女/i.test(nm))s+=40;
  if(/Liang|Aaron|YunJhe|雲哲|Kangkang|Male|男/i.test(nm))s-=30;
  if(/zh[-_]CN|cmn/i.test(v.lang))s+=8;
  if(/粵|Cantonese|HK/i.test(nm))s-=40;
  if(!v.localService)s+=6;
  return s;
}
/* bundled neural audio (female standard Mandarin) with speech-synthesis fallback */
const AUDIO_MISS={};
let curAudio=null;
function audioKey(t){t=String(t).split('（')[0];const h=t.replace(/[^㐀-鿿]/g,'');return h||t.replace(/[^A-Za-z0-9]/g,'');}
function hasTwVoice(){if(!VOICES.length)loadVoices();return VOICES.some(v=>/zh[-_]TW/i.test(v.lang)||/國語|臺灣|Taiwan|Mei-?Jia/i.test(v.name));}
let APACK=null,APACKP=null,AIDX=null,AURL={};
function loadPack(){
  if(APACK)return Promise.resolve(true);
  if(APACKP)return APACKP;
  APACKP=Promise.all([
    fetch('assets/audio-index.json').then(r=>{if(!r.ok)throw 0;return r.json()}),
    fetch('assets/audio.pack').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
  ]).then(([idx,buf])=>{AIDX=idx;APACK=buf;return true;}).catch(()=>false);
  return APACKP;
}
function playBundled(text,onFail){
  const k=audioKey(text);
  if(!k||AUDIO_MISS[k]){onFail();return;}
  loadPack().then(ok=>{
    if(!ok||!AIDX[k]){AUDIO_MISS[k]=1;onFail();return;}
    try{
      if(!AURL[k]){
        const[o,l]=AIDX[k];
        AURL[k]=URL.createObjectURL(new Blob([APACK.slice(o,o+l)],{type:'audio/mpeg'}));
      }
      if(curAudio){try{curAudio.pause();}catch(e){}}
      const a=new Audio(AURL[k]);
      curAudio=a;
      a.onerror=()=>{AUDIO_MISS[k]=1;onFail();};
      a.play().catch(()=>{AUDIO_MISS[k]=1;onFail();});
    }catch(e){onFail();}
  });
}
function playAudio(text){
  const mode=S.settings.audioSrc||'auto';
  // Taiwanese-accented system voices (Google 國語（臺灣）, Mei-Jia) beat the bundled
  // mainland-accented recording — prefer them whenever one exists.
  if(mode==='bundled'){playBundled(text,()=>speakText(text));return;}
  if(mode==='system'){speakText(text);return;}

/* ============ GRAMMAR DRILLS ============ */
let gramLesson=1, gq=null, gramOpen={};
const GPOOL=['嗎','呢','吧','的','得','都','也','很','不','沒','了','還是','或是','可以','會','能','想','要','先','再','就','比','跟','給','把','別','最','更','太','常','剛','已經','應該','打算','因為','所以','可是','不過','要是','一樣','每','只','又','從','到','在','離','當然','好像','需要','希望','一直','最好'];
const DICT=(()=>{const s=new Set(GPOOL);WORDS.forEach(w=>{const h=w.t.split('（')[0].replace(/[^㐀-鿿]/g,'');if(h)s.add(h);});return s;})();
function segZh(zh){
  const clean=zh.replace(/[。？！]/g,'');
  const parts=clean.split(/(，)/).filter(Boolean);
  const out=[];
  for(const part of parts){
    if(part==='，'){out.push('，');continue;}
    let i=0;
    while(i<part.length){
      let hit=null;
      for(let L=Math.min(5,part.length-i);L>=2;L--){
        if(DICT.has(part.substr(i,L))){hit=part.substr(i,L);break;}
      }
      if(hit){out.push(hit);i+=hit.length;}
      else{out.push(part[i]);i++;}
    }
  }
  // merge lone singles with a neighbor to keep chips meaningful
  const merged=[];
  for(const c of out){
    if(c.length===1&&c!=='，'&&merged.length&&merged[merged.length-1].length===1&&merged[merged.length-1]!=='，')merged[merged.length-1]+=c;
    else merged.push(c);
  }
  return merged;
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n,excl){const pool=a.filter(x=>!excl.includes(x));return shuf(pool).slice(0,n);}
function gStat(id){return S.gram&&S.gram[id]?S.gram[id]:{n:0,ok:0};}
function gMark(id,ok){S.gram=S.gram||{};const g=S.gram[id]=S.gram[id]||{n:0,ok:0};g.n++;if(ok)g.ok++;save();}
function gDots(id){const g=gStat(id);const d=g.n===0?0:(g.ok/g.n>=0.8&&g.n>=6)?3:(g.ok/g.n>=0.6&&g.n>=3)?2:1;return '<span class="gdots">'+[1,2,3].map(i=>'<span class="gdot'+(i<=d?' on':'')+'"></span>').join('')+'</span>';}
function tgtIn(p,zh){return p.tgt.find(t=>zh.includes(t));}
/* question builders — each returns {type,p,html-parts...} */
function buildQuestion(p,type){
  const sents=p.s.filter(s=>tgtIn(p,s.zh));
  const s=(type==='fib'||type==='mc')&&sents.length?sents[Math.floor(Math.random()*sents.length)]:p.s[Math.floor(Math.random()*p.s.length)];
  if(type==='fib'){
    const t=tgtIn(p,s.zh)||p.tgt[0];
    const opts=shuf([t,...sample(p.alt.concat(GPOOL),3,[t,...p.tgt])]);
    return {type,p,s,t,opts,blanked:s.zh.replace(t,'⬚')};
  }
  if(type==='mc'){
    const t=tgtIn(p,s.zh)||p.tgt[0];
    const altTok=(p.alt[0]&&!s.zh.includes(p.alt[0]))?p.alt[0]:sample(GPOOL,1,[t])[0];
    const c1=s.zh.replace(t,altTok);
    const c2=s.zh.replace(t,'');
    const segs=segZh(s.zh);
    let c3=s.zh;
    if(segs.length>2){const sw=shuf(segs.slice());c3=sw.join('')+(s.zh.match(/[。？！]$/)||[''])[0];if(c3===s.zh)c3=segs.slice().reverse().join('');}
    const opts=shuf([...new Set([s.zh,c1,c2,c3])].slice(0,4));
    return {type,p,s,opts,correct:s.zh};
  }
  if(type==='build'){
    let chunks=segZh(s.zh);
    let sh=shuf(chunks);
    let guard=0; while(sh.join('')===chunks.join('')&&guard++<5)sh=shuf(chunks);
    return {type,p,s,chunks,shuffled:sh,picked:[]};
  }
  if(type==='finish'){
    const cut=Math.max(2,Math.floor(s.zh.length*0.45));
    return {type,p,s,head:s.zh.slice(0,cut)};
  }
  return {type:'create',p,s};
}
const GTYPES=[['fib','Fill in the blank'],['mc','Multiple choice'],['build','Build the sentence'],['finish','Finish the sentence'],['create','Create your own']];
function startGramQuiz(scope){ // scope: array of points

  const qs=[];
  const types=GTYPES.map(t=>t[0]);

  for(let i=0;i<n;i++){
    const p=pts[i%pts.length];
    qs.push(buildQuestion(p,types[Math.floor(Math.random()*types.length)]));
  }
  gq={qs:shuf(qs),i:0,ok:0,state:'ask',chosen:null};
  renderGram();
}
function gramAnswer(ok){const q=gq.qs[gq.i];gMark(q.p.id,ok);if(ok)gq.ok++;gq.state='done';renderGram();}
function gramPick(idx){ // fib / mc click

}
function gramChunk(i){

let HWPromise=null;
function ensureHW(){
  if(window.HanziWriter)return Promise.resolve(true);
  if(HWPromise)return HWPromise;
  HWPromise=new Promise(res=>{
    const tryLoad=srcs=>{
      if(!srcs.length)return res(false);
      const s=document.createElement('script'); s.src=srcs[0];
      s.onload=()=>res(!!window.HanziWriter); s.onerror=()=>tryLoad(srcs.slice(1));
      document.head.appendChild(s);
    };
    tryLoad(['assets/hanzi-writer.min.js','https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js','https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.5.0/hanzi-writer.min.js']);
  });
  return HWPromise;
}
let STROKES=null,STROKESP=null;
function loadStrokes(){
  if(STROKES)return Promise.resolve(STROKES);
  if(STROKESP)return STROKESP;
  STROKESP=fetch('assets/strokes.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{STROKES=d;return d;}).catch(()=>{STROKES={};return STROKES;});
  return STROKESP;
}
function strokeDataLoader(char,onComplete,onErr){
  loadStrokes().then(d=>{
    if(d[char]){onComplete(d[char]);return;}
    fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/'+encodeURIComponent(char)+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(onComplete).catch(()=>onErr&&onErr());
  });
}
let strokeWriters=[];
function renderStrokes(hostId,text,opts){
  opts=opts||{};
  const host=document.getElementById(hostId); if(!host)return;
  const chars=[...text].filter(ch=>/\p{Script=Han}/u.test(ch));

    host.innerHTML=chars.map((c,i)=>'<div class="strokebox" id="'+hostId+'-c'+i+'"></div>').join('');

function playStrokes(){

function takeSnapshot(){

/* ---- BRAIN ---- */
let brainView='chars', brainGroup='stage', brainSel=null, brainTime=null;
const STAGE_NAMES=['Not started','Learning','Young','Solid','Mastered'];
const STAGE_DESC=['not yet studied','in short-step drilling (first days)','memory holds < 3 weeks','memory holds 3–6 weeks','memory holds 6+ weeks'];
function wordCards(wid){return MODES.filter(m=>S.settings.modes[m]).map(m=>S.cards[cardId(wid,m)]).filter(Boolean);}
function wordStage(wid){
  const cards=wordCards(wid); if(!cards.length)return 0;
  const started=cards.filter(c=>c.st!==undefined);
  if(!started.length)return 0;
  if(started.length<cards.length||started.some(c=>c.st==='learn'||c.st==='relearn'))return 1;
  const minS=Math.min(...started.map(c=>c.S));
  if(minS<7)return 1; if(minS<21)return 2; if(minS<MASTER_S)return 3; return 4;
}
function wordMem(wid){ // current recall probability (weakest card)
  const started=wordCards(wid).filter(c=>c.st!==undefined&&c.st==='rev');
  if(!started.length)return null;
  return Math.min(...started.map(c=>retrievability(Math.max(0.01,(Date.now()-c.last)/DAY),c.S)));
}
function wordDueNow(wid){return wordCards(wid).some(c=>c.st!==undefined&&c.due<=Date.now());}
function wordMastAt(wid){
  const cards=wordCards(wid); if(!cards.length)return null;
  if(!cards.every(c=>c.mastAt))return null;
  return Math.max(...cards.map(c=>c.mastAt));
}
function studyWords(){return WORDS.filter(w=>!isName(w)||S.settings.includeNames);}
const SIMP_CHAR={}; WORDS.forEach(w=>{if(w.s&&w.s.length===w.t.length){for(let i=0;i<w.t.length;i++){if(w.t[i]!==w.s[i])SIMP_CHAR[w.t[i]]=w.s[i];}}});
function charModel(){
  const map=new Map();
  studyWords().forEach(w=>{
    for(const ch of w.t){
      if(!/\p{Script=Han}/u.test(ch))continue;
      if(!map.has(ch))map.set(ch,{ch,words:[],stage:0,due:false,lesson:99,mem:null,mastAt:null});
      const e=map.get(ch);
      e.words.push(w.id);
      e.lesson=Math.min(e.lesson,w.l);
      const st=wordStage(w.id);
      if(st>e.stage){e.stage=st;}
      if(wordDueNow(w.id))e.due=true;
      const m=wordMem(w.id); if(m!==null)e.mem=e.mem===null?m:Math.max(e.mem,m);
      const ma=wordMastAt(w.id); if(ma&&(!e.mastAt||ma<e.mastAt||e.mastAt===null))e.mastAt=e.mastAt?Math.max(e.mastAt,ma):ma;
    }
  });
  return [...map.values()];
}
function firstTone(p){for(const ch of p){if(toneMarks[ch])return toneMarks[ch];}return 0;}
function posGroup(w){
  if(isName(w))return 'Names';
  const p=w.pos;
  if(!p)return 'Proper nouns';
  if(/^Vs/.test(p))return 'Adjectives 形';
  if(/^V/.test(p))return 'Verbs 動';
  if(p==='N')return 'Nouns 名';
  if(p==='Adv')return 'Adverbs 副';
  if(p==='M')return 'Measure words 量';
  if(p==='Ptc')return 'Particles 助';
  if(p==='Det')return 'Determiners';
  if(p==='Prep')return 'Prepositions';
  if(p==='Conj')return 'Conjunctions';
  if(p==='Ph')return 'Phrases 語';

}
function fmtAgo(ts){const d=Math.floor((Date.now()-ts)/DAY);return d<=0?'today':d===1?'1d ago':d+'d ago';}
function fmtDueIn(c){
  if(!c||c.st===undefined)return 'not started';

  if(ms<=0)return 'due now';
  if(ms<DAY)return 'due in '+Math.max(1,Math.round(ms/3600000))+'h';

function stageCounts(items){const c=[0,0,0,0,0];items.forEach(i=>c[i.stage!==undefined?i.stage:wordStage(i.id)]++);return c;}
function tileTitle(label,stage,mem,due){

}
function tlChart(){
  const H=S.hist,n=H.d.length; if(n<2)return '';
  const Wd=640,Hh=88;
  let maxTot=1; const layers=[];
  for(let i=0;i<n;i++){
    const c=[0,0,0,0,0];
    for(const d of H.s[i])c[+d]++;
    layers.push(c);
    maxTot=Math.max(maxTot,c[1]+c[2]+c[3]+c[4]);
  }
  const x=i=>n===1?0:i/(n-1)*Wd;
  const y=v=>Hh-4-(v/maxTot)*(Hh-10);
  // stack bottom→top: mastered, solid, young, learning
  const order=[4,3,2,1];
  const cum=layers.map(c=>{let a=0;const m={};order.forEach(st=>{a+=c[st];m[st]=a;});return m;});
  let polys='';
  order.forEach((st,k)=>{
    let top='',bot='';
    for(let i=0;i<n;i++)top+=(i?' ':'')+x(i).toFixed(1)+','+y(cum[i][st]).toFixed(1);
    for(let i=n-1;i>=0;i--)bot+=' '+x(i).toFixed(1)+','+(k===0?Hh-4:y(cum[i][order[k-1]])).toFixed(1);
    const cls='s'+st;
    const col={4:'#0b5d54',3:'#2f9184',2:'#7fbfb3',1:'#dcebe7'}[st];
    polys+='<polygon points="'+top+bot+'" fill="'+col+'"><title>'+STAGE_NAMES[st]+'</title></polygon>';
  });
  return '<svg class="tl-chart" viewBox="0 0 '+Wd+' '+Hh+'" preserveAspectRatio="none">'+polys+'</svg>';
}

function renderLib(){
  const el=document.getElementById('vLib');

  <div class="filters">

  </div>`;
  const q=libSearch.trim().toLowerCase();
  for(let ln=1;ln<=15;ln++){
    const ws=WORDS.filter(w=>w.l===ln).filter(w=>{
      if(q&&!(w.t.includes(q)||w.p.toLowerCase().includes(q)||w.m.toLowerCase().includes(q)))return false;
      const st=wordStatus(w.id);
      if(libFilter==='tracked'&&!st)return false;
      if(libFilter==='untracked'&&st)return false;
      if(libFilter==='due'&&(!st||st.k!=='due'))return false;
      if(libFilter==='simp'&&!w.s)return false;
      return true;
    });
    if(!ws.length&&(q||libFilter!=='all'))continue;
    const all=WORDS.filter(w=>w.l===ln);
    const nTracked=all.filter(w=>tracked(w.id)).length;
    const open=!!openLessons[ln]||q||libFilter!=='all';
    html+=`<div class="lesson ${open?'open':''}">
      <div class="head" onclick="openLessons[${ln}]=!openLessons[${ln}];renderLib()">
        <span class="car">▶</span>
        <div><div class="ttl">Lesson ${ln} · ${LESSON_TITLES[ln]}</div><div class="sub">${nTracked} of ${all.length} in deck</div></div>
        <div class="acts">
          ${nTracked<all.length?`<button class="btn sm ghost" onclick="event.stopPropagation();WORDS.filter(w=>w.l===${ln}).forEach(w=>trackWord(w.id));renderLib();badge()">Study lesson</button>
          <button class="btn sm ghost" title="mark whole lesson as already known" onclick="event.stopPropagation();if(confirm('Mark all of Lesson ${ln} as already known? They skip learning and re-check in about 3 weeks.')){WORDS.filter(w=>w.l===${ln}).forEach(w=>markKnown(w.id));renderLib();badge();}">Know it all</button>`
          :`<button class="btn sm ghost" onclick="event.stopPropagation();if(confirm('Remove all Lesson ${ln} cards and their progress?')){WORDS.filter(w=>w.l===${ln}).forEach(w=>untrackWord(w.id));renderLib();badge();}">Remove</button>`}
        </div>
      </div>
      <div class="prog"><i style="width:${all.length?Math.round(nTracked/all.length*100):0}%"></i></div>
      ${open?`<div class="wl">${ws.map(w=>wrowHtml(w)).join('')}</div>`:''}
    </div>`;
  }
  el.innerHTML=html;
}

  if(rq.fresh.length)return rq.fresh[0];
