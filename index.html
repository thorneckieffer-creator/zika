function todayDone(){const l=S.log[dkey(new Date())];return l?(l.rev||0)+(l.new||0):0;}
function nextDueText(){
  const now=Date.now(); let next=Infinity;
  for(const cid in S.cards){const c=S.cards[cid];if(!c||c.st===undefined||c.susp||!S.settings.modes[modeOf(cid)])continue;if(c.due>now&&c.due<next)next=c.due;}
  if(!isFinite(next))return '';
  const d=new Date(next), today=dkey(new Date())===dkey(d);
  const tm=new Date(new Date().getTime()+86400000);
  const m=Math.round((next-now)/60000);
  if(m<60)return 'next card in '+m+' min';
  if(today)return 'next cards at '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(dkey(tm)===dkey(d))return 'next cards tomorrow';
  return 'next cards '+dkey(d).slice(5).replace('-','/');
}
/* numbers that count up — small, fast, easing out */
function countUp(root){
  (root||document).querySelectorAll('[data-count]').forEach(el=>{
    const to=parseFloat(el.dataset.count)||0, suf=el.dataset.suf||'', t0=performance.now(), dur=650;
    if(!animOn()||to===0){el.textContent=to+suf;return;}
    (function f(t){const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e)+suf;if(k<1)requestAnimationFrame(f);})(t0);
  });
}
function ringSvg(frac,size,stroke,cls){
  const r=(size-stroke)/2, C=2*Math.PI*r, off=C*(1-Math.max(0,Math.min(1,frac)));
  return `<svg class="ring ${cls||''}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${off}"/></svg>`;
}
function ringArm(root){requestAnimationFrame(()=>requestAnimationFrame(()=>{(root||document).querySelectorAll('.ring .fg').forEach(c=>{c.style.strokeDashoffset=c.dataset.off;});}));}

   in the Library; word-type categories with rings in the Brain.

/* character stage map: ch → best stage across every tracked word that contains it */
function charStageMap(){
  const m={};
  for(const cid in S.cards){
    const c=S.cards[cid]; if(!c||c.st===undefined)continue;
    const w=byId[cid.split(':')[0]]; if(!w)continue;
    const st=wordStage(w.id);
    for(const ch of w.t){ if(/\p{Script=Han}/u.test(ch)&&(m[ch]===undefined||st>m[ch]))m[ch]=st; }
  }
  return m;
}
function lessonChars(ln){const set=new Set();(LESSON_WORDS[ln]||[]).forEach(w=>{if(!S.settings.includeNames&&isName(w))return;for(const ch of w.t)if(/\p{Script=Han}/u.test(ch))set.add(ch);});return [...set];}
/* per lesson: how many of its characters are solid (stage ≥3), learning (1–2), untouched */
function lessonMastery(ln,csm){
  csm=csm||charStageMap();
  const chars=lessonChars(ln); let solid=0,learn=0,mast=0;
  chars.forEach(ch=>{const st=csm[ch]||0; if(st>=4)mast++; else if(st===3)solid++; else if(st>=1)learn++;});
  return {n:chars.length,mast,solid,learn,known:mast+solid,frac:chars.length?(mast+solid)/chars.length:0,lfrac:chars.length?(mast+solid+learn)/chars.length:0};
}
/* two-tone ring: outer solid arc (known) drawn over a paler arc (learning) */
function ring2(m,size,stroke){
  const r=(size-stroke)/2, C=2*Math.PI*r;
  const arc=(f,cls)=>`<circle class="${cls}" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-Math.max(0,Math.min(1,f)))}"/>`;
  return `<svg class="ring r2 ${m.frac>=0.999&&m.n?'full':''}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>${arc(m.lfrac,'fg soft')}${arc(m.frac,'fg')}</svg>`;
}

const WCATS=[
  ['noun','Nouns','名詞',p=>p==='N'],
  ['verb','Action verbs','動作動詞',p=>/^(V|Vi|V-sep|Vpt)$/.test(p)],
  ['state','State verbs · adjectives','狀態動詞',p=>/^Vs/.test(p)||p==='Vst'],

  ['aux','Auxiliary verbs','助動詞',p=>p==='Vaux'],
  ['adv','Adverbs','副詞',p=>p==='Adv'],
  ['m','Measure words','量詞',p=>p==='M'],
  ['ptc','Particles','助詞',p=>p==='Ptc'],
  ['prep','Prepositions','介詞',p=>p==='Prep'],
  ['conj','Conjunctions','連詞',p=>p==='Conj'],
  ['det','Determiners','限定詞',p=>p==='Det'],
  ['ph','Phrases','短語',p=>p==='Ph'],
  ['name','Names & places','專有名詞',p=>true]];
function wordCat(w){ if(isName(w)||!w.pos)return 'name'; for(const c of WCATS){if(c[3](w.pos))return c[0];} return 'name'; }
let brainCat=null;
function catPanel(){
  const [lo,hi]=brainScope==='all'?[1,MAX_LN]:bookRange(brainScope);
  const ws=WORDS.filter(w=>(!isName(w)||S.settings.includeNames)&&w.l>=lo&&w.l<=hi);
  const bins={}; ws.forEach(w=>{const k=wordCat(w);(bins[k]=bins[k]||[]).push(w);});
  const tiles=WCATS.filter(c=>bins[c[0]]).map(c=>{
    const list=bins[c[0]]; let known=0,learn=0;
    list.forEach(w=>{const st=wordStage(w.id); if(st>=3)known++; else if(st>=1)learn++;});
    const m={n:list.length,frac:known/list.length,lfrac:(known+learn)/list.length};
    const on=brainCat===c[0];
    return `<div class="ctile ${on?'on':''} ${known?'':'none'}" onclick="brainCat=brainCat==='${c[0]}'?null:'${c[0]}';brainSel=null;renderBrain()">
      ${ring2(m,46,5)}<div class="ct-b"><b>${esc(c[1])}</b><span class="zh">${c[2]}</span><span class="ct-n">${known}<i>/${list.length}</i></span></div></div>`;
  }).join('');
  return `<div class="card"><div class="row spread" style="margin-bottom:10px"><div class="lab" style="margin:0">By word type${brainCat?' · <span class="link" onclick="brainCat=null;brainSel=null;renderBrain()">show all</span>':''}</div><div class="small muted">tap a type to focus the walls on it</div></div>
    <div class="cgrid">${tiles}</div></div>`;
}

const GP={}; for(const l in GRAMMAR){GRAMMAR[l].forEach(p=>{GP[p.id]={p,l:+l};});}
function isGram(cid){return typeof cid==='string'&&cid.slice(0,2)==='g:';}
function gramClozable(p){return !!(p.tgt&&p.tgt.length&&p.s&&p.s.some(x=>tgtIn(p,x.zh)));}
function gramCid(id){return 'g:'+id;}
function gramTrackedCount(ln){return (GRAMMAR[ln]||[]).filter(p=>S.cards[gramCid(p.id)]).length;}
function gramClozableCount(ln){return (GRAMMAR[ln]||[]).filter(gramClozable).length;}
function trackGram(ln){let n=0;(GRAMMAR[ln]||[]).forEach(p=>{if(gramClozable(p)&&!S.cards[gramCid(p.id)]){S.cards[gramCid(p.id)]={};n++;}});save();return n;}
function untrackGram(ln){(GRAMMAR[ln]||[]).forEach(p=>{delete S.cards[gramCid(p.id)];});save();}
function gramStage(id){const c=S.cards[gramCid(id)];if(!c||c.st===undefined)return 0;if(c.st!=='rev'||c.S<7)return 1;if(c.S<21)return 2;if(c.S<MASTER_S)return 3;return 4;}
/* grasp: 0 not started · 1 shaky · 2 getting there · 3 solid · 4 mastered — the cloze card's memory, checked against quiz + Which-one history */
const GRASP_T=['not started','shaky','getting there','solid','mastered'];
function gramGrasp(id){
  const st=gramStage(id), q=gStat(id);
  let lv=st;
  if(q.n>=3){const r=q.ok/q.n; if(r>=0.8&&q.n>=6)lv=Math.max(lv,3); else if(r>=0.6)lv=Math.max(lv,2); else if(r<0.5)lv=Math.min(lv||1,1); else lv=Math.max(lv,1);}
  const p=GP[id]&&GP[id].p; if(p){const f=famOf(p), cf=(S.cf||{})[f]; if(cf&&cf.n>=4&&cf.ok/cf.n<0.6)lv=Math.min(lv,1);}
  return lv;
}

function gramSentence(p,c){const sents=p.s.filter(x=>tgtIn(p,x.zh));const i=((c&&c.reps)||0)%Math.max(1,sents.length);return sents[i]||p.s[0];}
function gramBlank(p,s){const t=tgtIn(p,s.zh)||p.tgt[0];return {t,html:esc(s.zh).split(esc(t)).join('<span class="blank">'+'&nbsp;'.repeat(Math.max(2,t.length*2))+'</span>')};}

/* ---- 2. Which one? ---- */
function cfStat(k){return (S.cf||{})[k]||{n:0,ok:0};}
function cfMark(k,ok){S.cf=S.cf||{};const s=S.cf[k]=S.cf[k]||{n:0,ok:0};s.n++;if(ok)s.ok++;s.last=Date.now();save();}
function cfLevel(k){const s=cfStat(k);if(!s.n)return 0;const r=s.ok/s.n;return s.n<4?1:r>=0.9?4:r>=0.75?3:r>=0.6?2:1;}
function buildConfuse(fams,n){
  const pool=CONFUSE.filter(f=>!fams||fams.includes(f.k));
  const items=[];
  pool.forEach(f=>{const lv=cfLevel(f.k), wt=lv===0?3:lv===1?4:lv===2?2:1;f.q.forEach(q=>items.push({mode:'confuse',f,q,wt}));});
  const out=[]; let bag=items.slice();
  while(out.length<n&&bag.length){const tot=bag.reduce((a,x)=>a+x.wt,0);let r=Math.random()*tot,i=0;for(;i<bag.length;i++){r-=bag[i].wt;if(r<=0)break;}out.push(bag[i]);bag.splice(i,1);}
  return out;
}
function startConfuse(fams){drillMode='confuse';dq={qs:buildConfuse(fams,fams&&fams.length===1?Math.min(8,CONFUSE.find(f=>f.k===fams[0]).q.length):12),i:0,ok:0,state:'ask',chosen:null,fams};go('drill');}
function cfPick(i){
  /* a miss comes back once at the end of the round */
  try{const q=dq&&dq.qs[dq.i];if(q&&dq.state==='ask'){const opts=q.q.opts||q.f.opts;if(opts[i]!==q.q.a&&!q._requeued)dq.qs.push(Object.assign({},q,{_requeued:true}));}}catch(e){}
  const q=dq.qs[dq.i];if(dq.state!=='ask')return;dq.chosen=i;const opts=q.q.opts||q.f.opts;const ok=opts[i]===q.q.a;cfMark(q.f.k,ok);if(ok)dq.ok++;dq.state='done';haptic(ok?'good':'again');renderDrill();}
function renderConfuse(el){
  const q=dq.qs[dq.i], f=q.f, it=q.q, done=dq.state==='done', opts=it.opts||f.opts, pick=!!f.pick;
  const zh=pick?'':esc(it.zh).replace('⬚','<span class="blank">'+(done?esc(it.a):'&nbsp;&nbsp;&nbsp;')+'</span>');
  el.innerHTML=`<div class="rev-top"><span class="qtype">Which one? · ${esc(f.t)}</span><span class="qprog">${dq.i+1} / ${dq.qs.length}</span></div>
  <div class="qbox">
    ${pick?`<div class="qen" style="font-size:15.5px;color:var(--ink)">Which one says: “${esc(it.en)}”</div>`:`<div class="qzh zh">${zh}</div><div class="qen">${esc(it.en)}</div>`}
    <div class="opts ${pick?'sm':''}" ${pick?'style="grid-template-columns:1fr"':''}>${opts.map((o,i)=>`<button class="zh ${done?(o===it.a?'right':(dq.chosen===i?'wrong':'')):''}" onclick="cfPick(${i})">${esc(o)}</button>`).join('')}</div>
    ${done?`<div class="why ${opts[dq.chosen]===it.a?'ok':'bad'}"><b>${opts[dq.chosen]===it.a?'✓':'✗'}</b> ${esc(it.why)} <a class="nlink" href="${NOTION.index}#辨析" target="_blank" rel="noopener">rule ↗</a></div>`:''}
  </div>
  ${done?`<div class="qfoot" style="margin-top:12px"><button class="btn" onclick="drillNext()">Next →</button></div>`:''}`;
}
function confusePanel(){
  return `<div class="card"><div class="row spread" style="margin-bottom:6px"><div><div class="lab" style="margin:0">Which one? · 辨析</div><div class="small muted">weak families come up more often · rules are in the Grammar Index</div></div><button class="btn sm" onclick="startConfuse(null)">Mixed set · 12</button></div>

const WORD_BY_T=(()=>{const m={};WORDS.forEach(w=>{const k=w.t.split('（')[0];if(!m[k]||w.l<m[k].l)m[k]=w;});return m;})();
function readPool(){const cl=S.settings.curLesson||22, lo=Math.max(1,cl-4);const out=[];for(let l=lo;l<=cl;l++)(GRAMMAR[l]||[]).forEach(p=>p.s.forEach(s=>{if(s.zh.length>=8)out.push({p,s,l,wt:l===cl?3:l===cl-1?2:1});}));return out;}

/* =====================================================   v28 — one-scan device linking (Mac ⇄ iPad)
   1. A sync link: <app url>#sync=<code>. Opening it links the
      device to that code automatically, then the hash is removed.
   2. Settings → Cloud sync shows the link as a QR code + Copy link,
      with the iPad steps written next to it.
   3. Today shows a "Cloud sync is off" card with an inline code box
      whenever this device has no code (covers the iPad home-screen
      app, which keeps its own storage separate from Safari).
   4. iPad/iPhone Safari gets the Add to Home Screen hint once.
   ============================================================ */
/* a device that has never reviewed anything counts as empty, even though the
   app seeds a few unstarted cards on first open — so a fresh iPad adopts the
   Mac's deck quietly instead of asking which copy should win */
function syncLink(code){return location.origin+location.pathname.replace(/index\.html$/,'')+'#sync='+encodeURIComponent(code||SYNC.code);}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isStandalone(){return !!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));}
function qrSvg(text,cell){
  try{const q=window.qrcode(0,'M');q.addData(text);q.make();
    return q.createSvgTag({cellSize:cell||4,margin:2,scalable:true}).replace('<svg ','<svg class="qrsvg" ');}
  catch(e){return '';}
}
function fbCopyLink(){
  const t=syncLink(); if(!SYNC.code)return;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Link copied — open it on the other device'),()=>prompt('Copy this link:',t));
  else prompt('Copy this link:',t);
}
function fbPasteCode(id){
  const el=document.getElementById(id); if(!el)return;
  if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(t=>{const m=String(t).match(/sync=([a-z0-9-]+)/i);el.value=m?m[1]:String(t).trim();}).catch(()=>el.focus());
  else el.focus();
}

function mtGet(){S.mtest=S.mtest||{lo:9,hi:21,res:{},order:[],i:0,started:0};return S.mtest;}
function mtWords(){const T=mtGet();return WORDS.filter(w=>w.l>=T.lo&&w.l<=T.hi&&!isName(w)&&!/[+＋]|number|noun/i.test(w.t)).map(w=>w.id);}
function mtStart(lo,hi){const T=mtGet();if(lo)T.lo=lo;if(hi)T.hi=hi;T.order=mtWords();T.i=T.order.findIndex(id=>!T.res[id]);if(T.i<0)T.i=0;T.started=T.started||Date.now();save();drillMode='mtest';dq=null;MT.revealed=false;go('drill');}
function mtResume(){const T=mtGet();if(!T.order.length)return mtStart();T.i=T.order.findIndex(id=>!T.res[id]);if(T.i<0)T.i=T.order.length;drillMode='mtest';dq=null;MT.revealed=false;go('drill');}
function mtJump(ln){const T=mtGet();const i=T.order.findIndex(id=>byId[id].l===ln&&!T.res[id]);if(i>=0){T.i=i;MT.revealed=false;mtRender();}}
const MT={revealed:false};
function mtApply(wid,r){
  if(r==='m'){markMastered(wid);S.hard=(S.hard||[]).filter(x=>x!==wid);}
  else{untrackWord(wid);trackWord(wid);S.hard=(S.hard||[]).filter(x=>x!==wid);
    if(r==='h'){addHard(wid);S.pick=S.pick||[];if(!S.pick.includes(wid))S.pick.push(wid);}}
}
function mtMark(r){
  {const T=mtGet(),wid=T.order[T.i];if(wid){MT.stack.push({wid,i:T.i,cards:JSON.parse(JSON.stringify(MODES.map(m=>S.cards[cardId(wid,m)]||null))),hard:isHard(wid),pick:(S.pick||[]).includes(wid),prev:T.res[wid]||null});if(MT.stack.length>50)MT.stack.shift();}}
  const T=mtGet(),wid=T.order[T.i];if(!wid)return;
  T.res[wid]=r;mtApply(wid,r);haptic(r==='h'?'again':'good');
  T.i++;MT.revealed=false;save();badge();
  if(T.i>=T.order.length||byId[T.order[T.i]].l!==byId[wid].l){/* lesson boundary: pause here */}
  mtRender();
}
function mtUndo(){const u=MT.stack.pop();if(!u)return;const T=mtGet();
  MODES.forEach((m,i)=>{const c=u.cards[i];if(c)S.cards[cardId(u.wid,m)]=c;else delete S.cards[cardId(u.wid,m)];});
  S.hard=(S.hard||[]).filter(x=>x!==u.wid);if(u.hard)S.hard.push(u.wid);
  S.pick=(S.pick||[]).filter(x=>x!==u.wid);if(u.pick)S.pick.push(u.wid);
  if(u.prev)T.res[u.wid]=u.prev;else delete T.res[u.wid];
  T.i=u.i;MT.revealed=false;save();badge();mtRender();}
function mtStats(ln){const T=mtGet();const ids=T.order.length?T.order:mtWords();const sub=ln?ids.filter(id=>byId[id].l===ln):ids;const n={m:0,l:0,h:0,todo:0};sub.forEach(id=>{const r=T.res[id];if(r)n[r]++;else n.todo++;});n.n=sub.length;n.done=n.n-n.todo;return n;}

function laneOf(cid){

  const w=wordOf(cid); if(!w)return 'maint';
  if(w.l>=cl-1)return 'live';
  const r=(S.mtest&&S.mtest.res||{})[w.id];
  if(r==='l'||r==='h'||isHard(w.id))return 'catch';
  return 'maint';
}
function laneCounts(){
  const q=buildQueue(), out={live:{due:0,fresh:0},catch:{due:0,fresh:0},maint:{due:0,fresh:0}};

/* ============================================================
   v43 — 聲調教練 Tone coach (beta). Record a word, see your pitch
   curve against the native speaker's, and get each syllable's tone
   graded. Everything is signal processing in the browser: no audio
   leaves the device. The app keeps a running picture of your voice
   (mid pitch and range) and of which tones and tone pairs you miss.
   v52 rebuilt the analysis (tracker, octave repair, segmentation,
   classifier) against ten voices: docs/voice.md, tools/tone_lab.mjs.
   ============================================================ */
const TC_SR=16000, TC_HOP=0.01, TC_FRAME=0.025, TC_FMIN=70, TC_FMAX=420;
/* mono Float32 at any rate → 16 kHz (box-filter decimation is plenty for pitch) */
function tcResample(x,sr){
  if(sr===TC_SR)return x;
  const ratio=sr/TC_SR, n=Math.floor(x.length/ratio), y=new Float32Array(n);
  for(let i=0;i<n;i++){const a=Math.floor(i*ratio), b=Math.min(x.length,Math.floor((i+1)*ratio)); let s=0; for(let j=a;j<b;j++)s+=x[j]; y[i]=s/Math.max(1,b-a);}
  return y;
}
/* YIN pitch tracker → Hz per 10 ms frame, 0 where unvoiced; the loudness of each frame rides along as f0.rms */
function tcPitch(x){
  const N=Math.round(TC_FRAME*TC_SR), H=Math.round(TC_HOP*TC_SR), tMin=Math.floor(TC_SR/TC_FMAX), tMax=Math.ceil(TC_SR/TC_FMIN);
  const frames=Math.max(0,Math.floor((x.length-N-tMax)/H)), f0=new Float32Array(frames), rms=new Float32Array(frames), d=new Float32Array(tMax+1);
  for(let f=0;f<frames;f++){ const o=f*H; let e=0; for(let j=0;j<N;j++)e+=x[o+j]*x[o+j]; rms[f]=Math.sqrt(e/N); }
  /* the gate follows the loud part of the take, not its single loudest click */
  const loud=Array.from(rms).sort((a,b)=>a-b)[Math.floor(frames*0.9)]||0, gate=Math.max(0.002,loud*0.1);
  f0.rms=rms;
  for(let f=0;f<frames;f++){
    if(rms[f]<gate)continue;
    const o=f*H; let run=0, best=0;
    for(let t=1;t<=tMax;t++){
      let s=0; for(let j=0;j<N;j++){const v=x[o+j]-x[o+j+t]; s+=v*v;}
      run+=s; d[t]=run?s*t/run:1;
    }
    for(let t=tMin;t<tMax;t++){ if(d[t]<0.14){ while(t+1<tMax&&d[t+1]<d[t])t++; best=t; break; } }
    if(!best){ let m=1; for(let t=tMin;t<tMax;t++)if(d[t]<m){m=d[t];best=t;} if(m>0.45)continue; }
    const a=d[best-1], b=d[best], c=d[best+1], den=a-2*b+c, shift=den?0.5*(a-c)/den:0;
    f0[f]=TC_SR/(best+(Math.abs(shift)<1?shift:0));
  }
  return f0;
}
/* clean a raw track → semitones re 100 Hz (NaN = unvoiced): octave slips put back, blips out, short gaps bridged.
   A slip is found by continuity, never by distance from the speaker's middle: a voice really does travel an octave
   inside one falling tone, and a creaky low tone flickers between a note and the octave under it. Each voiced frame
   may stay, or move an octave either way; the cheapest path is the one with no jump faster than a voice can glide. */
function tcClean(f0){
  const n=f0.length, st=new Float32Array(n).fill(NaN), ix=[];
  for(let i=0;i<n;i++)if(f0[i]>0){st[i]=Math.log2(f0[i]/100)*12;ix.push(i);}
  const m=ix.length; if(m<4)return st.fill(NaN);
  const SH=[0,12,-12], cost=[0,0.3,0.3], back=new Int8Array(m*3);
  for(let q=1;q<m;q++){
    const g=ix[q]-ix[q-1], d=st[ix[q]]-st[ix[q-1]], next=[0,0,0];
    for(let k=0;k<3;k++){ let best=Infinity, arg=0;
      for(let p=0;p<3;p++){const c=cost[p]+Math.max(0,Math.abs(d+SH[k]-SH[p])-1.5*g); if(c<best){best=c;arg=p;}}
      next[k]=best+(k?0.3:0); back[q*3+k]=arg; }
    cost[0]=next[0]; cost[1]=next[1]; cost[2]=next[2];
  }
  let k=cost[1]<cost[0]?1:0; if(cost[2]<cost[k])k=2;
  for(let q=m-1;q>=0;q--){ st[ix[q]]+=SH[k]; k=back[q*3+k]; }
  for(let i=0;i<n;i++){ if(!isNaN(st[i])&&(i===0||isNaN(st[i-1]))&&(i===n-1||isNaN(st[i+1])))st[i]=NaN; }          /* lone frames */
  for(let i=1;i<n-1;i++){ if(!isNaN(st[i])&&!isNaN(st[i-1])&&!isNaN(st[i+1])){const md=[st[i-1],st[i],st[i+1]].sort((a,b)=>a-b)[1]; if(Math.abs(st[i]-md)>3)st[i]=md;} }
  for(let i=0;i<n;i++){ if(!isNaN(st[i]))continue; let j=i; while(j<n&&isNaN(st[j]))j++; if(i>0&&j<n&&j-i<=4){for(let q=i;q<j;q++)st[q]=st[i-1]+(st[j]-st[i-1])*(q-i+1)/(j-i+1);} i=j; }
  return st;
}
/* voiced stretches → exactly `count` syllables. A short stray stretch well away from the rest (the hiss of an x or sh
   that the tracker took for a note) is dropped and close gaps are merged; a stretch that holds more than one syllable
   is cut into equal parts and each cut is moved to the nearest dip in loudness (the closure between two syllables).

  let runs=[]; const n=st.length;

  if(!runs.length||count<1)return [];

    let k=0, g=Infinity; for(let i=0;i<runs.length-1;i++){const gap=runs[i+1][0]-runs[i][1]; if(gap<g){g=gap;k=i;}}
    const la=runs[k][1]-runs[k][0], lb=runs[k+1][1]-runs[k+1][0];

  const line=(pts,x0)=>pts.map((z,i)=>(i?'L':'M')+(x0+14+i*(W-28)/15).toFixed(1)+','+y(z).toFixed(1)).join('');
  let g='';
  for(let i=0;i<n;i++){
    const x0=i*W, s=res.syl[i], r=res.ref&&res.ref.syl[i];
    g+=`<rect x="${x0+3}" y="3" width="${W-6}" height="${H-6}" rx="10" class="tc-cell"/>`
      +`<line x1="${x0+10}" x2="${x0+W-10}" y1="${H/2}" y2="${H/2}" class="tc-mid"/>`
      +(r?`<path d="${line(r.z,x0)}" class="tc-ref"/>`:'')
      +`<path d="${line(s.s.z,x0)}" class="tc-me ${s.ok===null?'na':s.ok?'ok':s.close?'close':'no'}"/>`;
  }

  return out;
}

/* ============================================================
   My words — a personal deck for vocabulary met outside class.
   Kept apart from the course on purpose: its own words (ids u1,
   u2 … never reused), its own cards and daily intake, the same
   FSRS-5 maths. Lives in S.my, so it syncs and backs up with
   everything else.  S.my = {n, w:{id:{t,p,m,at,g?}}, c:{'id:rec':card}, intro:{day:n}, log:{day:n}, perDay, both, tp:[{id,n}], tn}
   Topics (v60): d.tp lists them in order, ids t1, t2 … never reused (d.tn counts up); a word names its topics in w.g.
   ============================================================ */
const MY={mode:'list',cur:null,shown:false,done:0,q:'',edit:null,tab:'one',
  tp:null,      /* the list's topic filter: null = all, a topic id, or '-' = words with no topic */
  sel:[],       /* topics ticked in the add / edit sheet */
  auto:{p:'',m:''},   /* what the sheet last filled into Pinyin and Meaning by itself: a field still holding it follows the characters, one you typed in is left alone */
  scope:null};  /* the filter the running study session was started with */
/* The topics a deck starts with: parts of life, not parts of speech. Every device seeds the same ids in the same order, so two that seed apart still agree. */
const MY_TOPICS=['Food & drink','Getting around','Shopping & money','Home & daily life','School & study','Work','People & family','Health & body','Feelings & opinions','Free time','Travel & places','Slang & set phrases'];
function myDeck(){
  if(!S.my||typeof S.my!=='object')S.my={n:1,w:{},c:{},intro:{},log:{}};
  const d=S.my; d.w=d.w||{}; d.c=d.c||{}; d.intro=d.intro||{}; d.log=d.log||{}; d.n=d.n||1;
  if(!Array.isArray(d.tp))d.tp=MY_TOPICS.map((n,i)=>({id:'t'+(i+1),n}));
  if(!d.tn)d.tn=1+d.tp.reduce((m,t)=>Math.max(m,+String(t.id).slice(1)||0),MY_TOPICS.length);
  return d;
}
const myIds=()=>Object.keys(myDeck().w);
const myModes=()=>myDeck().both?['rec','prod']:['rec'];
const myWord=cid=>myDeck().w[cid.split(':')[0]];
function myAdd(t,p,m,g){
  t=String(t||'').trim(); if(!t)return null;
  const d=myDeck(); for(const id in d.w)if(d.w[id].t===t)return {id,dup:true};
  const id='u'+(d.n++); d.w[id]={t,p:String(p||'').trim(),m:String(m||'').trim(),at:Date.now()}; myTag(d.w[id],g);
  return {id};
}
/* ---- topics ---- */
const myTopic=id=>myDeck().tp.find(t=>t.id===id)||null;
function myTopicsOf(w){const d=myDeck();return ((w&&w.g)||[]).map(id=>d.tp.find(t=>t.id===id)).filter(Boolean);}
function myInTopic(w,f){if(!f)return true;const ts=myTopicsOf(w);return f==='-'?!ts.length:ts.some(t=>t.id===f);}
function myTag(w,ids){if(ids&&ids.length)w.g=[...new Set(ids)];else delete w.g;}
const myScopeName=f=>f==='-'?'No topic':f?(myTopic(f)||{}).n||'':'';
function myTopicAdd(name){
  name=String(name||'').replace(/\s+/g,' ').trim().slice(0,30); if(!name)return null;
  const d=myDeck(), had=d.tp.find(t=>t.n.toLowerCase()===name.toLowerCase()); if(had)return had.id;
  const id='t'+(d.tn++); d.tp.push({id,n:name}); return id;
}
function myTopicCounts(){
  const d=myDeck(), c={'-':0};
  for(const id in d.w){const ts=myTopicsOf(d.w[id]); if(!ts.length)c['-']++; ts.forEach(t=>{c[t.id]=(c[t.id]||0)+1;});}
  return c;
}
function myTopicPills(w,skip){const ts=myTopicsOf(w).filter(t=>t.id!==skip);return ts.length?'<div class="tp">'+ts.map(t=>'<span>'+esc(t.n)+'</span>').join('')+'</div>':'';}   /* skip: the topic the list is already filtered to */
/* ---- the dictionary (v62): CC-CEDICT, CC BY-SA 4.0, cut down by tools/build_dict.py to one line per word:
   字<TAB>pinyin<TAB>gloss[<TAB>pinyin<TAB>gloss …] — the first pair is the everyday reading (Taiwan's where it differs), the rest are other readings.
   7 MB, about 3 MB over the air: fetched the first time My words is opened, then kept by the service worker with the other assets. ---- */
const DC={url:'assets/dict.txt?v=1',map:null,wait:null,failed:false,warm:false};
function dcLoad(){
  if(DC.map)return Promise.resolve(DC.map);
  if(!DC.wait)DC.wait=fetch(DC.url).then(r=>{if(!r.ok)throw new Error('dict '+r.status);return r.text();}).then(txt=>{
    const m=new Map(); let i=0;
    while(i<txt.length){const e=txt.indexOf('\n',i), end=e<0?txt.length:e, tab=txt.indexOf('\t',i); if(tab>i&&tab<end)m.set(txt.slice(i,tab),txt.slice(tab+1,end)); i=end+1;}
    DC.map=m; DC.failed=false; return m;
  }).catch(()=>{DC.wait=null;DC.failed=true;return null;});   /* offline before the first fetch: the next call tries again */
  return DC.wait;
}
function dcEntry(t){
  const v=DC.map&&DC.map.get(t); if(!v)return null;
  const f=v.split('\t'), out=[]; for(let i=0;i+1<f.length;i+=2)out.push({p:f[i],m:f[i+1]});
  return out.length?out:null;
}
/* what the dictionary knows about a word or phrase: the word itself, or failing that its parts by longest match (pinyin only) */
function dcLook(t){
  t=String(t||'').trim(); if(!t||!DC.map)return null;
  const han=[...t].filter(ch=>/\p{Script=Han}/u.test(ch)), whole=dcEntry(t)||dcEntry(han.join(''));
  if(whole)return {p:whole[0].p,m:whole[0].m,alts:whole.slice(1),parts:null};
  const parts=[]; let i=0;
  while(i<han.length){
    let hit=null;
    for(let n=Math.min(6,han.length-i);n>=1&&!hit;n--){     /* a part the course teaches is read the course's way: 吧 ba, 得 de */
      const w=han.slice(i,i+n).join(''), cw=myCourseWord(w), e=cw?[{p:cw.p,m:cw.m}]:dcEntry(w); if(e)hit={t:w,n,p:e[0].p,m:e[0].m};}
    if(!hit)return null;
    parts.push(hit); i+=hit.n;
  }
  /* 一 and 不 between parts are written with the tone they are spoken with, as the course and the dictionary write them inside a word: 不 + 見 bú jiàn */
  parts.forEach((x,k)=>{
    const nx=parts[k+1], tn=nx?toneSeq(nx.p)[0]:0; if(!tn)return;
    if(x.t==='不'&&x.p==='bù'&&tn===4)x.p='bú';
    else if(x.t==='一'&&x.p==='yī'&&!(k&&/[第十初]$/.test(parts[k-1].t)))x.p=tn===4?'yí':tn<=3?'yì':x.p;
  });
  return parts.length?{p:parts.map(x=>x.p).join(' '),m:'',alts:[],parts}:null;
}
/* The best guess at a word's pinyin and meaning: the course's own if it teaches the word, then the dictionary, then (pinyin only) character by character. */
function myCourseWord(t){return WORDS.find(w=>w.t===t||String(w.t).split('（')[0]===t)||null;}
function myGuess(t){
  t=String(t||'').trim(); const none={p:'',m:'',alts:[],parts:null,src:''}; if(!t)return none;
  const cw=myCourseWord(t); if(cw)return {p:cw.p,m:cw.m,alts:[],parts:null,src:'course'};
  const d=dcLook(t); if(d)return Object.assign(d,{src:'dict'});
  const out=[]; for(const ch of t){ if(!/\p{Script=Han}/u.test(ch))continue; const c=COMPONENTS[ch]; if(!c||!c.p)return none; out.push(String(c.p).split(/[,;/ ]/)[0]); }
  return out.length?{p:out.join(''),m:'',alts:[],parts:null,src:'chars'}:none;
}
const myMissing=()=>{const d=myDeck();return myIds().filter(id=>!d.w[id].p||!d.w[id].m);};
/* words added before the dictionary, or while it could not be reached */
function myFillMissing(){
  toast('Looking them up…');
  dcLoad().then(()=>{
    const d=myDeck(), was={}; let n=0;
    for(const id of myMissing()){const w=d.w[id], g=myGuess(w.t), p=w.p||g.p, m=w.m||g.m; if(p!==w.p||m!==w.m){was[id]={p:w.p,m:w.m};w.p=p;w.m=m;n++;}}
    if(!n){toast(DC.map?'The dictionary has nothing more for those words':'The dictionary could not be reached. It needs a connection the first time.');return;}
    save(); if(view==='my'&&MY.mode!=='study')renderMy();
    toast('Filled in '+n+' word'+(n===1?'':'s'),{action:'Undo',ms:7000,onAction:()=>{const dd=myDeck();for(const id in was)if(dd.w[id])Object.assign(dd.w[id],was[id]);save();if(view==='my'&&MY.mode!=='study')renderMy();}});
  });
}
function myQueue(f){   /* f: a topic filter as in MY.tp; the daily allowance of new cards is the deck's, whatever the filter */
  const d=myDeck(), now=Date.now(), learn=[], rev=[], fresh=[], ahead=[];
  for(const id in d.w){ if(f&&!myInTopic(d.w[id],f))continue; for(const m of myModes()){
    const cid=id+':'+m, c=d.c[cid];
    if(!c||c.st===undefined){fresh.push(cid);continue;}
    if(c.due<=now)(c.st==='rev'?rev:learn).push(cid); else if(c.st!=='rev')ahead.push(cid);
  }}
  const by=(a,b)=>d.c[a].due-d.c[b].due; learn.sort(by); rev.sort(by); ahead.sort(by);
  const left=Math.max(0,(d.perDay??10)-(d.intro[dkey(new Date())]||0));
  return {learn,rev,fresh:fresh.slice(0,left),waiting:fresh.length,ahead};
}
function myRate(cid,g){
  const d=myDeck(), now=Date.now(), today=dkey(new Date()); let c=d.c[cid];
  const sched=days=>{c.due=now+fuzz(days)*DAY;c.days=(c.days||0)+1;};
  if(!c||c.st===undefined){
    d.intro[today]=(d.intro[today]||0)+1;
    c=d.c[cid]={st:'learn',S:initS(g),D:initD(g),due:0,last:now,reps:1,lapses:0,days:0};
    if(g===1)c.due=now+MIN; else if(g===2)c.due=now+5*MIN; else if(g===3)c.due=now+10*MIN; else{c.st='rev';sched(nextIntervalDays(c.S));}
  }else if(c.st==='learn'||c.st==='relearn'){
    c.reps++;c.last=now;c.S=stabShort(c.S,g);c.D=updD(c.D,g);
    if(g===1)c.due=now+MIN; else if(g===2)c.due=now+5*MIN; else{c.st='rev';sched(Math.max(1,nextIntervalDays(c.S)));}
  }else{
    const t=Math.max(0.01,(now-c.last)/DAY), r=retrievability(t,c.S), d0=c.D;
    c.D=updD(d0,g);c.reps++;c.last=now;
    if(g===1){c.lapses++;c.S=stabForget(c.S,d0,r);c.st='relearn';c.due=now+5*MIN;}
    else{c.S=stabRecall(c.S,d0,r,g);sched(nextIntervalDays(c.S));}
  }
  d.log[today]=(d.log[today]||0)+1;
  for(const k of ['intro','log']){const ks=Object.keys(d[k]).sort(); while(ks.length>120)delete d[k][ks.shift()];}
  save();
}
function myBadge(){const q=myQueue(), n=q.learn.length+q.rev.length+q.fresh.length, b=document.getElementById('bMy');if(b){b.textContent=n;b.classList.toggle('zero',n===0);}}
function myState(id){
  const d=myDeck(), c=d.c[id+':rec'], now=Date.now();
  if(!c||c.st===undefined)return '<span class="tag">new</span>';
  if(c.due<=now)return '<span class="tag due">due</span>';
  if(c.st!=='rev')return '<span class="tag">learning</span>';
  const days=Math.max(1,Math.round((c.due-now)/DAY));
  return '<span class="tag ok">in '+days+'d</span>';
}
function mySpk(id){return '<button class="spk" title="pronounce" onclick="event.stopPropagation();mySay(\''+id+'\')">'+SPK_SVG+'</button>';}
function mySay(id){const w=myDeck().w[id];if(w)playAudio(w.t,w.p||undefined);}

/* ---- list ---- */
function renderMy(){
  const host=document.getElementById('vMy'); if(!host)return;
  if(MY.mode==='study'){myStudyRender();return;}
  const d=myDeck(), all=myIds();
  if(MY.tp&&!all.some(id=>myInTopic(d.w[id],MY.tp)))MY.tp=null;      /* the last word left that topic */
  const q=myQueue(MY.tp), name=myScopeName(MY.tp), inTopic=MY.tp?all.filter(id=>myInTopic(d.w[id],MY.tp)).length:all.length;
  const ready=q.learn.length+q.rev.length+q.fresh.length;
  /* words with a gap; once the dictionary is in memory, only those it can do something for */
  const gaps=myMissing().filter(id=>{if(!DC.map)return true;const w=d.w[id],g=myGuess(w.t);return (!w.p&&g.p)||(!w.m&&g.m);}).length;
  myBadge();
  /* have the dictionary on the device before it is needed offline; once it is here the line about gaps counts only what it can fill */
  if(!DC.map&&!DC.wait&&!DC.warm&&navigator.onLine!==false){DC.warm=true;setTimeout(()=>dcLoad().then(m=>{
    DC.warm=false; const sh=document.getElementById('shSheet'), at=document.activeElement;
    if(m&&view==='my'&&MY.mode==='list'&&!(sh&&sh.style.display==='flex')&&!(at&&at.id==='myQ'))renderMy();}),1200);}
  const head=`<div class="my-head"><div><h1>My words</h1><div class="sub">Your own deck for words outside class. It is scheduled like the course, and kept separate from it.</div></div>
    <button class="btn" onclick="myOpenAdd()">Add words</button></div>`;
  if(!all.length){
    host.innerHTML=head+`<div class="card my-empty"><div class="big">生詞</div><div style="font-weight:600;font-size:16px">Nothing here yet</div>
      <div class="small muted" style="max-width:380px;margin:6px auto 16px">A word from a menu, a sign, a show or a friend: add it here and it comes back on the same schedule as your class words, without touching the course deck.</div>
      <button class="btn" onclick="myOpenAdd()">Add your first word</button></div>`;
    return;
  }
  host.innerHTML=head+`<div class="card">
      <div class="row spread" style="margin-bottom:12px"><div><div class="lab" style="margin-bottom:2px">Ready now${name?' · '+esc(name):''}</div>
        <div class="small muted">${q.rev.length} due · ${q.learn.length} learning · ${q.fresh.length} new${q.waiting>q.fresh.length?' ('+(q.waiting-q.fresh.length)+' more waiting)':''}</div></div>
        <div style="font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em">${ready}</div></div>
      <button class="btn big" ${ready||q.ahead.length?'':'disabled'} onclick="myStart(MY.tp)">${ready?'Study '+(name?esc(name):'my words'):q.ahead.length?'Keep going · '+q.ahead.length+' still learning':'All caught up'}</button>
      <div class="set-row" style="margin-top:8px"><div><b>New cards a day</b><div class="d">how many new cards this deck starts each day</div></div>
        <input type="number" min="0" max="100" value="${d.perDay??10}" onchange="const v=parseInt(this.value);myDeck().perDay=Math.max(0,isNaN(v)?10:v);save();renderMy()"></div>
      <div class="set-row"><div><b>Both directions</b><div class="d">also ask from the meaning back to the characters, to write on paper</div></div>
        <button class="tgl${d.both?' on':''}" aria-label="both directions" onclick="myDeck().both=!myDeck().both;save();renderMy()"><i></i></button></div>
    </div>
    <div class="card"><div class="lab">${MY.tp?inTopic+' of ':''}${all.length} word${all.length===1?'':'s'}</div>
      ${gaps?`<div class="small muted" style="margin:6px 0 2px">${gaps} word${gaps===1?' is':'s are'} missing pinyin or a meaning · <span class="link" onclick="myFillMissing()">Fill in from the dictionary</span></div>`:''}
      ${myTopicBar()}
      ${all.length>6?`<input class="search" id="myQ" placeholder="Search characters, pinyin, meaning or topic" value="${esc(MY.q).replace(/"/g,'&quot;')}" oninput="MY.q=this.value;myListOnly()">`:''}
      <div id="myList">${myRows(myShown())}</div></div>`;
}
/* the words the list shows: the topic filter, then the search box; newest first */
function myShown(){
  const d=myDeck(), f=MY.q.trim().toLowerCase(), plain=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return myIds().filter(id=>myInTopic(d.w[id],MY.tp)).sort((a,b)=>d.w[b].at-d.w[a].at).filter(id=>{
    if(!f)return true; const w=d.w[id];
    return (w.t+' '+w.p+' '+w.m+' '+myTopicsOf(w).map(t=>t.n).join(' ')).toLowerCase().includes(f)||plain(w.p).includes(f);});
}
/* the row of topic filters above the list: only topics that hold a word, then the door to the topic editor */
function myTopicBar(){
  const d=myDeck(), c=myTopicCounts(), used=d.tp.filter(t=>c[t.id]);
  const b=(f,label,n)=>`<button class="${(MY.tp||'')===f?'on':''}" onclick="mySetTopic('${f}')">${esc(label)}<span class="n">${n}</span></button>`;
  if(!used.length)return `<div class="my-chips bar"><button class="add" onclick="myTopicsSheet()">Topics</button><span class="small muted" style="align-self:center">Sort words by the part of life they belong to: tap a word’s ✎.</span></div>`;
  return `<div class="my-chips bar">${b('','All',myIds().length)}${used.map(t=>b(t.id,t.n,c[t.id])).join('')}${c['-']?b('-','No topic',c['-']):''}<button class="add" onclick="myTopicsSheet()">Edit topics</button></div>`;
}
function mySetTopic(f){MY.tp=f||null;renderMy();}
function myRows(ids){
  const d=myDeck();
  if(!ids.length)return '<div class="small muted" style="padding:10px 0">No match.</div>';
  return ids.map(id=>{const w=d.w[id];return `<div class="my-row"><div class="tr">${esc(w.t)}</div>
    <div class="info"><div class="py">${w.p?tonePinyin(esc(w.p)):'<span class="muted">no pinyin</span>'}</div><div class="mn">${esc(w.m)||'<span class="muted">no meaning yet</span>'}</div>${myTopicPills(w,MY.tp)}</div>
    ${myState(id)}${mySpk(id)}<button class="wbtn" title="edit" aria-label="edit" onclick="myOpenAdd('${id}')">✎</button></div>`;}).join('');

/* Pinyin and Meaning follow the characters as they are typed. A field is filled only while it is empty or still holds what was filled in
   last time (MY.auto), so anything typed by hand stays. */
function myFill(){
  const g=id=>document.getElementById(id), T=g('myT'), P=g('myP'), M=g('myM'); if(!T||!P||!M)return;
  const a=MY.auto, x=myGuess(T.value);
  if(!P.value.trim()||P.value===a.p){P.value=x.p;a.p=x.p;}
  if(!M.value.trim()||M.value===a.m){M.value=x.m;a.m=x.m;}
  const eg=!T.value.trim(); P.placeholder=eg?'zhēnzhū nǎichá':''; M.placeholder=eg?'bubble tea':'';   /* the example belongs to the empty form, not to a word being typed */
}
function myHint(e){
  if(e&&e.isComposing)return;                      /* an input method still composing: wait for the characters */
  const T=document.getElementById('myT'), box=document.getElementById('myHintBox'); if(!T||!box)return;
  myFill();
  const t=T.value.trim(), d=myDeck(), cw=myCourseWord(t);
  const dup=Object.keys(d.w).find(id=>d.w[id].t===t&&id!==MY.edit);
  let h='';
  if(dup)h='Already in My words.';
  else if(cw)h='This is a course word (Book '+bookOf(cw.l)+' · Lesson '+lnInBook(cw.l)+'): '+esc(cw.m)+'. You can still add it here.';
  else if(/\p{Script=Han}/u.test(t)){
    const g=myGuess(t);
    if(!DC.map)h=DC.failed?'The dictionary could not be reached, so nothing is looked up. It needs a connection the first time.':'Looking it up…';
    else if(g.src==='dict'&&g.parts&&g.parts.length>1)h='Not in the dictionary as one word, so the pinyin is put together from its parts and the meaning is yours to write: '
      +g.parts.map(x=>'<span class="zh">'+esc(x.t)+'</span> '+esc(x.p)+' <i>'+esc(x.m.split('; ')[0])+'</i>').join(' · ');
    else if(g.src==='dict'&&g.alts.length)h='Also read '+g.alts.map((x,i)=>'<button type="button" class="my-alt" onclick="myUseAlt('+i+')"><b>'+esc(x.p)+'</b> '+esc(x.m)+'</button>').join('');
    else if(g.src!=='dict')h='Not in the dictionary. Type the pinyin and the meaning yourself.';
  }
  box.innerHTML=h?'<div class="my-hint">'+h+'</div>':'';
}

   a tap on one of these buttons begins with that blur, and a repaint would remove the button before the tap lands.) */
function myUseAlt(i){

function mySaveOne(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim(), t=g('myT');
  if(!t){toast('Type the characters first');return;}

  let p=g('myP'); const m=g('myM');
  if(!p)p=myGuess(t).p;
  const d=myDeck();

    Object.assign(d.w[MY.edit],{t,p,m}); myTag(d.w[MY.edit],MY.sel); save(); shClose(); renderMy(); toast('Saved'); return;
  }
  const r=myAdd(t,p,m,MY.sel);

function renderMyKeepSheet(){const host=document.getElementById('vMy');if(host&&MY.mode!=='study'){const keep=document.activeElement;renderMy();try{if(keep&&keep.focus)keep.focus();}catch(e){}}}
const MY_PY=/^[a-zāáǎàēéěèīíǐìōóǒòūúǔùüǖǘǚǜ\s'’·\-0-5]+$/i;
function myParse(text){
  const out=[];
  String(text||'').split(/\n/).forEach(line=>{
    line=line.trim(); if(!line)return;
    let parts=line.split(/\t|[;；|｜]|[,，]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length===1){const mm=line.match(/^([^\sA-Za-z]+)\s+(.+)$/); if(mm)parts=[mm[1],mm[2]];}
    const t=parts[0]; if(!t||!/\p{Script=Han}/u.test(t))return;
    let p='', m='';
    if(parts.length>=3){p=parts[1];m=parts.slice(2).join(', ');if(!MY_PY.test(p)){m=parts.slice(1).join(', ');p='';}}
    else if(parts.length===2){if(MY_PY.test(parts[1])&&/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ1-5]/i.test(parts[1]))p=parts[1];else m=parts[1];}
    const x=myGuess(t); out.push({t,p:p||x.p,m:m||x.m});
  });
  return out;
}
function mySaveMany(){
  if(!DC.map&&!DC.failed){toast('Looking them up…');dcLoad().then(mySaveMany);return;}
  const rows=myParse((document.getElementById('myBulk')||{}).value); if(!rows.length){toast('Nothing to add yet: one word per line, characters first');return;}
  const d=myDeck(); let added=0, dup=0;
  rows.forEach(r=>{
    const x=myAdd(r.t,r.p,r.m,MY.sel); if(!x)return;
    if(x.dup){dup++; if(MY.sel.length)myTag(d.w[x.id],(d.w[x.id].g||[]).concat(MY.sel));}   /* a word already in the deck joins the topics too */
    else added++;
  });
  save(); shClose(); if(view==='my')renderMy(); else myBadge();
  toast('Added '+added+' word'+(added===1?'':'s')+(dup?' · '+dup+' already there':''));
}
function myDelete(id){
  const d=myDeck(), w=d.w[id]; if(!w)return;
  const cards={}; for(const k in d.c)if(k.split(':')[0]===id){cards[k]=d.c[k];delete d.c[k];}
  delete d.w[id]; save(); shClose(); renderMy();
  toast('Deleted '+esc(w.t),{action:'Undo',ms:7000,onAction:()=>{const dd=myDeck();dd.w[id]=w;Object.assign(dd.c,cards);save();renderMy();}});
}

/* ============================================================
   用法 — usage phrases (functions prefixed us*).
   USAGE[wordId] = [[中文, pinyin, English], …]: short collocations first, then a sentence or two.
   The phrases are written in tools/content/usage_phrases.txt; tools/check_usage.py checks them
   (only characters met by the end of the word's lesson), generates the pinyin and rewrites the
   USAGE line below. Never edit that line by hand.
   Shown on the answer side of a review card and in the Brain's word detail (usBlock), and
   practised in the 用法 drill (DRILL_SCREENS.usage).
   ============================================================ */
function usOf(wid){return USAGE[wid]||[];}
function usHeads(w){const m=w.t.match(/（([^）]+)）/);return [w.t.split('（')[0].replace(/\s*\+\s*[a-z]+|[a-z]+\s*\+\s*/g,'').trim()].concat(m?[m[1]]:[]);}
/* the phrase with its headword marked, or (cloze) replaced by a blank of the same length; null if the word is split up inside it */
function usMark(zh,w,cloze){
  const h=usHeads(w).find(x=>zh.includes(x));
  if(!h)return cloze?null:esc(zh);
  const i=zh.indexOf(h);
  return esc(zh.slice(0,i))+(cloze?'<span class="us-gap" aria-label="blank">'+'<i></i>'.repeat(h.length)+'</span>':'<b>'+esc(h)+'</b>')+esc(zh.slice(i+h.length));
}
function usIsSent(zh){return /[。？！][」』]?$/.test(zh);}
/* the order a card shows them in: a sentence first (the word at work), then the collocations, then the other sentences */
function usOrder(w){
  const l=usOf(w.id), ks=l.map((p,k)=>k), s=ks.find(k=>usIsSent(l[k][0]));
  return s===undefined?ks:[s].concat(ks.filter(k=>k!==s));
}
function usRow(w,i){
  const p=usOf(w.id)[i];
  return `<div class="us-row${usIsSent(p[0])?' sent':''}" onclick="event.stopPropagation();usSay('${w.id}',${i})" title="tap to hear it"><div class="us-zh zh" lang="zh-Hant">${usMark(p[0],w)}</div><div class="us-sub">${S.settings.showPy!==false?`<span class="us-py">${tonePinyin(esc(p[1]))}</span>`:''}<span>${esc(p[2])}</span></div></div>`;
}
/* the list for a card's answer side: a sentence and two phrases, the rest one tap away */
function usBlock(w,all){
  if(!w||S.settings.usageCards===false)return '';
  const ks=usOrder(w); if(!ks.length)return '';
  const n=all?ks.length:Math.min(3,ks.length);
  return `<div class="us-box" data-w="${w.id}"><div class="us-h">用法 · how it is used</div>${ks.slice(0,n).map(k=>usRow(w,k)).join('')}${n<ks.length?`<div class="us-more"><span class="link" onclick="event.stopPropagation();usExpand(this)">${ks.length-n} more</span></div>`:''}</div>`;
}
/* optional, on the question side of a write card: the word's sentence with the word left blank */
function usHint(w){
  if(!w||S.settings.usageHint!==true||S.settings.usageCards===false)return '';
  const l=usOf(w.id), k=usKs(w).find(x=>usIsSent(l[x][0])); if(k===undefined)return '';
  return `<div class="us-hint"><div class="zh" lang="zh-Hant">${usMark(l[k][0],w,true)}</div><div class="us-sub">${esc(l[k][2])}</div></div>`;
}
function usExpand(el){const box=el.closest('.us-box');const w=box&&byId[box.dataset.w];if(w)box.outerHTML=usBlock(w,true);}
function usSay(wid,i){const p=usOf(wid)[i];if(p)speakText(p[0]);}

/* ---------- the 用法 drill ----------
   Start screen: pick a lesson (or the hard list, or what is due), then a short quiz, the whole lesson, or
   just browse every word's phrases. A question gives the English and the phrase with the word blanked.
   S.us[wordId] = [times right, times missed, last answer 1/0]: it orders the quiz and draws the lesson's progress. */
